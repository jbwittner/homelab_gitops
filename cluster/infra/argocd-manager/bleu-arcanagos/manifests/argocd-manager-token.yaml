apiVersion: v1
kind: Secret
metadata:
  name: argocd-manager-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: argocd-manager
# Token « legacy » de ServiceAccount : non expirant, contrairement aux tokens projetés
# (TokenRequest) qui tournent silencieusement et couperaient l'accès du hub sans prévenir.
# Ce manifeste ne porte AUCUNE donnée : `data.token`, `data.ca.crt` et `data.namespace` sont
# remplis dans le cluster par le token controller — d'où l'`ignoreDifferences` sur `/data`
# dans `argocd-manager.app.yaml`. Rien de secret n'est committé ici.
type: kubernetes.io/service-account-token
