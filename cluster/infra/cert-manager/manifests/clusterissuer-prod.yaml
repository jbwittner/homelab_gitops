apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  annotations:
    # Après le chart (wave 0) : le webhook d'admission cert-manager doit répondre,
    # sinon l'apply est rejeté en `failed calling webhook "webhook.cert-manager.io"`.
    argocd.argoproj.io/sync-wave: "1"
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: jeanbaptiste.wittner@outlook.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key      # créé par cert-manager (ns cert-manager)
    solvers:
      - dns01:
          cloudflare:
            # Token API Cloudflare (Zone:DNS:Edit + Zone:Zone:Read). SealedSecret, ns cert-manager.
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
