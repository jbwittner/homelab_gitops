# Classe de snapshot CSI du moteur LVM. Elle n'est **consommée par personne aujourd'hui** : elle
# rend seulement la capacité disponible.
#
# POURQUOI ELLE EXISTE. La copie de volume de velero est en mode `fs-backup` (kopia) : un PARCOURS
# DU SYSTÈME DE FICHIERS VIVANT, sans gel applicatif ni instantané bloc. Le résultat n'est pas
# cohérent-crash, il est ÉTALÉ — le fichier A est lu à t₀ et le fichier B à t₀+n, et il n'existe
# aucun instant réel où le volume a ressemblé à sa copie. Sur une forge Git, le cas qui mord est un
# `push` en vol : les `refs` copiées après leur mise à jour, avant les objets qu'elles désignent.
#
# Un snapshot LVM est atomique et pris en millisecondes ; velero téléverse ensuite DEPUIS le
# snapshot, figé, et l'upload peut durer sans que rien ne bouge sous lui. On échange un étalement
# contre une vraie cohérence-crash — ce que Git sait justement encaisser, ses objets étant écrits
# avant les refs et les refs mises à jour par `rename()` atomique.
#
# Analyse complète : doc/forgejo-pra.md §1.
#
# ⚠️ CETTE CLASSE NE CHANGE RIEN À ELLE SEULE. Bascule velero = `snapshotVolumes: true` +
# `snapshotMoveData: true` sur la schedule, ce qui n'est PAS fait ici, et ce qui exige de rejouer
# l'exercice de PRA d'abord : la restauration ne passe plus par `PodVolumeRestore` mais par
# `DataDownload`, et le contrôle « N volume(s) réellement repris » de
# script/forgejo-pra-script.sh lit `podvolumerestores` — il rapporterait 0 et sortirait en KO à
# tort. Il faut aussi revérifier que la règle d'exclusion des PVC CNPG de
# cluster/infra/velero/manifests/volume-policies.yaml s'applique au chemin snapshot : elle est
# écrite pour le chemin fs-backup, et si elle ne portait pas, on réintroduirait une seconde chaîne
# de sauvegarde concurrente pour la base — en silence.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: openebs-lvm
  annotations:
    # Posée APRÈS la StorageClass (wave 1) : elle n'a de sens qu'une fois le driver debout et le VG
    # créé sur chaque nœud.
    argocd.argoproj.io/sync-wave: "2"
    # ⚠️ PAS de `snapshot.storage.kubernetes.io/is-default-class`. Une classe par défaut ferait
    # silencieusement porter tout `VolumeSnapshot` sans classe sur ce driver — y compris ceux
    # qu'un chart tiers créerait sans le savoir. velero, lui, nomme sa classe explicitement.
  labels:
    app.kubernetes.io/name: openebs
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: storage
driver: local.csi.openebs.io

# `Delete` : supprimer le `VolumeSnapshot` détruit le LV de snapshot et rend l'espace au VG.
# C'est ce qu'on veut d'un snapshot de sauvegarde — il n'est qu'un point de passage pour l'upload,
# jamais une sauvegarde en soi : il vit sur le MÊME VG, le MÊME nœud et le MÊME disque que sa
# source, qui n'a aucune réplique ailleurs (cf. README §Rôle, stockage node-local).
# `Retain` laisserait des LV de snapshot orphelins immobilisant du VG après chaque sauvegarde.
deletionPolicy: Delete

# --- Provisionnement du snapshot ---
# ⚠️ La StorageClass est en `thinProvision: "no"` (ÉPAIS, cf. storageclass.yaml). Un snapshot LVM
# d'un LV épais n'est pas gratuit : il réserve une zone de copie-sur-écriture dans le VG, dont la
# taille est `snapSize`, pour toute la durée de vie du snapshot.
#
# ⚠️⚠️ ET LE MODE D'ÉCHEC EST BRUTAL : si les écritures sur le volume SOURCE pendant la vie du
# snapshot dépassent `snapSize`, LVM INVALIDE le snapshot. La sauvegarde qui le lisait échoue en
# cours de route. Ce n'est pas une dégradation, c'est une perte sèche de la sauvegarde en cours.
#
# `snapSize: "20%"` — 20 % de la taille du volume source, soit 20Gi pour le PVC de 100Gi de
# forgejo. Dimensionné sur les ÉCRITURES attendues pendant l'upload, pas sur la taille du volume :
# la copie tourne à 03:00, la forge est mono-utilisateur, et l'écrivain automatisé le plus proche
# (`renovate-forgejo`) est planifié à 02:00. 20 % est deux ordres de grandeur au-dessus du besoin.
# ⚠️ À réexaminer si la forge devient réellement écrite la nuit — l'invalidation est silencieuse
# côté Kubernetes, elle ne se lit que dans l'échec de la sauvegarde.
parameters:
  snapSize: "20%"
