
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Volet BOOTSTRAP du composant : uniquement ce qu'il faut pour que le cluster ait sa StorageClass
# par défaut. Le ServiceMonitor et le PrometheusRule vivent dans le composant frère
# `openebs-monitoring` (CRDs prometheus-operator absentes à ce stade).
#
# Ordre déclaratif via sync-waves de ressource (pas via l'ordre de cette liste) :
#   namespace (-1) → DaemonSet de bootstrap du VG (0) → StorageClass (1).
#
# ⚠️ PAS de `VolumeSnapshotClass`, et c'est un constat de MESURE, pas un oubli — voir README
# §Contraintes. Elle a été déclarée puis retirée le 2026-09-08 : sur cette StorageClass en
# provisionnement ÉPAIS, le driver crée bien un snapshot (qui passe `Ready`) mais REFUSE ensuite
# d'en provisionner un volume — `snapshot <id> is not of thin type`. Une classe qui produit des
# snapshots verts et non restaurables est pire que pas de classe du tout.
resources:
  - namespace.yaml
  - storageclass.yaml
  - vg-bootstrap-daemonset.yaml
