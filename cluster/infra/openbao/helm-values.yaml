# helm-values — openbao (gestionnaire de secrets, stockage raft intégré)

global:
  # TLS terminé au Gateway, backends joints en HTTP clair — comme tout le repo
  # (doc/reseau.md). Sans effet sur le chiffrement AU REPOS d'OpenBao, qui est
  # indépendant : seul le transport intra-cluster est en clair.
  tlsDisable: true

# --- Agent injector ---
# Activé par défaut dans le chart (`"-"` + `global.enabled: true`) ; explicité ici parce que
# c'est un choix. Il n'injecte RIEN tant que la méthode d'auth `kubernetes`, une policy et un
# role n'existent pas côté OpenBao — configuration interne au coffre, qui ne vit pas dans ce
# repo (cf. README, section « Ce qui n'est pas GitOps »).
injector:
  enabled: true

server:
  # HA + raft à 3 replicas. Raft veut un nombre IMPAIR : le quorum est la majorité stricte,
  # donc 2 nœuds exigent 2 votants (zéro panne tolérée, pour deux fois plus de surface de
  # panne qu'à 1 nœud — strictement pire). 3 nœuds tolèrent la perte d'un nœud.
  # Le backend raft apporte par ailleurs, à n'importe quel compte de replicas :
  #   - un stockage transactionnel, là où l'upstream déconseille explicitement `file`
  #     en production (« not transactional and lacks system-level file locking ») ;
  #   - `bao operator raft snapshot save`, qui sauvegarde À CHAUD — seul filet réel, le
  #     contenu d'OpenBao étant la seule chose du homelab absente de Git.
  # ⚠️ L'anti-affinité du chart est `requiredDuringScheduling` sur `kubernetes.io/hostname` :
  # il faut AUTANT DE NŒUDS que de replicas, sinon les pods en trop restent `Pending`.
  ha:
    enabled: true
    # TEMPORAIRE — remontée de quorum. `openbao-1` est encore un Voter dans la configuration
    # raft : tant qu'il n'est pas retiré par `bao operator raft remove-peer`, un scale down à 1
    # laisse 2 votants pour 1 pod joignable, donc AUCUN quorum et une élection en boucle.
    # Séquence : 2 → desceller openbao-1 → remove-peer → 1. Cf. README, section Opérations.
    replicas: 1
    raft:
      enabled: true
      # Node ID = nom du pod. Sinon un ID aléatoire est régénéré à chaque redémarrage et le
      # nœud se réenregistre comme un nouveau pair dans la configuration raft.
      setNodeId: true

    # À 3 replicas le helper `openbao.pdb.maxUnavailable` du chart calcule 1 : un drain reste
    # possible, et le quorum raft (2 sur 3) est protégé. C'est le cas où le PDB sert vraiment
    # — il était désactivé tant qu'on tournait à 1 replica, où le helper calcule 0 et BLOQUE
    # tout `kubectl drain` sans rien protéger.
    disruptionBudget:
      enabled: true

  dataStorage:
    enabled: true
    # Un coffre tient dans très peu : ce sont des KV chiffrés, pas des données applicatives.
    # StorageClass par défaut du cluster = openebs-lvm-thin.
    size: 5Gi

  # LE COFFRE. Le défaut des StatefulSets récents supprime les PVC avec le StatefulSet :
  # sans ce `Retain`, un `prune` ArgoCD ou un passage à 0 replica effacerait toutes les
  # données — irrécupérables, puisqu'elles ne sont pas dans Git.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

# Pas de Service `ui` séparé : `ui = true` dans la config HCL ci-dessus suffit à servir
# l'interface sur le port 8200 du Service `openbao`, vers lequel pointe l'HTTPRoute.
ui:
  enabled: true

serverTelemetry:
  serviceMonitor:
    enabled: false
    # `selectors` REMPLACE le bloc de labels par défaut du template (`release: prometheus`).
    # Le prometheus-operator du chart kube-prometheus-stack ne sélectionne que ce label-ci
    # (serviceMonitorSelectorNilUsesHelmValues) — même contrainte que pour alloy.
    selectors:
      release: kube-prometheus-stack

  # Dashboard upstream du chart NON déployé : il ne porte pas l'annotation `grafana_folder`
  # qui range les dashboards maison dans le dossier « Wittnerlab ».
  grafanaDashboard:
    enabled: false

# Secrets montés en volume via le Secrets Store CSI driver — driver absent du repo.
csi:
  enabled: false
