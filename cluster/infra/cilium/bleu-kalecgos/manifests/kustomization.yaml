apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ⚠️ `namePrefix` restitue les noms historiques (`bleu-kalecgos-l2`, `bleu-kalecgos-pool`) à
# partir des noms nus portés par les manifestes. Le changer renomme les ressources : Cilium
# cesserait d'annoncer les IP de LB le temps que la nouvelle politique soit posée.
namePrefix: bleu-kalecgos-

# ⚠️ `includeSelectors: false` obligatoire : à `true`, kustomize injecte aussi ces paires dans
# les `selector` et `template.metadata.labels`, champs immuables sur bien des ressources.
# ⚠️ Ne pas poser `app.kubernetes.io/instance` ici. Ce cluster suit le défaut d'ArgoCD 3
# (`resourceTrackingMethod: annotation`, cf. `argocd.argoproj.io/tracking-id` sur les objets),
# donc ce label est aujourd'hui libre — mais il redeviendrait la clé de tracking au moindre
# passage en `label`, et ArgoCD perdrait alors la trace de ces ressources.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: cilium
      app.kubernetes.io/part-of: homelab-gitops
      app.kubernetes.io/component: cni
      homelab.wittner.tech/cluster: bleu-kalecgos

resources:
  - ../../common/manifests
  - ip-pool.yaml
