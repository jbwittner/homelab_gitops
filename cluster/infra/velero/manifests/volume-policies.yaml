apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-volume-policies
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: homelab-gitops
# Correctif de la contrepartie assumée du mode OPT-OUT (`defaultVolumesToFsBackup: true`,
# helm-values.yaml) : « tout volume est sauvegardé sans annotation sur le pod » vaut aussi pour les
# volumes qui n'ont, par construction, rien à sauvegarder. Un `emptyDir` naît vide au démarrage du
# pod et meurt avec lui : le restaurer ne restaure rien, et le contenu capturé est au mieux du
# scratch (`shm` et `scratch-data` de CNPG).
#
# Ce n'est pas qu'une question de bruit : UN SEUL emptyDir suffit à faire échouer la sauvegarde
# entière. Sur un pod déjà terminé — pod de Job, `Completed` mais conservé par
# `successfulJobsHistoryLimit` — kubelet a démonté le volume avant que le node-agent ne l'ouvre, et
# le `podvolumebackup` part en `Failed`, ce qui fait passer tout le Backup en `PartiallyFailed` :
#
#   error to expose PVB: error to get pod volume path: [...] expected one matching path:
#   /host_pods/<uid>/volumes/*/<volume>, got 0
#
# C'est une course STRUCTURELLE, pas transitoire : décaler les horaires ne la ferme pas, un pod de
# Job terminé restant visible aussi longtemps que son historique le retient. Elle a été trouvée sur
# le `snapshot-dir` du CronJob `openbao-snapshot` (`velero-daily-20260815030017`), namespace depuis
# sorti du périmètre — mais la règle n'était pas un correctif pour lui : elle vaut pour tout pod à
# venir, et le prochain CronJob ajouté à la liste blanche la déclencherait à l'identique.
#
# Écrit ici, côté velero, et non en annotation `backup.velero.io/backup-volumes-excludes` sur les
# pods concernés : une RÈGLE plutôt qu'une exception à reposer à chaque nouveau composant, sans
# rien à retenir. La voie annotation est de toute façon souvent fermée, un chart n'exposant pas
# nécessairement d'annotations sur son `podTemplate` — c'était le cas d'openbao-0.29.0, qui n'en
# expose que sur l'objet CronJob (`snapshotAgent.annotations`), pas sur le template que lit velero.
#
# Portée : `skip` ne concerne QUE la copie de données (fs-backup/kopia). Les objets Kubernetes
# eux-mêmes (Pod, Job, ConfigMap…) restent sauvegardés, donc restaurables.
#
# --------------------------------------------------------------------------------------------
#
# SECONDE RÈGLE — les PVC des bases CloudNativePG sortent de la copie kopia (2026-09-08).
#
# Ce n'est PAS un correctif, c'est un arbitrage entre deux chaînes de sauvegarde concurrentes, et
# c'est le même que celui déjà rendu pour openbao (cf. helm-values.yaml, « openbao N'EST PAS UN
# CANDIDAT »). Une copie kopia d'un volume PostgreSQL vivant est cohérente-CRASH : elle vaut un
# `kill -9` suivi d'un redémarrage, Postgres rejoue son WAL et s'en sort le plus souvent. La
# sauvegarde native — sauvegarde de base barman-cloud encadrée par `pg_backup_start` /
# `pg_backup_stop`, plus archivage WAL continu — est cohérente-TRANSACTION et donne en prime le
# PITR. Elle est strictement meilleure, sur le même bucket-frère GCS et avec la même rétention de
# 30 jours.
#
# Garder les deux ne serait pas « une ceinture et des bretelles » mais un second chemin de
# restauration à moitié fiable, qu'on n'utiliserait jamais et qui coûterait à chaque sauvegarde la
# lecture intégrale du volume de la base, sur un stockage node-local que le PVC de 100Gi de Forgejo
# occupe déjà à 03:00.
#
# ⚠️ CE QUI TIENT CETTE DÉCISION. Exactement comme pour openbao, l'exclusion n'est défendable que
# parce qu'une DÉTECTION PASSIVE d'une chaîne native morte en silence a été posée en face :
# `CNPGWalArchivingStalled`, `CNPGWalArchivingFailing`, `CNPGBackupTooOld` et `CNPGNoBackupMetric`
# (cluster/app/cnpg-monitoring/manifests/prometheusrule.yaml). Supprimer ces alertes rend cette
# règle indéfendable — les deux décisions se tiennent ensemble.
#
# ⚠️ RÈGLE CLUSTER-WIDE, ET C'EST VOULU. Le sélecteur est le label que l'opérateur pose sur TOUS
# les PVC qu'il crée, quelle que soit la base — pas `cnpg.io/cluster: forgejo-db`, qui aurait
# demandé une ligne par base et se serait fait oublier à la suivante. Corollaire à ne pas perdre :
# le jour où `authentik` entre dans `includedNamespaces`, sa base ne sera couverte par RIEN tant
# qu'elle n'aura pas son propre `ObjectStore` — cette règle-ci l'aura déjà exclue de kopia. C'est
# la contrepartie assumée d'une règle plutôt que d'une exception.
#
# Portée, comme pour l'emptyDir : `skip` ne concerne QUE la copie de données. Les objets
# Kubernetes — le `Cluster`, ses Secrets auto-générés, le PVC lui-même — restent sauvegardés par
# velero, donc restaurables. Ce sont eux qui permettent de recréer la base ; ce sont les données
# natives qui la remplissent.
data:
  policies.yaml: |
    version: v1
    volumePolicies:
      - conditions:
          volumeTypes:
            - emptyDir
        action:
          type: skip
      # ⚠️ `pvcLabels` demande velero >= 1.16 (ici 1.18.1, chart 12.1.0). Sur une version plus
      # ancienne la condition est ignorée SANS erreur : la règle ne matche rien et les volumes
      # CNPG repartent dans kopia — une régression silencieuse, à revérifier après un downgrade.
      - conditions:
          pvcLabels:
            app.kubernetes.io/managed-by: cloudnative-pg
        action:
          type: skip
