apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # ⚠️ Comme pour argocd-manager, la wave porte sur l'ApplicationSet lui-même, PAS sur les
    # Applications générées : le tier-2 `infra` synchronise cet objet, le contrôleur
    # ApplicationSet crée les Applications ensuite, hors de cet ordonnancement.
    #
    # Conséquence à connaître : la disponibilité des CRDs avant le premier `ExternalSecret` du
    # repo (celui d'`argocd`, wave -1) n'est plus *ordonnée*, seulement *éventuelle* — si la CRD
    # manque encore, la sync d'argocd échoue et converge au retry suivant. C'est le prix du
    # multi-cluster, et c'est le même compromis que cilium et argocd-manager.
    argocd.argoproj.io/sync-wave: "-7"
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: secrets
spec:
  # ESO tourne sur TOUS les clusters : chacun a besoin de matérialiser localement les secrets
  # du coffre, un Secret Kubernetes ne traversant pas les clusters. Ce qui diffère d'un cluster
  # à l'autre, c'est uniquement le `ClusterSecretStore` (cf. `<cluster>/manifests/`) — le chart,
  # lui, est identique partout et vit dans `common/`.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    # Retirer un dossier de cluster supprimerait l'Application, donc le contrôleur ESO du
    # cluster, donc le rafraîchissement de tous ses secrets. Les `Secret` déjà matérialisés
    # survivraient (ils ne sont pas possédés par ESO au sens ArgoCD), mais la CRD partirait
    # avec les `ExternalSecret` : on préserve.
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/jbwittner/homelab_gitops.git
        revision: main
        # Un niveau de profondeur : ne matche que les dossiers de cluster, pas leurs `manifests/`.
        directories:
          - path: cluster/infra/external-secrets/*
          # ⚠️ `common/` est un dossier partagé, pas un cluster : sans cette exclusion le
          # generator produirait une Application `common-external-secrets` vers un cluster
          # `common` inexistant.
          - path: cluster/infra/external-secrets/common
            exclude: true
  template:
    metadata:
      name: '{{.path.basename}}-external-secrets'
      labels:
        app.kubernetes.io/name: external-secrets
        app.kubernetes.io/part-of: homelab-gitops
        app.kubernetes.io/component: secrets
        homelab.wittner.tech/cluster: '{{.path.basename}}'
      # Sûr uniquement grâce à `preserveResourcesOnDeletion` ci-dessus : le contrôleur
      # ApplicationSet retire ce finalizer avant de supprimer une Application générée.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          # Version commune à tous les clusters — un seul point de bump (et un seul PR Renovate).
          targetRevision: 2.8.0
          helm:
            releaseName: external-secrets
            # Deux couches : les values communes, puis l'éventuelle surcharge du cluster.
            # L'ordre fait foi — le second fichier écrase le premier.
            valueFiles:
              - '$values/cluster/infra/external-secrets/common/helm-values.yaml'
              - '$values/{{.path.path}}/helm-values.yaml'
            # Rend la surcharge facultative : aucun cluster n'en a aujourd'hui, et sans ce flag
            # l'absence du fichier ferait échouer le rendu Helm.
            ignoreMissingValueFiles: true
        - repoURL: https://github.com/jbwittner/homelab_gitops.git
          targetRevision: main
          ref: values
        # Namespace (commun) + le ClusterSecretStore, lui PROPRE au cluster : l'adresse
        # d'openbao et le mount d'auth diffèrent selon qu'on est sur le hub ou sur un spoke.
        - repoURL: https://github.com/jbwittner/homelab_gitops.git
          targetRevision: main
          path: '{{.path.path}}/manifests'
      destination:
        # Le nom du dossier EST le nom du cluster, tel qu'enregistré côté hub.
        name: '{{.path.basename}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
