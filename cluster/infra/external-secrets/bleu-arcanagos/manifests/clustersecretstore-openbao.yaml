# Le pont ESO → openbao, vu depuis un SPOKE (openbao tourne sur le hub).
#
# ⚠️ Le nom `openbao` est identique sur tous les clusters, et c'est load-bearing : les
# `ExternalSecret` des composants référencent `ClusterSecretStore/openbao` sans savoir sur quel
# cluster ils tournent.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      # Accès INTER-CLUSTER, seule vraie différence avec le hub : `openbao.openbao.svc` ne
      # résout pas ici. On repasse par l'exposition publique du coffre sur `shared-gw`
      # (listener `https-internal`, doc/reseau.md), donc en HTTPS — le certificat est émis par
      # Let's Encrypt, la chaîne est publiquement approuvée et aucun `caProvider` n'est requis.
      #
      # ⚠️ Dépendance de bootstrap qui n'existe pas sur le hub : ce store suppose la Gateway
      # programmée, le certificat wildcard émis et le DNS `*.lan.wittner.tech` résolu. Sur un
      # spoke, ESO ne peut donc rien servir avant que l'exposition du hub soit complète.
      server: https://openbao.lan.wittner.tech
      path: kv
      version: v2
      auth:
        kubernetes:
          # ⚠️ Mount PROPRE à ce cluster. Côté openbao il doit être configuré avec le
          # `kubernetes_host` et le `kubernetes_ca_cert` de CE cluster, plus un
          # `token_reviewer_jwt` : contrairement au hub, openbao n'a aucun accès local à
          # l'API TokenReview d'un spoke pour valider les tokens présentés.
          mountPath: kubernetes-bleu-arcanagos
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
