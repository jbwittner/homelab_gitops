apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base commune, référencée par le `manifests/` de chaque cluster. Ce dossier n'est jamais
# déployé seul : il est exclu du generator git de `external-secrets.appset.yaml`.
#
# Seul le namespace est ici. Le `ClusterSecretStore` n'y est PAS : l'adresse d'openbao et le
# mount d'auth diffèrent d'un cluster à l'autre (cf. README, § Par cluster).
resources:
  - namespace.yaml
