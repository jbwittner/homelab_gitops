# Le pont ESO → openbao, vu depuis le HUB (openbao tourne ici).
#
# ⚠️ Le nom `openbao` est identique sur tous les clusters, et c'est load-bearing : les
# `ExternalSecret` des composants référencent `ClusterSecretStore/openbao` sans savoir sur quel
# cluster ils tournent. C'est ce qui rend un composant déplaçable d'un cluster à l'autre sans
# retoucher ses secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    # Wave de RESSOURCE, interne à la sync de cette Application : la CRD ClusterSecretStore est
    # posée par le chart en wave 0, cet objet la consomme en wave 1.
    argocd.argoproj.io/sync-wave: "1"
    # Sans ça, le dry-run initial d'ArgoCD échoue sur `no matches for kind ClusterSecretStore`
    # au tout premier bootstrap : le dry-run précède la pose de la CRD, que la wave ci-dessus
    # ordonne seulement pour l'apply.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      # Accès INTRA-CLUSTER : openbao vit sur ce cluster. HTTP clair, TLS terminé au Gateway
      # pour l'UI seulement (doc/reseau.md). Le Service `openbao`, PAS `openbao-active` : ce
      # dernier n'a aucun endpoint tant que le coffre est scellé.
      server: http://openbao.openbao.svc.cluster.local:8200
      # Moteur KV v2 monté sur `kv`. Le suffixe `/data` propre à la v2 est ajouté par ESO :
      # les `remoteRef.key` des ExternalSecret s'écrivent SANS lui (`homelab/argocd/oidc`).
      path: kv
      version: v2
      auth:
        # Auth Kubernetes : ESO forge un token pour son propre ServiceAccount via l'API
        # TokenRequest et le présente à openbao. AUCUN credential d'amorçage n'est nécessaire.
        kubernetes:
          # ⚠️ Un mount PAR CLUSTER, et ce n'est pas un choix de style : une méthode d'auth
          # `kubernetes` est configurée pour UN API server (issuer, CA, TokenReview). Un mount
          # unique partagé ne pourrait pas valider les tokens des autres clusters.
          mountPath: kubernetes-bleu-kalecgos
          # Contrat avec le repo Terraform : role borné au SA ci-dessous, portant une policy en
          # lecture sur `kv/data/homelab/*`.
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
