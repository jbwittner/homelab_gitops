apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Wave d'INFRA la plus basse : ESO livre les CRDs `ExternalSecret`, que le premier
    # consommateur du repo (l'app `argocd`, wave -1) exige déjà. Contrairement à la forme
    # `ApplicationSet` d'avant, cette wave porte bien sur l'objet déployant — le tier-2 `infra`
    # synchronise cette Application elle-même, donc l'ordre CRDs-avant-consommateurs est de
    # nouveau *garanti*, et non plus seulement éventuel.
    argocd.argoproj.io/sync-wave: "-7"
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: secrets
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Pont coffre → `Secret` natifs (archétype b : chart + `$values` + `manifests/`). Un `Secret`
  # Kubernetes ne traversant pas les clusters, un cluster qui consomme des secrets d'openbao a
  # besoin de son propre contrôleur : étendre ESO à un second cluster impose donc de repasser en
  # `ApplicationSet` (cf. doc/conventions.md).
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.8.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/cluster/infra/external-secrets/helm-values.yaml
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
    # Namespace + le `ClusterSecretStore` qui pointe le coffre local.
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: cluster/infra/external-secrets/manifests
  destination:
    name: bleu-kalecgos
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
