apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"       # très tôt : CRD+controller avant tout SealedSecret (ex. token Cloudflare)
  labels:
    app.kubernetes.io/name: sealed-secrets
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: secrets
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Contrôleur sealed-secrets (Bitnami) : déchiffre les SealedSecret du dépôt en Secret natifs.
  # La clé privée reste DANS le cluster — et sa copie hors ligne est le seul point de reprise du
  # homelab (cf. README §Contraintes).
  #
  # ⚠️ ARCHÉTYPE CHANGÉ le 2026-09-08 : (d) « Helm sans values » → (a) « Helm + $values ». Un seul
  # réglage le justifie, `keyrenewperiod: "0"`, et c'est un réglage de PLAN DE REPRISE : il fige la
  # clé de scellement pour qu'une sauvegarde hors ligne unique reste suffisante. Le pourquoi
  # complet est dans helm-values.yaml, pas ici.
  #
  # ⚠️ Conséquence de l'archétype : ce composant, en wave -8, dépend maintenant AUSSI de la source
  # Git pour être rendu. Ce n'est pas une nouvelle classe de dépendance — l'Application elle-même
  # vient de Git par l'app-of-apps — mais c'est à savoir avant de diagnostiquer un rendu qui
  # échoue au bootstrap à froid : un dépôt injoignable bloque désormais le contrôleur, donc TOUS
  # les SealedSecret en aval.
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.19.3
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/cluster/infra/sealed-secrets/helm-values.yaml
    - repoURL: git@github.com:jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
  destination:
    name: bleu-kalecgos
    namespace: sealed-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
