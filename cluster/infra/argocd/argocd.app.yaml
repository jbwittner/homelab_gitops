apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"        # avant tout le reste
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: cluster/infra/argocd/manifests     # MÊME dossier que l'apply manuel du bootstrap
    # ⚠️ Tout ce qui dépend d'une CRD du tier-1 est DEHORS de `manifests/`, volontairement : ce
    # dossier sert aussi à l'`apply -k` d'amorçage, où n'existent ni la CRD `ExternalSecret`
    # (wave -7, external-secrets) ni la CRD `HTTPRoute` (wave -10, gateway-api). Les garder là
    # ferait échouer le geste de bootstrap sur `no matches for kind`.
    # Argo, lui, les applique bien : à son tour de sync (wave -1) les deux CRDs sont posées
    # depuis longtemps. Sans cette source, `argocd-notifications-secret` et le clientSecret OIDC
    # restent vides (les deux fonctionnalités échouent silencieusement) et l'UI n'est pas routée.
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: cluster/infra/argocd/post-bootstrap
  destination:
    name: bleu-kalecgos
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false                             # ⚠️ prune désactivé — Argo se couperait les jambes
    syncOptions:
      - ServerSideApply=true                   # ⚠️ doit matcher l'apply manuel
      - RespectIgnoreDifferences=true
