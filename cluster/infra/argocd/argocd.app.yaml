apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"        # avant tout le reste
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: cluster/infra/argocd/manifests     # MÊME dossier que l'apply manuel du bootstrap
    # ⚠️ Les ExternalSecret sont DEHORS de `manifests/`, volontairement : ce dossier sert aussi
    # à l'`apply -k` d'amorçage, où la CRD `ExternalSecret` n'existe pas encore (elle arrive en
    # wave -7 avec external-secrets). Les garder ici ferait échouer le geste de bootstrap.
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: cluster/infra/argocd/external-secrets
  destination:
    name: bleu-kalecgos
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false                             # ⚠️ prune désactivé — Argo se couperait les jambes
    syncOptions:
      - ServerSideApply=true                   # ⚠️ doit matcher l'apply manuel
      - RespectIgnoreDifferences=true
