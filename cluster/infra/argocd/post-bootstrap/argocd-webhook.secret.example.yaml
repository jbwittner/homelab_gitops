# EXEMPLE — versionné, sans aucune valeur réelle. C'est la copie de référence du template de
# scellement `argocd-webhook.secret.yaml`, qui est gitignoré (`*.secret.yaml`) ET que la
# procédure de scellement demande de SUPPRIMER une fois `kubeseal` passé. Sans ce fichier-ci, la
# procédure disparaîtrait avec lui : un `SealedSecret` ne porte que du chiffré, pas les
# commentaires du clair.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient
# qu'un `REMPLACER`. Il se recopie, il ne s'applique pas.
#
# --------------------------------------------------------------------------------------------
#
# CE QUE C'EST : le HMAC partagé entre le webhook « push » de la forge et l'endpoint
# `/api/webhook` d'`argocd-server`. Forgejo signe le corps de la livraison avec
# (`X-Hub-Signature-256`), ArgoCD la vérifie avec la même valeur. Cf.
# [README §Webhook Forgejo](../README.md).
#
# ⚠️ La clé s'appelle `webhook.github.secret` et ce n'est PAS une erreur : ArgoCD n'a pas de
# parseur Forgejo. La forge envoie, sur TOUS ses types de webhook, les en-têtes de compatibilité
# GitHub (`X-GitHub-Event`, `X-Hub-Signature-256`) en plus des siens — ArgoCD les voit en
# premier et traite la livraison avec son parseur GitHub. Une clé `webhook.gitea.secret`
# n'existe pas côté ArgoCD et serait ignorée en silence.
#
# ⚠️ Ce Secret s'appelle `argocd-secret` : il ne CRÉE pas un objet, il en complète un qui existe
# déjà et qui porte `server.secretkey` et le hash admin. C'est tout l'objet de l'annotation
# `patch` ci-dessous — sans elle, cet objet-ci écraserait les deux (cf.
# `../manifests/argocd-secret.yaml`, qui pose la même annotation sur l'objet existant).
#
# --------------------------------------------------------------------------------------------
#
# 1. Produire le fichier en clair à partir de ce template, avec un secret neuf :
#
#      SEC=cluster/infra/argocd/post-bootstrap/argocd-webhook.secret.yaml
#      grep -v '^#' cluster/infra/argocd/post-bootstrap/argocd-webhook.secret.example.yaml > "$SEC"
#      openssl rand -hex 32          # → la valeur à mettre dans "$SEC" ET dans Forgejo
#
#    ⚠️ Le nom de la copie compte : `*.secret.yaml` est le motif du `.gitignore`. Un fichier
#    nommé autrement serait suivi par Git — avec le secret dedans.
#    ⚠️ La valeur est à RECOPIER dans le webhook Forgejo (champ « Secret ») : les deux côtés
#    doivent porter exactement la même chaîne, sinon ArgoCD répond `401` à chaque livraison et
#    la forge affiche un échec sans rien dire de la cause.
#
# 2. Sceller (cf. cluster/infra/sealed-secrets/README.md §Sceller un Secret) :
#
#      kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#        < cluster/infra/argocd/post-bootstrap/argocd-webhook.secret.yaml \
#        > cluster/infra/argocd/post-bootstrap/argocd-webhook.sealed.yaml
#      rm cluster/infra/argocd/post-bootstrap/argocd-webhook.secret.yaml
#
#    ⚠️ Vérifier le CONTENU du `.sealed.yaml`, pas son existence : un fichier scellé vide
#    (0 octet) ne fait pas échouer `kustomize build`, il ne rend simplement rien.
#
# 3. Créer le webhook côté forge (hors de ce dépôt) — README §Webhook Forgejo.
#
# --------------------------------------------------------------------------------------------
#
# ROTATION : refaire 1 → 2, committer le `.sealed.yaml`, puis remplacer la valeur dans le
# webhook Forgejo. ⚠️ Pendant l'intervalle les livraisons sont rejetées en `401` — la seule
# conséquence est le retour au cycle de polling de 3 min, rien ne casse.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  annotations:
    # Le contrôleur sealed-secrets AJOUTE la clé ci-dessous et ne touche à rien d'autre dans
    # `argocd-secret`. ⚠️ `patch` et non `managed` : `managed` remplacerait l'objet ENTIER —
    # exit `server.secretkey` et le hash `admin.password`.
    sealedsecrets.bitnami.com/patch: "true"
type: Opaque
stringData:
  # HMAC partagé avec le webhook Forgejo. 32 octets en hexadécimal (`openssl rand -hex 32`).
  webhook.github.secret: REMPLACER
