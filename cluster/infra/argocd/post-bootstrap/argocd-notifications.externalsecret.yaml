# Token de service account Grafana, lu par le notifications-controller (`$grafana-api-key`
# dans argocd-notifications-cm). Le nom du Secret est IMPOSÉ par le contrôleur, qui ne lit que
# `argocd-notifications-secret` — contrairement à argocd-cm qui accepte n'importe quel secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-notifications-secret
    # ⚠️ `Merge`, pas `Owner` : l'install.yaml upstream livre déjà ce Secret, VIDE. En `Owner`
    # ESO refuserait de s'approprier un objet qu'il n'a pas créé. `Merge` injecte la clé dans
    # le Secret existant sans en revendiquer la propriété — exactement le rôle que tenait
    # l'annotation `sealedsecrets.bitnami.com/managed: "true"` du patch supprimé.
    #
    # Pas de `deletionPolicy` : elle est incompatible avec `Merge` (ESO ne supprime jamais un
    # Secret dont il n'est pas propriétaire), et `Retain` est de toute façon le défaut.
    creationPolicy: Merge
  data:
    - secretKey: grafana-api-key
      remoteRef:
        key: homelab/argocd
        property: grafana-api-key
