# EXEMPLE — versionné, sans aucune valeur réelle. C'est la copie de référence du template de
# scellement `repo-homelab-gitops.secret.yaml`, qui est gitignoré (`*.secret.yaml`) ET dont la
# procédure de scellement demande la SUPPRESSION une fois `kubeseal` passé. Sans ce fichier-ci, la
# procédure de génération du credential disparaîtrait avec lui : `repo-homelab-gitops.sealed.yaml`
# ne conserve rien, un `SealedSecret` ne porte que du chiffré, pas les commentaires du clair.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient que
# des `REMPLACER`. Il se recopie, il ne s'applique pas.
#
# --------------------------------------------------------------------------------------------
#
# CE QUE C'EST : le credential avec lequel `argocd-repo-server` clone CE dépôt, servi par la forge
# auto-hébergée https://forgejo.wittner.tech et privé.
#
# ⚠️ C'est le SEUL objet du cluster dont dépendent les 29 `repoURL` de `cluster/`. S'il disparaît ou si
# le jeton est révoqué côté Forgejo, TOUTES les Applications tombent en `ComparisonError` d'un
# coup, `argocd` compris (self-managed) — c'est-à-dire l'outil avec lequel on diagnostiquerait.
# Mode d'échec côté logs : `argocd-repo-server` en `authentication required` / HTTP 401.
#
# --------------------------------------------------------------------------------------------
#
# HISTORIQUE — ce fichier portait jusqu'ici une deploy key SSH `ed25519` vers
# `git@github.com:jbwittner/homelab_gitops.git`. La source du GitOps est passée à Forgejo, et
# Forgejo est en **full HTTPS, SSH désactivé** (`DISABLE_SSH: true`, cf.
# `doc/forgejo-docker-bascule-et-sauvegarde.md`). L'authentification est donc un couple
# utilisateur + **jeton d'accès personnel**, pas une clé. Conséquences :
#   - plus de `sshPrivateKey`, plus de `ssh-keygen`, plus de fichier `argocd-deploy-key` à la
#     racine du dépôt (les deux lignes du `.gitignore` sont conservées par sécurité) ;
#   - plus rien à vérifier côté `argocd-ssh-known-hosts-cm` : la chaîne TLS est un certificat
#     Let's Encrypt wildcard `*.wittner.tech`, déjà dans le magasin de CA du conteneur ;
#   - la deploy key GitHub `argocd-bleu-kalecgos` n'a plus d'usage → **la révoquer** côté GitHub,
#     et supprimer `argocd-deploy-key` / `argocd-deploy-key.pub` du poste s'ils y traînent.
#
# --------------------------------------------------------------------------------------------
#
# 1. Créer le jeton DANS Forgejo, sur un compte dédié (pas le compte humain) :
#
#    Forgejo → compte bot → Paramètres → Applications → Générer un nouveau jeton
#      Nom     : argocd-bleu-kalecgos
#      Portées : `read:repository` — et RIEN d'autre.
#
#    ⚠️ Lecture seule, et pas par principe : un jeton en écriture serait le seul credential du
#    dispositif capable de réécrire l'état désiré du cluster. ArgoCD ne fait que lire.
#
#    ⚠️ Le compte bot doit avoir accès au dépôt `jbwittner/homelab_gitops`. Un jeton valide sur un
#    compte sans droit de lecture ne rend pas 403 mais 404 — Forgejo masque l'existence des dépôts
#    privés. Le symptôme ressemble alors à une faute de frappe dans l'URL.
#
#    ⚠️ Le jeton n'est affiché QU'UNE FOIS, à la création. Pas de relecture possible ensuite.
#
# 2. Produire le fichier en clair à partir de ce template, jeton injecté :
#
#      SEC=cluster/infra/argocd/post-bootstrap/repo-homelab-gitops.secret.yaml
#      grep -v '^#' cluster/infra/argocd/post-bootstrap/repo-homelab-gitops.secret.example.yaml > "$SEC"
#      # puis remplacer les deux `REMPLACER` (username, password) dans "$SEC"
#
#    ⚠️ Le nom de la copie compte : `*.secret.yaml` est le motif du `.gitignore`. Un fichier nommé
#    autrement serait suivi par Git — avec le jeton dedans.
#    ⚠️ Ne jamais renseigner ce fichier-ci « juste pour tester » : son nom ne correspond PAS au
#    motif gitignoré, il serait committé avec ses valeurs.
#
# 3. GESTE D'AMORÇAGE — appliquer à la main, AVANT `kubectl apply -f cluster/root.yaml` :
#
#      kubectl apply -f cluster/infra/argocd/post-bootstrap/repo-homelab-gitops.secret.yaml \
#        --server-side --force-conflicts
#
#    ⚠️ `--server-side` n'est PAS cosmétique ici. Un `kubectl apply` client-side écrit l'objet
#    entier dans l'annotation `kubectl.kubernetes.io/last-applied-configuration` — c'est-à-dire le
#    JETON en clair, dans les métadonnées, qui survivent au scellement et que le contrôleur
#    sealed-secrets ne nettoiera jamais. Si le geste a déjà été fait sans le drapeau :
#      kubectl -n argocd annotate secret repo-homelab-gitops \
#        kubectl.kubernetes.io/last-applied-configuration-
#
#    ⚠️ Ce `kubectl apply` est irréductible et c'est tout l'intérêt de l'annotation `managed`
#    ci-dessous. Le credential doit exister AVANT le premier fetch d'ArgoCD : à cet instant ni la
#    CRD `SealedSecret` (wave -8) n'existe, ni le dépôt n'est lisible. Un `SealedSecret` ne peut
#    donc pas servir ici. L'annotation permet au contrôleur sealed-secrets de REPRENDRE ensuite
#    en gestion cet objet qu'il n'a pas créé — après quoi la rotation repasse par Git.
#
# 4. Sceller (cf. cluster/infra/sealed-secrets/README.md §Sceller un Secret) :
#
#      kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#        < cluster/infra/argocd/post-bootstrap/repo-homelab-gitops.secret.yaml \
#        > cluster/infra/argocd/post-bootstrap/repo-homelab-gitops.sealed.yaml
#      rm cluster/infra/argocd/post-bootstrap/repo-homelab-gitops.secret.yaml
#
#    ⚠️ Vérifier le CONTENU du `.sealed.yaml`, pas son existence : un fichier scellé vide (0 octet)
#    ne fait pas échouer `kustomize build`, il ne rend simplement rien. Le dépôt est déjà tombé
#    dans ce piège.
#    ⚠️ Le `SealedSecret` est chiffré pour le couple (`repo-homelab-gitops`, `argocd`) : le
#    renommer ou le déplacer de namespace le rend indéchiffrable, il faut resceller.
#
# --------------------------------------------------------------------------------------------
#
# ROTATION : refaire 1 → 4, puis supprimer l'ANCIEN jeton dans Forgejo — en créant le nouveau
# AVANT de révoquer l'ancien, sinon fenêtre d'indisponibilité —, committer le `.sealed.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: repo-homelab-gitops
  namespace: argocd
  labels:
    # Ce label est ce qui fait qu'ArgoCD regarde ce Secret. Sans lui l'objet est inerte et les
    # Applications échouent à l'authentification sans que rien ne signale pourquoi.
    argocd.argoproj.io/secret-type: repository
  annotations:
    # Autorise le contrôleur sealed-secrets à écrire dans un Secret qu'il n'a pas créé (celui posé
    # à la main à l'étape 3). Sans elle il refuse, et le Secret d'amorçage n'est jamais rattaché au
    # GitOps. Même mécanique que `../manifests/argocd-notifications-secret.yaml`.
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  type: git
  # ⚠️ Doit être STRICTEMENT la chaîne écrite dans les 29 `repoURL` de `cluster/`, suffixe `.git`
  # compris : ArgoCD apparie credential et source par égalité d'URL normalisée. Une URL SSH ici
  # face à des sources en HTTPS (ou l'inverse), ou un `.git` de différence, ne produit aucune
  # erreur de configuration — juste un clone anonyme qui échoue en 404.
  url: https://forgejo.wittner.tech/jbwittner/homelab_gitops.git
  # Compte bot Forgejo. Forgejo n'impose pas de valeur particulière ici quand `password` est un
  # jeton, mais ArgoCD REFUSE un `password` sans `username` — le champ est obligatoire.
  username: REMPLACER
  # Jeton d'accès personnel Forgejo, portée `read:repository`. Pas un mot de passe de compte :
  # un mot de passe donnerait tous les droits du compte et casserait à la première 2FA.
  password: REMPLACER
