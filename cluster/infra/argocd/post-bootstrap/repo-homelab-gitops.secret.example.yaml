# EXEMPLE — versionné, sans aucune valeur réelle. C'est la copie de référence du template de
# scellement `repo-homelab-gitops.secret.yaml`, qui est gitignoré (`*.secret.yaml`) ET dont la
# procédure de scellement demande la SUPPRESSION une fois `kubeseal` passé. Sans ce fichier-ci, la
# procédure de génération de la deploy key disparaîtrait avec lui : `repo-homelab-gitops.sealed.yaml`
# ne conserve rien, un `SealedSecret` ne porte que du chiffré, pas les commentaires du clair.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient que
# des `REMPLACER`. Il se recopie, il ne s'applique pas.
#
# --------------------------------------------------------------------------------------------
#
# CE QUE C'EST : le credential avec lequel `argocd-repo-server` clone CE dépôt, devenu privé.
# Jusqu'au passage en privé il n'existait pas — le clone était HTTPS anonyme.
#
# ⚠️ C'est le SEUL objet du cluster dont dépendent les 32 `repoURL` du dépôt. S'il disparaît ou si
# la deploy key est révoquée côté GitHub, TOUTES les Applications tombent en `ComparisonError`
# d'un coup, `argocd` compris (self-managed) — c'est-à-dire l'outil avec lequel on diagnostiquerait.
# Mode d'échec côté logs : `argocd-repo-server` en erreur d'authentification SSH.
#
# --------------------------------------------------------------------------------------------
#
# 1. Générer la paire de clés DANS LE DOSSIER COURANT, en se plaçant à la RACINE DU DÉPÔT :
#
#      cd "$(git rev-parse --show-toplevel)"
#      ssh-keygen -t ed25519 -C "argocd@bleu-kalecgos" -f ./argocd-deploy-key -N ""
#
#    → produit ./argocd-deploy-key (privée, 0600) et ./argocd-deploy-key.pub (publique)
#
#    ⚠️ La racine du dépôt, et pas ~/.ssh ni un sous-dossier : les deux noms sont gitignorés
#    LÀ et nulle part ailleurs (`.gitignore` racine, lignes `argocd-deploy-key` et
#    `argocd-deploy-key.pub`). Ailleurs dans l'arbre, la clé PRIVÉE serait suivie par Git.
#    Le contrôler avant d'aller plus loin — doit rendre deux lignes :
#
#      git check-ignore -v argocd-deploy-key argocd-deploy-key.pub
#
#    ⚠️ `-f ./argocd-deploy-key` : c'est le chemin relatif qui fixe le dossier de sortie.
#    ⚠️ `-N ""` : pas de passphrase. ArgoCD lit la clé sans interaction possible.
#    ⚠️ `ed25519` et non RSA : c'est l'algorithme dont la clé hôte github.com est livrée dans
#    `argocd-ssh-known-hosts-cm` par l'install upstream épinglé. Rien à patcher côté known_hosts.
#
# 2. Poser la clé PUBLIQUE sur GitHub :
#
#      cat argocd-deploy-key.pub
#
#    dépôt → Settings → Deploy keys → Add deploy key, titre `argocd-bleu-kalecgos`,
#    **« Allow write access » DÉCOCHÉ**.
#
#    ⚠️ Décoché, et pas par principe : une deploy key en écriture serait le seul credential du
#    dispositif capable de réécrire l'état désiré du cluster. ArgoCD ne fait que lire.
#
# 3. Produire le fichier en clair à partir de ce template, avec la clé PRIVÉE injectée.
#    Le bloc scalaire `sshPrivateKey: |` attend la clé indentée de 4 espaces — d'où le `sed` :
#
#      SEC=cluster/infra/argocd/post-bootstrap/repo-homelab-gitops.secret.yaml
#      grep -v '^#' cluster/infra/argocd/post-bootstrap/repo-homelab-gitops.secret.example.yaml \
#        | sed '/^    REMPLACER$/d' > "$SEC"
#      sed 's/^/    /' argocd-deploy-key >> "$SEC"
#
#    (ou, à la main : `cp` le template puis remplacer `REMPLACER` par la clé, indentée de 4.)
#
#    ⚠️ Une indentation fausse ne fait PAS échouer l'apply : le Secret est créé avec une clé
#    tronquée ou mal formée, et l'échec n'apparaît qu'au clone, en erreur d'auth SSH.
#
#    ⚠️ Le nom de la copie compte : `*.secret.yaml` est le motif du `.gitignore`. Un fichier nommé
#    autrement serait suivi par Git — avec une clé privée dedans.
#    ⚠️ Ne jamais renseigner ce fichier-ci « juste pour tester » : son nom ne correspond PAS au
#    motif gitignoré, il serait committé avec ses valeurs.
#
# 4. GESTE D'AMORÇAGE — appliquer à la main, AVANT `kubectl apply -f cluster/root.yaml` :
#
#      kubectl apply -f cluster/infra/argocd/post-bootstrap/repo-homelab-gitops.secret.yaml \
#        --server-side --force-conflicts
#
#    ⚠️ `--server-side` n'est PAS cosmétique ici. Un `kubectl apply` client-side écrit l'objet
#    entier dans l'annotation `kubectl.kubernetes.io/last-applied-configuration` — c'est-à-dire la
#    CLÉ PRIVÉE en clair, dans les métadonnées, qui survivent au scellement et que le contrôleur
#    sealed-secrets ne nettoiera jamais. Si le geste a déjà été fait sans le drapeau :
#      kubectl -n argocd annotate secret repo-homelab-gitops \
#        kubectl.kubernetes.io/last-applied-configuration-
#
#    ⚠️ Ce `kubectl apply` est irréductible et c'est tout l'intérêt de l'annotation `managed`
#    ci-dessous. Le credential doit exister AVANT le premier fetch d'ArgoCD : à cet instant ni la
#    CRD `SealedSecret` (wave -8) n'existe, ni le dépôt n'est lisible. Un `SealedSecret` ne peut
#    donc pas servir ici. L'annotation permet au contrôleur sealed-secrets de REPRENDRE ensuite
#    en gestion cet objet qu'il n'a pas créé — après quoi la rotation repasse par Git.
#
# 5. Sceller (cf. cluster/infra/sealed-secrets/README.md §Sceller un Secret) :
#
#      kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#        < cluster/infra/argocd/post-bootstrap/repo-homelab-gitops.secret.yaml \
#        > cluster/infra/argocd/post-bootstrap/repo-homelab-gitops.sealed.yaml
#      rm cluster/infra/argocd/post-bootstrap/repo-homelab-gitops.secret.yaml
#      rm argocd-deploy-key argocd-deploy-key.pub
#
#    ⚠️ Vérifier le CONTENU du `.sealed.yaml`, pas son existence : un fichier scellé vide (0 octet)
#    ne fait pas échouer `kustomize build`, il ne rend simplement rien. Le dépôt est déjà tombé
#    dans ce piège.
#    ⚠️ Le `SealedSecret` est chiffré pour le couple (`repo-homelab-gitops`, `argocd`) : le
#    renommer ou le déplacer de namespace le rend indéchiffrable, il faut resceller.
#
# --------------------------------------------------------------------------------------------
#
# ROTATION : refaire 1 → 5, remplacer la deploy key sur GitHub (en ajouter une nouvelle AVANT de
# supprimer l'ancienne, sinon fenêtre d'indisponibilité), committer le `.sealed.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: repo-homelab-gitops
  namespace: argocd
  labels:
    # Ce label est ce qui fait qu'ArgoCD regarde ce Secret. Sans lui l'objet est inerte et les
    # Applications échouent à l'authentification sans que rien ne signale pourquoi.
    argocd.argoproj.io/secret-type: repository
  annotations:
    # Autorise le contrôleur sealed-secrets à écrire dans un Secret qu'il n'a pas créé (celui posé
    # à la main à l'étape 4). Sans elle il refuse, et le Secret d'amorçage n'est jamais rattaché au
    # GitOps. Même mécanique que `../manifests/argocd-notifications-secret.yaml`.
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  type: git
  # ⚠️ Doit être STRICTEMENT la chaîne écrite dans les 32 `repoURL` du dépôt, suffixe `.git`
  # compris : ArgoCD apparie credential et source par égalité d'URL normalisée. Une URL HTTPS ici
  # face à des sources en SSH (ou l'inverse) ne produit aucune erreur de configuration — juste un
  # clone anonyme qui échoue.
  url: git@github.com:jbwittner/homelab_gitops.git
  sshPrivateKey: |
    REMPLACER
