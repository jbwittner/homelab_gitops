# client_secret OIDC d'ArgoCD (provider authentik), servi par openbao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-oidc
    creationPolicy: Owner
    # ⚠️ Load-bearing : coffre scellé (donc après CHAQUE redémarrage du pod openbao) l'objet
    # passe NotReady, mais le Secret déjà matérialisé est CONSERVÉ. C'est ce qui rend
    # acceptable de dépendre d'un coffre à descellement manuel.
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          # OBLIGATOIRE : ArgoCD ne charge `$argocd-oidc:client-secret` (argocd-cm) que si le
          # Secret porte ce label. Sinon client_secret vide → invalid_client au token.
          # Le label doit être posé ICI : ESO recrée le Secret, il n'hérite de rien.
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: client-secret
      remoteRef:
        key: homelab/argocd
        property: oidc-client-secret
