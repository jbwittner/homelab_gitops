# L'install.yaml upstream livre un Secret `argocd-notifications-secret` VIDE, et le
# notifications-controller ne lit QUE ce nom-là (pas de `$autre-secret:clé` comme
# dans argocd-cm). L'annotation `managed` autorise le contrôleur sealed-secrets à
# adopter ce Secret existant et à y injecter `grafana-api-key` — sans elle il
# refuse ("already exists and is not managed by SealedSecret").
#
# Pas de conflit de propriétaires : ce patch ne déclare AUCUN champ `data`, donc en
# ServerSideApply Argo ne possède pas les clés et ne les écrase pas au self-heal.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
