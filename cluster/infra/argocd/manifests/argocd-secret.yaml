# Patch du Secret `argocd-secret` livré VIDE par l'install.yaml upstream (aucun champ `data`).
#
# ⚠️ Ce patch ne pose QU'UNE ANNOTATION, et c'est délibéré : `argocd-secret` n'est pas un secret
# comme les autres. `argocd-server` y écrit lui-même `server.secretkey` (clé de signature des
# JWT) et le hash `admin.password` / `admin.passwordMtime` (cf. README §Compte admin local) —
# trois valeurs qui sont de l'état VIVANT du cluster et n'ont rien à faire dans Git.
#
# D'où `patch` et NON `managed`, contrairement à `argocd-notifications-secret.yaml` :
#   - `managed` = le contrôleur sealed-secrets REMPLACE le Secret entier par ce que porte le
#     SealedSecret. Ici ça effacerait `server.secretkey` (toutes les sessions invalidées, à
#     chaque sync) et le mot de passe admin — c'est-à-dire le seul moyen d'entrer, le SSO étant
#     désactivé. Il prendrait en plus la PROPRIÉTÉ de l'objet : supprimer le SealedSecret
#     supprimerait `argocd-secret`.
#   - `patch` = le contrôleur AJOUTE les clés du SealedSecret et ne touche à rien d'autre
#     (« secret keys, labels and annotations […] not present in the SealedSecret won't be
#     deleted »), et ne prend PAS la propriété de l'objet.
# Les deux annotations lèvent le même refus (« Resource … is not managed by SealedSecret »), et
# ce refus se juge sur l'objet EXISTANT : l'annotation doit être posée ICI, pas seulement dans le
# template du SealedSecret.
#
# Ce que le SealedSecret `../post-bootstrap/argocd-webhook.sealed.yaml` vient y ajouter :
# `webhook.github.secret`, le HMAC partagé avec le webhook Forgejo (cf. README §Webhook Forgejo).
#
# Ce patch reste dans `manifests/` (et non `post-bootstrap/`) : c'est un objet d'API cœur, il
# s'applique proprement à l'amorçage même si le contrôleur sealed-secrets n'existe pas encore.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  annotations:
    sealedsecrets.bitnami.com/patch: "true"
