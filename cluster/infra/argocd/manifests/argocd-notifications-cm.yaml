apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Service Grafana : le notifications-controller pose une *annotation* Grafana
  # (POST /api/annotations) à chaque événement souscrit. Appel in-cluster —
  # inutile de repasser par shared-gw/TLS pour du trafic argocd → monitoring.
  # `$grafana-api-key` est résolu dans le Secret `argocd-notifications-secret`
  # (alimenté depuis openbao par ../post-bootstrap/argocd-notifications.externalsecret.yaml,
  # en `creationPolicy: Merge`) : le contrôleur ne lit QUE ce secret-là, d'où le nom
  # imposé (contrairement à `$argocd-oidc:client-secret` dans argocd-cm, qui accepte
  # n'importe quel secret).
  service.grafana: |
    apiUrl: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api
    apiKey: $grafana-api-key

  # Templates — le service grafana n'a pas de champ dédié : seul le `message`
  # générique est utilisé, il devient le texte de l'annotation.
  # `syncResult.revision` est VIDE sur les apps multi-source (archétypes (a)/(b)) :
  # les révisions y vivent dans la liste `syncResult.revisions` (chart + repo $values).
  # D'où le `with/else` — sinon « déployé — révision  » sur la moitié des apps.
  template.app-deployed: |
    message: |
      {{.app.metadata.name}} déployé — révision {{with .app.status.operationState.syncResult.revisions}}{{range $i, $r := .}}{{if $i}} + {{end}}{{$r}}{{end}}{{else}}{{.app.status.operationState.syncResult.revision}}{{end}}
  template.app-health-degraded: |
    message: |
      {{.app.metadata.name}} dégradé — health {{.app.status.health.status}}
  template.app-sync-failed: |
    message: |
      {{.app.metadata.name}} — sync en échec : {{.app.status.operationState.message}}

  # Triggers (catalogue upstream). `oncePer` évite une annotation par resync.
  #
  # ⚠️ `oncePer` du catalogue (`syncResult.revision` seul) est CASSÉ en multi-source :
  # la valeur est vide, donc la clé de dédup ne change jamais → une seule annotation
  # à vie pour cert-manager, cnpg, openebs, kube-prometheus-stack… Le couple
  # [revision, revisions] couvre les deux formes ; le résultat est passé à
  # fmt.Sprintf("%v"), n'importe quel type est accepté. Les guillemets sont
  # obligatoires : sans eux YAML lirait une séquence, pas la chaîne d'expression.
  trigger.on-deployed: |
    - description: Application synced et healthy. Une fois par révision.
      oncePer: "[app.status.operationState.syncResult.revision, app.status.operationState.syncResult.revisions]"
      send: [app-deployed]
      when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
  trigger.on-health-degraded: |
    - description: Application dégradée
      send: [app-health-degraded]
      when: app.status.health.status == 'Degraded'
  trigger.on-sync-failed: |
    - description: Sync en échec
      send: [app-sync-failed]
      when: app.status.operationState.phase in ['Error', 'Failed']

  # Souscriptions globales : s'appliquent à TOUTES les Applications, pas besoin
  # d'annoter chaque `.app.yaml`. Recipient grafana = liste de tags séparés par
  # `|` — ce sont les tags de l'annotation, à réutiliser en filtre côté dashboard.
  subscriptions: |
    - recipients:
        - grafana:argocd|deployed
      triggers:
        - on-deployed
    - recipients:
        - grafana:argocd|degraded
      triggers:
        - on-health-degraded
    - recipients:
        - grafana:argocd|sync-failed
      triggers:
        - on-sync-failed
