apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

# Argo CD de bleu-kalecgos, dossier autonome : install upstream épinglé + patchs cmd-params/cm/
# rbac/notifications. Sert AUSSI à l'apply manuel du bootstrap (kubectl apply -k ce dossier),
# sur un cluster où SEULS Talos et Cilium tournent.
#
# ⚠️ N'ajouter ici QUE des objets d'API cœur. Tout ce qui consomme une CRD posée par le tier-1
# (`ExternalSecret`, `HTTPRoute`, …) va dans `../post-bootstrap/`, second `source` de la même
# Application — sinon l'apply d'amorçage échoue sur `no matches for kind`.
#
# Le critère est bien « est-ce que ça CASSE l'amorçage », et pas « est-ce que c'est utile à
# l'amorçage » : les patchs RBAC et notifications ci-dessous ne servent à rien tant qu'authentik
# et Grafana n'existent pas, mais ils s'appliquent proprement et n'empêchent ni Argo de démarrer
# ni le compte local `admin` de fonctionner. Les sortir n'achèterait rien et coûterait cher —
# leur cible vivant dans l'install upstream de ce dossier, il faudrait l'en retirer par un
# `$patch: delete` et les reposer en ressources autonomes, qui écraseraient en silence les clés
# que l'upstream pourrait y ajouter un jour (voir `argocd-cm`, qui en porte déjà 9).
#
# Note compat K8s 1.36 : le tag de l'install.yaml ci-dessous est le point d'épinglage Argo.
# Si les pods crash-loop après upgrade, bumper le tag vX.Y.Z ici.
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/refs/tags/v3.5.0/manifests/install.yaml
  - cluster-bleu-kalecgos.yaml
patches:
  - path: argocd-cmd-params-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  - path: argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  # --- DÉSACTIVÉ : authentik non déployé (le patch ne mappe qu'un groupe authentik). ---
#   - path: argocd-rbac-cm.yaml
#     target:
#       kind: ConfigMap
#       name: argocd-rbac-cm
  - path: argocd-notifications-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-notifications-cm
  # Annotation `sealedsecrets.bitnami.com/managed` sur le Secret livré vide par l'upstream :
  # sans elle le contrôleur sealed-secrets refuse d'y écrire la clé Grafana.
  - path: argocd-notifications-secret.yaml
    target:
      kind: Secret
      name: argocd-notifications-secret
