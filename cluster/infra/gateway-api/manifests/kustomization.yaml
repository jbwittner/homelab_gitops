apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CRDs Gateway API, install upstream standard épinglé. Ce tag est la SOURCE UNIQUE de la version
# des CRDs (aucun README ne doit la répéter).
#
# ⚠️ COUPLAGE AVEC CILIUM : c'est Cilium qui implémente Gateway API ici, et il ne supporte qu'un
# intervalle de versions de CRDs (la version supportée est annoncée dans les release notes de
# chaque mineure Cilium). Renovate propose les bumps de ce tag et du chart Cilium
# INDÉPENDAMMENT : avant de merger l'un ou l'autre, vérifier la version de Gateway API annoncée
# par la mineure Cilium déployée (cf. cluster/infra/cilium/cilium.appset.yaml) et aligner les
# deux dans le même commit si besoin. Des CRDs plus récentes que ce que Cilium sait lire se
# traduisent par des Gateway/HTTPRoute jamais réconciliées, sans erreur explicite.
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml
  - namespace.yaml
  - gateway.yaml