# Sans état : la persistance est l'adaptateur `spi-memory` (données en dur), rien à monter.
# Une seule réplique quand même : Spring Security génère le mot de passe du compte `user` au
# démarrage, différent à chaque pod — à deux répliques, l'authentification Basic réussirait une
# requête sur deux.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankwiz-api
  namespace: bankwiz-dev
  labels:
    app.kubernetes.io/name: bankwiz-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bankwiz-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bankwiz-api
    spec:
      automountServiceAccountToken: false
      # Pas d'imagePullSecrets : les paquets de la forge sont publics, le pull est anonyme
      # (cf. cluster/app/bankwiz/README.md §Contraintes).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bankwiz-api
          # Tag FIXE `develop-sha-<sha court>` poussé par le workflow `develop.yml` du dépôt
          # applicatif, épinglé au digest. Le tag mobile `develop` n'est volontairement pas
          # utilisé : ArgoCD ne voit pas qu'il bouge, le mettre à jour demanderait un
          # `rollout restart` à la main. Monter de version = un commit ici.
          image: forgejo.wittner.tech/jbwittner/bankwiz-server:develop-sha-ea706bf@sha256:532291f7f23434acce1f2c63783bca035282ef0f9eb651671161f9f45c1086bd
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # UID numérique de l'utilisateur `spring` du Dockerfile.
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Pas d'actuator dans l'application : `/public/ping` est le seul endpoint ouvert sans
          # authentification (cf. SecurityConfiguration du dépôt applicatif).
          startupProbe:
            httpGet:
              path: /public/ping
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /public/ping
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /public/ping
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # L'image fixe -XX:MaxRAMPercentage=75 : le tas prend 75 % de la limite mémoire.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            # Racine en lecture seule : Tomcat écrit son répertoire de travail dans java.io.tmpdir.
            - name: tmp
              mountPath: /tmp
            # Configuration Spring (manifests/application.yaml). Le profil actif y est
            # déclaré : pas de SPRING_PROFILES_ACTIVE ici, la configuration vit en un seul endroit.
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: bankwiz-api-config
