# Sans état côté pod : rien à monter. La persistance est la base CNPG `bankwiz-db`
# (bankwiz-db.yaml) dès que l'image embarque l'adaptateur `spi-postgres` ; d'ici là, `spi-memory`
# (données en dur) et les identifiants injectés ci-dessous sont ignorés.
# Une seule réplique quand même : Spring Security génère le mot de passe du compte `user` au
# démarrage, différent à chaque pod — à deux répliques, l'authentification Basic réussirait une
# requête sur deux.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankwiz-api
  namespace: bankwiz-dev
  labels:
    app.kubernetes.io/name: bankwiz-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bankwiz-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bankwiz-api
    spec:
      automountServiceAccountToken: false
      # Pas d'imagePullSecrets : les paquets de la forge sont publics, le pull est anonyme
      # (cf. cluster/app/bankwiz/README.md §Contraintes).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bankwiz-api
          # Tag FIXE `develop-sha-<sha court>` poussé par le workflow `develop.yml` du dépôt
          # applicatif, épinglé au digest. Le tag mobile `develop` n'est volontairement pas
          # utilisé : ArgoCD ne voit pas qu'il bouge, le mettre à jour demanderait un
          # `rollout restart` à la main. Monter de version = un commit ici.
          image: forgejo.wittner.tech/jbwittner/bankwiz-server:develop-sha-08cb048@sha256:98476e70fbbc1a77584e6cfbde628167802af871571786a60ebe3ec6907960b3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # UID numérique de l'utilisateur `spring` du Dockerfile.
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
          # Identifiants seulement : l'URL est dans application.yaml. Secret généré par CNPG, jamais
          # scellé. Pas `optional` : sans base, le pod reste en CreateContainerConfigError plutôt que
          # de démarrer sans persistance.
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bankwiz-db-app
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bankwiz-db-app
                  key: password
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # Actuator, sur son propre port (`management.server.port`, application.yaml). Volontairement
            # absent de service.yaml : ni le Service ni donc l'HTTPRoute n'y mènent, seul le kubelet
            # (sondes) et ce qui vise l'IP du pod l'atteignent.
            - name: management
              containerPort: 8081
              protocol: TCP
          # Groupes de santé Kubernetes d'actuator, ouverts sans authentification (cf.
          # SecurityConfiguration du dépôt applicatif). Ils ne reflètent que l'état interne de
          # l'application, pas la base : une base indisponible ne doit ni tuer le pod (liveness)
          # ni le sortir du Service (readiness) — redémarrer n'y changerait rien.
          # La startup vise la liveness, comme le recommande la doc Spring Boot.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          # L'image fixe -XX:MaxRAMPercentage=75 : le tas prend 75 % de la limite mémoire.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            # Racine en lecture seule : Tomcat écrit son répertoire de travail dans java.io.tmpdir.
            - name: tmp
              mountPath: /tmp
            # Configuration Spring (manifests/application.yaml). Le profil actif y est
            # déclaré : pas de SPRING_PROFILES_ACTIVE ici, la configuration vit en un seul endroit.
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: bankwiz-api-config
