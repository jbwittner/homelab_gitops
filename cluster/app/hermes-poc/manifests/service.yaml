apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes-poc
  labels:
    app.kubernetes.io/name: hermes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes
  ports:
    - { name: api, port: 8642, targetPort: api, protocol: TCP }
    - { name: dashboard, port: 9119, targetPort: dashboard, protocol: TCP }
