# La machine d'EXERCICE du PRA de la forge. Ce n'est PAS un standby : rien ici ne prend le relais
# de la production, et rien ici ne doit être joignable depuis Internet.
#
# ⚠️ Ce qu'elle remplace, c'est la pile parallèle montée SUR L'HÔTE DE PRODUCTION, décrite au
# § Protocole de homelab_emeriss/forgejo/doc/pra-exercices.md. Ce que ça achète, et qui est la
# seule justification de ce composant :
#   - plus de contention mémoire : le protocole actuel avertit que deux Forgejo + deux PostgreSQL
#     sur les 2 Gio de plancher laissent l'OOM killer choisir sa victime, sans garantie que ce
#     soit la copie ;
#   - plus de collision de ports : `postgres-exporter` publie `9187` EN DUR, d'où la surcharge
#     `profiles: ["jamais-en-exercice"]` du protocole — inutile ici, la VM a ses propres ports ;
#   - plus de risque de chemin : le `rm -rf` de l'étape 3 ne peut PAS atteindre `/srv/forgejo` de
#     la production, il n'existe pas dans cette VM. Aujourd'hui seul le préfixe `pra-` sépare la
#     commande destructrice de la perte de la production ;
#   - l'exercice se joue N'IMPORTE QUAND — plus de fenêtre interdite autour de 3h30 ni pendant
#     qu'on pousse sur la forge.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: forgejo-pra
  labels:
    app.kubernetes.io/name: forgejo-pra
    app.kubernetes.io/part-of: homelab-gitops
spec:
  # ⚠️ ÉTEINTE PAR DÉFAUT, et c'est l'état normal entre deux exercices. Trois raisons :
  #   1. une seconde forge qui tourne sans surveillance porte les MÊMES identifiants de miroir
  #      poussé que la production — `update_mirrors` passe 24 h après le démarrage du conteneur,
  #      donc une VM oubliée en marche finit par pousser vers le dépôt GitHub, la copie de survie ;
  #   2. 4 vCPU + 4 Gio réservés en permanence sur un nœud, pour rien ;
  #   3. le disque de la VM porte une copie des données de la forge après un exercice.
  #
  # ⚠️ ALLUMER SE FAIT PAR GIT, pas par `virtctl start` : `selfHeal: true` est actif sur
  # l'Application et ré-imposerait `Halted` dans la minute. Passer cette valeur à `Always`,
  # commiter, pousser — ArgoCD démarre la VM. C'est aussi ce qui date l'exercice dans l'historique.
  runStrategy: Always

  dataVolumeTemplates:
    - metadata:
        name: forgejo-pra-root
        annotations:
          # ⚠️ SANS CETTE LIGNE, LE DISQUE NE S'IMPORTE JAMAIS TANT QUE LA VM EST ÉTEINTE.
          # `openebs-lvm-thin` est en `WaitForFirstConsumer` et le CR CDI porte le feature gate
          # `HonorWaitForFirstConsumer` : pas de pod `virt-launcher` ⇒ pas de consommateur ⇒ le
          # PVC reste `Pending` et le DataVolume `PendingPopulation`, indéfiniment. L'événement
          # du PVC le dit : `waiting for first consumer to be created before binding`.
          #
          # Ce qu'on y gagne n'est PAS du temps : mesuré le 2026-09-14, l'import prend 69 s, et
          # sans l'annotation il aurait lieu au premier allumage (le pod `virt-launcher` EST un
          # premier consommateur). 69 s contre un budget RTO d'une heure ne justifient rien.
          #
          # Ce qu'on y gagne, c'est la LISIBILITÉ DE L'ÉTAT AU REPOS. Sans l'annotation, le
          # composant vit en permanence en `PVC Pending` + `DV PendingPopulation` — état
          # rigoureusement indiscernable d'une panne de stockage, à l'œil comme pour une alerte.
          # Avec, l'état nominal éteint est `DV Succeeded` + `PVC Bound`, et tout autre état est
          # un vrai problème. Un composant dormant doit être vert, sinon on cesse de le regarder.
          #
          # Annotation CIBLÉE sur ce volume, et pas `featureGates: []` sur le CR CDI : le feature
          # gate vaut pour tout le cluster, cette annotation pour ce DataVolume seul.
          #
          # ⚠️ Ce qu'on paie en échange : le PVC est provisionné MAINTENANT, sur un nœud choisi
          # sans savoir où la VM se schedulera — et le `nodeAffinity` du PV y cloue ensuite la VM.
          # C'est exactement ce que `WaitForFirstConsumer` sert à éviter. Sans conséquence ici :
          # trois nœuds équivalents, une seule VM, aucune autre contrainte de placement.
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
      spec:
        storage:
          accessModes:
            - ReadWriteOnce
          storageClassName: openebs-lvm-thin
          resources:
            requests:
              # Sans commune mesure avec les ~26 Mio de la forge : ce qui dimensionne, c'est la
              # COEXISTENCE de l'étape 3 — l'archive rapatriée dans `restauration/`, `data/`
              # déballé, et `pgdata/` restauré, plus les images Docker. Le VG a ~930 Gio libres
              # par nœud : la place n'est pas la contrainte, la re-télécharger l'est.
              storage: 40Gi
        source:
          http:
            # Debian 13 (trixie) générique, build DATÉ — pas le lien `latest/`, qui bouge sous le
            # manifeste et rendrait la VM non reproductible. Renovate NE SUIT PAS cette URL
            # (aucun manager ne connaît cloud.debian.org) : elle se rafraîchit à la main, à
            # l'exercice COMPLET annuel. Une image de quelques mois est sans conséquence ici —
            # le premier geste dans la VM est de toute façon un `apt update`.
            url: https://cloud.debian.org/images/cloud/trixie/20260914-2601/debian-13-generic-amd64-20260914-2601.qcow2

  template:
    metadata:
      labels:
        app: forgejo-pra
        kubevirt.io/domain: forgejo-pra
    spec:
      # Même raison que le `evictionStrategy` du KubeVirt CR : volume node-local, migration à
      # chaud impossible. Drainer le nœud éteint cette VM — ce qui est acceptable pour un
      # composant d'exercice, et ne le serait pas pour de l'exploitation.
      evictionStrategy: None
      terminationGracePeriodSeconds: 60
      domain:
        cpu:
          # Colonne « confortable » du tableau de dimensionnement de
          # homelab_emeriss/forgejo/README.md § Matériel minimum. Le plancher (2 vCPU / 2 Gio)
          # n'est PAS la bonne cible ici : c'est justement le plancher qui rend le protocole
          # actuel risqué, et un exercice sous-dimensionné mesure un RTO qui n'est pas le vrai.
          cores: 4
        memory:
          guest: 4Gi
        devices:
          disks:
            - name: root
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              # `masquerade` : la VM est NATée derrière l'IP du pod. Sortie LAN et Internet OK
              # (indispensable — `restic` parle à GCS, et le dépôt se clone depuis la forge) ;
              # entrée par le Service seulement. Sans `ports:`, TOUS les ports sont transférés.
              masquerade: {}
          # Sans RNG virtio, la génération d'entropie de la VM est lente au point de faire traîner
          # le premier démarrage de PostgreSQL et de sshd.
          rng: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: root
          dataVolume:
            name: forgejo-pra-root
        - name: cloudinit
          cloudInitNoCloud:
            # ⚠️ PLAFOND DUR DE 2048 OCTETS sur `userData` inline, imposé par le webhook
            # `virtualmachine-validator.kubevirt.io` (au-delà : `userdata exceeds 2048 byte
            # limit. Should use UserDataSecretRef`). C'est pourquoi le bloc ci-dessous ne porte
            # AUCUN commentaire : ils comptent dans les 2048. Ils sont ici, autour, où ils sont
            # gratuits. ⚠️ Ne pas y ajouter une ligne sans revérifier la taille :
            #   kustomize build cluster/app/forgejo-pra/manifests \
            #     | yq -r 'select(.kind=="VirtualMachine")
            #             | .spec.template.spec.volumes[1].cloudInitNoCloud.userData' | wc -c
            #
            # ⚠️ VOLONTAIREMENT MINIMAL, et ce n'est pas de la paresse : ce cloud-init ne
            # REMPLACE PAS homelab_emeriss/doc/bootstrap-debian.md. Il pose le strict nécessaire
            # pour ouvrir un SSH et lancer un `docker compose` — compte, swap, Docker CE, les
            # trois paquets. Tout le reste (journalisation Docker, unattended-upgrades, horloge,
            # volume de sauvegarde dédié, durcissement SSH) reste dans le bootstrap, qui est la
            # procédure qu'on veut ÉPROUVER, pas recopier. Une procédure recopiée diverge.
            #
            # ⚠️ Aucun secret ici — ce dépôt est PUBLIC. Le mot de passe `restic`, les sept
            # `FORGEJO_*` et `DB_PASSWORD` se saisissent à la main dans la VM au moment de
            # l'exercice, depuis les copies HORS LIGNE. Une clé publique SSH n'est pas un secret.
            # ⚠️ `sops` est ABSENT de cette liste à dessein : Debian ne l'empaquette pas, et le
            # §4.2 du bootstrap impose de vérifier la somme de contrôle du binaire GitHub —
            # l'installer ici ferait sauter ce contrôle. Cf. README § Prérequis dans la VM.
            #
            # Ce que fait le script, dans l'ordre :
            #   1. swap 2 Go — sans lui un `git gc` ou un `pg_restore` qui déborde se fait tuer
            #      par l'OOM killer AU MILIEU d'un repack (bootstrap-debian.md §3) ;
            #   2. Docker CE depuis le dépôt Docker (§4) — PAS `docker.io`, qui n'a pas le
            #      plugin `compose` v2 alors que tout le dépôt d'en face est en `docker compose` ;
            #   3. `jbwittner` dans le groupe `docker` — ⚠️ équivalent root, assumé : VM jetable ;
            #   4. l'arborescence d'exercice du § Protocole, aux MÊMES chemins que sur l'hôte de
            #      production, ce qui permet de jouer la procédure sans traduire un seul chemin.
            #
            # `uid: 1000` est explicite parce que c'est celui de l'image Forgejo rootless, donc
            # celui du `chown -R 1000:1000` de la procédure. Un compte en 1001 obligerait à
            # traduire toute la restauration.
            userData: |
              #cloud-config
              hostname: pra-forgejo
              package_update: true
              packages: [ca-certificates, curl, gnupg, git, locales-all, restic, age, apache2-utils]
              users:
                - name: jbwittner
                  uid: 1000
                  shell: /bin/bash
                  groups: [sudo]
                  sudo: "ALL=(ALL) NOPASSWD:ALL"
                  lock_passwd: true
                  ssh_authorized_keys:
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJB5ArFSObC1wh8qZ8r5+u8Vm9TpPPM8qGf5h1aFlzab jbwittner@MBPJB.local
              runcmd:
                - |
                  set -eux
                  fallocate -l 2G /swapfile
                  chmod 600 /swapfile
                  mkswap /swapfile
                  swapon /swapfile
                  echo '/swapfile none swap sw 0 0' >> /etc/fstab
                  install -m 0755 -d /etc/apt/keyrings
                  curl -fsSL https://download.docker.com/linux/debian/gpg \
                    | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
                  chmod a+r /etc/apt/keyrings/docker.gpg
                  . /etc/os-release
                  echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian ${VERSION_CODENAME} stable" \
                    > /etc/apt/sources.list.d/docker.list
                  apt-get update
                  apt-get install -y docker-ce docker-ce-cli containerd.io \
                                     docker-buildx-plugin docker-compose-plugin
                  usermod -aG docker jbwittner
                  install -d -m 700 /srv/pra-forgejo
                  install -d -m 750 /srv/pra-forgejo/data /srv/pra-forgejo/pgdata
                  install -d -m 700 /srv/pra-forgejo/restauration
                  install -d -m 700 /etc/forgejo
                  install -d -m 700 /var/backups/forgejo
