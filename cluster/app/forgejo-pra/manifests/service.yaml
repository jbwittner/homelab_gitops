# Le seul chemin d'entrée vers la VM d'exercice. Deux ports, aucun n'est public.
#
# ⚠️ CE NOM NE DOIT JAMAIS ÊTRE DÉCLARÉ AU REVERSE PROXY `192.168.1.50`, ni au tunnel Cloudflare.
# C'est une copie de la forge, avec ses vraies données et ses vrais comptes ; elle n'a rien à
# faire derrière `forgejo.wittner.tech` ni sous un nom `*.lan.wittner.tech`. On s'y rend par l'IP
# et rien d'autre. C'est aussi pour ça qu'il n'y a pas d'HTTPRoute dans ce composant.
apiVersion: v1
kind: Service
metadata:
  name: forgejo-pra
  annotations:
    # Pool `bleu-kalecgos-pool` (192.168.1.80-89). `.80` est pris par `shared-gw` ; `.81` est
    # figée ici pour que l'URL de contrôle de l'exercice ne change pas d'un exercice à l'autre.
    lbipam.cilium.io/ips: "192.168.1.81"
spec:
  type: LoadBalancer
  selector:
    # Les labels de `spec.template.metadata.labels` de la VirtualMachine sont portés par le pod
    # `virt-launcher`. ⚠️ VM `Halted` = aucun pod = Service SANS endpoint. C'est l'état normal
    # entre deux exercices, pas une panne.
    app: forgejo-pra
  ports:
    - name: forgejo
      # 3001 et non 3000, volontairement : c'est le port d'exercice du § Protocole. Le décalage
      # est ce qui empêche de croire qu'on regarde la copie alors qu'on regarde la production.
      port: 3001
      targetPort: 3000
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
