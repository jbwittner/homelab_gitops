apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: argocd
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: app-of-apps
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # App-of-apps de la partie APP : découvre tous les composants applicatifs, tous clusters
  # confondus. Un composant mono-cluster est une `Application` (`<nom>.app.yaml`), un composant
  # déployé sur plusieurs clusters est un `ApplicationSet` (`<nom>.appset.yaml`).
  # Le glob ne matche PAS ce fichier, qui porte le suffixe distinct '*.bootstrap.yaml'.
  project: default
  source:
    repoURL: https://github.com/jbwittner/homelab_gitops.git
    targetRevision: main
    path: cluster/app
    directory:
      recurse: true
      include: '{*.app.yaml,*.appset.yaml}'
  destination:
    name: bleu-kalecgos     # le HUB : ce tier ne produit que des Application/ApplicationSet
    namespace: argocd
  # ⚠️ CONVENTION — toute `Application` découverte ici DOIT porter le finalizer
  # `resources-finalizer.argocd.argoproj.io`. Le `prune: true` ci-dessous supprime l'objet
  # `Application` dès que son fichier quitte le glob (renommage en `.noapp.yaml`, suppression du
  # dossier). Sans finalizer, cette suppression est immédiate et n'entraîne RIEN : namespace,
  # StatefulSet, PVC, HTTPRoute et policies restent dans le cluster, vivants et plus réconciliés
  # par personne. Avec, le contrôleur supprime d'abord les ressources gérées, attend qu'elles
  # soient parties, puis relâche l'`Application`.
  #
  # Deux étages à ne pas confondre : `prune` décide du sort de l'`Application`, le finalizer
  # décide du sort de ce qu'elle gère. Les deux sont nécessaires.
  #
  # Le finalizer est inerte tant que rien ne demande de suppression : l'ajouter ne coûte rien et
  # ne change rien au déployé. Mais il doit être présent SUR L'OBJET VIVANT avant que la
  # suppression n'arrive — le poser et sortir le fichier du glob dans le même commit ne protège
  # de rien, le fichier peut disparaître avant que le finalizer n'ait été appliqué. D'où la
  # procédure en deux commits documentée en
  # [hermes-close](hermes-close/README.md#décommissionnement).
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
