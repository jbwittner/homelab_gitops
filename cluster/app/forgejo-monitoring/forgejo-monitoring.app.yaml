# Volet observabilité de la forge — qui n'est PLUS dans ce cluster depuis le 2026-09-11 (cf.
# [archive/forgejo](../../../archive/forgejo/README.md)). Ce composant est ce qu'il en reste ici :
# le scrape de son `/metrics` publié sur le LAN et les deux alertes de disponibilité.
#
# Séparé à l'origine du composant principal pour la même raison que velero-monitoring et
# cnpg-monitoring — ce sont des CRs `monitoring.coreos.com`, dont les CRDs n'existent pas au
# bootstrap à froid. La raison tient toujours, et une seconde s'y est ajoutée : il n'y a plus de
# composant principal où les mettre.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-monitoring
  namespace: argocd
  annotations:
    # Wave 2, comme les composants frères : après les CRDs. Aucun ordre vis-à-vis de la forge —
    # elle est hors du cluster, rien ici ne peut l'attendre. Une alerte peut exister avant ce
    # qu'elle surveille : elle sonnera, ce qui est correct.
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: forgejo-monitoring
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: forge
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://forgejo.wittner.tech/jbwittner/homelab_gitops.git
    targetRevision: main
    path: cluster/app/forgejo-monitoring/manifests
  destination:
    name: bleu-kalecgos
    # ⚠️ `monitoring` et non `forgejo` : ce namespace n'existe plus. C'est aussi celui du Secret
    # du token de métriques, que l'opérateur n'accepte de lire que dans le namespace de la
    # ScrapeConfig.
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
