# Alertes de disponibilité de la forge — qui n'est PLUS dans ce cluster depuis le 2026-09-11
# (composant archivé dans `archive/forgejo/`, la forge tourne en Docker sur une machine dédiée).
#
# POURQUOI CE COMPOSANT EXISTE : le 2026-09-09, pendant l'exercice de reprise en place, Forgejo est
# resté INDISPONIBLE ~45 MINUTES — PVC détruit, base détruite, Deployment supprimé — et **aucune
# alerte n'a sonné**. Ni celles du repo, ni les règles par défaut de kube-prometheus-stack.
#
# ⚠️ LA SOURCE A CHANGÉ AVEC LA BASCULE. Les deux règles s'appuyaient sur kube-state-metrics
# (`kube_deployment_status_replicas_available{namespace="forgejo"}`) : ces séries n'existent plus,
# il n'y a plus ni Deployment ni namespace. La sonde est désormais le SCRAPE LUI-MÊME —
# `up{job="forgejo"}`, alimenté par `scrapeconfig.yaml` sur
# `https://forgejo-metrics.lan.wittner.tech/metrics`. C'est un gain et une perte :
#   + elle voit le processus VIVANT MAIS MUET, ce que kube-state-metrics ne pouvait pas voir ;
#   + elle voit la machine Docker, que le cluster ne connaît par aucun autre biais ;
#   − elle voit aussi tout ce qui se met en travers du chemin réseau (DNS LAN, reverse proxy
#     192.168.1.50, TLS) et une DÉRIVE DU TOKEN de métriques (401 → `up == 0`). Un secret mal
#     tourné allume donc une alerte de disponibilité de la forge. C'est assumé : un scrape muet
#     n'est pas distinguable d'une forge morte, et le silence est la panne qu'on refuse.
#
# ⚠️ LE PIÈGE CENTRAL DE CE FICHIER RESTE LE MÊME : une expression qui compare une série ABSENTE
# ne se déclenche JAMAIS. Série absente ≠ série à zéro. D'où le couple valeur + `absent(...)`,
# exactement comme `VeleroBackupTooOld` / `VeleroNoBackupMetric` (velero-monitoring). Les deux se
# déplacent ensemble ; en garder une seule rouvre le trou.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forgejo-alerts
  namespace: monitoring
  labels:
    # ⚠️ OBLIGATOIRE : sélecteur du prometheus-operator (`ruleSelectorNilUsesHelmValues`). Sans ce
    # label, l'objet est ignoré SANS ERREUR — la règle n'existe simplement jamais.
    release: kube-prometheus-stack
spec:
  groups:
    - name: forgejo.rules
      rules:
        # La cible existe et ne répond pas : conteneur arrêté ou en boucle de redémarrage, machine
        # Docker éteinte, reverse proxy qui ne route plus le hostname, certificat expiré, ou token
        # de métriques divergent (401).
        #
        # ⚠️ 10 min, et pas moins. La forge est un conteneur unique : toute montée de version la
        # rend indisponible le temps du remplacement, et la mise à jour est maintenant MANUELLE
        # (plus de Renovate sur ce déploiement). Un seuil plus court transformerait chaque
        # redémarrage en alerte critique, et une alerte qu'on apprend à ignorer ne protège plus de
        # rien.
        - alert: ForgejoDown
          expr: up{job="forgejo"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "forgejo : la forge ne répond plus"
            description: "Le scrape de https://forgejo-metrics.lan.wittner.tech/metrics échoue depuis 10 min. ⚠️ C'est AUSSI le chemin du GitOps : si la forge est morte, ArgoCD ne se réconcilie plus (Applications en ComparisonError) — le déployé reste en place, mais rien ne bouge. Diagnostic dans l'ordre : la cible dans Prometheus (/targets, message d'erreur exact), puis `curl -sI https://forgejo.wittner.tech/` depuis le LAN, puis la machine Docker elle-même. Un 401 dans le message de la cible n'est pas une panne de la forge mais une dérive du token de métriques (cf. forgejo-metrics.secret.example.yaml)."

        # Complément INDISPENSABLE de la précédente : `== 0` ne peut rien dire d'une série qui
        # n'existe plus. La série `up{job="forgejo"}` disparaît si la ScrapeConfig est supprimée ou
        # perd son label `release`, si `prune` d'ArgoCD emporte le composant, ou si le relabeling
        # qui fixe `job="forgejo"` est modifié — trois façons silencieuses d'arrêter de surveiller
        # la forge.
        #
        # Exposition connue et assumée : elle se déclenche aussi si Prometheus lui-même ne tourne
        # plus — mais dans ce cas plus aucune alerte ne part, et le signal vient d'ailleurs
        # (Alertmanager muet, `Watchdog` qui cesse d'arriver).
        - alert: ForgejoScrapeMissing
          expr: absent(up{job="forgejo"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "forgejo : la forge n'est plus surveillée du tout"
            description: "Plus aucune série `up{job=\"forgejo\"}` depuis 15 min : ce n'est pas une panne de la forge, c'est la SURVEILLANCE qui a disparu. Vérifier `kubectl -n monitoring get scrapeconfig forgejo-metrics` (et son label `release: kube-prometheus-stack`), puis `kubectl -n argocd get app forgejo-monitoring`. Tant que cette alerte sonne, l'absence de ForgejoDown ne prouve RIEN."

    # ═══════════════════════════════════════════════════════════════════════════════════════════
    - name: forgejo-backup.rules
    # ═══════════════════════════════════════════════════════════════════════════════════════════
    # Fraîcheur des sauvegardes de la forge. Les séries viennent du collecteur `textfile` de
    # node-exporter, alimenté par `forgejo-ctl backup` sur l'hôte (fonction `publier_metriques`).
    #
    # ⚠️ POURQUOI PAS UN `OnFailure=` SYSTEMD, qui était le plan initial inscrit dans l'unité.
    # Un `OnFailure=` ne voit que ce qui ÉCHOUE. Or le mode de panne le plus coûteux d'un timer est
    # qu'il ne se déclenche PLUS : rien n'échoue alors, donc rien ne part. Une métrique ABSENTE le
    # dit sans qu'aucun processus n'ait à tourner sur l'hôte — et sans y poser un credential
    # Alertmanager qui, lui, se serait tu si la poussée elle-même avait échoué.
    #
    # ⚠️ MÊME COUPLE valeur + `absent(...)` que `VeleroBackupTooOld` / `VeleroNoBackupMetric`
    # (velero-monitoring), et pour la même raison. `publier_metriques` OMET délibérément la série
    # de succès quand aucune sauvegarde n'a jamais abouti, au lieu de l'écrire à zéro : un zéro se
    # lirait comme une sauvegarde du 1er janvier 1970, donc comme périmée — vrai, mais masquant
    # que le timer ne s'est JAMAIS déclenché. Les deux règles se déplacent ensemble ; en garder une
    # seule rouvre le trou.
      rules:
        # ⚠️ 30 h et non 24 : la période du timer est quotidienne, plus 15 min de
        # `RandomizedDelaySec`, plus la marge d'un `prune` restic long. C'est EXACTEMENT le seuil
        # `MAX_AGE_HOURS` de `forgejo-ctl` — les deux se changent ensemble, sinon la sonde locale
        # et l'alerte du cluster répondent différemment à la même question.
        - alert: ForgejoBackupTooOld
          expr: (time() - forgejo_backup_last_success_timestamp_seconds{job="external-node"}) > 108000
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "forgejo : aucune sauvegarde réussie depuis plus de 30 h"
            description: "La dernière sauvegarde RÉUSSIE de la forge remonte à plus de 30 h alors que le timer est quotidien. ⚠️ Ce qui est en jeu n'est pas la sauvegarde, c'est la capacité à RECONSTRUIRE : la forge porte homelab_gitops. Sur l'hôte : `sudo forgejo-ctl status` (code 3 attendu), puis `journalctl -u forgejo-backup.service -n 50`."

        # Complément indispensable de la précédente : `time() - <métrique>` ne se déclenche JAMAIS
        # si la série n'existe pas. Elle est absente tant qu'aucune sauvegarde n'a abouti sur cet
        # hôte — le cas d'un bootstrap où `systemctl enable --now forgejo-backup.timer` a été
        # oublié, que rien d'autre ne signale.
        #
        # ⚠️ 6 h : assez pour ne pas sonner pendant une reconstruction d'hôte en cours, assez peu
        # pour qu'un timer jamais armé se voie le jour même.
        # ⚠️ Elle est aussi absente si `ExternalNodeScrapeMissing` ou
        # `ExternalNodeTextfileCollectorFailing` (composant hosts-monitoring) sonnent : lire celles-là AVANT.
        - alert: ForgejoBackupNoMetric
          expr: absent(forgejo_backup_last_success_timestamp_seconds{job="external-node"})
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "forgejo : aucune sauvegarde réussie connue"
            description: "La métrique du dernier succès est absente depuis 6 h : soit aucune sauvegarde n'a JAMAIS abouti sur cet hôte (timer non armé — `systemctl enable --now forgejo-backup.timer`), soit le canal de publication est cassé. ⚠️ Vérifier d'abord ExternalNodeScrapeMissing et ExternalNodeTextfileCollectorFailing, du composant hosts-monitoring : si l'une des deux sonne, celle-ci n'est qu'un symptôme. Tant qu'elle sonne, ForgejoBackupTooOld est AVEUGLE."

        # L'échec franc. Il arrive AVANT `ForgejoBackupTooOld` — 15 min contre 30 h — parce qu'un
        # échec connu se répare le jour même, alors que la fraîcheur est le filet de dernier
        # recours. La métrique est écrite depuis `nettoyer`, donc sur toutes les issues, y compris
        # un SIGTERM en pleine fenêtre à froid.
        #
        # ⚠️ La série reste à 0 jusqu'à la PROCHAINE exécution : l'alerte ne s'éteint pas parce que
        # le problème est réglé, mais parce qu'une sauvegarde a REUSSI. C'est voulu — un échec
        # oublié ne doit pas s'effacer tout seul à minuit.
        - alert: ForgejoBackupFailed
          expr: forgejo_backup_last_run_success{job="external-node"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "forgejo : la dernière sauvegarde a échoué"
            description: "La dernière exécution de `forgejo-ctl backup` s'est terminée en échec. ⚠️ Vérifier EN PREMIER que la forge a été relevée : `backup` l'arrête pendant les dumps, et seul un SIGKILL peut la laisser éteinte (l'`ExecStopPost=` de l'unité est le rattrapage). `systemctl status forgejo-backup.service` puis `journalctl -u forgejo-backup.service -n 50`. Cette alerte ne s'éteindra qu'à la prochaine sauvegarde RÉUSSIE."

    # ═══════════════════════════════════════════════════════════════════════════════════════════
    - name: forgejo-db.rules
    # ═══════════════════════════════════════════════════════════════════════════════════════════
    # La BASE de la forge, via `forgejo-db-metrics.lan.wittner.tech` (`scrapeconfig-db.yaml`).
    #
    # ⚠️ « LA BASE EST MORTE » ÉTAIT DÉJÀ ALERTÉ AVANT CE GROUPE, par une chaîne indirecte : base
    # injoignable → `pg_isready` en échec → healthcheck de la forge en échec → les `SELECT count(*)`
    # de son `/metrics` échouent → `up{job="forgejo"} == 0` → `ForgejoDown`. Ce groupe n'ajoute donc
    # PAS la disponibilité : il ajoute ce que cette chaîne ne pouvait pas voir — et surtout la
    # capacité à NOMMER la cause au lieu de la déduire.
      rules:
        # L'exportateur lui-même ne répond pas : conteneur arrêté, proxy qui ne route plus,
        # certificat expiré, ou mot de passe de scrape divergent (401). Ne dit RIEN de la base.
        - alert: ForgejoDbExporterDown
          expr: up{job="forgejo-db"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "forgejo : l'exportateur PostgreSQL ne répond plus"
            description: "Le scrape de https://forgejo-db-metrics.lan.wittner.tech/metrics échoue depuis 10 min. ⚠️ Ce n'est PAS une alerte de base de données : tant qu'elle sonne, ForgejoDbDown est aveugle. Si ForgejoDown ne sonne pas en même temps, la forge tourne — donc la base aussi — et c'est l'exportateur ou son chemin réseau qui est en cause. Un 401 dans le message de la cible est une dérive du mot de passe de scrape."

        # Couple valeur + `absent(...)`, comme partout ailleurs dans ce fichier.
        - alert: ForgejoDbScrapeMissing
          expr: absent(up{job="forgejo-db"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "forgejo : la base n'est plus surveillée du tout"
            description: "Plus aucune série `up{job=\"forgejo-db\"}` depuis 15 min : c'est la SURVEILLANCE qui a disparu, pas la base. Vérifier `kubectl -n monitoring get scrapeconfig forgejo-db-metrics` et son label `release: kube-prometheus-stack`."

        # ⚠️ LA RÈGLE QUI JUSTIFIE CE GROUPE. `pg_up` distingue « l'exportateur tourne mais ne
        # joint pas la base » de « l'exportateur ne répond plus » — une distinction qu'aucune des
        # alertes existantes ne savait faire, puisque toutes lisaient un `up` de scrape.
        # Concrètement : conteneur `db` arrêté, mot de passe divergent entre `DATA_SOURCE_PASS` et
        # `POSTGRES_PASSWORD`, ou base qui refuse les connexions (`max_connections` atteint,
        # arrêt en cours).
        #
        # ⚠️ 5 min, et pas 10 : contrairement à un scrape, ce signal ne dépend d'aucun chemin
        # réseau long — l'exportateur et la base sont dans le même compose.
        - alert: ForgejoDbDown
          expr: pg_up{job="forgejo-db"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "forgejo : PostgreSQL ne répond pas à son exportateur"
            description: "L'exportateur tourne mais n'obtient pas de connexion : la base est bien en cause, pas le chemin de supervision. Sur l'hôte : `docker compose ps db` et `docker compose logs --tail=50 db`. ⚠️ ForgejoDown devrait sonner 5 min plus tard — si ce n'est PAS le cas, la forge tourne sur une base que l'exportateur seul ne joint pas : chercher du côté de `DATA_SOURCE_PASS`, pas du côté de PostgreSQL."

        # Un deadlock n'est jamais normal sur cette base : une forge à un seul écrivain n'en
        # produit pas. Leur apparition signale une contention réelle — migration de schéma
        # interrompue, deux instances Forgejo écrivant en même temps (le cas redouté de la
        # bascule), ou un `forgejo-ctl backup` chevauchant une opération longue.
        #
        # ⚠️ `increase(...[1h]) > 0` et non un seuil : sur une base qui doit en produire ZÉRO,
        # l'apparition EST le signal. Fenêtre d'1 h pour ne pas rappeler l'incident tout le jour.
        - alert: ForgejoDbDeadlocks
          expr: increase(pg_stat_database_deadlocks{job="forgejo-db", datname="app"}[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "forgejo : deadlock(s) sur la base"
            description: "Au moins un deadlock dans la dernière heure sur une base qui ne devrait pas en produire : la forge est un écrivain unique. Causes à écarter dans l'ordre : DEUX instances Forgejo écrivant sur la même base (le scénario redouté de la bascule — vérifier qu'aucune ancienne instance ne tourne), migration de schéma interrompue, sauvegarde chevauchant une opération longue. `docker compose logs db | grep -i deadlock` donne les requêtes en cause."
