apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ⚠️ ns `monitoring` et non `forgejo` : le namespace de la forge n'existe plus (composant archivé
# le 2026-09-11). La ScrapeConfig doit de toute façon partager le namespace du Secret de son token.
namespace: monitoring
resources:
  - prometheusrule.yaml
  # Deux cibles, deux objets — et non un seul avec deux `staticConfigs`. Elles ont des mécanismes
  # d'authentification différents (Bearer pour la forge, Basic pour l'exportateur), des Secrets
  # différents et des `job` différents. Les fondre rendrait ces réglages communs.
  #
  # ⚠️ LA MACHINE QUI PORTE LA FORGE N'EST PAS SCRUTÉE ICI : son node-exporter est le composant
  # `cluster/app/hosts-monitoring`. Une machine précède le service qu'elle héberge et lui survit ;
  # la mettre ici ferait disparaître sa supervision au `prune` du jour où on retire la forge.
  # ⚠️ Ce composant en DÉPEND tout de même : les trois alertes de `forgejo-backup.rules` lisent des
  # séries qui arrivent par CE scrape-là (collecteur textfile). Dépendance à sens unique, écrite
  # des deux côtés.
  - scrapeconfig.yaml        # la forge -> job="forgejo"
  - scrapeconfig-db.yaml     # la base  -> job="forgejo-db"
  #
  # --- Secret scellé du token de métriques : ligne COMMENTÉE ----------------------------------
  #
  # ⚠️ Commentée et non absente : un `resources:` pointant un fichier MANQUANT fait échouer le
  # `kustomize build` ENTIER — l'Application partirait en `ComparisonError` et ni les alertes ni
  # la ScrapeConfig ne seraient posées. Commentée, tout se déploie et seul le scrape échoue,
  # lisiblement (cible en erreur `secret "forgejo-metrics" not found` côté prometheus-operator).
  #
  # Décommenter DANS LE MÊME COMMIT que la production du fichier scellé
  # (cf. `forgejo-metrics.secret.example.yaml`).
  #
  - forgejo-metrics.sealed.yaml
  #
  # --- Secret scellé du basic auth de l'exportateur PostgreSQL : même régime, même piège -------
  #
  # ⚠️ Commentée pour la même raison que ci-dessus : tant que le fichier n'existe pas, la
  # décommenter casse le `kustomize build` ENTIER et met toute l'Application en `ComparisonError`
  # — y compris les alertes, qui n'ont rien à voir avec ce secret.
  #
  # Tant qu'elle est commentée, le scrape de la base échoue (`secret "forgejo-db-metrics" not
  # found` côté prometheus-operator) et `forgejo-db.rules` ne voit rien.
  #
  # ⚠️ Il y a un SECOND secret à sceller, dans un AUTRE composant : `node-exporters` de
  # `cluster/app/hosts-monitoring`. Tant que celui-là manque, ce sont les trois alertes de
  # `forgejo-backup.rules` D'ICI qui sont aveugles — elles transitent par ce scrape-là.
  #
  # Décommenter DANS LE MÊME COMMIT que la production du fichier scellé
  # (cf. `forgejo-db-metrics.secret.example.yaml`).
  #
  - forgejo-db-metrics.sealed.yaml
  #
  # ⚠️ Les `*.secret.example.yaml` ne vont JAMAIS ici : ils ne contiennent que des `REMPLACER`.
