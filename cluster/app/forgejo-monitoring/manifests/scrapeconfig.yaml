# Scrape du `/metrics` de la forge — qui n'est PLUS dans ce cluster.
#
# Forgejo tourne en Docker sur une machine dédiée (cf.
# `doc/forgejo-docker-bascule-et-sauvegarde.md`) et son endpoint de métriques est publié sur le LAN
# par le reverse proxy `192.168.1.50` : `https://forgejo-metrics.lan.wittner.tech/metrics`. Il n'y
# a donc plus ni Service ni pod à sélectionner — un `ServiceMonitor` n'a rien à quoi s'accrocher,
# d'où cette `ScrapeConfig` (CRD `monitoring.coreos.com/v1alpha1`, livrée par kube-prometheus-stack)
# qui est la seule forme acceptant une CIBLE STATIQUE HORS CLUSTER.
#
# ⚠️ Il vit dans le ns `monitoring` et non `forgejo` — ce namespace n'existe plus. Conséquence
# directe : le Secret du token doit être dans `monitoring` LUI AUSSI, l'opérateur ne lit les
# références d'`authorization` que dans le namespace de l'objet. Le SealedSecret de l'ancien
# composant (`archive/forgejo/manifests/forgejo-metrics.sealed.yaml`) est chiffré pour le couple
# (`forgejo-metrics`, `forgejo`) : il est INUTILISABLE ici, le token doit être re-scellé pour
# `monitoring` (cf. `forgejo-metrics.secret.example.yaml`).
#
# ⚠️ Dépendances de ce scrape, toutes hors du cluster : résolution DNS de
# `forgejo-metrics.lan.wittner.tech` depuis les pods, route vers `192.168.1.50`, et déclaration du
# hostname AU reverse proxy. Un hostname `*.lan.wittner.tech` non déclaré là-bas répond 404 sans
# que rien ici ne soit en faute (cf. doc/reseau.md).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: forgejo-metrics
  namespace: monitoring
  labels:
    # ⚠️ OBLIGATOIRE : sélecteur du prometheus-operator
    # (`scrapeConfigSelectorNilUsesHelmValues`). Sans ce label, l'objet est ignoré SANS ERREUR —
    # la cible n'apparaît simplement jamais dans /targets.
    release: kube-prometheus-stack
spec:
  staticConfigs:
    - targets:
        # Host SANS schéma ni chemin : ils sont portés par `scheme` et `metricsPath` ci-dessous.
        - forgejo-metrics.lan.wittner.tech
  scheme: HTTPS
  metricsPath: /metrics
  # ⚠️ 60s et non 30s comme ailleurs. Chaque scrape déclenche une trentaine de `SELECT count(*)`
  # sur la base de la forge (le collecteur amont recompte tout, il ne met rien en cache) : la
  # fréquence de scrape est une charge SQL directe, sur une machine qu'on ne surveille plus
  # d'ici. Ce sont des jauges de dépôts et de comptes, elles ne bougent pas à la seconde.
  scrapeInterval: 60s
  scrapeTimeout: 20s
  # `Authorization: Bearer <token>`, comparé à temps constant côté Forgejo. MÊME valeur que
  # `[metrics] TOKEN` de l'`app.ini` de la machine Docker : les deux vivent maintenant dans deux
  # systèmes différents et RIEN ne les empêche de diverger — c'est le coût de la sortie du
  # cluster. Une divergence se lit en 401, donc en `up == 0`, donc en `ForgejoDown`.
  #
  # ⚠️ `type: Bearer` est le défaut, mais il est explicité : la valeur envoyée est
  # `<type> <credentials>`, et un type vide enverrait le token nu — 401 sans rien dire de plus.
  authorization:
    type: Bearer
    credentials:
      name: forgejo-metrics
      key: token
  # TLS : le proxy sert le wildcard Let's Encrypt `*.lan.wittner.tech`, CA publique déjà dans le
  # magasin du conteneur Prometheus. Pas de `tlsConfig`, et surtout PAS d'`insecureSkipVerify`.
  relabelings:
    # Fixe le label `job`. Sans ça, une ScrapeConfig nomme son job
    # `scrapeConfig/monitoring/forgejo-metrics` — et le dashboard « Forge — forgejo » comme les
    # deux alertes sélectionnent `job="forgejo"`. C'est le SEUL point de couplage entre cet objet
    # et eux : le changer casse les deux, silencieusement.
    - targetLabel: job
      replacement: forgejo
