# EXEMPLE — versionné, sans aucune valeur réelle. Copie de référence du template de scellement
# `forgejo-metrics.secret.yaml`, qui est gitignoré (`*.secret.yaml`) et supprimé après `kubeseal`.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient
# qu'un `REMPLACER`. Il se recopie, il ne s'applique pas.
#
# --------------------------------------------------------------------------------------------
#
# À quoi il sert : présenter `Authorization: Bearer <token>` au `/metrics` de la forge, qui vit
# maintenant HORS du cluster (`https://forgejo-metrics.lan.wittner.tech/metrics`, machine Docker —
# cf. doc/forgejo-docker-bascule-et-sauvegarde.md). Sans en-tête, Forgejo répond 401 et la cible
# reste muette.
#
# ⚠️ CE N'EST PLUS LA MÊME CLÉ QUE CELLE DE L'APP. Du temps du composant `cluster/app/forgejo`, un
# seul Secret servait à la fois au pod (`FORGEJO__METRICS__TOKEN`) et au scrape : ils ne POUVAIENT
# pas diverger. Désormais la valeur de référence est le `[metrics] TOKEN` de l'`app.ini` de la
# machine Docker, et ce Secret n'en est qu'une COPIE. Les deux se tournent à la main, dans deux
# systèmes distincts.
#
# ⚠️ Et il ne se recycle pas depuis l'ancien composant : `archive/forgejo/manifests/
# forgejo-metrics.sealed.yaml` est chiffré pour le couple (`forgejo-metrics`, `forgejo`). Un
# SealedSecret ne change ni de nom ni de namespace — il faut re-sceller pour `monitoring`, avec la
# valeur en clair relevée sur l'`app.ini`.
#
# Scellement (depuis la racine du repo) :
#   cp cluster/app/forgejo-monitoring/manifests/forgejo-metrics.secret.example.yaml \
#      cluster/app/forgejo-monitoring/manifests/forgejo-metrics.secret.yaml
#   # renseigner `token` avec le `[metrics] TOKEN` de l'app.ini de la machine Docker, puis :
#   kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#     < cluster/app/forgejo-monitoring/manifests/forgejo-metrics.secret.yaml \
#     > cluster/app/forgejo-monitoring/manifests/forgejo-metrics.sealed.yaml
#   rm cluster/app/forgejo-monitoring/manifests/forgejo-metrics.secret.yaml
#   # puis DÉCOMMENTER la ligne `forgejo-metrics.sealed.yaml` de kustomization.yaml
#
# ⚠️ Rotation : changer le token côté `app.ini` demande un redémarrage du conteneur Forgejo
# (l'`app.ini` n'est relu qu'au DÉMARRAGE), Prometheus rechargeant lui sa configuration en
# quelques dizaines de secondes. Entre les deux, la cible est en 401 — donc `ForgejoDown` après
# 10 min.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-metrics
  namespace: monitoring
  labels:
    # Exclut le Secret des sauvegardes velero : il est reproductible depuis Git, et le RESTAURER
    # nuit — un Secret restauré arrive sans ownerReference, le contrôleur sealed-secrets refuse
    # alors de s'approprier l'objet préexistant et le Secret devient orphelin, en silence.
    velero.io/exclude-from-backup: "true"
type: Opaque
stringData:
  # `[metrics] TOKEN` de l'app.ini de la machine Docker — recopié, pas régénéré.
  token: "REMPLACER"
