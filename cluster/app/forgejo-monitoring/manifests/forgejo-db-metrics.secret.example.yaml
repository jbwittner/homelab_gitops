# EXEMPLE — versionné, sans aucune valeur réelle. Copie de référence du template de scellement
# `forgejo-db-metrics.secret.yaml`, qui est gitignoré (`*.secret.yaml`) et supprimé après `kubeseal`.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient que
# des `REMPLACER`. Il se recopie, il ne s'applique pas.
#
# --------------------------------------------------------------------------------------------
#
# À quoi il sert : présenter `Authorization: Basic ...` au `postgres-exporter` de la machine qui
# porte la forge (service de la pile `forgejo/`, dépôt homelab_emeriss ; fichier d'hôte
# `/etc/forgejo/metrics-web-config.yml`). Sans en-tête, il répond 401 et la cible reste muette.
#
# ⚠️ IL NE COUVRE QUE LA BASE. Le `node-exporter` de la MÊME machine a son propre Secret,
# `node-exporters`, dans le composant `hosts-monitoring`. Ce n'est pas une isolation
# cryptographique — ce serait illusoire, même hôte, même `docker inspect` — c'est une
# INDÉPENDANCE DE CYCLE DE VIE : la supervision de la machine survit à la forge, donc retirer la
# forge du parc doit pouvoir supprimer CE Secret sans toucher à l'autre. Un secret partagé aurait
# réintroduit exactement le couplage que la séparation des deux composants sert à défaire.
#
# ⚠️ CE N'EST PAS LE MÊME SECRET QUE `forgejo-metrics`, et ils ne sont pas interchangeables.
# Celui-ci est un couple identifiant/mot de passe pour `basicAuth` ; l'autre est le
# `[metrics] TOKEN` de l'`app.ini` pour `authorization: Bearer`. Deux mécanismes parce que deux
# logiciels : Forgejo ne sait pas faire de basic auth sur `/metrics`.
#
# ⚠️ CÔTÉ HÔTE, C'EST UN HACHAGE BCRYPT QUI EST STOCKÉ, pas le mot de passe. Ici c'est le mot de
# passe EN CLAIR (scellé) : c'est Prometheus qui l'émet. On ne peut donc PAS récupérer la valeur
# depuis la machine si elle est perdue — il faut en tirer une neuve et refaire les deux copies.
#
# Scellement (depuis la racine du repo) :
#   cp cluster/app/forgejo-monitoring/manifests/forgejo-db-metrics.secret.example.yaml \
#      cluster/app/forgejo-monitoring/manifests/forgejo-db-metrics.secret.yaml
#   # tirer le mot de passe, puis le renseigner ci-dessous :
#   openssl rand -base64 24
#   kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#     < cluster/app/forgejo-monitoring/manifests/forgejo-db-metrics.secret.yaml \
#     > cluster/app/forgejo-monitoring/manifests/forgejo-db-metrics.sealed.yaml
#   rm cluster/app/forgejo-monitoring/manifests/forgejo-db-metrics.secret.yaml
#   # puis DÉCOMMENTER la ligne `forgejo-db-metrics.sealed.yaml` de kustomization.yaml
#
# Puis, sur l'hôte `vert-emeriss`, produire le hachage de ce mot de passe et le poser dans
# `/etc/forgejo/metrics-web-config.yml` — ce fichier-là SEULEMENT, pas celui du node-exporter
# (paquet `apache2-utils`, cf. doc/bootstrap-debian.md §4.0 du dépôt homelab_emeriss) :
#   htpasswd -nBC 12 "" | tr -d ':\n' ; echo
#
# ⚠️ ORDRE DE ROTATION : le CLUSTER D'ABORD, l'hôte ensuite. `exporter-toolkit` relit son fichier
# à chaque requête (aucun redémarrage), alors que ce Secret demande un commit puis une synchro
# ArgoCD. Dans l'autre sens, la fenêtre de 401 dure le temps du commit — et au-delà de 10 min elle
# allume `ForgejoDbExporterDown`.
#
# ⚠️ Entre Traefik et la machine, ce mot de passe passe EN CLAIR sur le LAN : le TLS s'arrête au
# proxy (pas de `tls_server_config` côté exportateur, qui imposerait un certificat auto-signé donc
# un `insecureSkipVerify` — que ce dépôt refuse).
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-db-metrics
  namespace: monitoring
  labels:
    # Exclut le Secret des sauvegardes velero : il est reproductible depuis Git, et le RESTAURER
    # nuit — un Secret restauré arrive sans ownerReference, le contrôleur sealed-secrets refuse
    # alors de s'approprier l'objet préexistant et le Secret devient orphelin, en silence.
    velero.io/exclude-from-backup: "true"
type: Opaque
stringData:
  # ⚠️ `prometheus` est le nom attendu par `/etc/forgejo/metrics-web-config.yml` (clé de
  # `basic_auth_users`). Le changer ici sans le changer là-bas donne un 401, donc `up == 0`, donc
  # `ForgejoDbExporterDown` — une alerte de panne, pas un message d'authentification.
  username: "prometheus"
  # `openssl rand -base64 24`. En clair ici, scellé ensuite ; l'hôte n'en garde que le bcrypt.
  # ⚠️ TIRER UNE VALEUR PROPRE, pas celle de `node-exporters` : les deux Secrets sont séparés pour
  # que leurs cycles de vie le soient. Les remplir avec la MÊME valeur ne casse rien — deux Secrets
  # distincts restent deux objets qu'on peut créer, tourner et supprimer séparément. C'est ce qui
  # est fait aujourd'hui. Le seul coût est qu'une fuite de l'un expose l'autre : sur une machine
  # où les deux exportateurs partagent l'hôte, le démon Docker et le groupe `docker`, c'était déjà
  # vrai. Les diverger reste possible à tout moment, sans toucher au reste.
  password: "REMPLACER"
