# Le runner Forgejo Actions, et le démon Docker qui le sert.
#
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# POURQUOI UN STATEFULSET ET PAS UN DEPLOYMENT — deux raisons, et la seconde est la vraie.
#
# 1. Deux PVC en RWO par pod (le cache d'actions, et `/var/lib/docker` de dind). Même argument que
#    `hermes`.
# 2. ⚠️ CHAQUE REPLICA A SA PROPRE IDENTITÉ AUPRÈS DE LA FORGE. Un couple (uuid, token) ne se
#    partage pas entre deux daemons : deux processus présentant le même uuid se disputent les
#    jobs et la forge n'en voit qu'un. Il faut donc qu'un pod sache QUEL enregistrement est le
#    sien — c'est l'ordinal stable du StatefulSet (`forgejo-runner-0`, `-1`, …) qui le lui dit,
#    et l'initContainer `render-config` ci-dessous qui va chercher la bonne clé du Secret.
#    Un Deployment, dont les pods ont des noms aléatoires, ne peut pas faire ça.
#
# ⚠️ CONSÉQUENCE OPÉRATOIRE : `replicas: N` exige N enregistrements DÉJÀ scellés. Monter le chiffre
# sans avoir scellé `connection-<N-1>.yml` laisse le nouveau pod en `Init:CrashLoopBackOff`.
# L'échec est franc et le message le dit — mais l'ordre est : enregistrer sur la forge, sceller,
# PUIS monter le chiffre. Cf. README §Monter le parallélisme.
# ═══════════════════════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  serviceName: forgejo-runner
  # ⚠️ Le nombre de jobs exécutables en parallèle. `runner.capacity` reste à 1 dans config.yml :
  # c'est ICI que se règle le parallélisme, pour que deux jobs concurrents aient deux démons
  # Docker distincts. Cf. config/config.yml, section `runner.capacity`.
  replicas: 1
  # `Parallel` et non `OrderedReady` : contrairement à `hermes`, les pods ne partagent RIEN — un
  # jeu de PVC par ordinal, une identité par ordinal. Rien à sérialiser, et `OrderedReady` ferait
  # attendre `-1` derrière un `-0` bloqué sur un job long.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      # Ce pod exécute du code arbitraire venu des dépôts, dans un conteneur privilégié. Aucun
      # jeton de ServiceAccount ne doit s'y trouver : sinon une workflow malveillante — ou
      # simplement une dépendance compromise tirée par un build — parle à l'API Kubernetes avec
      # les droits du SA.
      automountServiceAccountToken: false
      # Laisse le temps à `shutdown_timeout` (1 h, config.yml) de terminer un job en cours avant
      # que le kubelet n'envoie SIGKILL. Sans ça, tout rollout tue les jobs en vol.
      terminationGracePeriodSeconds: 3660

      initContainers:
        # ───────────────────────────────────────────────────────────────────────────────────────
        # Assemble le config.yml final : partie commune (ConfigMap, en clair) + section `server:`
        # du replica (SealedSecret, chiffrée). Simple concaténation — `server:` est une clé racine,
        # le YAML se recolle sans outil.
        # ───────────────────────────────────────────────────────────────────────────────────────
        - name: render-config
          # Même image que le sidecar `prune`, pour n'introduire aucune image de plus.
          image: docker.io/library/docker:29.8.0-cli
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # `forgejo-runner-0` → `0`. L'ordinal est la seule chose stable qui distingue un
              # pod de StatefulSet ; c'est ce qui rend le montage déclaratif.
              ORDINAL="${HOSTNAME##*-}"
              SRC="/secrets/connection-${ORDINAL}.yml"
              if [ ! -f "$SRC" ]; then
                echo "FATAL: aucune connexion scellée pour l'ordinal ${ORDINAL} (${SRC} absent)." >&2
                echo "Chaque replica a son propre enregistrement sur la forge. Enregistrer le" >&2
                echo "runner, sceller la cle connection-${ORDINAL}.yml, PUIS monter replicas." >&2
                echo "Cf. cluster/app/forgejo-runner/README.md, section Monter le parallelisme." >&2
                exit 1
              fi
              cat /config/config.yml "$SRC" > /run/forgejo-runner/config.yml
              echo "config.yml assemble pour l'ordinal ${ORDINAL}"
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: connections, mountPath: /secrets, readOnly: true }
            - { name: runtime, mountPath: /run/forgejo-runner }
          resources:
            requests: { cpu: "10m", memory: 16Mi }
            limits: { memory: 64Mi }

      containers:
        # ───────────────────────────────────────────────────────────────────────────────────────
        # 1. LE DÉMON DOCKER
        # ───────────────────────────────────────────────────────────────────────────────────────
        - name: dind
          image: docker.io/library/docker:29.8.0-dind
          # L'ENTRYPOINT (`dockerd-entrypoint.sh`) reste en place : il prépare cgroups et iptables
          # avant d'exécuter ces arguments.
          args:
            # ⚠️ SOCKET UNIX, ET AUCUNE ÉCOUTE TCP. C'est le choix structurant de ce fichier, pour
            # deux raisons qui se cumulent :
            #
            # 1. SÉCURITÉ. Une écoute `tcp://0.0.0.0:2375` — la forme que décrit la doc Forgejo,
            #    pensée pour deux conteneurs Docker séparés — rendrait le démon joignable sur l'IP
            #    DU POD, donc depuis n'importe quel pod du cluster, sans TLS ni authentification.
            #    Qui atteint ce port est root sur le nœud Talos
            #    (`docker run -v /:/host --privileged`). Ici, le runner et le démon sont dans le
            #    MÊME pod : un socket dans un emptyDir partagé leur suffit, et il n'existe alors
            #    plus aucun port à fermer. `netpol.yaml` reste, mais en défense de profondeur et
            #    non plus comme seul rempart.
            #
            # 2. DÉPRÉCIATION DOCKER. Depuis la 29, `dockerd` journalise « API is accessible on
            #    http://0.0.0.0:2375 without encryption » suivi de « In future versions this will
            #    be a hard failure preventing the daemon from starting! » (moby#36357, ouvert
            #    depuis 2018, milestone `v-future`). Aucun drapeau d'opt-out n'existe ni n'est
            #    prévu : les seules issues supportées sont TLS, socket Unix ou SSH. Le socket
            #    supprime le problème au lieu de le chiffrer.
            #
            # ⚠️ Le chemin n'est PAS `/var/run/docker.sock` : `/var/run` de l'image dind porte
            # déjà l'état de containerd, y monter un emptyDir l'écraserait. D'où un répertoire
            # dédié, partagé par les trois conteneurs.
            #
            # ⚠️ Alternative écartée : TLS via `DOCKER_TLS_CERTDIR`. L'image `docker:dind` sait
            # générer ses certificats seule, mais le certificat serveur ne porte pas
            # `pod.docker.internal` dans ses SAN — toute vérification depuis un job container
            # échouerait. Il faudrait émettre les nôtres (cert-manager est là), soit un Issuer, un
            # Certificate, trois montages de Secret et une rotation à surveiller, pour un résultat
            # MOINS bon : le port resterait ouvert, simplement chiffré.
            - "dockerd"
            - "-H"
            - "unix:///run/docker-sock/docker.sock"
          env:
            # Neutralise la génération automatique de certificats de l'image, qui ajouterait
            # d'elle-même une écoute `tcp://0.0.0.0:2376` — exactement ce que ce montage supprime.
            - { name: DOCKER_TLS_CERTDIR, value: "" }
          securityContext:
            # Le seul privilège du composant, et il est irréductible : overlayfs, netns et
            # iptables du bridge Docker. C'est ce que le label PSA du namespace autorise.
            privileged: true
          # Sondes EXEC, et il n'y a de toute façon plus de port à sonder : le démon n'écoute
          # que sur un socket Unix. Une sonde `tcpSocket` supposerait de rouvrir une écoute
          # réseau, et partirait en plus de l'identité `host` de Cilium, ce qui exigerait une
          # règle d'ingress. En `exec`, aucun paquet ne traverse la policy.
          startupProbe:
            exec:
              command: ["docker", "-H", "unix:///run/docker-sock/docker.sock", "info"]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["docker", "-H", "unix:///run/docker-sock/docker.sock", "info"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: 512Mi
            limits:
              # Pas de limite CPU : un build est par nature en dents de scie, et une limite CPU
              # sur le démon étrangle tous les conteneurs de test qu'il héberge.
              memory: 6Gi
          volumeMounts:
            # ⚠️ PVC et non emptyDir : c'est le cache d'images. En emptyDir, l'image de job de
            # 1,5 Go et toutes les images testcontainers seraient retéléchargées à chaque rollout.
            - { name: dind-storage, mountPath: /var/lib/docker }
            # Le socket. Partagé avec `runner` et `prune`, et c'est tout le montage : rien ne sort
            # du pod.
            - { name: docker-sock, mountPath: /run/docker-sock }

        # ───────────────────────────────────────────────────────────────────────────────────────
        # 2. LE RUNNER
        # ───────────────────────────────────────────────────────────────────────────────────────
        - name: runner
          image: data.forgejo.org/forgejo/runner:13.1.0
          command:
            - "forgejo-runner"
            - "daemon"
            # Fichier ASSEMBLÉ par l'initContainer, dans l'emptyDir `runtime`. Jamais le ConfigMap
            # directement : il lui manque la section `server:`.
            - "--config"
            - "/run/forgejo-runner/config.yml"
          env:
            # Par où le runner CRÉE les job containers : le socket du sidecar `dind`, partagé
            # par un emptyDir. À ne pas confondre avec `container.docker_host` de config.yml, qui
            # dit au runner quel socket MONTER dans les job containers — ils valent la même chose
            # ici, mais ils ne répondent pas à la même question.
            - { name: DOCKER_HOST, value: "unix:///run/docker-sock/docker.sock" }
            # Le runner écrit divers fichiers relatifs à $HOME ; le pointer vers le PVC évite la
            # couche éphémère.
            - { name: HOME, value: "/data" }
          workingDir: /data
          securityContext:
            # ⚠️ Root, et c'est assumé plutôt que subi. Descendre en non-root ne réduirait RIEN :
            # ce conteneur partage la netns du pod avec un démon Docker privilégié qu'il pilote
            # déjà — il peut donc de toute façon obtenir tout ce que ce démon peut faire. Un
            # `runAsUser` ici donnerait l'apparence d'un durcissement sans en être un, et coûterait
            # un `fsGroup` sur deux PVC. Le vrai périmètre de confinement est le pod, pas ce
            # conteneur.
            runAsUser: 0
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: runtime, mountPath: /run/forgejo-runner, readOnly: true }
            - { name: docker-sock, mountPath: /run/docker-sock }

        # ───────────────────────────────────────────────────────────────────────────────────────
        # 3. LE RAMASSE-MIETTES
        #
        # ⚠️ SIDECAR ET NON CronJob, pour une raison de sécurité et non de commodité : un CronJob
        # est un autre pod, il ne partage donc ni le socket ni son emptyDir. Il faudrait rouvrir
        # une écoute TCP et un Service pour qu'il joigne le démon — exactement le montage que ce
        # composant a supprimé. Ici le socket ne sort jamais du pod.
        # ───────────────────────────────────────────────────────────────────────────────────────
        - name: prune
          image: docker.io/library/docker:29.8.0-cli
          env:
            - { name: DOCKER_HOST, value: "unix:///run/docker-sock/docker.sock" }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # Seuil de remplissage du PVC de dind au-delà duquel on sacrifie le cache
              # d'images. Cf. le commentaire du niveau 2 plus bas.
              BUDGET=85
              while true; do
                # `sleep` D'ABORD : au démarrage d'un pod, le cache vient précisément d'être
                # restauré depuis le PVC, c'est le pire moment pour l'élaguer.
                sleep 86400

                # ─── NIVEAU 1 : quotidien, sans risque pour le cache ────────────────────────
                # Rien ici ne peut supprimer une image utile.
                #
                # ⚠️ `until` n'a PAS la même sémantique selon l'objet, et c'est le piège qui a
                # motivé cette réécriture : sur un CONTENEUR il filtre la date de création de ce
                # conteneur (ce qu'on veut), mais sur une IMAGE il filtre `.Created`, la date de
                # construction EN AMONT. `nginx:alpine` et `catthehacker/ubuntu:act-22.04` sont
                # publiées depuis des semaines : un `docker image prune -a --filter until=168h`
                # les supprime au tout premier passage, et vide donc le PVC que ce cache justifie.
                # Panne muette — le run suivant retélécharge 2,2 Go sans qu'aucune alerte bouge.
                docker container prune -f --filter "until=24h" || true
                # Volumes anonymes laissés par testcontainers. Seuls ceux qu'aucun conteneur ne
                # référence partent.
                docker volume prune -f || true
                # SANS `-a` : uniquement les couches orphelines (dangling), jamais une image
                # taguée. C'est la seule forme de `image prune` qui ne peut pas coûter un cache.
                docker image prune -f || true
                # Le cache de BUILD est le seul objet dont Docker connaisse vraiment la dernière
                # utilisation — BuildKit la suit lui-même. `unused-for` est donc exact ICI, et
                # n'a d'équivalent nulle part ailleurs.
                docker buildx prune -f --filter "unused-for=168h" || true

                # ─── NIVEAU 2 : seulement sous pression disque ──────────────────────────────
                # Docker n'expose AUCUNE date de dernier usage pour une image (`.Created` est la
                # date amont, `.Metadata.LastTagTime` la date du pull — une image tirée une fois
                # et utilisée tous les jours garde un LastTagTime d'il y a un an). Élaguer « les
                # moins utilisées » est donc impossible : l'information n'existe pas.
                # D'où le renversement : on n'élague pas par ancienneté, on élague par PRESSION.
                # Tant qu'il reste de la place, tout reste. Au-delà du seuil, balayage complet et
                # le cache se reconstruit au run suivant (~15 s pour l'image de job, mesuré).
                USED=$(df -P /var/lib/docker | awk 'NR==2 {print $5}' | tr -d '%')
                if [ "${USED:-0}" -ge "$BUDGET" ]; then
                  echo "prune: /var/lib/docker a ${USED}% (seuil ${BUDGET}%) - balayage complet"
                  docker image prune -af || true
                fi
              done
          resources:
            requests: { cpu: "10m", memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: docker-sock, mountPath: /run/docker-sock }
            # ⚠️ Le MÊME PVC que `dind`, monté ici en lecture seule, uniquement pour son `df`.
            # Sans lui, le niveau 2 ne peut pas connaître le taux de remplissage : `docker system
            # df` ne rapporte que la taille des objets Docker, pas la capacité du volume.
            - { name: dind-storage, mountPath: /var/lib/docker, readOnly: true }

      volumes:
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: connections
          secret:
            # Produit par le contrôleur sealed-secrets depuis `connections.sealed.yaml`.
            secretName: forgejo-runner-connections
        # Le config.yml assemblé. emptyDir et non PVC : il est reconstruit à chaque démarrage du
        # pod, et il contient le token EN CLAIR — il n'a rien à faire sur un disque persistant.
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Le socket du démon Docker, partagé par les trois conteneurs du pod. emptyDir : il se
        # recrée à chaque démarrage et ne doit RIEN garder entre deux vies du pod — un fichier de
        # socket périmé sur un volume persistant empêcherait `dockerd` de démarrer.
        - name: docker-sock
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

  volumeClaimTemplates:
    # Un jeu de volumes PAR REPLICA — c'est ce qui donne à chaque runner son propre cache et son
    # propre démon, sans aucune contention.
    - metadata:
        name: data
      spec:
        storageClassName: openebs-lvm-thin
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: dind-storage
      spec:
        storageClassName: openebs-lvm-thin
        accessModes: [ReadWriteOnce]
        resources:
          # Thin : l'espace n'est consommé qu'à l'écriture réelle. Dimensionné pour l'image de job
          # (~2,2 Go), les images testcontainers d'un homelab et les couches de build.
          # ⚠️ Surveillé par `openebs-monitoring`. Le sidecar `prune` vide tout le cache au-delà
          # de `BUDGET=85` % de CE volume : si `openebs-monitoring` sonne quand même, c'est le
          # seuil qu'il faut baisser, pas le PVC qu'il faut agrandir — un volume plus grand
          # repousse simplement le même mur.
          requests:
            storage: 50Gi
