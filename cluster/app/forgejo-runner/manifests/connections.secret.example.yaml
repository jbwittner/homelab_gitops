# EXEMPLE — versionné, sans aucune valeur réelle. Copie de référence du template de scellement
# `connections.secret.yaml`, qui est gitignoré (`*.secret.yaml`) et supprimé après `kubeseal`.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient que
# des `REMPLACER`. Il se recopie, il ne s'applique pas.
#
# ───────────────────────────────────────────────────────────────────────────────────────────────
# À QUOI IL SERT
#
# Il porte la section racine `server:` du config.yml, celle qui manque volontairement à
# `config/config.yml`. Une clé PAR REPLICA, nommée par l'ordinal du pod : l'initContainer
# `render-config` lit `connection-${HOSTNAME##*-}.yml` et la concatène à la partie commune.
#
# Un couple (uuid, token) ne se partage pas entre deux daemons — d'où une clé par replica, et non
# une valeur unique.
#
# ───────────────────────────────────────────────────────────────────────────────────────────────
# D'OÙ VIENNENT UUID ET TOKEN — enregistrement HORS LIGNE, pas par l'UI
#
# L'enregistrement interactif de l'UI Forgejo produit un uuid et un token qu'il faudrait recopier
# à la main : impératif, non reproductible. La doc Forgejo prévoit un chemin IaC où c'est NOUS qui
# choisissons le secret. C'est celui-ci, et c'est ce qui rend ce composant entièrement déclaratif.
#
# 1. Générer un secret de 40 caractères hexadécimaux et en DÉRIVER l'uuid. L'uuid n'est pas
#    aléatoire : c'est l'ASCII des 16 premiers caractères du secret, encodé en hexadécimal et
#    reformaté 8-4-4-4-12. Il se calcule donc sans jamais interroger la forge :
#
#      SECRET=$(openssl rand -hex 20)
#      # `od` et non `xxd` : ce dernier vient de `vim-common`, absent d'une Debian minimale.
#      UUID=$(printf '%s' "${SECRET:0:16}" | od -An -tx1 | tr -d ' \n' \
#             | sed -E 's/(.{8})(.{4})(.{4})(.{4})(.{12})/\1-\2-\3-\4-\5/')
#      echo "uuid:  $UUID"
#      echo "token: $SECRET"
#
# 2. Déclarer le runner SUR LA MACHINE DOCKER DE LA FORGE (cette commande ne peut pas partir
#    d'ici — elle a besoin d'un accès administrateur au binaire Forgejo) :
#
#      docker compose exec forgejo forgejo forgejo-cli actions register \
#        --name kube-runner-0 --scope jbwittner --secret "$SECRET"
#
#    ⚠️ `--scope jbwittner` : portée UTILISATEUR. Le runner n'exécutera que les workflows des
#    dépôts DONT TU ES PROPRIÉTAIRE. Une portée d'instance (`--scope` omis côté admin) lui
#    ferait accepter n'importe quel dépôt de la forge, y compris ceux créés plus tard par
#    quelqu'un d'autre. Une organisation n'est PAS couverte par la portée utilisateur : elle
#    demande son propre enregistrement.
#
#    La commande réaffiche l'uuid — il doit être IDENTIQUE à celui calculé en 1. S'il diffère,
#    c'est le secret qui a été mal recopié.
#
# 3. Reporter le couple ci-dessous, puis sceller.
#
# ───────────────────────────────────────────────────────────────────────────────────────────────
# SCELLEMENT (depuis la racine du repo)
#
#   cp cluster/app/forgejo-runner/manifests/connections.secret.example.yaml \
#      cluster/app/forgejo-runner/manifests/connections.secret.yaml
#   # renseigner les uuid/token, puis :
#   kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#     < cluster/app/forgejo-runner/manifests/connections.secret.yaml \
#     > cluster/app/forgejo-runner/manifests/connections.sealed.yaml
#   rm cluster/app/forgejo-runner/manifests/connections.secret.yaml
#
# ⚠️ ROTATION : relancer l'étape 2 avec les 24 DERNIERS caractères changés et les 16 premiers
# identiques met à jour le secret d'un runner existant. Changer les 16 premiers crée un NOUVEAU
# runner et laisse l'ancien en `offline` dans l'UI, à supprimer à la main.
# Ordre : la forge D'ABORD (elle accepte le nouveau secret immédiatement), le cluster ensuite.
# Entre les deux, le runner est en erreur d'authentification — donc `ForgejoRunnerDown` après
# 10 min.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner-connections
  namespace: forgejo-runner
  labels:
    # Exclut le Secret des sauvegardes velero : il est reproductible depuis Git, et le RESTAURER
    # nuit — un Secret restauré arrive sans ownerReference, le contrôleur sealed-secrets refuse
    # alors de s'approprier l'objet préexistant et le Secret devient orphelin, en silence.
    # (velero est `.noapp.yaml` aujourd'hui ; le label est posé pour le jour où il revient.)
    velero.io/exclude-from-backup: "true"
type: Opaque
stringData:
  # ⚠️ Le nom de la clé EST l'ordinal du pod. `connection-0.yml` → `forgejo-runner-0`.
  # Une clé manquante pour un ordinal déployé = `Init:CrashLoopBackOff` sur ce pod, avec un
  # message explicite dans `kubectl logs ... -c render-config`.
  connection-0.yml: |
    server:
      connections:
        forgejo:
          url: https://forgejo.wittner.tech/
          uuid: REMPLACER-uuid-calcule-a-l-etape-1
          token: REMPLACER-secret-40-hex-de-l-etape-1

