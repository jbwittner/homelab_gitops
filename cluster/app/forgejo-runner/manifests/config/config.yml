# Partie COMMUNE de la configuration de forgejo-runner. Elle est identique pour tous les replicas
# et ne contient AUCUN secret — elle est donc en clair, versionnée, générée en ConfigMap par
# `kustomization.yaml` (suffixe de hash → éditer ce fichier déclenche le rollout).
#
# ⚠️ IL MANQUE VOLONTAIREMENT LA SECTION RACINE `server:`. Elle porte l'uuid et le token, qui sont
# PROPRES À CHAQUE REPLICA (un enregistrement ne se partage pas entre deux daemons). Elle arrive
# du SealedSecret `forgejo-runner-connections`, clé `connection-<ordinal>.yml`, et l'initContainer
# `render-config` du StatefulSet CONCATÈNE les deux fichiers. La concaténation suffit parce que
# `server:` est une clé racine : aucun templating, aucun `envsubst`, aucune image maison.
#
# ⚠️ Ne jamais ajouter de clé `server:` ici : le YAML aurait alors deux clés racines `server:` et
# le runner s'arrêterait au démarrage sur une erreur de parsing.

log:
  # Ce que le processus runner écrit dans ses propres logs (kubectl logs).
  level: info
  # Ce qui remonte à la forge et s'affiche dans l'UI du job. `debug` ici rend les logs de job
  # illisibles ET les expose à quiconque peut lire le dépôt.
  job_level: info

runner:
  # Sans effet tant que `server.connections` est renseigné (c'est le cas), mais le runner écrit
  # quand même à cet emplacement dans certains chemins de code : le pointer vers le PVC évite une
  # écriture dans le répertoire courant.
  file: /data/.runner

  # ⚠️ RESTE À 1, ET C'EST STRUCTURANT. Le parallélisme de ce composant se règle par le nombre de
  # REPLICAS, pas par `capacity`. Deux jobs concurrents dans un même runner partagent le même
  # démon dind : ils se voient l'un l'autre (`docker ps`, `docker exec`), ce que la doc Forgejo
  # signale explicitement comme une fuite possible de secrets d'un job vers l'autre. Un replica
  # de plus = un pod de plus = un dind de plus = une isolation réelle.
  # Cf. README §Monter le parallélisme — ce n'est pas qu'un chiffre à changer.
  capacity: 1

  # Variables injectées dans LE JOB CONTAINER (et dans chaque `docker exec` d'une étape).
  # C'est ici que se joue l'accès Docker des workflows.
  envs:
    # ⚠️ PAS de `DOCKER_HOST` ici, et c'est délibéré. Le runner MONTE le socket du démon dans
    # chaque job container à l'emplacement standard `/var/run/docker.sock` (cf.
    # `container.docker_host` plus bas) : le `docker` du job le trouve tout seul. Poser un
    # `DOCKER_HOST` le détournerait vers une écoute réseau qui n'existe plus.
    #
    # ⚠️ EN REVANCHE, `TESTCONTAINERS_HOST_OVERRIDE` DEVIENT INDISPENSABLE — il ne l'était
    # qu'en ceinture du temps de l'écoute TCP. Testcontainers déduit l'adresse où joindre les
    # ports publiés à partir de `DOCKER_HOST` ; face à un socket Unix, il conclut `localhost`.
    # Or les ports sont publiés dans la netns DU POD, pas dans celle du job container : sans cet
    # override, chaque test partirait en timeout sur un conteneur pourtant démarré — et le
    # symptôme est indiscernable d'un service lent à s'initialiser.
    #
    # `pod.docker.internal` est résolu par `container.options` ci-dessous, en `--add-host`. Il
    # désigne la netns DU POD vue depuis l'intérieur de dind : c'est là que sont publiés les
    # ports des conteneurs, et c'est là qu'écoute aussi le proxy de cache du runner.
    TESTCONTAINERS_HOST_OVERRIDE: pod.docker.internal
    # Ryuk (le ramasse-miettes de testcontainers) monte `/var/run/docker.sock`. Ce socket existe
    # bien À L'INTÉRIEUR de dind, donc Ryuk fonctionne et n'a pas à être désactivé. Le laisser
    # actif est ce qui empêche les conteneurs de test de s'accumuler entre deux passages du
    # sidecar `prune`.
    TESTCONTAINERS_RYUK_DISABLED: "false"

  # La forge coupe elle-même à 3 h. 1 h ici est une borne plus basse et VOLONTAIRE : un build de
  # homelab ne dure pas une heure, et un job parti en boucle monopolise le seul replica.
  timeout: 1h
  # Laisse un job en cours se terminer quand le pod est supprimé (rollout, drain de nœud).
  # À 0 le job serait tué net et repartirait de zéro au prochain run.
  shutdown_timeout: 1h

  insecure: false
  fetch_timeout: 30s
  # 10 s et non 2 s (le défaut) : ce runner interroge une forge qui vit HORS du cluster, derrière
  # Cloudflare. 2 s donnerait ~43 000 requêtes par jour pour un dépôt qui construit trois fois par
  # semaine. Le prix payé est une latence d'au plus 10 s au démarrage d'un job.
  fetch_interval: 10s
  report_interval: 1s

  # ═════════════════════════════════════════════════════════════════════════════════════════════
  # LABELS — quelle image sert de job container.
  #
  # ⚠️ TOUTE image de job container DOIT contenir Node.js. Ce n'est pas un confort : les actions
  # courantes (`actions/checkout`, `actions/cache`, `actions/setup-*`) sont des actions JavaScript
  # que le runner exécute AVEC le node de l'image. Une image `maven:` ou `golang:` nue échoue dès
  # la première étape `uses:`, sur un message qui parle de node et pas du JDK — piège classique.
  #
  # D'où le choix de `catthehacker/ubuntu:act-*` comme image par défaut : c'est l'image de
  # référence de l'écosystème act/Forgejo, elle embarque node ET l'outillage que les actions
  # `setup-java` / `setup-go` attendent pour déposer un toolchain. Elle pèse ~1,5 Go, ce que le
  # PVC dind amortit dès le deuxième run (`force_pull: false` plus bas).
  #
  # Le JDK et le toolchain Go ne sont PAS dans l'image : ils sont posés par `actions/setup-java`
  # et `actions/setup-go`, dont le téléchargement est rattrapé par le serveur de cache (section
  # `cache` ci-dessous). Alternative écartée : construire une image maison à trois toolchains —
  # elle demanderait sa propre chaîne de build, son propre dépôt et sa propre surveillance de
  # fraîcheur, pour gagner quelques dizaines de secondes par run. Cf. README §Contraintes.
  # ═════════════════════════════════════════════════════════════════════════════════════════════
  labels:
    # `runs-on: docker` — le label que cherchent les workflows écrits pour Forgejo.
    - "docker:docker://ghcr.io/catthehacker/ubuntu:act-22.04"
    # `runs-on: ubuntu-latest` / `ubuntu-22.04` — pour que les workflows copiés de GitHub tournent
    # sans réécriture. ⚠️ L'image ne fournit PAS tout ce que fournit un runner GitHub hébergé.
    - "ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04"
    - "ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04"
    # `runs-on: node20` — image légère pour un job purement JS/TS, sans testcontainers ni build
    # natif. ~200 Mo contre ~1,5 Go : à préférer quand elle suffit.
    - "node20:docker://data.forgejo.org/oci/node:20-bookworm"

cache:
  # Sert `ACTIONS_CACHE_URL` à `actions/cache`. C'est ce qui rend supportable le fait que le JDK
  # et le toolchain Go ne soient pas dans l'image : ils sont téléchargés une fois, puis restitués
  # depuis le PVC.
  enabled: true
  # Dans le PVC `data` du replica. Sans ce réglage le cache irait dans `$HOME/.cache/actcache`,
  # donc dans la couche éphémère du conteneur : perdu à chaque rollout, sans aucun signe.
  dir: /data/cache
  # ⚠️ RÉGLAGE INDISPENSABLE, et sa nécessité n'est pas évidente. Le proxy de cache écoute dans la
  # netns DU POD ; les job containers, eux, vivent dans le réseau bridge de dind. L'autodétection
  # annoncerait une adresse que ces conteneurs ne savent pas joindre, et `actions/cache` échouerait
  # en timeout — sans faire échouer le job, juste en le ralentissant à chaque run. Panne muette.
  # Même alias que `TESTCONTAINERS_HOST_OVERRIDE`, posé par `container.options` : les deux
  # désignent la netns du pod, seul endroit joignable depuis un job container.
  host: pod.docker.internal
  port: 0
  proxy_port: 0

container:
  # Vide = le runner crée un réseau Docker dédié par job, DANS dind. C'est l'isolation par défaut,
  # et le fait que les services (`jobs.<id>.services`) et les conteneurs lancés par le job se
  # voient entre eux.
  network: ""
  enable_ipv6: false

  # ⚠️ `false`, et ce n'est PAS incohérent avec le sidecar dind privilégié. Ce réglage concerne
  # les conteneurs de JOB, créés dans dind. Le privilège nécessaire à Docker est porté une seule
  # fois, par le démon lui-même. Le passer à `true` donnerait `CAP_SYS_ADMIN` à chaque workflow
  # dans le démon dind, ce dont rien n'a besoin ici.
  privileged: false

  # `host-gateway` est résolu PAR DIND, et vaut l'adresse de sa passerelle de bridge —
  # c'est-à-dire la netns du pod. Ce seul alias sert au PLAN DE DONNÉES : les ports publiés par
  # les conteneurs de test (`TESTCONTAINERS_HOST_OVERRIDE`) et le proxy de cache (`cache.host`).
  # Le plan de contrôle, lui, ne passe plus par le réseau du tout — c'est le socket monté.
  # ⚠️ Retirer cette ligne ne casse pas le démarrage : les jobs partent, `docker build` marche
  # même, puis testcontainers et le cache échouent en « no such host ».
  options: "--add-host=pod.docker.internal:host-gateway"

  workdir_parent: /workspace

  # ⚠️ VIDE, donc AUCUN montage hôte autorisé depuis un workflow (`jobs.<id>.container.volumes`).
  # Un `'**'` rendrait la racine du conteneur dind montable par une workflow. Le jour où un
  # montage devient nécessaire, lister le chemin exact, jamais un glob large.
  valid_volumes: []

  # Deux effets d'un seul réglage, et c'est ce qui rend le socket Unix supérieur au TCP ici :
  #   1. le runner CRÉE les job containers sur ce démon ;
  #   2. `unix://` étant partageable, il MONTE ce socket dans chaque job container, à
  #      l'emplacement standard `/var/run/docker.sock`. La doc Forgejo précise qu'un `tcp://` ne
  #      peut pas l'être — c'est pourquoi l'ancien montage devait passer par
  #      `runner.envs.DOCKER_HOST`, devenu inutile.
  # Le chemin est celui de l'emptyDir partagé avec le sidecar `dind` (cf. statefulset.yaml) ;
  # le démon n'écoute sur aucun port.
  # ⚠️ Ne JAMAIS mettre `automount` ici : sur Talos il n'existe aucun `/var/run/docker.sock` au
  # niveau du pod (containerd, pas Docker), l'autodétection ne trouverait rien et retomberait
  # silencieusement sur `-` — tout accès Docker depuis les workflows cesserait.
  docker_host: "unix:///run/docker-sock/docker.sock"

  # `false` : c'est ce qui donne sa valeur au PVC de dind. À `true`, l'image de 1,5 Go serait
  # retéléchargée à chaque job.
  # ⚠️ Conséquence : un tag mobile (`act-22.04`) n'est plus jamais rafraîchi. La mise à jour est
  # explicite — cf. README §Opérations, « Rafraîchir l'image de job ».
  force_pull: false
  force_rebuild: false

host:
  # Sans objet : aucun label `:host` n'est déclaré, rien ne s'exécute hors conteneur. Pointé vers
  # le PVC quand même, pour qu'une erreur de configuration future n'écrive pas dans la couche
  # éphémère.
  workdir_parent: /data/host-workdir
