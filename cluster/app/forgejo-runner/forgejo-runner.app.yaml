apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-runner
  namespace: argocd
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: ci
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://forgejo.wittner.tech/jbwittner/homelab_gitops.git
    targetRevision: main
    path: cluster/app/forgejo-runner/manifests
  destination:
    name: bleu-kalecgos
    # Le namespace est porté par manifests/namespace.yaml (il doit être LABELLISÉ
    # `pod-security.kubernetes.io/enforce: privileged`), donc pas de `CreateNamespace=true`.
    namespace: forgejo-runner
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
