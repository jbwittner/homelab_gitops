# helm-values — kube-prometheus-stack (Prometheus + Alertmanager + Grafana + operator + exporters)

# --- Grafana : compte admin local uniquement (SSO authentik commenté, cf. plus bas) ---
grafana:
  # Dashboards maison regroupés dans un dossier Grafana « Wittnerlab », au lieu d'être
  # noyés parmi la trentaine de dashboards du chart : la page Dashboards liste les dossiers
  # AVANT les dashboards racine, donc les nôtres sortent en tête.
  # Les deux réglages vont par paire :
  #   - folderAnnotation : le sidecar range le ConfigMap dans le sous-dossier nommé par
  #     l'annotation `grafana_folder` (les dashboards du chart, non annotés, restent à la racine) ;
  #   - foldersFromFilesStructure : Grafana crée un dossier par sous-répertoire trouvé.
  # Sans la seconde, l'annotation ne produit rien de visible.
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  # PVC RWO node-local (openebs-lvm-thin) → Recreate force l'arrêt de l'ancien pod
  # avant le nouveau, sinon double-mount RWO au rollout ("device already mounted").
  deploymentStrategy:
    type: Recreate
  ## SSO AUTHENTIK — livré mais DÉSACTIVÉ. Même convention que le bloc alertmanager plus
  ## bas : `##` = documentation, elle reste commentée pour toujours ; `#` seul = la
  ## configuration à décommenter le jour de la réactivation.
  ## Trois morceaux se décommentent ENSEMBLE, sinon Grafana démarre en erreur :
  ## ce bloc `envValueFrom`, le bloc `auth.generic_oauth` de grafana.ini ci-dessous, et la
  ## ligne `grafana-oidc.externalsecret.yaml` de `manifests/kustomization.yaml`.
  ##
  ## client-secret OIDC injecté en env → Grafana surcharge automatiquement
  ## [auth.generic_oauth] client_secret. Jamais écrit en clair dans grafana.ini.
  # envValueFrom:
  #   GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
  #     secretKeyRef:
  #       name: grafana-oidc
  #       key: client-secret

  # Compte admin local. SSO commenté ⇒ c'est le SEUL moyen de se connecter à Grafana :
  # perdre ce mot de passe, c'est perdre l'accès. Il est porté par le SealedSecret
  # `manifests/grafana-admin.sealed.yaml` (rotation : cf. README §Compte admin).
  # Le formulaire login reste actif : on ne met JAMAIS disable_login_form: true.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: https://grafana.lan.wittner.tech
    ## SSO authentik DÉSACTIVÉ — se décommente avec le bloc `envValueFrom` plus haut.
    ## Seul, il ferait démarrer Grafana avec un provider OIDC sans client_secret.
    # auth.generic_oauth:
    #   enabled: true
    #   name: Authentik
    #   client_id: grafana
    #   scopes: "openid profile email groups"
    #   auth_url: https://authentik.wittner.tech/application/o/authorize/
    #   token_url: https://authentik.wittner.tech/application/o/token/
    #   api_url: https://authentik.wittner.tech/application/o/userinfo/
    #   # Mapping groupe authentik → rôle Grafana via le claim `groups` (défaut Viewer).
    #   role_attribute_path: "contains(groups[*], 'app-grafana-admin') && 'Admin' || contains(groups[*], 'app-grafana-viewer') && 'Viewer' || 'Viewer'"
    #   role_attribute_strict: false
  persistence:
    enabled: true
    size: 5Gi            # StorageClass par défaut du cluster = openebs-lvm-thin
  # Datasource des LOGS (Prometheus est câblé automatiquement par le chart). Déclarée ici et non
  # dans le composant loki : même précédent que dashboard-argocd / servicemonitors-argocd, le
  # câblage côté Grafana vit dans le composant qui porte Grafana.
  # Pas de secret : Loki est en `auth_enabled: false` et n'est joignable qu'en intra-cluster.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.loki.svc.cluster.local
      jsonData:
        maxLines: 1000

# --- Prometheus : rétention + PVC (nœud unique Talos, dimensionnement raisonnable) ---
prometheus:
  prometheusSpec:
    retention: 15d
    # Adresse que Prometheus met dans le lien « Source » de chaque alerte qu'il pousse vers
    # Alertmanager (le `generatorURL`), donc dans le corps des MAILS.
    #
    # Sans ce réglage, l'opérateur y met le DNS interne du cluster
    # (`http://kube-prometheus-stack-prometheus.monitoring:9090`) : le lien ne résout nulle part
    # depuis un client mail, et rien en cluster ne le signale — le défaut ne se voit qu'en lisant
    # un vrai mail. Constaté le 2026-09-09 sur les mails de l'exercice d'injection.
    #
    # `localhost` est un choix assumé : Prometheus, LUI, n'est pas exposé (§ Accès) — le seul
    # chemin reste un port-forward, et le lien devient cliquable exactement au moment où on
    # diagnostique. Le partage avec Alertmanager s'arrête donc ici : celui-là est exposé sur le LAN
    # parce qu'il a un usage à distance (poser un silence), Prometheus n'en a pas — et il
    # divulguerait toute la topologie et la volumétrie du homelab à qui atteint l'URL.
    #
    # ⚠️ Ne PAS y mettre de chemin (`/prometheus` par exemple) : `--web.external-url` sert aussi de
    # préfixe de route à l'UI, et l'interface deviendrait injoignable en port-forward direct.
    externalUrl: http://localhost:9090
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 20Gi

# --- Alertmanager : PVC + notification mail des alertes critiques ---
alertmanager:
  alertmanagerSpec:
    # Adresse du bouton « View In Alertmanager » du corps des mails. Contrairement à Prometheus
    # ci-dessus, Alertmanager EST exposé sur le LAN (`manifests/alertmanager-httproute.yaml`) :
    # le lien est donc cliquable depuis n'importe quel appareil du LAN, téléphone compris, sans
    # port-forward. Les deux se déplacent ensemble — retirer la route rend ce lien mort.
    #
    # ⚠️ Le hostname doit aussi être déclaré sur le reverse proxy LAN (192.168.1.50), hors dépôt.
    #
    # ⚠️ `https://`, pas `http://` : TLS est terminé au Gateway (wildcard `*.lan.wittner.tech`).
    # Écrire `http` produirait un lien qui redirige ou échoue selon le client.
    externalUrl: https://alertmanager.lan.wittner.tech
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 2Gi
    ## NOTIFICATION MAIL — ACTIVE depuis le 2026-09-09. Convention de ce bloc : `##` =
    ## documentation, elle reste commentée pour toujours ; tout le reste est de la configuration
    ## vivante. Pour désactiver, c'est l'inverse du chemin d'activation : recommenter `secrets` ET
    ## `config` ensemble, jamais l'un sans l'autre.
    ##
    ## `secrets` monte le Secret `alertmanager-smtp` sous
    ## /etc/alertmanager/secrets/alertmanager-smtp/<clé>. C'est le SEUL moyen de donner un mot de
    ## passe SMTP à Alertmanager sans l'écrire dans ce fichier — donc dans Git.
    ##
    ## ⚠️ Le Secret vient du **SealedSecret** `alertmanager-smtp.sealed.yaml`, PAS de
    ## l'`ExternalSecret` du même nom (conservé dans manifests/, non référencé). Le canal a été
    ## changé à l'activation : faire dépendre l'alerting d'un service tiers le ferait taire le
    ## jour où ce service tombe — et cette panne-là serait l'alerte qui ne part pas. Même raison
    ## que pour le compte admin Grafana.
    ##
    ## ⚠️ `secrets` sans le Secret met le pod Alertmanager en ContainerCreating INDÉFINIMENT : un
    ## volume dont le Secret manque ne se monte pas, et le symptôme n'est pas une erreur de config
    ## mais un pod qui ne démarre jamais. Le SealedSecret est donc posé AVANT par le même commit,
    ## et il est scellé pour le couple (`alertmanager-smtp`, `monitoring`) — le déplacer le rend
    ## indéchiffrable, sans autre signal que ce même ContainerCreating.
    secrets:
      - alertmanager-smtp

  ## `config` REMPLACE intégralement la configuration par défaut du chart — elle n'est pas
  ## fusionnée. Les `inhibit_rules` et le receiver `"null"` ci-dessous ne sont donc pas décoratifs :
  ## ce sont ceux du chart, recopiés à l'identique. Les perdre réactiverait les alertes `info` que
  ## l'InfoInhibitor étouffe, et surtout ferait sonner les warnings d'un composant DÉJÀ en critical
  ## (première règle d'inhibition) — trois mails là où un seul décrit la panne.
  ##
  ## `tplConfig` vaut false dans ce chart (vérifié en 88.6.5) : les `{{ }}` ci-dessous partent tels
  ## quels vers Alertmanager au lieu d'être interprétés par Helm. À revérifier si le flag change,
  ## sinon il faudrait les échapper en `{{ "{{" }}`.
  config:
    global:
      resolve_timeout: 5m
      # Relais transactionnel. Alternatives au même format : in-v3.mailjet.com:587 (Mailjet),
      # mail.smtp2go.com:587 (SMTP2GO). Le port 587 est du STARTTLS, pas du TLS implicite —
      # avec 465 il faudrait `smtp_require_tls: false` ET un smarthost en TLS direct, que
      # certains relais refusent. Rester en 587.
      smtp_smarthost: 'smtp-relay.brevo.com:587'
      # DOIT être une adresse d'expéditeur validée chez le relais, sinon les mails sont acceptés
      # puis silencieusement jetés — l'échec n'apparaît que dans les logs du relais, pas ici.
      #
      # VALIDÉ le 2026-09-09 par un envoi réel (README § Éprouvé) : le domaine `wittner.tech` est
      # authentifié chez Brevo (DKIM de domaine), pas seulement `forgejo@wittner.tech` comme
      # expéditeur unique — cette adresse-ci n'existe donc nulle part ailleurs et part quand même.
      #
      # ⚠️ À REVÉRIFIER par un envoi réel à chaque changement de cette valeur OU de relais : une
      # adresse non validée ne produit PAS d'erreur. Le relais accepte le mail et le jette, et le
      # seul endroit où ça se voit est le journal d'envoi de Brevo — ni les logs d'Alertmanager,
      # ni son UI. Repli connu et sans risque : `forgejo@wittner.tech`, qui envoie déjà.
      smtp_from: 'alertmanager@wittner.tech'
      # Login SMTP du relais (PAS l'adresse mail du compte chez Brevo : un identifiant dédié).
      # En clair, faute de `smtp_auth_username_file` côté Alertmanager — la valeur de référence
      # reste celle du `SealedSecret` `alertmanager-smtp`, dont la clé `username` porte le même
      # login pour que la paire ne se dissocie jamais.
      #
      # ⚠️ MÊME credential Brevo que le mailer de Forgejo. Un seul relais, une seule clé — la
      # tourner chez Brevo casse les DEUX.
      #
      # ⚠️ Depuis la sortie de la forge du cluster (archive/forgejo), le second consommateur n'est
      # plus un fichier de ce dépôt mais le `[mailer]` de l'`app.ini` de la machine Docker : une
      # rotation demande donc un resceller ICI **et** une édition LÀ-BAS, dans deux systèmes
      # différents. Rien ne signale l'oubli du second — la forge cesse simplement d'envoyer.
      #
      # ⚠️ PUBLIC ET ASSUMÉ. Le dépôt est en lecture anonyme : ce login l'est aussi. Il reste en
      # clair parce qu'Alertmanager n'offre pas de `smtp_auth_username_file`, et que sortir toute
      # la config dans un `configSecret` pour cacher un identifiant enterrerait le routage et les
      # inhibitions hors de Git — coût sans rapport avec l'enjeu. Ce qui protège le relais est le
      # mot de passe, scellé et jamais ici. Contrepartie : un login connu se prête au bourrage
      # d'identifiants, et le SEUL endroit où ça se verrait est le journal d'envoi de Brevo — ni
      # les logs d'Alertmanager, ni son UI.
      smtp_auth_username: 'b66e7b001@smtp-brevo.com'
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    inhibit_rules:
      - source_matchers: [severity = critical]
        target_matchers: [severity =~ warning|info]
        equal: [namespace, alertname]
      - source_matchers: [severity = warning]
        target_matchers: [severity = info]
        equal: [namespace, alertname]
      - source_matchers: [alertname = InfoInhibitor]
        target_matchers: [severity = info]
        equal: [namespace]
      - target_matchers: [alertname = InfoInhibitor]
    route:
      # `alertname` en plus de `namespace` : sans lui, deux pannes simultanées mais sans rapport
      # arriveraient dans le MÊME mail, et le `repeat_interval`
      # du groupe s'appliquerait aux deux.
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      # Un rappel toutes les 4 h tant que ça sonne. Le défaut du chart (12 h) est trop long pour
      # une alerte critique : une panne du soir ne re-notifierait qu'au matin.
      repeat_interval: 4h
      # Défaut = ne rien envoyer. Tout ce qui n'est pas explicitement routé plus bas reste
      # visible dans Grafana et ne génère PAS de mail — c'est le choix « critical uniquement ».
      receiver: "null"
      routes:
        # Watchdog sonne en permanence par construction (deadman switch) : la router vers un mail
        # produirait une alerte toutes les 4 h à vie. Sa valeur est ailleurs — cf. README.
        - matchers: ['alertname = "Watchdog"']
          receiver: "null"
        - matchers: ['severity = "critical"']
          receiver: email-critique
    receivers:
      - name: "null"
      - name: email-critique
        email_configs:
          # `send_resolved` : sans lui, rien ne dit jamais que c'est rentré dans l'ordre, et on
          # se déplace pour une panne déjà résolue.
          - to: jeanbaptiste.wittner@outlook.com
            send_resolved: true
            headers:
              Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} — {{ .CommonAnnotations.summary }}'
    templates:
      - '/etc/alertmanager/config/*.tmpl'

# --- node-exporter : `instance` = nom du nœud au lieu de l'IP:port du pod.
#     Par défaut la ServiceMonitor du chart n'applique aucun relabeling, donc toutes
#     les séries node-* sortent avec instance="192.168.1.11:9100". Corrigé ici plutôt
#     que dans chaque dashboard : une jointure node_uname_info par requête serait à
#     refaire partout, et les dashboards fournis par le chart resteraient en IP.
#     Note : les séries déjà stockées gardent l'ancien label jusqu'à expiration de la
#     rétention (15j) — un trou apparaît sur les graphes à cheval sur le changement.
prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance

# --- Talos mono-nœud : composants control-plane non scrapables par défaut (bind
#     addresses / accès restreints) → désactivés pour éviter des targets "down"
#     permanentes. À réactiver avec les endpoints Talos adéquats si besoin.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# --- kube-state-metrics : exposer les objets velero comme métriques ---
#
# POURQUOI. Les métriques natives de velero sont agrégées PAR SCHEDULE et écrasées à chaque
# sauvegarde : `velero_backup_tarball_size_bytes` ne décrit que la DERNIÈRE. Impossible d'en tirer
# la liste des sauvegardes existantes ni leur taille — ce sont des propriétés d'OBJETS, pas des
# compteurs. KSM sait justement transformer des CRs en séries : c'est le seul chemin déclaratif
# vers un tableau « une ligne par sauvegarde ».
#
# La taille des DONNÉES se reconstruit en sommant `velero_pvb_object_bytes` par `backup` (un
# PodVolumeBackup par volume copié). Elle ne couvre pas les objets Kubernetes, dont le tarball
# n'est exposé nulle part par CR — et aucune des deux ne mesure l'occupation RÉELLE du bucket,
# kopia dédupliquant entre sauvegardes (cf. README de velero).
kube-state-metrics:
  # KSM ne lit que les ressources cœur par défaut : sans cette règle, les CRs velero.io sont
  # invisibles et les métriques ci-dessous restent vides SANS erreur dans les logs.
  rbac:
    extraRules:
      - apiGroups: ["velero.io"]
        resources: ["backups", "podvolumebackups", "restores", "schedules"]
        verbs: ["list", "watch"]
      - apiGroups: ["postgresql.cnpg.io"]
        resources: ["clusters", "backups"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          # --- Une série par objet Backup ---
          - groupVersionKind:
              group: velero.io
              version: v1
              kind: Backup
            # Nom final = <metricNamePrefix>_<name> : velero_backup_object_info, etc. Le préfixe
            # est distinct de `velero_backup_*` (métriques du serveur) À DESSEIN : deux sources,
            # deux sémantiques — ici l'état d'un objet, là un compteur d'exécutions.
            metricNamePrefix: velero_backup_object
            labelsFromPath:
              backup: [metadata, name]
            metrics:
              - name: info
                help: "Sauvegarde velero existante (1 par objet Backup)"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      phase: [status, phase]
                      # Absent sur un backup manuel — c'est ce qui les distingue.
                      schedule: [metadata, labels, velero.io/schedule-name]
                      storage_location: [spec, storageLocation]
              - name: items_backed_up
                help: "Nombre d'éléments Kubernetes sauvegardés"
                each:
                  type: Gauge
                  gauge:
                    path: [status, progress, itemsBackedUp]
                    nilIsZero: true
              - name: start_time
                help: "Début de la sauvegarde (timestamp Unix)"
                each:
                  type: Gauge
                  gauge:
                    path: [status, startTimestamp]
              - name: completion_time
                help: "Fin de la sauvegarde (timestamp Unix)"
                each:
                  type: Gauge
                  gauge:
                    # Pas de `nilIsZero` : une sauvegarde en cours n'a pas encore ce champ, et une
                    # valeur 0 s'afficherait en « 1970 » au lieu de rester vide.
                    path: [status, completionTimestamp]
              - name: expiration
                help: "Date d'expiration (TTL) de la sauvegarde (timestamp Unix)"
                each:
                  type: Gauge
                  gauge:
                    path: [status, expiration]
          # --- Une série par volume copié : c'est ici que vit la TAILLE des données ---
          - groupVersionKind:
              group: velero.io
              version: v1
              kind: PodVolumeBackup
            metricNamePrefix: velero_pvb_object
            labelsFromPath:
              backup: [metadata, labels, velero.io/backup-name]
              node: [spec, node]
              volume: [spec, volume]
              pod: [spec, pod, name]
              volume_namespace: [spec, pod, namespace]
            metrics:
              - name: bytes
                help: "Octets copiés par kopia pour ce volume"
                each:
                  type: Gauge
                  gauge:
                    # `status.progress` est un objet VIDE pour un volume sans donnée : nilIsZero
                    # évite que ces PVB disparaissent de la somme au lieu d'y compter zéro.
                    path: [status, progress, totalBytes]
                    nilIsZero: true
              - name: info
                help: "PodVolumeBackup existant (1 par volume)"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      phase: [status, phase]

          # --- Une série par objet Cluster (CloudNativePG) ---
          #
          # POURQUOI. Le collecteur d'instance (port 9187) ne parle que des instances qui RÉPONDENT :
          # une base dont tous les pods sont morts disparaît de Prometheus au lieu de passer au
          # rouge. Ces séries-ci viennent de l'API Kubernetes, pas de PostgreSQL — elles survivent
          # à la base et sont la seule façon d'afficher « 0 instance prête sur 1 attendue ».
          - groupVersionKind:
              group: postgresql.cnpg.io
              version: v1
              kind: Cluster
            metricNamePrefix: cnpg_cluster_object
            labelsFromPath:
              # ⚠️ `cnpg_cluster` et NON `cnpg_io_cluster` : ce dernier est le label posé par le
              # PodMonitor sur les métriques du collecteur (cf. cnpg-monitoring/manifests/podmonitor.yaml).
              # Deux sources, deux noms — c'est délibéré, une collision rendrait indistinguables
              # des séries qui n'ont ni la même fraîcheur ni la même sémantique. Les requêtes qui
              # croisent les deux passent par `label_replace`.
              cnpg_cluster: [metadata, name]
              # KSM n'ajoute PAS le namespace de la CR : le label `namespace` des séries qu'il
              # produit est celui du pod kube-state-metrics (monitoring), posé au relabeling. Sans
              # cette ligne, l'information « dans quel namespace vit cette base » est perdue.
              db_namespace: [metadata, namespace]
            metrics:
              - name: info
                help: "Cluster PostgreSQL existant (1 par objet Cluster)"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      # Texte libre de l'opérateur (« Cluster in healthy state », « Setting up
                      # primary »…), pas une énumération stable : à afficher, pas à comparer.
                      phase: [status, phase]
                      primary: [status, currentPrimary]
              - name: instances
                help: "Instances désirées"
                each:
                  type: Gauge
                  gauge:
                    path: [status, instances]
                    nilIsZero: true
              - name: ready_instances
                help: "Instances prêtes"
                each:
                  type: Gauge
                  gauge:
                    # `nilIsZero` LOAD-BEARING : le champ est absent — pas à zéro — tant qu'aucune
                    # instance n'est prête, c'est-à-dire exactement dans le cas qu'on veut voir.
                    path: [status, readyInstances]
                    nilIsZero: true

          # --- Une série par objet Backup (CloudNativePG) ---
          #
          # Même raison que pour velero : les métriques du sidecar barman-cloud ne décrivent que la
          # DERNIÈRE sauvegarde (`last_available_backup_timestamp`). La liste des sauvegardes
          # existantes est une propriété d'OBJETS, et KSM est le seul chemin déclaratif vers un
          # tableau « une ligne par sauvegarde ».
          #
          # ⚠️ Une sauvegarde reste restaurable après suppression de son CR `Backup` : les objets
          # vivent dans le bucket, la rétention est réglée dans l'`ObjectStore`. Ce que ces séries
          # décrivent, c'est l'INVENTAIRE KUBERNETES, pas le contenu du dépôt.
          - groupVersionKind:
              group: postgresql.cnpg.io
              version: v1
              kind: Backup
            metricNamePrefix: cnpg_backup_object
            labelsFromPath:
              backup: [metadata, name]
              db_namespace: [metadata, namespace]
              cnpg_cluster: [spec, cluster, name]
            metrics:
              - name: info
                help: "Sauvegarde CloudNativePG existante (1 par objet Backup)"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      # En minuscules chez CloudNativePG (`completed`, `running`, `failed`) — là où
                      # velero les capitalise. Les value mappings du dashboard suivent cette casse.
                      phase: [status, phase]
                      method: [status, method]
                      # Nom de la sauvegarde dans le dépôt barman (`20260908T150207`) : c'est lui,
                      # pas le nom du CR, qu'attend `barman-cloud-restore --backup-id`.
                      backup_id: [status, backupId]
              - name: start_time
                help: "Début de la sauvegarde (timestamp Unix)"
                each:
                  type: Gauge
                  gauge:
                    path: [status, startedAt]
              - name: stop_time
                help: "Fin de la sauvegarde (timestamp Unix)"
                each:
                  type: Gauge
                  gauge:
                    # Pas de `nilIsZero` : une sauvegarde en cours n'a pas encore ce champ, et une
                    # valeur 0 s'afficherait en « 1970 » au lieu de rester vide.
                    path: [status, stoppedAt]
