# Identifiants SMTP du relais transactionnel utilisé par Alertmanager pour envoyer les mails
# d'alerte, servis par openbao.
#
# Deux clés, et une seule des deux est vraiment secrète :
#   - `password` : la clé SMTP du relais. Alertmanager la lit dans un FICHIER
#     (`smtp_auth_password_file`), jamais depuis la config — c'est ce qui permet de garder
#     helm-values.yaml en clair dans Git. Le montage vient de `alertmanagerSpec.secrets`.
#   - `username` : le login SMTP. Alertmanager n'a PAS de `smtp_auth_username_file`, donc cette
#     valeur est de toute façon écrite en clair dans helm-values.yaml. Elle est stockée ici
#     malgré tout pour que la paire ne se dissocie jamais du coffre — un login sans son mot de
#     passe est inutilisable, et retrouver lequel des relais est configuré six mois plus tard
#     coûte plus cher que ces trois lignes.
#
# `deletionPolicy: Retain` comme partout ici : coffre scellé, l'objet passe NotReady et
# l'Application est Degraded, mais le Secret reste — Alertmanager continue d'envoyer. L'inverse
# (Delete) démonterait le volume et casserait le pod au premier scellement, c'est-à-dire
# exactement au moment où les alertes comptent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-smtp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: homelab/alertmanager/smtp
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: username
      remoteRef:
        key: homelab/alertmanager/smtp
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
