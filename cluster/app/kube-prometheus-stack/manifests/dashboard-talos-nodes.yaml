# cluster/app/kube-prometheus-stack/manifests/dashboard-talos-nodes.yaml
# Dashboard Grafana « Système — nœuds Talos »
# Chargé automatiquement par le sidecar de kube-prometheus-stack
# via le label grafana_dashboard: "1".
#
# Sources de métriques :
#   - node-exporter        : CPU, mémoire, filesystems, réseau, hwmon
#   - kube-state-metrics   : nombre de pods par nœud
#   - openebs-lvm exporter : VolumeGroups LVM (ServiceMonitor openebs-monitoring)
#
# Structure : la vue par défaut tient en une page — une table « État des nœuds »
# (une ligne par nœud, donc lisible quel que soit le nombre de nœuds) suivie des
# séries temporelles réellement actionnables. Tout le reste vit dans les lignes
# « Diagnostic — … », repliées par défaut (collapsed: true), à déplier au besoin.
#
# Les requêtes hwmon ne présument aucune topologie matérielle : nombre de NVMe/SSD
# variable selon le nœud, chips coretemp multiples, capteurs multiples par disque
# (composite + capteurs internes). Tout est agrégé/étiqueté par chip et par capteur.
#
# Seuils hwmon : node_hwmon_temp_{max,crit}_celsius est systématiquement encadré par
# « > 0 < 200 ». Un capteur NVMe sans seuil configuré renvoie 0xFFFF K, que le driver
# nvme du noyau expose tel quel dans tempN_max — soit 65535 - 273.15 = 65261.85 °C.
# Sans ce filtre, la série bidon écrase l'échelle des graphiques de température et
# rend absurdes les ratios « % du seuil ». Les capteurs internes (NAND, contrôleur)
# sont les principaux concernés : contrairement à ce que l'on pourrait croire, ils
# déclarent bien un seuil, mais invalide.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-talos-nodes
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  talos-nodes.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": false,
            "iconColor": "purple",
            "name": "Déploiements ArgoCD",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [
                "argocd",
                "deployed"
              ],
              "type": "tags"
            }
