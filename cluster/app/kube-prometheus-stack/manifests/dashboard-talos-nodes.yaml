                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "max",
                    "value": 2
                  },
                  {
                    "id": "thresholds",
                    "value": {
