        ]
      },
      "description": "Vue système des nœuds Talos. L'essentiel est visible d'emblée ; les analyses fines sont dans les lignes « Diagnostic », repliées. Aucune topologie matérielle codée en dur : nœuds, disques et capteurs sont découverts dynamiquement.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Vue d'ensemble",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Une ligne par nœud : reste lisible que le cluster en compte 2, 3 ou davantage. « Load / cœur » est le load average 1 min divisé par le nombre de cœurs — 1.00 = exactement saturé. Un tiret signifie que le nœud n'expose pas ce capteur (pas de coretemp, pas de NVMe) ou, pour « NVMe (% seuil) », qu'aucun disque n'annonce de seuil valide — pas qu'il est en panne.",
