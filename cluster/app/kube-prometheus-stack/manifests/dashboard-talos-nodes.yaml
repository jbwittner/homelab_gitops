                        {
                          "color": "green",
                          "value": 40
                        },
                        {
                          "color": "yellow",
                          "value": 70
                        },
                        {
                          "color": "orange",
                          "value": 80
                        },
                        {
                          "color": "red",
                          "value": 90
                        }
                      ]
                    }
