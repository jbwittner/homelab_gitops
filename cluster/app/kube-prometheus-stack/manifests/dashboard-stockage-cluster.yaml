              "editorMode": "code",
              "expr": "max by (instance) ((1 - node_filesystem_avail_bytes{instance=~\"$instance\",mountpoint=\"/var\"} / node_filesystem_size_bytes{instance=~\"$instance\",mountpoint=\"/var\"}) * 100)",
              "format": "table",
              "instant": true,
