                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "Time 5": true,
                  "Time 6": true,
                  "Time 7": true,
                  "Time 8": true,
                  "Value #H": true,
                  "instance": true
                },
                "indexByName": {
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4,
                  "Value #E": 5,
                  "Value #F": 6,
                  "Value #G": 7,
                  "nodename": 0
                },
                "renameByName": {
                  "Value #A": "CPU",
                  "Value #B": "Mémoire",
                  "Value #C": "/var",
                  "Value #D": "Load / cœur",
                  "Value #E": "Temp. CPU",
                  "Value #F": "NVMe (% seuil)",
