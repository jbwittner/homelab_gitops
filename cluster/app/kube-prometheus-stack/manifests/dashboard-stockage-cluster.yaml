              "editorMode": "code",
              "expr": "max by (instance) (node_load1{instance=~\"$instance\"}) / count by (instance) (node_cpu_seconds_total{instance=~\"$instance\",mode=\"idle\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance) (node_hwmon_temp_celsius{instance=~\"$instance\",chip=~\"platform_coretemp.*\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "E"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance) (node_hwmon_temp_celsius{instance=~\"$instance\",chip=~\"nvme.*\",sensor=\"temp1\"} / on (instance, chip) (node_hwmon_temp_max_celsius{instance=~\"$instance\",chip=~\"nvme.*\",sensor=\"temp1\"} > 0 < 200)) * 100",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "F"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count by (instance) (label_replace(kube_pod_info{node=~\"$node\"}, \"instance\", \"\", \"\", \"\") * on (node) group_left (instance) label_replace(max by (instance, nodename) (node_uname_info{instance=~\"$instance\"}), \"node\", \"$1\", \"nodename\", \"(.*)\"))",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "G"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance, nodename) (node_uname_info{instance=~\"$instance\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "H"
            }
