# cluster/app/kube-prometheus-stack/manifests/dashboard-stockage-cluster.yaml
# Dashboard Grafana « Stockage — cluster »
# Chargé automatiquement par le sidecar de kube-prometheus-stack via le label
# grafana_dashboard: "1".
#
# ⚠️ CE DASHBOARD EST NÉ D'UN DÉCOUPAGE, le 2026-09-11 : il recueille les sept panneaux de l'ancien
# « Système — nœuds Talos » qui ne parlaient PAS d'une machine mais du CLUSTER — l'état des nœuds
# Kubernetes et les VolumeGroups LVM d'OpenEBS. Le reste de ce dashboard est devenu
# « Machines — système », générique et couvrant aussi les machines hors cluster.
#
# ⚠️ Le critère du découpage est celui appliqué partout ailleurs ce jour-là : le SUJET, et le CYCLE
# DE VIE. Une machine précède le service qu'elle héberge ; un VolumeGroup OpenEBS n'existe que
# parce qu'un cluster Kubernetes le pilote. Les mélanger produisait un dashboard qui s'affichait à
# moitié vide dès qu'on y sélectionnait une machine externe, sans la moindre erreur.
#
# ⚠️ SES VARIABLES SONT FILTRÉES SUR `job="node-exporter"`, et elles doivent le rester. C'est
# l'inverse de « Machines — système », où ce filtre a été RETIRÉ. La raison est la même des deux
# côtés : ici les métriques `lvm_*` ne sont produites que par l'exporteur OpenEBS du cluster, donc
# proposer une machine externe dans le sélecteur afficherait un dashboard entièrement vide.
#
# ⚠️ Source des métriques : `lvm_*` vient du service `openebs-lvm-localpv-node-service`, `kube_*`
# de kube-state-metrics. AUCUNE ne vient de node-exporter — c'est ce qui rend ce dashboard
# structurellement inapplicable à une machine hors cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-stockage-cluster
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  stockage-cluster.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": false,
            "iconColor": "purple",
            "name": "Déploiements ArgoCD",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [
                "argocd",
                "deployed"
              ],
              "type": "tags"
            }
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "panels": [],
          "title": "État des nœuds",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Une ligne par nœud : reste lisible que le cluster en compte 2, 3 ou davantage. « Load / cœur » est le load average 1 min divisé par le nombre de cœurs — 1.00 = exactement saturé. Un tiret signifie que le nœud n'expose pas ce capteur (pas de coretemp, pas de NVMe) ou, pour « NVMe (% seuil) », qu'aucun disque n'annonce de seuil valide — pas qu'il est en panne.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "mode": "gradient",
                  "type": "gauge",
                  "valueDisplayMode": "text"
                },
                "inspect": false
              },
              "decimals": 0,
              "mappings": [],
              "max": 100,
              "min": 0,
              "noValue": "—",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "orange",
                    "value": 85
                  },
                  {
                    "color": "red",
                    "value": 95
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Nœud"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "auto"
                    }
                  },
                  {
                    "id": "unit",
                    "value": "string"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Load / cœur"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "max",
                    "value": 2
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 0.8
                        },
                        {
                          "color": "orange",
                          "value": 1
                        },
                        {
                          "color": "red",
                          "value": 1.5
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Temp. CPU"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  },
                  {
                    "id": "max",
                    "value": 100
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "blue",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 40
                        },
                        {
                          "color": "yellow",
                          "value": 70
                        },
                        {
                          "color": "orange",
                          "value": 80
                        },
                        {
                          "color": "red",
                          "value": 90
                        }
                      ]
                    }
                  }
                ]
