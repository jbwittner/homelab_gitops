# Compte admin local Grafana (break-glass), servi par openbao.
#
# ⚠️ C'est le chemin d'accès de secours quand le SSO authentik est en panne. Il repose donc sur
# `deletionPolicy: Retain` : coffre scellé, l'ExternalSecret passe NotReady mais le Secret
# reste en place et le login local continue de fonctionner. Ne pas passer en `Delete`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-user
      remoteRef:
        key: homelab/grafana/admin
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: homelab/grafana/admin
        property: admin-password
