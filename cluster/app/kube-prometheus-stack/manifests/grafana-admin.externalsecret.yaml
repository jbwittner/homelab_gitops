# ⚠️ REMPLACÉ par `grafana-admin.sealed.yaml` — fichier conservé, mais NON référencé dans
# `kustomization.yaml`. Les deux visent le même Secret `grafana-admin` et ne peuvent pas
# coexister : revenir au canal openbao suppose de commenter le SealedSecret en même temps.
#
# Compte admin local Grafana, servi par openbao.
#
# `deletionPolicy: Retain` : coffre scellé, l'ExternalSecret passe NotReady mais le Secret
# reste en place et le login local continue de fonctionner. Ne pas passer en `Delete`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: admin-user
      remoteRef:
        key: homelab/grafana/admin
        property: admin-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: admin-password
      remoteRef:
        key: homelab/grafana/admin
        property: admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
