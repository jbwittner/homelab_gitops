# ⚠️ VESTIGE INERTE — le `ClusterSecretStore` que ce fichier référence n'existe plus dans le dépôt,
# et la CRD `ExternalSecret` n'est pas posée dans le cluster (external-secrets est en `.noapp.yaml`).
# Conservé comme modèle si un backend de secrets externe est un jour remonté ; à réécrire alors
# contre le nom du nouveau store. NON référencé dans `kustomization.yaml`.
#
# ⚠️ SSO DÉSACTIVÉ — fichier conservé, mais NON référencé dans `kustomization.yaml`. Se
# décommente avec les blocs `envValueFrom` et `auth.generic_oauth` de `helm-values.yaml`.
#
# client_secret OIDC de Grafana (provider authentik).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: REMPLACER        # ⚠️ nom du futur ClusterSecretStore — aucun n'existe aujourd'hui
  target:
    name: grafana-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: homelab/grafana/oidc
        property: client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
