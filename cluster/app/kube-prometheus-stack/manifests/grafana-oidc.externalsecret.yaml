# client_secret OIDC de Grafana (provider authentik), servi par openbao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: homelab/grafana/oidc
        property: client-secret
        conversionStrategy: Default	
        decodingStrategy: None
        metadataPolicy: None
