# cluster/app/kube-prometheus-stack/manifests/dashboard-logs.yaml
# Dashboard Grafana « Logs — applications »
# Chargé automatiquement par le sidecar de kube-prometheus-stack (label grafana_dashboard: "1").
#
# Source : datasource Loki (déclarée dans helm-values.yaml, `grafana.additionalDataSources`),
# alimentée par le DaemonSet alloy. Les labels interrogeables sont ceux posés par alloy —
# `namespace`, `pod`, `container`, `app`, `node` — et rien d'autre : dans Loki seuls les labels
# sont indexés, tout le reste se filtre sur le CONTENU de la ligne (`|~`), d'où la variable
# Recherche plutôt qu'une variable par champ.
#
# Les niveaux viennent de `detected_level`, métadonnée structurée que Loki pose sur CHAQUE ligne
# à l'ingestion (limits_config.discover_log_levels, activé par défaut — le passer à false vide
# les panneaux « niveau »). Loki lit le champ `level` d'une ligne JSON (authentik), le `level=`
# d'une ligne logfmt (ArgoCD), ou devine sur les mots-clés d'une ligne libre ; ce qu'il ne sait
# pas classer devient `unknown`. Vérifié à l'exécution sur des lignes réelles des deux formats.
# Note : `warning` est normalisé en `warn`.
#
# `detected_level` n'étant PAS un label indexé mais une métadonnée structurée, il se filtre
# après le sélecteur (`| detected_level=~"…"`) et non dans `{}`, et il ne sort pas de l'API des
# labels — d'où une variable `custom` plutôt qu'un `label_values()` pour le filtre Niveau.
#
# PIÈGE LogQL, vérifié à l'exécution : les regex sont écrites entre BACKTICKS (chaîne brute).
# Entre guillemets, LogQL applique les échappements Go — `\b` y devient le caractère backspace
# au lieu de la limite de mot, et la requête, toujours valide, ne remonte plus AUCUNE ligne.
# Aucun message d'erreur : juste un panneau vide. Même règle pour la variable Recherche.
#
# Fenêtre par défaut : 30 s de rafraîchissement sur `now-1h`, comme les autres dashboards maison.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
