# cluster/app/kube-prometheus-stack/manifests/dashboard-ressources-volumes.yaml
# Dashboard Grafana « Ressources — volumes »
# Chargé automatiquement par le sidecar de kube-prometheus-stack (label grafana_dashboard: "1").
#
# Complète la chaîne « Ressources » (tag commun `ressources`) sur l'axe stockage.
#
# Sources de métriques :
#   - kubelet (cAdvisor/stats)  : kubelet_volume_stats_* — remplissage et inodes PAR PVC.
#     Ces séries n'existent que parce que le driver CSI lvm-localpv annonce la capacité
#     GET_VOLUME_STATS, et uniquement pour les volumes effectivement montés par un pod.
#   - kube-state-metrics        : kube_persistentvolumeclaim_*, kube_persistentvolume_*,
#     kube_pod_spec_volumes_persistentvolumeclaims_info (détection des PVC orphelins).
#   - exporter OpenEBS lvm-localpv (ServiceMonitor du composant openebs) : lvm_lv_* et lvm_vg_*.
#
# Pourquoi une rangée thin pool : le nom `openebs-lvm-thin` est historique, la classe provisionne
# aujourd'hui en volumes ÉPAIS (`thinProvision: "no"`) — ces panneaux restent vides tant qu'aucun
# thin pool n'existe. Ils sont conservés parce qu'en provisionnement fin la somme des PVC peut
# dépasser la taille réelle du pool : c'est alors le remplissage du POOL — pas celui des PVC —
# qui décide du moment où les écritures échouent, et les deux vues ne se substituent pas.
#
# Pourquoi rien n'est agrégé sur l'axe nœud : le stockage est NODE-LOCAL, il y a un VG `lvmvg`
# PAR NŒUD. Une somme mentirait — 20 Gio libres répartis 19 + 1 ne provisionnent pas un PVC de
# 5 Gio sur le second nœud. Les vues VG sont donc par nœud (série par `instance`), et les tuiles
# thin pool montrent le PIRE nœud.
#
# Le détail VG / disques / filesystems des nœuds vit dans « Système — nœuds Talos ».
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ressources-volumes
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
