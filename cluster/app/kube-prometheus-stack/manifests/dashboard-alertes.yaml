# cluster/app/kube-prometheus-stack/manifests/dashboard-alertes.yaml
# Dashboard Grafana « Alerts — cluster »
# Chargé automatiquement par le sidecar de kube-prometheus-stack via le label
# grafana_dashboard: "1", rangé dans le dossier Wittnerlab par l'annotation grafana_folder.
#
# Source : `ALERTS` et `ALERTS_FOR_STATE`, deux séries que PROMETHEUS LUI-MÊME synthétise pour
# chaque règle d'alerte évaluée. Aucune métrique d'application, aucune datasource supplémentaire —
# c'est ce qui rend ce dashboard indépendant du reste : il continue de fonctionner même quand le
# composant surveillé est mort, ce qui est précisément le moment où on l'ouvre.
#
# Pourquoi PAS le panneau « Alert list » de Grafana : il lit l'API d'un Alertmanager, or aucune
# datasource de ce type n'est déclarée dans helm-values.yaml (seule `Loki` l'est). Tant que ce
# câblage n'existe pas, les alertes se lisent via ALERTS — ce qui a l'avantage de donner
# l'HISTORIQUE (le panneau Alert list ne montre que l'instant présent).
#
# Cinq pièges, tous constatés sur le Prometheus du cluster :
#
#   1. LE TABLEAU MONTRE `pending` AUTANT QUE `firing`, et c'est le point le plus important de ce
#      fichier. Une règle passe `pending` dès que sa condition est vraie, et n'arrive à `firing`
#      qu'après son `for:` — 15 min pour la plupart, 1 h pour CNPGBackupChainAbsent. Un tableau
#      limité à `firing` reste donc VIDE pendant tout le quart d'heure qui suit une panne, à côté
#      d'une tuile qui affiche « 3 ». C'est l'état par lequel passe toute panne, celui qu'on
#      regarde en premier, et l'omettre rendait le tableau inutile exactement quand il sert.
#
#   2. Récupérer l'état DANS le tableau demande un `group_left` : `ALERTS_FOR_STATE` porte l'âge
#      mais pas le label `alertstate`, `ALERTS` porte l'état mais pas l'âge. D'où
#      `(time() - ALERTS_FOR_STATE) * ignoring(alertstate) group_left(alertstate) ALERTS` — la
#      multiplication par 1 laisse l'âge intact et greffe le label. `on(alertname)` à la place
#      d'`ignoring(alertstate)` mélangerait deux instances d'une même règle ; sans `ignoring`,
#      rien ne matche et le tableau est vide sans erreur.
#
#   3. `count()` sur un vecteur vide ne renvoie pas 0 : il ne renvoie RIEN, et les tuiles
#      afficheraient « No data » là où « 0 alerte » est l'information voulue. D'où le
#      `or vector(0)`, sur les tuiles comme sur la tuile Watchdog.
#
#   4. LES LABELS NE SONT PAS LES MÊMES D'UNE RÈGLE À L'AUTRE, et c'est structurel : `absent(...)`
#      ne peut porter que les labels écrits dans ses matchers. `CNPGMetricsAbsent` sort donc
#      SANS `namespace`, tandis qu'une règle bâtie sur une métrique réelle sort
#      avec `namespace` et `cronjob`. Conséquence directe : le filtre de ce dashboard porte sur
#      `alertname` (préfixe du composant), jamais sur `namespace` — un filtre par namespace
#      masquerait silencieusement la moitié des alertes du coffre.
#
#   5. `Watchdog` est exclu PARTOUT (`alertname!="Watchdog"`) et remplacé par une tuile dédiée.
#      C'est le deadman switch du chart : il sonne en permanence, par construction. Laissé dans le
#      tableau il en occupe la seule ligne en temps normal ; laissé dans les graphes il ajoute une
#      série `severity=none` toujours à 1 qui écrase l'échelle. Son information n'est pas sa
#      présence mais sa DISPARITION, ce qu'une tuile `absent(...)` dit mieux qu'une ligne de plus.
#
# Rétention : `ALERTS` n'existe que TANT QUE l'alerte est active. Une alerte résolue disparaît des
# graphes au-delà de la fenêtre où elle a sonné, et tout disparaît à 15 j (rétention Prometheus).
# Ce dashboard montre l'état et l'historique récent — il ne remplace pas un journal d'incidents.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-alertes
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  alertes.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "State and history of the Prometheus alerts (CNPG, Forgejo, velero, openebs, chart rules). Source: the ALERTS / ALERTS_FOR_STATE series.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "panels": [],
          "title": "Current state",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "severity=critical alerts currently firing, i.e. whose `for:` has elapsed. They are the only ones that would be mailed out if notification were enabled.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "count(ALERTS{alertstate=\"firing\", severity=\"critical\", alertname=~\"$composant\"}) or vector(0)",
              "instant": true,
              "legendFormat": "critical",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Critical (firing)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "severity=warning alerts currently firing.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "count(ALERTS{alertstate=\"firing\", severity=\"warning\", alertname=~\"$composant\"}) or vector(0)",
              "instant": true,
              "legendFormat": "warnings",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Warnings (firing)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Condition true, `for:` not elapsed yet. These alerts appear in the table below in the `pending` state — this is where a failure shows up BEFORE it becomes official. Blue rather than yellow: nothing to do at this stage, the debounce is doing its job.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "text", "value": null },
                  { "color": "blue", "value": 1 }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "count(ALERTS{alertstate=\"pending\", alertname=~\"$composant\"}) or vector(0)",
              "instant": true,
              "legendFormat": "pending",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Incubating (pending)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Watchdog is the chart's deadman switch: an alert that fires PERMANENTLY, whose only information is that it stopped. As long as it is there, the evaluation → rules → Prometheus chain works. A red tile here means Prometheus no longer evaluates — no other alert on this dashboard can then be trusted, including the three green tiles on the left.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                {
                  "options": {
                    "0": { "color": "green", "index": 0, "text": "OK" },
                    "1": { "color": "red", "index": 1, "text": "SILENT" }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "absent(ALERTS{alertname=\"Watchdog\"}) or vector(0)",
              "instant": true,
              "legendFormat": "watchdog",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Alerting chain",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Active alerts, `firing` first then `pending`. \"Since\" comes from ALERTS_FOR_STATE: it is the instant the condition became true, so BEFORE the `for:` elapsed — an alert pending for 20 min with a `for: 3h` is normal. The job / namespace / cronjob columns are empty for rules built on `absent()` that do not declare them in their matchers, see the file header. Watchdog is excluded: it has its own tile.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": {
                "align": "auto",
                "cellOptions": { "type": "auto" },
                "filterable": true,
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "text", "value": null }]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Value" },
                "properties": [
                  { "id": "displayName", "value": "Since" },
                  { "id": "unit", "value": "s" },
                  { "id": "custom.width", "value": 130 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "alertstate" },
                "properties": [
                  { "id": "displayName", "value": "State" },
                  { "id": "custom.width", "value": 110 },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "firing": { "color": "red", "index": 0, "text": "firing" },
                          "pending": { "color": "blue", "index": 1, "text": "pending" }
                        },
                        "type": "value"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "severity" },
                "properties": [
                  { "id": "displayName", "value": "Severity" },
                  { "id": "custom.width", "value": 110 },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "critical": { "color": "red", "index": 0, "text": "critical" },
                          "warning": { "color": "orange", "index": 1, "text": "warning" }
                        },
                        "type": "value"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "alertname" },
                "properties": [
                  { "id": "displayName", "value": "Alert" },
                  { "id": "custom.width", "value": 280 }
                ]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 5 },
          "id": 10,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": false, "displayName": "State" }]
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "(time() - ALERTS_FOR_STATE{alertname=~\"$composant\", alertname!=\"Watchdog\", severity=~\"$severity\"}) * ignoring(alertstate) group_left(alertstate) ALERTS{alertstate=~\"firing|pending\", alertname!=\"Watchdog\"}",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Active alerts (firing + pending)",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true },
                "includeByName": {},
                "indexByName": {
                  "alertname": 0,
                  "alertstate": 1,
                  "severity": 2,
                  "Value": 3,
                  "namespace": 4,
                  "job": 5
                },
                "renameByName": {}
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "id": 101,
          "panels": [],
          "title": "History",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "One band per alert, RED while it is firing and BLUE while it is pending — the blue band to the left of the red one is the `for:` elapsing. `ALERTS` equals 1 in BOTH states, so nothing would tell them apart on screen: hence the `* 2` on the firing branch, and the 1 = pending / 2 = firing encoding read by the value mappings. The `max by (alertname)` drops the alertstate label, without which the same alert would take two rows on the Y axis. The band only exists while the alert is active: a gap is not missing data, it is the return to normal. No legend on the right: the names are already on the Y axis.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": {
                "fillOpacity": 85,
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineWidth": 0,
                "spanNulls": false
              },
              "mappings": [
                {
                  "options": {
                    "1": { "color": "blue", "index": 0, "text": "pending" },
                    "2": { "color": "red", "index": 1, "text": "firing" }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "text", "value": null }]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 14 },
          "id": 11,
          "options": {
            "alignValue": "left",
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false },
            "mergeValues": true,
            "rowHeight": 0.9,
            "showValue": "never",
            "tooltip": { "hideZeros": false, "mode": "single", "sort": "none" }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "max by (alertname) ((ALERTS{alertstate=\"firing\", alertname=~\"$composant\", alertname!=\"Watchdog\", severity=~\"$severity\"} * 2) or ALERTS{alertstate=\"pending\", alertname=~\"$composant\", alertname!=\"Watchdog\", severity=~\"$severity\"})",
              "legendFormat": "{{alertname}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "When each alert fired",
          "type": "state-timeline"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Number of firing alerts per severity, stacked. Watchdog (severity=none) is excluded: always at 1, it shifted the whole curve up one step and flattened the scale. Use it to tell a clean failure (a step) from a flapping alert (a sawtooth) — the latter calls for a `for:` adjustment, not an intervention.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 35,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "normal" },
                "thresholdsStyle": { "mode": "off" }
              },
              "decimals": 0,
              "mappings": [],
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "none"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "critical" },
                "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }]
              },
              {
                "matcher": { "id": "byName", "options": "warning" },
                "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }]
              }
            ]
          },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 23 },
          "id": 12,
          "options": {
            "legend": {
              "calcs": ["max"],
              "displayMode": "list",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": { "hideZeros": false, "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "sum by (severity) (ALERTS{alertstate=\"firing\", alertname=~\"$composant\", alertname!=\"Watchdog\", severity=~\"$severity\", severity!=\"none\"})",
              "legendFormat": "{{severity}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Firing alerts over time",
          "type": "timeseries"
        }
      ],
      "preload": false,
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": ["wittnerlab", "alerts"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Datasource",
            "multi": false,
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "allValue": ".*",
            "current": {},
            "description": "Filters on the alertname PREFIX, not on the namespace: rules built on absent() only carry the labels of their matchers, so several absent()-based alerts (CNPGMetricsAbsent, ForgejoScrapeMissing) have no namespace label at all. Filtering by namespace would silently hide half of them.",
            "hide": 0,
            "includeAll": true,
            "label": "Component",
            "multi": true,
            "name": "composant",
            "options": [],
            "query": "CNPG : CNPG.*, Forgejo : Forgejo.*, Velero : Velero.*, OpenEBS : OpenEBS.*, Kubernetes (chart) : Kube.*",
            "queryValue": "",
            "skipUrlSync": false,
            "type": "custom"
          },
          {
            "allValue": ".+",
            "current": {},
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(ALERTS, severity)",
            "description": "Fed by the alerts ACTUALLY present in Prometheus: a severity that never fired does not appear in the list.",
            "hide": 0,
            "includeAll": true,
            "label": "Severity",
            "multi": true,
            "name": "severity",
            "options": [],
            "query": {
              "qryType": 1,
              "query": "label_values(ALERTS, severity)",
              "refId": "severity"
            },
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "utc",
      "title": "Alerts — cluster",
      "uid": "cluster-alertes",
      "version": 1,
      "weekStart": ""
    }
