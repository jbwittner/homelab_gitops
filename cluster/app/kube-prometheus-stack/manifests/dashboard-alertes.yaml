# cluster/app/kube-prometheus-stack/manifests/dashboard-alertes.yaml
# Dashboard Grafana « Alertes — cluster »
# Chargé automatiquement par le sidecar de kube-prometheus-stack via le label
# grafana_dashboard: "1", rangé dans le dossier Wittnerlab par l'annotation grafana_folder.
#
# Source : `ALERTS` et `ALERTS_FOR_STATE`, deux séries que PROMETHEUS LUI-MÊME synthétise pour
# chaque règle d'alerte évaluée. Aucune métrique d'application, aucune datasource supplémentaire —
# c'est ce qui rend ce dashboard indépendant du reste : il continue de fonctionner même quand le
# composant surveillé est mort, ce qui est précisément le moment où on l'ouvre.
#
# Pourquoi PAS le panneau « Alert list » de Grafana : il lit l'API d'un Alertmanager, or aucune
# datasource de ce type n'est déclarée dans helm-values.yaml (seule `Loki` l'est). Tant que ce
# câblage n'existe pas, les alertes se lisent via ALERTS — ce qui a l'avantage de donner
# l'HISTORIQUE (le panneau Alert list ne montre que l'instant présent).
#
# Cinq pièges, tous constatés sur le Prometheus du cluster :
#
#   1. LE TABLEAU MONTRE `pending` AUTANT QUE `firing`, et c'est le point le plus important de ce
#      fichier. Une règle passe `pending` dès que sa condition est vraie, et n'arrive à `firing`
#      qu'après son `for:` — 15 min pour la plupart, 3 h pour OpenBaoSealedTooLong. Un tableau
#      limité à `firing` reste donc VIDE pendant tout le quart d'heure qui suit une panne, à côté
#      d'une tuile qui affiche « 3 ». C'est l'état par lequel passe toute panne, celui qu'on
#      regarde en premier, et l'omettre rendait le tableau inutile exactement quand il sert.
#
#   2. Récupérer l'état DANS le tableau demande un `group_left` : `ALERTS_FOR_STATE` porte l'âge
#      mais pas le label `alertstate`, `ALERTS` porte l'état mais pas l'âge. D'où
#      `(time() - ALERTS_FOR_STATE) * ignoring(alertstate) group_left(alertstate) ALERTS` — la
#      multiplication par 1 laisse l'âge intact et greffe le label. `on(alertname)` à la place
#      d'`ignoring(alertstate)` mélangerait deux instances d'une même règle ; sans `ignoring`,
#      rien ne matche et le tableau est vide sans erreur.
#
#   3. `count()` sur un vecteur vide ne renvoie pas 0 : il ne renvoie RIEN, et les tuiles
#      afficheraient « No data » là où « 0 alerte » est l'information voulue. D'où le
#      `or vector(0)`, sur les tuiles comme sur la tuile Watchdog.
#
#   4. LES LABELS NE SONT PAS LES MÊMES D'UNE RÈGLE À L'AUTRE, et c'est structurel : `absent(...)`
#      ne peut porter que les labels écrits dans ses matchers. `OpenBaoNoActiveNode` sort donc
#      avec `job="openbao-active"` et SANS `namespace`, tandis que `OpenBaoSnapshotTooOld` sort
#      avec `namespace` et `cronjob`. Conséquence directe : le filtre de ce dashboard porte sur
#      `alertname` (préfixe du composant), jamais sur `namespace` — un filtre par namespace
#      masquerait silencieusement la moitié des alertes du coffre.
#
#   5. `Watchdog` est exclu PARTOUT (`alertname!="Watchdog"`) et remplacé par une tuile dédiée.
#      C'est le deadman switch du chart : il sonne en permanence, par construction. Laissé dans le
#      tableau il en occupe la seule ligne en temps normal ; laissé dans les graphes il ajoute une
#      série `severity=none` toujours à 1 qui écrase l'échelle. Son information n'est pas sa
#      présence mais sa DISPARITION, ce qu'une tuile `absent(...)` dit mieux qu'une ligne de plus.
#
# Rétention : `ALERTS` n'existe que TANT QUE l'alerte est active. Une alerte résolue disparaît des
# graphes au-delà de la fenêtre où elle a sonné, et tout disparaît à 15 j (rétention Prometheus).
# Ce dashboard montre l'état et l'historique récent — il ne remplace pas un journal d'incidents.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-alertes
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  alertes.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "État et historique des alertes Prometheus (openbao, velero, openebs, règles du chart). Source : séries ALERTS / ALERTS_FOR_STATE.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "panels": [],
          "title": "État courant",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Alertes severity=critical actuellement firing, c'est-à-dire dont le `for:` est écoulé. Ce sont les seules qui partiraient en mail si la notification était activée.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "count(ALERTS{alertstate=\"firing\", severity=\"critical\", alertname=~\"$composant\"}) or vector(0)",
              "instant": true,
              "legendFormat": "critiques",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Critiques (firing)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Alertes severity=warning actuellement firing.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "count(ALERTS{alertstate=\"firing\", severity=\"warning\", alertname=~\"$composant\"}) or vector(0)",
              "instant": true,
              "legendFormat": "warnings",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Warnings (firing)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Condition vraie, `for:` pas encore écoulé. Ces alertes sont dans le tableau ci-dessous avec l'état `pending` — c'est là qu'on voit une panne AVANT qu'elle ne devienne officielle. Bleu et non jaune : rien à faire à ce stade, l'anti-rebond travaille.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "text", "value": null },
                  { "color": "blue", "value": 1 }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "count(ALERTS{alertstate=\"pending\", alertname=~\"$composant\"}) or vector(0)",
              "instant": true,
              "legendFormat": "pending",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "En incubation (pending)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Watchdog est le deadman switch du chart : une alerte qui sonne EN PERMANENCE, dont la seule information est de s'arrêter. Tant qu'elle est là, la chaîne évaluation → règles → Prometheus fonctionne. Cette tuile au rouge signifie que Prometheus n'évalue plus — aucune autre alerte de ce dashboard n'est alors digne de confiance, y compris les trois tuiles vertes à gauche.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                {
                  "options": {
                    "0": { "color": "green", "index": 0, "text": "OK" },
                    "1": { "color": "red", "index": 1, "text": "MUETTE" }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "absent(ALERTS{alertname=\"Watchdog\"}) or vector(0)",
              "instant": true,
              "legendFormat": "watchdog",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Chaîne d'alerting",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Alertes actives, `firing` en tête puis `pending`. « Depuis » vient de ALERTS_FOR_STATE : c'est l'instant où la condition est devenue vraie, donc AVANT l'écoulement du `for:` — une alerte pending depuis 20 min avec un `for: 3h` est normale. Les colonnes job / namespace / cronjob sont vides pour les règles bâties sur `absent()` qui ne les déclarent pas dans leurs matchers, cf. l'en-tête du fichier. Watchdog est exclu : il a sa tuile.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": {
                "align": "auto",
                "cellOptions": { "type": "auto" },
                "filterable": true,
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "text", "value": null }]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Value" },
                "properties": [
                  { "id": "displayName", "value": "Depuis" },
                  { "id": "unit", "value": "s" },
                  { "id": "custom.width", "value": 130 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "alertstate" },
                "properties": [
                  { "id": "displayName", "value": "État" },
                  { "id": "custom.width", "value": 110 },
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "firing": { "color": "red", "index": 0, "text": "firing" },
                          "pending": { "color": "blue", "index": 1, "text": "pending" }
                        },
                        "type": "value"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "severity" },
                "properties": [
                  { "id": "displayName", "value": "Sévérité" },
                  { "id": "custom.width", "value": 110 },
                  { "id": "custom.cellOptions", "value": { "type": "color-text" } },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "critical": { "color": "red", "index": 0, "text": "critical" },
                          "warning": { "color": "orange", "index": 1, "text": "warning" }
                        },
                        "type": "value"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "alertname" },
                "properties": [
                  { "id": "displayName", "value": "Alerte" },
                  { "id": "custom.width", "value": 280 }
                ]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 5 },
          "id": 10,
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": false, "displayName": "État" }]
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "(time() - ALERTS_FOR_STATE{alertname=~\"$composant\", alertname!=\"Watchdog\", severity=~\"$severity\"}) * ignoring(alertstate) group_left(alertstate) ALERTS{alertstate=~\"firing|pending\", alertname!=\"Watchdog\"}",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Alertes actives (firing + pending)",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true },
                "includeByName": {},
                "indexByName": {
                  "alertname": 0,
                  "alertstate": 1,
                  "severity": 2,
                  "Value": 3,
                  "namespace": 4,
                  "job": 5
                },
                "renameByName": {}
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "id": 101,
          "panels": [],
          "title": "Historique",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Une bande par alerte, ROUGE quand elle est firing et BLEUE quand elle est pending — la bande bleue à gauche de la rouge, c'est le `for:` qui s'écoule. `ALERTS` vaut 1 dans les DEUX états, donc rien ne les distinguerait à l'affichage : d'où le `* 2` sur la branche firing, et le codage 1 = pending / 2 = firing lu par les value mappings. Le `max by (alertname)` supprime le label alertstate, sans quoi la même alerte occuperait deux lignes de l'axe Y. La bande n'existe que pendant que l'alerte est active : un trou n'est pas une absence de données, c'est le retour à la normale. Pas de légende à droite : les noms sont déjà sur l'axe Y.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": {
                "fillOpacity": 85,
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineWidth": 0,
                "spanNulls": false
              },
              "mappings": [
                {
                  "options": {
                    "1": { "color": "blue", "index": 0, "text": "pending" },
                    "2": { "color": "red", "index": 1, "text": "firing" }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "text", "value": null }]
              }
            },
            "overrides": []
          },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 14 },
          "id": 11,
          "options": {
            "alignValue": "left",
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false },
            "mergeValues": true,
            "rowHeight": 0.9,
            "showValue": "never",
            "tooltip": { "hideZeros": false, "mode": "single", "sort": "none" }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "max by (alertname) ((ALERTS{alertstate=\"firing\", alertname=~\"$composant\", alertname!=\"Watchdog\", severity=~\"$severity\"} * 2) or ALERTS{alertstate=\"pending\", alertname=~\"$composant\", alertname!=\"Watchdog\", severity=~\"$severity\"})",
              "legendFormat": "{{alertname}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Quand chaque alerte a sonné",
          "type": "state-timeline"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "description": "Nombre d'alertes firing par sévérité, empilé. Watchdog (severity=none) est exclu : toujours à 1, il décalait toute la courbe d'un cran et écrasait l'échelle. Sert à distinguer une panne franche (marche d'escalier) d'une alerte qui bat (dents de scie) — la seconde appelle un ajustement du `for:`, pas une intervention.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 35,
                "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false,
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": { "type": "linear" },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "normal" },
                "thresholdsStyle": { "mode": "off" }
              },
              "decimals": 0,
              "mappings": [],
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "none"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "critical" },
                "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }]
              },
              {
                "matcher": { "id": "byName", "options": "warning" },
                "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }]
              }
            ]
          },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 23 },
          "id": 12,
          "options": {
            "legend": {
              "calcs": ["max"],
              "displayMode": "list",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": { "hideZeros": false, "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "editorMode": "code",
              "expr": "sum by (severity) (ALERTS{alertstate=\"firing\", alertname=~\"$composant\", alertname!=\"Watchdog\", severity=~\"$severity\", severity!=\"none\"})",
              "legendFormat": "{{severity}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Alertes firing dans le temps",
          "type": "timeseries"
        }
      ],
      "preload": false,
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": ["wittnerlab", "alertes"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Datasource",
            "multi": false,
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "allValue": ".*",
            "current": {},
            "description": "Filtre par PRÉFIXE d'alertname, et non par namespace : les règles bâties sur absent() ne portent que les labels de leurs matchers, donc plusieurs alertes openbao n'ont aucun label namespace. Filtrer par namespace en masquerait la moitié sans le dire.",
            "hide": 0,
            "includeAll": true,
            "label": "Composant",
            "multi": true,
            "name": "composant",
            "options": [],
            "query": "OpenBao : OpenBao.*, Velero : Velero.*, OpenEBS : OpenEBS.*, Kubernetes (chart) : Kube.*",
            "queryValue": "",
            "skipUrlSync": false,
            "type": "custom"
          },
          {
            "allValue": ".+",
            "current": {},
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "definition": "label_values(ALERTS, severity)",
            "description": "Alimenté par les alertes RÉELLEMENT présentes dans Prometheus : une sévérité qui n'a jamais sonné n'apparaît pas dans la liste.",
            "hide": 0,
            "includeAll": true,
            "label": "Sévérité",
            "multi": true,
            "name": "severity",
            "options": [],
            "query": {
              "qryType": 1,
              "query": "label_values(ALERTS, severity)",
              "refId": "severity"
            },
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Alertes — cluster",
      "uid": "cluster-alertes",
      "version": 1,
      "weekStart": ""
    }
