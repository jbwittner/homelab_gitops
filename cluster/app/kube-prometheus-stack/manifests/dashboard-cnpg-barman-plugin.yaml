# cluster/app/kube-prometheus-stack/manifests/dashboard-cnpg-barman-plugin.yaml
# Dashboard Grafana « Sauvegardes PostgreSQL — barman-cloud »
# Chargé automatiquement par le sidecar de kube-prometheus-stack via le label
# grafana_dashboard: "1".
#
# Pendant du dashboard « Sauvegardes — velero » pour l'autre chaîne de sauvegarde du cluster.
# Les deux ne se recouvrent PAS : les PVC des bases CNPG sont exclus de la copie kopia
# (cluster/infra/velero/manifests/volume-policies.yaml), donc ce qui est montré ici est la SEULE
# protection des données PostgreSQL.
#
# Sources de métriques :
#   - sidecar `plugin-barman-cloud`, servi sur l'endpoint 9187 des pods d'instance (PodMonitor
#     `cnpg-instances`, cluster/app/cnpg-monitoring) :
#     barman_cloud_cloudnative_pg_io_{last_available_backup_timestamp,last_failed_backup_timestamp,
#     first_recoverability_point}
#   - collecteur d'instance, même endpoint : cnpg_collector_pg_wal_archive_status,
#     cnpg_pg_stat_archiver_*
#   - kube-state-metrics, customResourceState (helm-values.yaml) : cnpg_backup_object_* — la liste
#     des CRs `Backup`, que les métriques du sidecar ne donnent pas
#
# ⚠️ TROIS PIÈGES, tous vérifiés sur `forgejo-db` en CloudNativePG 1.30 / plugin 0.15. Ils sont
# les mêmes que ceux documentés en tête de cnpg-monitoring/manifests/prometheusrule.yaml, et les
# panneaux de ce dashboard sont écrits pour les contourner :
#
#   1. `cnpg_pg_stat_archiver_seconds_since_last_archival` N'EST PAS un indicateur de fraîcheur.
#      PostgreSQL ne force un changement de segment sur `archive_timeout` que s'il y a EU de
#      l'activité WAL : une base au repos n'archive rien, indéfiniment (40 h relevées sur une
#      instance saine). Le signal d'une chaîne cassée est le BACKLOG
#      (`cnpg_collector_pg_wal_archive_status{value="ready"}`), nul au repos.
#
#   2. Les timestamps du plugin valent 0, PAS « absent », quand rien n'a jamais abouti. Toutes les
#      requêtes de fraîcheur portent une garde `> 0` — sans elle elles afficheraient un âge de 56
#      ans au lieu d'un « No data » honnête.
#
#   3. Les métriques `cnpg_collector_{last_available,last_failed}_backup_timestamp` de l'opérateur
#      sont marquées (Deprecated) par l'amont depuis le passage aux plugins CNPG-I. Ce dashboard
#      n'utilise QUE les métriques `barman_cloud_cloudnative_pg_io_*` servies par le sidecar.
#
# Ce que ce dashboard ne peut PAS montrer : l'occupation RÉELLE du bucket. Ni le plugin ni le
# collecteur n'exposent la taille des objets écrits — elle se mesure côté fournisseur
# (`gcloud storage du`), exactement comme pour le dépôt kopia de velero.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cnpg-barman-plugin
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  cnpg-barman-plugin.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "panels": [],
          "title": "État de la chaîne",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Temps écoulé depuis la dernière sauvegarde de base RÉUSSIE. Rouge au-delà de 36 h, seuil de l'alerte `CNPGBackupTooOld` et de la schedule quotidienne (02:00). ⚠️ La garde `> 0` est load-bearing : la métrique vaut ZÉRO — pas « absente » — tant qu'aucune sauvegarde n'a jamais abouti. Sans elle, cette tuile afficherait « 56 ans » au lieu de « No data ». Un « No data » ici veut donc dire : aucune sauvegarde n'a jamais réussi, ce que couvre l'alerte `CNPGNoBackupYet`.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 93600
                  },
                  {
                    "color": "red",
                    "value": 129600
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cnpg_io_cluster=~\"$cluster\"} > 0)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Dernière sauvegarde réussie",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 1
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Étendue de la fenêtre restaurable : du plus ancien point de reprise encore dans le bucket jusqu'à la dernière sauvegarde. C'est la profondeur réelle du PITR — la seule réponse à « jusqu'où puis-je remonter ». Elle est bornée par la rétention configurée dans l'`ObjectStore` de la base, pas par cette chaîne : si elle cesse de croître alors que les sauvegardes passent, c'est la rétention qui recycle.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cnpg_io_cluster=~\"$cluster\"} > 0) - min(barman_cloud_cloudnative_pg_io_first_recoverability_point{cnpg_io_cluster=~\"$cluster\"} > 0)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Fenêtre de restauration (PITR)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 2
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Segments présents dans `pg_wal/archive_status/` en attente d'archivage. LE signal d'une chaîne morte : un archiveur sain les draine en quelques secondes, donc 0 en régime normal ET sur une base au repos. Non nul de façon durable = PITR interrompu, et `pg_wal` qui grossit jusqu'à remplir le PVC — un `pg_wal` plein ARRÊTE PostgreSQL. Alerte `CNPGWalArchivingBacklog` à 30 min.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max(cnpg_collector_pg_wal_archive_status{cnpg_io_cluster=~\"$cluster\", value=\"ready\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Segments WAL en attente",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 3
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Segments dont l'archivage a échoué sur 24 h. Complète la tuile voisine : un échec qui finit par passer au retry laisse le backlog à zéro et ne se voit QUE ici. Alerte `CNPGWalArchivingFailing` dès le premier échec sur une heure.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(increase(cnpg_pg_stat_archiver_failed_count{cnpg_io_cluster=~\"$cluster\"}[24h]))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Échecs d'archivage (24 h)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 4
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Âge du dernier ÉCHEC de sauvegarde de base. « No data » est ici la BONNE nouvelle : aucune sauvegarde n'a jamais échoué (la métrique vaut 0, filtrée par `> 0`). Si cette tuile est plus récente que « Dernière sauvegarde réussie », la dernière tentative a échoué — c'est exactement la condition de l'alerte `CNPGLastBackupFailed`.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 129600
                  },
                  {
                    "color": "green",
                    "value": 604800
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "time() - max(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{cnpg_io_cluster=~\"$cluster\"} > 0)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Dernière tentative en échec",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 5
          },
          "id": 5
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Nombre de bases dont le sidecar barman-cloud sert des métriques. Ces séries N'EXISTENT QUE pour les Clusters dont le `spec.plugins` est câblé : cette tuile compte donc les bases réellement prises en charge, pas celles qu'on croit avoir configurées.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count(count by (cnpg_io_cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cnpg_io_cluster=~\"$cluster\"}))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Bases sauvegardées",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 5
          },
          "id": 6
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Clusters PostgreSQL vivants MOINS clusters ayant une chaîne barman-cloud. Non nul veut dire qu'au moins une base n'est sauvegardée par rien — rappel : les PVC CNPG sont aussi exclus de la copie kopia de velero (`velero/manifests/volume-policies.yaml`). ⚠️ Cette tuile ignore la variable Base à dessein : masquer une base non sauvegardée en la désélectionnant serait exactement le contraire de ce qu'on veut.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count(count by (cnpg_io_cluster) (cnpg_collector_up)) - (count(count by (cnpg_io_cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)) or vector(0))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Bases sans chaîne de sauvegarde",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 5
          },
          "id": 7
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Réplicas prêts du Deployment CNPG-I. Ce Deployment ne transporte AUCUNE donnée : il répond à l'opérateur en gRPC sur `barman-cloud:9090`. Le travail réel est fait par le conteneur sidecar injecté dans chaque pod d'instance (rangée « Coût du plugin »). À 0, aucune NOUVELLE sauvegarde ne peut être lancée — l'archivage WAL déjà en place, lui, continue.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"cnpg-system\", deployment=\"plugin-barman-cloud\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Plugin barman-cloud disponible",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 5
          },
          "id": 8
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Une ligne par base sous barman-cloud. « Plus ancien point restaurable » et « Dernière sauvegarde » bornent la fenêtre PITR. Colonne « Dernier échec » vide = aucun échec depuis la création de la chaîne. ⚠️ Les timestamps sont multipliés par 1000 : Prometheus les sert en secondes, Grafana affiche `dateTimeAsIso` en millisecondes — sans la multiplication, toutes les dates tombent en 1970.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Dernière sauvegarde"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Plus ancien point restaurable"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Dernier échec"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  }
                ]
              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Base"
              }
            ]
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cnpg_io_cluster=~\"$cluster\"} * 1000",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "barman_cloud_cloudnative_pg_io_first_recoverability_point{cnpg_io_cluster=~\"$cluster\"} * 1000",
              "refId": "B",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{cnpg_io_cluster=~\"$cluster\"} > 0) * 1000",
              "refId": "C",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "cnpg_collector_pg_wal_archive_status{cnpg_io_cluster=~\"$cluster\", value=\"ready\"}",
              "refId": "D",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "increase(cnpg_pg_stat_archiver_failed_count{cnpg_io_cluster=~\"$cluster\"}[24h])",
              "refId": "E",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Chaîne de sauvegarde par base",
          "transformations": [
