# cluster/app/kube-prometheus-stack/manifests/dashboard-cnpg-barman-plugin.yaml
# Dashboard Grafana « PostgreSQL backups — barman-cloud »
# Chargé automatiquement par le sidecar de kube-prometheus-stack via le label
# grafana_dashboard: "1".
#
# Pendant du dashboard « Backups — velero » pour l'autre chaîne de sauvegarde du cluster.
# Les deux ne se recouvrent PAS : les PVC des bases CNPG sont exclus de la copie kopia
# (cluster/infra/velero/manifests/volume-policies.yaml), donc ce qui est montré ici est la SEULE
# protection des données PostgreSQL.
#
# Sources de métriques :
#   - sidecar `plugin-barman-cloud`, servi sur l'endpoint 9187 des pods d'instance (PodMonitor
#     `cnpg-instances`, cluster/app/cnpg-monitoring) :
#     barman_cloud_cloudnative_pg_io_{last_available_backup_timestamp,last_failed_backup_timestamp,
#     first_recoverability_point}
#   - collecteur d'instance, même endpoint : cnpg_collector_pg_wal_archive_status,
#     cnpg_pg_stat_archiver_*
#   - kube-state-metrics, customResourceState (helm-values.yaml) : cnpg_backup_object_* — la liste
#     des CRs `Backup`, que les métriques du sidecar ne donnent pas
#
# ⚠️ TROIS PIÈGES, tous vérifiés sur une base réelle en CloudNativePG 1.30 / plugin 0.15. Ils sont
# les mêmes que ceux documentés en tête de cnpg-monitoring/manifests/prometheusrule.yaml, et les
# panneaux de ce dashboard sont écrits pour les contourner :
#
#   1. `cnpg_pg_stat_archiver_seconds_since_last_archival` N'EST PAS un indicateur de fraîcheur.
#      PostgreSQL ne force un changement de segment sur `archive_timeout` que s'il y a EU de
#      l'activité WAL : une base au repos n'archive rien, indéfiniment (40 h relevées sur une
#      instance saine). Le signal d'une chaîne cassée est le BACKLOG
#      (`cnpg_collector_pg_wal_archive_status{value="ready"}`), nul au repos.
#
#   2. Les timestamps du plugin valent 0, PAS « absent », quand rien n'a jamais abouti. Toutes les
#      requêtes de fraîcheur portent une garde `> 0` — sans elle elles afficheraient un âge de 56
#      ans au lieu d'un « No data » honnête.
#
#   3. Les métriques `cnpg_collector_{last_available,last_failed}_backup_timestamp` de l'opérateur
#      sont marquées (Deprecated) par l'amont depuis le passage aux plugins CNPG-I. Ce dashboard
#      n'utilise QUE les métriques `barman_cloud_cloudnative_pg_io_*` servies par le sidecar.
#
# Ce que ce dashboard ne peut PAS montrer : l'occupation RÉELLE du bucket. Ni le plugin ni le
# collecteur n'exposent la taille des objets écrits — elle se mesure côté fournisseur
# (`gcloud storage du`), exactement comme pour le dépôt kopia de velero.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cnpg-barman-plugin
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  cnpg-barman-plugin.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "panels": [],
          "title": "Chain state",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Time elapsed since the last SUCCESSFUL base backup. Red beyond 36 h, the threshold of the `CNPGBackupTooOld` alert and of the daily schedule (02:00). ⚠️ The `> 0` guard is load-bearing: the metric reads ZERO — not \"absent\" — as long as no backup has ever succeeded. Without it, this tile would show \"56 years\" instead of \"No data\". So a \"No data\" here means: no backup has ever succeeded, which the `CNPGNoBackupYet` alert covers.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 93600
                  },
                  {
                    "color": "red",
                    "value": 129600
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cnpg_io_cluster=~\"$cluster\"} > 0)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Last successful backup",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 1
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Span of the restorable window: from the oldest recovery point still in the bucket up to the last backup. This is the real PITR depth — the only answer to \"how far back can I go\". It is bounded by the retention configured in the database's `ObjectStore`, not by this chain: if it stops growing while backups keep succeeding, retention is recycling.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cnpg_io_cluster=~\"$cluster\"} > 0) - min(barman_cloud_cloudnative_pg_io_first_recoverability_point{cnpg_io_cluster=~\"$cluster\"} > 0)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Restore window (PITR)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 2
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Segments sitting in `pg_wal/archive_status/` waiting to be archived. THE signal of a dead chain: a healthy archiver drains them in seconds, so 0 in normal operation AND on an idle database. Lastingly non-zero = PITR interrupted, and `pg_wal` growing until it fills the PVC — a full `pg_wal` STOPS PostgreSQL. `CNPGWalArchivingBacklog` alert at 30 min.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max(cnpg_collector_pg_wal_archive_status{cnpg_io_cluster=~\"$cluster\", value=\"ready\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "WAL segments pending",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 3
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Segments whose archiving failed over 24 h. Completes the neighbouring tile: a failure that eventually succeeds on retry leaves the backlog at zero and is visible ONLY here. `CNPGWalArchivingFailing` alert on the first failure within an hour.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(increase(cnpg_pg_stat_archiver_failed_count{cnpg_io_cluster=~\"$cluster\"}[24h]))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Archiving failures (24 h)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 4
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Age of the last FAILED base backup. \"No data\" is the GOOD news here: no backup has ever failed (the metric reads 0, filtered out by `> 0`). If this tile is more recent than \"Last successful backup\", the last attempt failed — exactly the condition of the `CNPGLastBackupFailed` alert.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 129600
                  },
                  {
                    "color": "green",
                    "value": 604800
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "time() - max(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{cnpg_io_cluster=~\"$cluster\"} > 0)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Last failed attempt",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 5
          },
          "id": 5
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Number of databases whose barman-cloud sidecar serves metrics. These series EXIST ONLY for Clusters whose `spec.plugins` is wired: this tile therefore counts the databases actually covered, not those believed to be configured.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count(count by (cnpg_io_cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cnpg_io_cluster=~\"$cluster\"}))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Databases backed up",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 5
          },
          "id": 6
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Live PostgreSQL clusters MINUS clusters having a barman-cloud chain. Non-zero means at least one database is backed up by nothing — a reminder: CNPG PVCs are also excluded from velero's kopia copy (`velero/manifests/volume-policies.yaml`). ⚠️ This tile ignores the Database variable on purpose: hiding an unprotected database by deselecting it would be exactly the opposite of what is wanted.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count(count by (cnpg_io_cluster) (cnpg_collector_up)) - (count(count by (cnpg_io_cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)) or vector(0))",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Databases with no backup chain",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 5
          },
          "id": 7
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Ready replicas of the CNPG-I Deployment. This Deployment carries NO data: it answers the operator over gRPC on `barman-cloud:9090`. The real work is done by the sidecar container injected into every instance pod (the \"Plugin cost\" row). At 0, no NEW backup can be started — the WAL archiving already in place keeps going.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"cnpg-system\", deployment=\"plugin-barman-cloud\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "barman-cloud plugin available",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 5
          },
          "id": 8
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "One row per database under barman-cloud. \"Oldest restorable point\" and \"Last backup\" bound the PITR window. An empty \"Last failure\" column = no failure since the chain was created. ⚠️ The timestamps are multiplied by 1000: Prometheus serves them in seconds, Grafana renders `dateTimeAsIso` in milliseconds — without the multiplication every date lands in 1970.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last backup"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Oldest restorable point"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last failure"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  }
                ]
              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Database"
              }
            ]
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cnpg_io_cluster=~\"$cluster\"} * 1000",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "barman_cloud_cloudnative_pg_io_first_recoverability_point{cnpg_io_cluster=~\"$cluster\"} * 1000",
              "refId": "B",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "(barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{cnpg_io_cluster=~\"$cluster\"} > 0) * 1000",
              "refId": "C",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "cnpg_collector_pg_wal_archive_status{cnpg_io_cluster=~\"$cluster\", value=\"ready\"}",
              "refId": "D",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "increase(cnpg_pg_stat_archiver_failed_count{cnpg_io_cluster=~\"$cluster\"}[24h])",
              "refId": "E",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Backup chain per database",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "cnpg_io_cluster",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "Time 5": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "pod": true,
                  "service": true,
                  "value": true,
                  "__name__": true,
                  "Time 6": true,
                  "Time 7": true,
                  "Time 1 1": true,
                  "Time 1 2": true,
                  "Time 1 3": true,
                  "Time 1 4": true,
                  "Time 1 5": true,
                  "Time 1 6": true,
                  "Time 1 7": true,
                  "Time 2 1": true,
                  "Time 2 2": true,
                  "Time 2 3": true,
                  "Time 2 4": true,
                  "Time 2 5": true,
                  "Time 2 6": true,
                  "Time 2 7": true,
                  "Time 3 1": true,
