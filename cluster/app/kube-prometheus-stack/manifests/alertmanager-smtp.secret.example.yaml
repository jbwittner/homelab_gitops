# Template VERSIONNÉ et VIDE du credential SMTP d'Alertmanager. Le fichier réellement scellé est
# `alertmanager-smtp.secret.yaml`, gitignoré (`*.secret.yaml`) — celui-ci ne sert qu'à garder en
# Git la forme attendue, les noms de clés et les pièges. Cf. README § Notification mail.
#
# Canal **sealed-secrets**, et non openbao comme le prévoyait
# `alertmanager-smtp.externalsecret.yaml` (conservé, non référencé). Même raison que pour le compte
# admin Grafana, en plus forte : Alertmanager est l'outil qui doit parler quand le reste se tait.
# Le faire dépendre d'un coffre descellé, c'est perdre les alertes exactement le jour où openbao
# tombe — et la panne d'openbao serait alors l'alerte qui ne part pas.
#
# ⚠️ Une seule des deux clés est vraiment secrète, et c'est une asymétrie à connaître :
#   - `password` : la clé SMTP du relais. Alertmanager la lit dans un FICHIER
#     (`smtp_auth_password_file`), jamais depuis sa config — c'est ce qui permet de garder
#     `helm-values.yaml` publiable. Le montage vient d'`alertmanagerSpec.secrets`, qui place le
#     Secret sous `/etc/alertmanager/secrets/alertmanager-smtp/<clé>`. Le NOM DE LA CLÉ EST DONC
#     LE NOM DU FICHIER : la renommer ici casse le chemin écrit dans `helm-values.yaml`.
#   - `username` : le login SMTP. Alertmanager n'a PAS de `smtp_auth_username_file` — la valeur
#     est de toute façon en clair dans `helm-values.yaml` (`smtp_auth_username`). Elle est scellée
#     ici malgré tout pour que la paire ne se dissocie jamais : un mot de passe dont on a perdu le
#     login associé n'est pas rejouable, et les logins Brevo ne ressemblent pas à une adresse mail.
#
# ⚠️ Le `SealedSecret` produit est chiffré pour le couple (`alertmanager-smtp`, `monitoring`) : le
# renommer ou le déplacer de namespace exige de le resceller.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-smtp
  namespace: monitoring
type: Opaque
stringData:
  # Login SMTP dédié du relais — chez Brevo un identifiant du type `9xxxxx@smtp-brevo.com`, ⚠️ PAS
  # l'adresse mail du compte. Doit être recopié à l'identique dans `smtp_auth_username` de
  # `helm-values.yaml` : les deux ne sont reliés par rien, un écart ne produit qu'un échec
  # d'authentification dans les logs d'Alertmanager.
  #
  # En place : le MÊME credential que le mailer de Forgejo (`forgejo-smtp`). Un seul relais, une
  # seule clé à faire tourner. ⚠️ Contrepartie assumée : tourner la clé chez Brevo casse les deux
  # d'un coup, et il faut resceller les DEUX fichiers.
  username: REMPLACER@smtp-brevo.com
  # Clé SMTP du relais.
  #
  # ⚠️ Sceller `REMPLACER` ici n'est PAS sans dommage, contrairement au document SMTP de Forgejo :
  # un mot de passe faux ne se voit qu'au premier mail d'alerte — donc lors d'une vraie panne, et
  # le seul symptôme est une ligne dans les logs d'Alertmanager que personne ne lit à ce
  # moment-là. D'où le test au `Watchdog` de la procédure (README § Notification mail) : c'est le
  # seul générateur d'alerte fiable dont on dispose pour prouver que la chaîne envoie.
  password: REMPLACER
