# cluster/app/kube-prometheus-stack/manifests/dashboard-machines.yaml
# Dashboard Grafana « Machines — système »
# Chargé automatiquement par le sidecar de kube-prometheus-stack via le label
# grafana_dashboard: "1".
#
# ⚠️ CE FICHIER EST L'ANCIEN « Système — nœuds Talos », DÉBARRASSÉ DE TOUT CE QUI ÉTAIT KUBERNETES,
# et il REMPLACE aussi « Machine — vert-emeriss », supprimé le même jour. Trois dashboards se
# recouvraient partiellement ; il n'en reste qu'un pour les machines, plus un pour le stockage du
# cluster (`dashboard-stockage-cluster.yaml`, qui a recueilli les panneaux LVM/OpenEBS).
#
# ⚠️ IL COUVRE TOUT LE PARC, NŒUDS DU CLUSTER ET MACHINES EXTERNES. Ses variables `instance` et
# `node` interrogent `label_values(node_uname_info, …)` SANS filtre de job — c'est délibéré et
# c'est son objet même. Deux jobs alimentent donc les mêmes panneaux :
#   job="node-exporter"  -> les 3 nœuds Talos, DaemonSet de kube-prometheus-stack
#   job="external-node"  -> les machines hors cluster, composant `cluster/app/hosts-monitoring`
# Vérifié le 2026-09-11 : les cinq familles de métriques utilisées ici (`node_uname_info`,
# `node_boot_time_seconds`, `node_hwmon_*`, `node_textfile_scrape_error`,
# `node_scrape_collector_*`) existent sur les QUATRE machines. Aucun panneau n'est vide sur une
# partie du parc.
#
# ⚠️ PIÈGE HISTORIQUE, À NE PAS REFAIRE : ce dashboard a porté pendant quelques heures un filtre
# `job="node-exporter"` sur ses variables. Il avait été posé pour une bonne raison — `vert-emeriss`
# apparaissait dans le sélecteur d'un dashboard réservé à Talos, et la choisir affichait un
# dashboard à moitié vide SANS erreur. Ce filtre n'a plus lieu d'être ici, mais il reste
# indispensable dans `dashboard-stockage-cluster.yaml`, qui lui est bel et bien réservé au cluster.
#
# ⚠️ CE QU'IL NE MONTRE PAS, à dessein :
#   - les VolumeGroups LVM / OpenEBS et l'état des nœuds Kubernetes : ils décrivent le CLUSTER, pas
#     une machine, et vivent dans `dashboard-stockage-cluster.yaml` ;
#   - la fraîcheur des SAUVEGARDES de la forge. Les séries `forgejo_backup_*` arrivent pourtant par
#     le scrape d'une machine (collecteur textfile de node-exporter) — mais elles parlent de la
#     forge, pas de la machine, et s'affichent dans « Forge — forgejo ». Ce qui reste ici est la
#     santé du CANAL : la tuile « Collecteur textfile » et la ligne « Diagnostic — santé de la
#     supervision ». Le canal appartient à la machine, son contenu au service.
#
# ⚠️ Les seuils de température sont CHOISIS, pas déclarés par le matériel : `vert-emeriss` n'expose
# ni `node_hwmon_temp_crit_celsius` ni `_max_celsius` (les séries de ce nom viennent des nœuds
# Talos). Aucune ALERTE n'est bâtie dessus — un seuil critique posé sur un matériel dont on ignore
# la limite déclarée produit du bruit ou une fausse sécurité.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-machines
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  machines.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": false,
            "iconColor": "purple",
            "name": "Déploiements ArgoCD",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [
                "argocd",
                "deployed"
              ],
              "type": "tags"
            }
          }
        ]
      },
      "description": "Vue système des nœuds Talos. L'essentiel est visible d'emblée ; les analyses fines sont dans les lignes « Diagnostic », repliées. Aucune topologie matérielle codée en dur : nœuds, disques et capteurs sont découverts dynamiquement.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Vue d'ensemble",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Part du temps CPU passée AILLEURS qu'en `idle`, moyennée sur tous les cœurs. `1 - avg(rate(idle))` plutôt que la somme des autres modes : c'est la même valeur, mais elle reste juste si un mode apparaît ou disparaît d'une version de noyau à l'autre.\n\n⚠️ SUR CETTE MACHINE, CE CHIFFRE SEUL INDUIT EN ERREUR : Git est IOPS-bound. Une forge qui rame peut afficher un CPU bas avec un `iowait` élevé et un disque saturé. À lire avec « Charge (1 min) » à côté et « Saturation disque » plus bas — si la charge dépasse 1 alors que ce carré est vert, le goulot est le disque, pas le calcul.\n\nAucune alerte n'est bâtie dessus, volontairement : un pic CPU sur une forge est un clone ou une réindexation, pas un incident.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "percentunit",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 80,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{instance=~\"$instance\",mode=\"idle\"}[$__rate_interval]))",
              "legendFormat": "{{instance}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "title": "CPU utilisé",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`1 - MemAvailable/MemTotal`. ⚠️ `MemAvailable` ET NON `MemFree` : le second ignore le cache récupérable et afficherait 90 % sur une machine parfaitement saine — c'est l'erreur de lecture classique sous Linux.\n\nLe rouge de ce carré est calé sur le seuil de l'alerte `ExternalNodeMemoryPressure` (moins de 10 % disponible pendant 20 min).\n\n⚠️ Un passage bref au rouge après un redémarrage du conteneur Forgejo est ATTENDU : `REPO_INDEXER_ENABLED` réindexe tous les dépôts au premier démarrage, et c'est le pic mémoire de cette machine. Durable, en revanche, ça finit en OOM-kill — qui se verra par `ForgejoDown`, sans en nommer la cause.\n\nL'hôte porte 15 Gio (le §« Matériel minimum » du README Forgejo n'en exige que 2) : ce carré doit rester très bas. Le détail — total, utilisé, disponible, cache — est dans le panneau « Mémoire ».",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "percentunit",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 81,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "1 - (node_memory_MemAvailable_bytes{instance=~\"$instance\"} / node_memory_MemTotal_bytes{instance=~\"$instance\"})",
              "legendFormat": "{{instance}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "title": "RAM utilisée",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Tuile VOLONTAIREMENT MUETTE : elle n'affiche un point de montage que si l'un dépasse 80 % de remplissage. Sinon elle dit « tous < 80 % » en vert.\n\n⚠️ MÉCANIQUE À COMPRENDRE AVANT DE LA MODIFIER : le `> 0.80` n'est pas une mise en forme, c'est un FILTRE de vecteur. Sous le seuil, la série n'existe pas — la tuile est en état « no data », et c'est le `noValue` qui s'affiche. C'est aussi pourquoi le premier palier de couleur est VERT : il ne colore jamais une valeur (elles valent au moins 0,80 par construction), il colore l'absence.\n\n`topk(1, ...)` et non `max(...)` : `max` rendrait un scalaire SANS étiquette, donc un pourcentage dont on ignorerait à quoi il se rapporte. `topk` conserve le point de montage, que la tuile affiche.\n\n⚠️ ELLE NE MONTRE QU'UN SEUL MONTAGE À LA FOIS. Si deux disques franchissent 80 % ensemble, le second est masqué. Le panneau « Remplissage des systèmes de fichiers » plus bas les montre tous — celui-ci est un témoin, pas un inventaire.\n\nOrange à 80 % est un PRÉAVIS sans alerte associée ; rouge à 90 % est le seuil exact de `ExternalNodeDiskAlmostFull` (severity critical). Un carré rouge annonce donc une alerte qui va sonner dans 30 min.\n\nLes `tmpfs` sont écartés au scrape : `/run/lock` fait 5 Mio et serait en permanence en tête de ce classement.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "percentunit",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              },
              "noValue": "tous < 80 %"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 82,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "topk(1, (1 - (node_filesystem_avail_bytes{instance=~\"$instance\"} / node_filesystem_size_bytes{instance=~\"$instance\"})) > 0.80)",
              "legendFormat": "{{instance}} · {{mountpoint}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "title": "Disque en alerte",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Le capteur le plus chaud de la machine, tous confondus.\n\n⚠️ LES SEUILS SONT CHOISIS, PAS DÉCLARÉS PAR LE MATÉRIEL. Vérifié le 2026-09-11 : cette machine n'expose ni `node_hwmon_temp_crit_celsius` ni `node_hwmon_temp_max_celsius` — le pilote ne publie aucune limite. 70 °C / 85 °C sont donc des valeurs de bon sens pour un AMD de bureau, à retoucher si la machine chauffe normalement plus haut.\n\n⚠️ `Tctl` EST UNE VALEUR DE CONTRÔLE, PAS FORCÉMENT LA TEMPÉRATURE DU DIE. C'est ce que le pilote `k10temp` donne au régulateur de ventilation ; selon le modèle AMD elle porte un décalage (`Tdie` serait la valeur brute, absente ici). À comparer à une lecture BIOS avant d'en tirer une conclusion sur un dépassement.\n\n⚠️ Aucune ALERTE n'est bâtie dessus aujourd'hui, volontairement : poser un seuil critique sur un matériel dont on ne connaît pas la limite déclarée produirait soit du bruit, soit une fausse sécurité. Cette tuile est un témoin à l'œil ; le détail par capteur est dans « Températures ».",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "celsius",
              "decimals": 1,
              "noValue": "pas de capteur",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 83,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance) ((node_hwmon_temp_celsius{instance=~\"$instance\"} * on(instance,chip,sensor) group_left(label) node_hwmon_sensor_label{instance=~\"$instance\"}) or on(instance,chip,sensor) node_hwmon_temp_celsius{instance=~\"$instance\"})",
              "legendFormat": "{{instance}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "title": "Température max",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`up` de la cible `external-node`. ⚠️ À 0, TOUT ce dashboard se fige sur la dernière valeur connue sans trou visible dans les courbes — et les trois alertes de sauvegarde de la forge deviennent aveugles, elles transitent par cette même cible.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds",
                "fixedColor": "text"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "KO",
                      "color": "red",
                      "index": 1
                    },
                    "1": {
                      "text": "OK",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 7
          },
          "id": 84,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "up{job=~\"node-exporter|external-node\",instance=~\"$instance\"}",
              "legendFormat": "{{instance}}",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Scrape",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`node_uname_info` — étiquette `nodename` du noyau, pas le label `instance` posé par la ScrapeConfig. Les deux doivent coïncider : s'ils divergent, c'est que le relabeling `instance` de `scrapeconfig-vert-emeriss.yaml` ne décrit plus la machine réellement scrutée.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 7
          },
          "id": 85,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "node_uname_info{instance=~\"$instance\"}",
              "legendFormat": "{{nodename}} · {{release}}",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Machine",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`node_time_seconds - node_boot_time_seconds`. Un uptime qui retombe à zéro sans intervention est un redémarrage subi : croiser avec le panneau mémoire (OOM) et le journal de l'hôte.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 7
          },
          "id": 86,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "node_time_seconds{instance=~\"$instance\"} - node_boot_time_seconds{instance=~\"$instance\"}",
              "legendFormat": "uptime",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Uptime",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`node_textfile_scrape_error`. ⚠️ À 1, node-exporter n'abandonne pas le seul fichier fautif : il abandonne TOUT le collecteur textfile — vérifié le 2026-09-11 sur l'image v1.12.1. Les métriques `forgejo_backup_*` disparaissent alors, et `ForgejoBackupNoMetric` se met à mentir (« aucune sauvegarde » au lieu de « canal coupé »). Causes usuelles : `.prom` en mode 0600 au lieu de 0644, ou écriture non atomique surprise en plein scrape.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds",
                "fixedColor": "text"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OK",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "ERREUR",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 7
          },
          "id": 87,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "node_textfile_scrape_error{instance=~\"$instance\"}",
              "legendFormat": "erreur",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Collecteur textfile",
