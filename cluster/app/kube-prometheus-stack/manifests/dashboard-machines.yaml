# cluster/app/kube-prometheus-stack/manifests/dashboard-machines.yaml
# Dashboard Grafana « Machines — system »
# Chargé automatiquement par le sidecar de kube-prometheus-stack via le label
# grafana_dashboard: "1".
#
# ⚠️ CE FICHIER EST L'ANCIEN « Système — nœuds Talos », DÉBARRASSÉ DE TOUT CE QUI ÉTAIT KUBERNETES,
# et il REMPLACE aussi « Machine — vert-emeriss », supprimé le même jour. Trois dashboards se
# recouvraient partiellement ; il n'en reste qu'un pour les machines, plus un pour le stockage du
# cluster (`dashboard-stockage-cluster.yaml`, qui a recueilli les panneaux LVM/OpenEBS).
#
# ⚠️ IL COUVRE TOUT LE PARC, NŒUDS DU CLUSTER ET MACHINES EXTERNES. Ses variables `instance` et
# `node` interrogent `label_values(node_uname_info, …)` SANS filtre de job — c'est délibéré et
# c'est son objet même. Deux jobs alimentent donc les mêmes panneaux :
#   job="node-exporter"  -> les 3 nœuds Talos, DaemonSet de kube-prometheus-stack
#   job="external-node"  -> les machines hors cluster, composant `cluster/app/hosts-monitoring`
# Vérifié le 2026-09-11 : les cinq familles de métriques utilisées ici (`node_uname_info`,
# `node_boot_time_seconds`, `node_hwmon_*`, `node_textfile_scrape_error`,
# `node_scrape_collector_*`) existent sur les QUATRE machines. Aucun panneau n'est vide sur une
# partie du parc.
#
# ⚠️ PIÈGE HISTORIQUE, À NE PAS REFAIRE : ce dashboard a porté pendant quelques heures un filtre
# `job="node-exporter"` sur ses variables. Il avait été posé pour une bonne raison — `vert-emeriss`
# apparaissait dans le sélecteur d'un dashboard réservé à Talos, et la choisir affichait un
# dashboard à moitié vide SANS erreur. Ce filtre n'a plus lieu d'être ici, mais il reste
# indispensable dans `dashboard-stockage-cluster.yaml`, qui lui est bel et bien réservé au cluster.
#
# ⚠️ CE QU'IL NE MONTRE PAS, à dessein :
#   - les VolumeGroups LVM / OpenEBS et l'état des nœuds Kubernetes : ils décrivent le CLUSTER, pas
#     une machine, et vivent dans `dashboard-stockage-cluster.yaml` ;
#   - la fraîcheur des SAUVEGARDES de la forge. Les séries `forgejo_backup_*` arrivent pourtant par
#     le scrape d'une machine (collecteur textfile de node-exporter) — mais elles parlent de la
#     forge, pas de la machine, et s'affichent dans « Forge — forgejo ». Ce qui reste ici est la
#     santé du CANAL : la tuile « Collecteur textfile » et la ligne « Diagnostic — santé de la
#     supervision ». Le canal appartient à la machine, son contenu au service.
#
# ⚠️ Les seuils de température sont CHOISIS, pas déclarés par le matériel : `vert-emeriss` n'expose
# ni `node_hwmon_temp_crit_celsius` ni `_max_celsius` (les séries de ce nom viennent des nœuds
# Talos). Aucune ALERTE n'est bâtie dessus — un seuil critique posé sur un matériel dont on ignore
# la limite déclarée produit du bruit ou une fausse sécurité.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-machines
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  machines.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": false,
            "iconColor": "purple",
            "name": "ArgoCD deployments",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [
                "argocd",
                "deployed"
              ],
              "type": "tags"
            }
          }
        ]
      },
      "description": "System view of the machines running a node-exporter. The essentials are visible straight away; the fine-grained analysis sits in the collapsed \"Diagnostic\" rows. No hardware topology is hardcoded: nodes, disks and sensors are discovered dynamically.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Overview",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Share of CPU time spent ANYWHERE but `idle`, averaged over all cores. `1 - avg(rate(idle))` rather than the sum of the other modes: same value, but it stays correct if a mode appears or disappears from one kernel version to the next.\n\n⚠️ ON THIS MACHINE THIS FIGURE ALONE MISLEADS: Git is IOPS-bound. A sluggish forge can show a low CPU with a high `iowait` and a saturated disk. Read it next to \"Load (1 min)\" and \"Disk saturation\" further down — if the load goes above 1 while this square is green, the bottleneck is the disk, not the compute.\n\nNo alert is built on it, deliberately: a CPU spike on a forge is a clone or a reindexing, not an incident.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "percentunit",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 80,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{instance=~\"$instance\",mode=\"idle\"}[$__rate_interval]))",
              "legendFormat": "{{instance}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "title": "CPU used",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`1 - MemAvailable/MemTotal`. ⚠️ `MemAvailable` AND NOT `MemFree`: the latter ignores the reclaimable cache and would show 90% on a perfectly healthy machine — the classic misreading on Linux.\n\nThe red of this square is aligned on the threshold of the `ExternalNodeMemoryPressure` alert (less than 10% available for 20 min).\n\n⚠️ A brief trip to red after the Forgejo container restarts is EXPECTED: `REPO_INDEXER_ENABLED` reindexes every repository on first start, and that is this machine's memory peak. Lasting, on the other hand, it ends in an OOM-kill — which will show as `ForgejoDown`, without naming the cause.\n\nThe host carries 15 GiB (the \"Minimum hardware\" section of the Forgejo README only asks for 2): this square must stay very low. The detail — total, used, available, cache — is in the \"Memory\" panel.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "percentunit",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 81,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "1 - (node_memory_MemAvailable_bytes{instance=~\"$instance\"} / node_memory_MemTotal_bytes{instance=~\"$instance\"})",
              "legendFormat": "{{instance}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "title": "RAM used",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "A DELIBERATELY SILENT tile: it shows a mount point only when one goes above 80% full. Otherwise it says \"all < 80%\" in green.\n\n⚠️ UNDERSTAND THE MECHANICS BEFORE CHANGING IT: the `> 0.80` is not formatting, it is a vector FILTER. Below the threshold the series does not exist — the tile is in the \"no data\" state, and what shows is the `noValue`. That is also why the first colour step is GREEN: it never colours a value (they are at least 0.80 by construction), it colours the absence.\n\n`topk(1, ...)` rather than `max(...)`: `max` would return a scalar with NO label, hence a percentage one could not attribute to anything. `topk` keeps the mount point, which the tile displays.\n\n⚠️ IT SHOWS ONLY ONE MOUNT AT A TIME. If two disks cross 80% together, the second is hidden. The \"Mounted filesystems\" panel further down shows them all — this one is a warning light, not an inventory.\n\nOrange at 80% is a HEADS-UP with no alert attached; red at 90% is the exact threshold of `ExternalNodeDiskAlmostFull` (severity critical). So a red square announces an alert that will fire within 30 min.\n\n`tmpfs` are dropped at scrape time: `/run/lock` is 5 MiB and would permanently top this ranking.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "percentunit",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              },
              "noValue": "all < 80%"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 82,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "topk(1, (1 - (node_filesystem_avail_bytes{instance=~\"$instance\"} / node_filesystem_size_bytes{instance=~\"$instance\"})) > 0.80)",
              "legendFormat": "{{instance}} · {{mountpoint}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "title": "Disk in alert",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "The hottest sensor of the machine, all of them considered.\n\n⚠️ THE THRESHOLDS ARE CHOSEN, NOT DECLARED BY THE HARDWARE. Verified on 2026-09-11: this machine exposes neither `node_hwmon_temp_crit_celsius` nor `node_hwmon_temp_max_celsius` — the driver publishes no limit. So 70 °C / 85 °C are common-sense values for a desktop AMD, to be adjusted if the machine normally runs hotter.\n\n⚠️ `Tctl` IS A CONTROL VALUE, NOT NECESSARILY THE DIE TEMPERATURE. It is what the `k10temp` driver gives the fan regulator; depending on the AMD model it carries an offset (`Tdie` would be the raw value, absent here). Compare it with a BIOS reading before concluding anything about an overrun.\n\n⚠️ No ALERT is built on it today, deliberately: setting a critical threshold on hardware whose declared limit is unknown would produce either noise or false safety. This tile is a warning light for the eye; the per-sensor detail is in \"Temperatures\".",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "celsius",
              "decimals": 1,
              "noValue": "no sensor",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 83,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance) ((node_hwmon_temp_celsius{instance=~\"$instance\"} * on(instance,chip,sensor) group_left(label) node_hwmon_sensor_label{instance=~\"$instance\"}) or on(instance,chip,sensor) node_hwmon_temp_celsius{instance=~\"$instance\"})",
              "legendFormat": "{{instance}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "title": "Max temperature",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`up` of the `external-node` target. ⚠️ At 0, THIS WHOLE dashboard freezes on the last known value with no visible gap in the curves — and the forge's three backup alerts go blind, they travel through that same target.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds",
                "fixedColor": "text"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "KO",
                      "color": "red",
                      "index": 1
                    },
                    "1": {
                      "text": "OK",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 7
          },
          "id": 84,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "up{job=~\"node-exporter|external-node\",instance=~\"$instance\"}",
              "legendFormat": "{{instance}}",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Scrape",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`node_uname_info` — the kernel's `nodename`, not the `instance` label set by the ScrapeConfig. The two must agree: when they diverge, the `instance` relabeling of `scrapeconfig-vert-emeriss.yaml` no longer describes the machine actually being scraped.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 7
          },
          "id": 85,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "node_uname_info{instance=~\"$instance\"}",
              "legendFormat": "{{nodename}} · {{release}}",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Machine",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`node_time_seconds - node_boot_time_seconds`. An uptime falling back to zero with no intervention is an unplanned reboot: cross-read with the memory panel (OOM) and the host's journal.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 7
          },
          "id": 86,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "node_time_seconds{instance=~\"$instance\"} - node_boot_time_seconds{instance=~\"$instance\"}",
              "legendFormat": "uptime",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Uptime",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`node_textfile_scrape_error`. ⚠️ At 1, node-exporter does not drop the offending file alone: it drops the WHOLE textfile collector — verified on 2026-09-11 on image v1.12.1. The `forgejo_backup_*` metrics then disappear, and `ForgejoBackupNoMetric` starts lying (\"no backup\" instead of \"channel cut\"). Usual causes: a `.prom` in mode 0600 instead of 0644, or a non-atomic write caught mid-scrape.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds",
                "fixedColor": "text"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OK",
                      "color": "green",
                      "index": 0
                    },
                    "1": {
                      "text": "ERROR",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 7
          },
          "id": 87,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "node_textfile_scrape_error{instance=~\"$instance\"}",
              "legendFormat": "error",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Textfile collector",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 11
          },
          "id": 10,
          "panels": [],
          "title": "Load",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "One curve per node. For the per-mode breakdown (iowait, steal, system…), expand \"Diagnostic — CPU & memory\".",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
