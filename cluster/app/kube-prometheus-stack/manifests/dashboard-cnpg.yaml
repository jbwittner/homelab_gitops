            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cnpg_cluster) (label_replace(cnpg_collector_postgres_version{cnpg_io_cluster=~\"$cluster\"}, \"cnpg_cluster\", \"$1\", \"cnpg_io_cluster\", \"(.*)\"))",
              "refId": "D",
              "instant": true,
              "range": false,
