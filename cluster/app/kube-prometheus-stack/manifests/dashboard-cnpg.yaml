# cluster/app/kube-prometheus-stack/manifests/dashboard-cnpg.yaml
# Dashboard Grafana « PostgreSQL — cnpg »
# Chargé automatiquement par le sidecar de kube-prometheus-stack via le label
# grafana_dashboard: "1".
#
# Sources de métriques — TROIS, et elles ne tombent pas ensemble :
#   - collecteur d'instance (9187, PodMonitor `cnpg-instances` de
#     cluster/app/cnpg-monitoring) : cnpg_collector_*, cnpg_pg_* — l'essentiel du dashboard
#   - kube-state-metrics, customResourceState (cluster/app/kube-prometheus-stack/helm-values.yaml) :
#     cnpg_cluster_object_* — l'état des CRs `Cluster`, lisible même quand plus aucun pod ne répond
#   - kube-state-metrics et cadvisor, métriques cœur : santé du Deployment de l'opérateur
#
# ⚠️ L'OPÉRATEUR N'EST PAS SCRAPÉ. `cnpg/helm-values.yaml` n'active pas
# `monitoring.podMonitorEnabled`, et l'activer ne suffirait pas : le PodMonitor rendu par le chart
# ne porte pas le label `release: kube-prometheus-stack` qu'attend le sélecteur de Prometheus
# (même piège que celui documenté dans cnpg-monitoring/manifests/podmonitor.yaml). Les métriques
# `controller_runtime_*` et les temps de réconciliation ne sont donc PAS disponibles ici — la
# rangée « Opérateur » se rabat sur ce que kube-state-metrics et cadvisor savent en dire.
#
# ⚠️ DEUX SOURCES, DEUX NOMS POUR LA MÊME BASE. Le collecteur d'instance étiquette
# `cnpg_io_cluster` (remonté par `podTargetLabels`), kube-state-metrics étiquette `cnpg_cluster`
# (défini par `labelsFromPath`). Les requêtes qui croisent les deux passent par `label_replace` —
# sans lui, la jointure est vide sans erreur.
#
# Ce que ce dashboard ne montre PAS, à dessein :
#   - la sauvegarde et l'archivage WAL — dashboard « Sauvegardes PostgreSQL — barman-cloud »
#   - le remplissage du PVC de la base — dashboard « Ressources — volumes » (la taille logique
#     affichée ici ne descend jamais après une suppression de lignes, elle ne mesure pas le disque)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cnpg
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  cnpg.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "panels": [],
          "title": "État",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Pods d'instance PostgreSQL dont le collecteur répond sur 9187. Ce n'est PAS le nombre d'instances désirées : une instance dont le pod est mort disparaît de cette tuile sans la faire passer au rouge. Le compte attendu se lit sur la tuile « Instances prêtes », servie par kube-state-metrics à partir du Cluster lui-même.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count(cnpg_collector_up{cnpg_io_cluster=~\"$cluster\"} == 1)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Instances scrapées",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "id": 1
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Rapport `status.readyInstances / status.instances` lu sur les CRs `Cluster` par kube-state-metrics. Sous 100 %, une instance est en cours de création, en attente de PVC ou en échec — l'opérateur ne bascule pas le service `-rw` tant qu'aucune n'est prête.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(cnpg_cluster_object_ready_instances{cnpg_cluster=~\"$cluster\"}) / clamp_min(sum(cnpg_cluster_object_instances{cnpg_cluster=~\"$cluster\"}), 1)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Instances prêtes / désirées",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "id": 2
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Temps écoulé depuis le dernier démarrage de PostgreSQL sur l'instance la plus ancienne. Une valeur qui retombe à zéro sans changement de version signale un redémarrage subi (OOM, éviction, `failover`), pas une opération planifiée.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "time() - max(cnpg_pg_postmaster_start_time{cnpg_io_cluster=~\"$cluster\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Ancienneté du postmaster",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "id": 3
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Version majeure.mineure servie par le collecteur (`server_version_num` remis en forme). Elle vient de l'IMAGE du pod : elle ne bouge qu'après un redémarrage de l'instance, pas au moment où le champ `imageName` change dans le Cluster.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
