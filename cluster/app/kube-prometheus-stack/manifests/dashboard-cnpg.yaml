          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "id": 4
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "L'opérateur a besoin d'une bascule décidée à la main pour finir ce qu'il a commencé — typiquement une montée de version en `primaryUpdateStrategy: supervised`. Tant que la tuile est à « Oui », l'instance primaire reste sur l'ancienne image.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "color": "green",
                      "index": 0,
                      "text": "Non"
                    },
                    "1": {
                      "color": "red",
                      "index": 1,
                      "text": "Oui"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
