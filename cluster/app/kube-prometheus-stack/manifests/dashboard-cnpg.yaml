          "description": "Une ligne par CR `Cluster`, servie par kube-state-metrics — donc lisible même quand PLUS AUCUN pod ne répond, contrairement à tout le reste du dashboard. Les deux dernières colonnes viennent au contraire du collecteur d'instance : elles se vident si la base est arrêtée, alors que la phase reste affichée. `label_replace` réaligne `cnpg_io_cluster` (collecteur) sur `cnpg_cluster` (kube-state-metrics) : les deux sources ne nomment pas la base pareil.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
