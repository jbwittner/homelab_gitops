# cluster/app/kube-prometheus-stack/manifests/dashboard-forgejo.yaml
# Dashboard Grafana « Forge — forgejo »
# Chargé automatiquement par le sidecar de kube-prometheus-stack via le label
# grafana_dashboard: "1".
#
# ⚠️ LA FORGE N'EST PLUS DANS CE CLUSTER depuis le 2026-09-11 (composant archivé dans
# `archive/forgejo/`, Forgejo tourne en Docker sur une machine dédiée). DEUX sources, toutes deux
# EXTERNES et posées par `cluster/app/forgejo-monitoring/manifests/` :
#
#   job="forgejo"     https://forgejo-metrics.lan.wittner.tech/metrics   (scrapeconfig.yaml)
#                     -> les `gitea_*` et les `go_*` / `process_*` du binaire
#   job="forgejo-db"  https://forgejo-db-metrics.lan.wittner.tech/metrics (scrapeconfig-db.yaml)
#                     -> les `pg_*` du postgres-exporter, section « Base de données »
#
# ⚠️ ET UNE TROISIÈME, QUI N'APPARTIENT PAS À `forgejo-monitoring` : la section « Sauvegarde » lit
# `forgejo_backup_*` sur le job `external-node`, posé par `cluster/app/hosts-monitoring`. Ces
# séries parlent de la FORGE — fraîcheur et résultat de `forgejo-ctl backup` — mais transitent par
# le collecteur `textfile` du node-exporter de la machine, donc par le scrape de l'autre composant.
# Elles sont ici parce que c'est de la forge qu'elles parlent, pas là où elles arrivent.
# Conséquence à connaître : cette section se vide si le scrape de `hosts-monitoring` tombe, alors
# que les deux autres restent vertes. Les alertes correspondantes (`forgejo-backup.rules`) sont,
# elles, dans `forgejo-monitoring` — même raisonnement.
#
# ⚠️ ÉTAT AU 2026-09-11 : LA SECTION « Sauvegarde » EST VIDE, et c'est attendu. Aucune série
# `forgejo_backup_*` n'existe encore — `forgejo-ctl` porte la fonction `publier_metriques` dans le
# dépôt, mais la copie exécutée sur l'hôte (/usr/local/sbin) n'a pas été redéployée. Il faut
# `sudo forgejo-ctl deploy` PUIS une première sauvegarde. Le canal, lui, est sain : vérifié le
# jour même, `node_textfile_scrape_error{job="external-node"}` vaut 0.
#
# ⚠️ CE VIDE EST LUI-MÊME LE SIGNAL, il ne se contourne pas en masquant les panneaux : c'est
# exactement ce sur quoi `ForgejoBackupNoMetric` alerte, et la raison pour laquelle
# `publier_metriques` OMET la série de succès au lieu de l'écrire à zéro — un zéro se lirait comme
# une sauvegarde du 1er janvier 1970, donc comme périmée, ce qui masquerait que le timer ne s'est
# JAMAIS déclenché. Les tuiles affichent « jamais » plutôt que « No data » pour cette raison.
#
# ⚠️ LES DEUX JOBS NE SE COMPORTENT PAS PAREIL, et c'est le piège de lecture de ce dashboard : les
# `gitea_*` sont des JAUGES recomptées à chaque scrape (voir plus bas), les `pg_stat_database_*`
# sont de vrais COMPTEURS CUMULÉS. `rate()` est absurde sur les premières et OBLIGATOIRE sur les
# secondes. Un panneau recopié d'une section à l'autre sans y penser affiche un chiffre faux, pas
# une erreur.
#
# Ce qui a disparu avec la bascule, et qu'il ne faut pas chercher à remettre ici : le remplissage
# du PVC `forgejo-data` (kubelet) et le compteur de redémarrages du conteneur (kube-state-metrics).
# Les deux décrivaient des objets Kubernetes qui n'existent plus ; leurs panneaux ont été retirés.
# La surveillance du disque et du service de la machine Docker se fait CHEZ ELLE, pas ici.
#
# ⚠️ LE JOB EST `forgejo`, posé par un relabeling de la ScrapeConfig (sans lui, une ScrapeConfig
# nomme son job `scrapeConfig/monitoring/forgejo-metrics`). C'est le seul couplage entre ce fichier
# et elle : le renommer d'un côté vide TOUS les panneaux de l'autre, sans erreur.
#
# ⚠️ LE PRÉFIXE DES MÉTRIQUES EST `gitea_`, PAS `forgejo_`. Le collecteur amont déclare
# `const namespace = "gitea_"` (modules/metrics/collector.go) et Forgejo ne l'a jamais renommé.
# Une requête `forgejo_repositories` renvoie une série vide sans le dire.
#
# ⚠️ TOUTES les métriques `gitea_*` sont des JAUGES recomptées à chaque scrape par un
# `SELECT count(*)` sur la base — jamais des compteurs cumulés. Deux conséquences :
#   - `rate()` et `increase()` n'ont aucun sens sur elles ; une courbe qui descend est une
#     suppression réelle ;
#   - chaque scrape coûte une trentaine de `count(*)` à PostgreSQL. C'est la raison du
#     `scrapeInterval: 60s` de la ScrapeConfig, et le premier levier si la base souffre.
#
# ⚠️ Le scrape est AUTHENTIFIÉ (`[metrics] TOKEN` de l'app.ini de la machine Docker, recopié dans
# le Secret `forgejo-metrics` du ns `monitoring`). Si les deux valeurs divergent, la cible passe en
# 401 : le panneau « Scrape » vire au rouge et TOUTES les jauges se figent sur leur dernière
# valeur, sans trou visible dans les courbes.
#
# Ce que ce dashboard ne montre PAS, à dessein :
#   - les PULL REQUESTS À PART. ⚠️ Elles ne sont pas absentes : dans Forgejo une PR EST une ligne
#     de la table `issue` (`is_pull = true`), et le collecteur compte cette table SANS filtrer
#     (`models/activities/statistic.go` : `Table("issue").GroupBy("is_closed")`). Les séries
#     `gitea_issues*` additionnent donc issues ET PR, y compris `issues_by_repository`, et une PR
#     fusionnée compte comme FERMÉE. Aucune requête ne peut les séparer — la distinction n'existe
#     qu'en base. C'est la raison des libellés « + PR » dans les panneaux.
#   - le trafic HTTP (requêtes, codes de retour, latence). Le collecteur n'expose que des
#     comptages d'objets ; il n'y a ni histogramme de requêtes ni compteur de clones.
#   - la MACHINE qui héberge la forge : disque, mémoire, charge, réseau. ⚠️ Ce n'est plus « le
#     cluster n'en voit rien » — depuis le 2026-09-11 il le voit, par le composant
#     `cluster/app/hosts-monitoring` — mais ça ne vit PAS ici : c'est le dashboard
#     « Machines — system » (`dashboard-machines.yaml`). Le critère est le cycle de vie :
#     une machine précède le service qu'elle héberge et lui survit, et ce dashboard-ci disparaîtra
#     avec la forge alors que l'autre restera valable tel quel.
#     ⚠️ C'est aussi là, et pas ici, que vivent les métriques de SAUVEGARDE de la forge
#     (`forgejo_backup_*`) : elles transitent par le collecteur textfile de node-exporter, donc par
#     l'autre scrape. Les ALERTES qui s'en servent sont, elles, dans `forgejo-monitoring`.
#     Les deux dashboards portent le même `instance` (`vert-emeriss`) — c'est ce qui permet de
#     rapprocher un incident de base d'un incident de disque.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-forgejo
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
