          "description": "⚠️ Ces séries arrivent par le scrape de `hosts-monitoring` (job `external-node`) : `forgejo-ctl backup` les dépose dans le collecteur `textfile` de node-exporter.\n\nLa taille des artefacts dans le temps. Chaque MARCHE est une sauvegarde : la valeur ne change qu'au moment où `publier_metriques` réécrit le fichier `.prom`, et reste plate entre deux.\n\n⚠️ C'est la taille À CHAUD, non compressée — restic compresse et déduplique ensuite, donc la croissance du bucket est bien plus lente que celle de ces courbes.\n\nCe qu'on y lit : l'archive des données suit le volume des dépôts Git, le dump de la base suit les métadonnées (issues, comptes). Une marche brutale sur l'une sans l'autre désigne laquelle des deux a grossi.\n\n⚠️ « Occupation locale » n'est PAS la somme des deux : elle compte les `KEEP_LOCAL=2` jeux conservés sur le disque, donc environ le double d'un jeu — et elle retombe à chaque passage d'`elaguer_local`.",
