# ─────────────────────────────────────────────────────────────────────────────────────────────
# MODÈLE d'environnement d'exécution jetable — un Job = une tâche = un pod, détruit après usage.
#
# CE FICHIER N'EST PAS APPLIQUÉ PAR ARGOCD. Il vit hors de `manifests/` exprès : un Job ici
# serait recréé en boucle par `selfHeal` chaque fois que son TTL le supprime.
#
# Paramètres à substituer (envsubst) :
#   TASK_ID    identifiant de tâche — doit être un nom DNS-1123 valide (a-z0-9 et '-')
#   TASK_IMAGE image de l'exécuteur (cf. README §Points d'extension — image)
#   TASK_TTL   secondes de rétention APRÈS fin, avant suppression automatique
#   TASK_DEADLINE  secondes de durée de vie maximale, fin ou pas
#
# Substitution (envsubst n'est PAS installe sur ce poste, gettext absent — sed suffit) :
#
#   sed -e 's|${TASK_ID}|ma-tache|g' -e 's|${TASK_IMAGE}|busybox:1.37.0|g' \
#       -e 's|${TASK_TTL}|600|g'     -e 's|${TASK_DEADLINE}|1800|g' \
#       task-job.yaml | kubectl create -f -
# ─────────────────────────────────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-task-${TASK_ID}
  namespace: hermes-exec
  labels:
    app.kubernetes.io/name: hermes-exec
    # ⚠️ CONTRAT AVEC LES POLICIES. `hermes.wittner.tech/role: task-runner` est le sélecteur des
    # deux CiliumNetworkPolicy (manifests/netpol-*.yaml). Un pod qui ne porte pas ce label
    # EXACTEMENT n'est sélectionné par aucune policy — et comme Cilium est en enforcement
    # `default`, il se retrouve avec une sortie internet COMPLÈTE au lieu d'un défaut-refus.
    # Une faute de frappe ici ne produit aucune erreur : elle ouvre le réseau en silence.
    hermes.wittner.tech/role: task-runner
    hermes.wittner.tech/task: "${TASK_ID}"
spec:
  # Nettoyage automatique : le Job et son pod sont supprimés TASK_TTL secondes après la fin,
  # succès comme échec. C'est le mécanisme demandé — aucun contrôleur à déployer, le
  # TTL-after-finished est intégré au kube-controller-manager depuis longtemps.
  # Mettre une valeur assez haute pour pouvoir lire les logs après coup.
  ttlSecondsAfterFinished: ${TASK_TTL}
  # Mur dur : au-delà, le pod est tué même s'il tourne encore. Sans lui, une tâche qui boucle
  # n'atteint jamais l'état « terminé », donc le TTL ne se déclenche jamais.
  activeDeadlineSeconds: ${TASK_DEADLINE}
  # Un environnement jetable ne se relance pas : un échec est un résultat, pas un incident à
  # réessayer. Un retry produirait un second pod pour la même tâche, avec le même id.
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-exec
        hermes.wittner.tech/role: task-runner
        hermes.wittner.tech/task: "${TASK_ID}"
    spec:
      restartPolicy: Never
      # SA sans le moindre droit (cf. manifests/serviceaccount.yaml). Aucun RoleBinding
      # n'existe, et il ne doit pas en être créé.
      serviceAccountName: hermes-exec-runner
      # Le token n'est même pas monté. Sans ça, du code décidé par un LLM a un chemin vers
      # l'API kube dans son système de fichiers.
      automountServiceAccountToken: false
      # Pas de résolution des Services du namespace dans /etc/hosts, pas de variables d'env
      # `*_SERVICE_HOST` : rien à découvrir depuis l'intérieur.
      enableServiceLinks: false
      # TODO — RUNTIME D'ISOLATION RENFORCÉE. NON CÂBLÉ, ET CE N'EST PAS CONTOURNÉ.
      # La phase 1 n'a trouvé AUCUNE RuntimeClass sur ce cluster (`kubectl get runtimeclass` →
      # vide) : ni gVisor/runsc, ni Kata. L'isolation ici est celle d'un conteneur ordinaire
      # durci — noyau partagé avec les autres pods du nœud.
      # Le câbler demande deux choses hors du périmètre de ce composant :
      #   1. une extension système Talos + un `runtimes.` containerd sur les 3 nœuds (machine
      #      config Talos) ;
      #   2. un objet RuntimeClass, qui est CLUSTER-SCOPED.
      # Une fois les deux en place, décommenter :
      # runtimeClassName: gvisor
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Propriétaire de groupe du volume de travail : sans lui, l'emptyDir appartient à
        # root:root et l'uid 65532 ne peut pas y écrire selon l'image.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: task
          image: ${TASK_IMAGE}
          # POINT D'EXTENSION — la commande de la tâche. Remplacer par ce que l'orchestrateur
          # doit faire exécuter.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "task ${TASK_ID} start"
              # ... travail de la tâche, dans /work ...
              echo "task ${TASK_ID} done"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            # Racine en LECTURE SEULE. Tout ce qui doit être écrit va dans /work, qui meurt avec
            # le pod. C'est ce qui rend l'environnement réellement jetable : rien de ce que la
            # tâche installe ou modifie ne persiste, même le temps du pod, hors du volume prévu.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Explicites, comme demandé — le LimitRange du namespace n'est qu'un filet.
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - { name: work, mountPath: /work }
            # /tmp séparé : beaucoup d'outils y écrivent sans qu'on le demande, et la racine est
            # en lecture seule. Sans ce montage, l'échec se manifeste en « Read-only file
            # system » sur un chemin qui n'a rien à voir avec la tâche.
            - { name: tmp, mountPath: /tmp }
          # POINT D'EXTENSION — SECRETS ET ACCÈS. RIEN N'EST CÂBLÉ ICI, VOLONTAIREMENT.
          # Ni `env`, ni `envFrom`, ni volume de type `secret`. Pas de clé SSH, pas de token Git,
          # pas d'identifiants Artifactory. Ces accès et les identités qui les portent seront
          # posés à la main après revue (cf. README §Points d'extension).
          # Le canal du dépôt est sealed-secrets (cf. ../../../infra/sealed-secrets/README.md) ;
          # un Secret pour ce namespace devra y être scellé pour le couple (nom, hermes-exec).
      volumes:
        # Volume de travail éphémère : détruit avec le pod. `sizeLimit` est appliqué par le
        # kubelet, qui évince le pod au dépassement — sans lui, un emptyDir peut remplir le
        # disque du nœud.
        - name: work
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
