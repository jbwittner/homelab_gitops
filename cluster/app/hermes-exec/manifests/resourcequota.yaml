# Plafond du namespace entier. La phase 1 n'a trouvé AUCUN ResourceQuota ni LimitRange sur ce
# cluster : sans ce fichier, un orchestrateur qui boucle sur la création de tâches peut consommer
# les 3 nœuds. Le quota est le seul frein qui ne dépend pas du bon comportement de l'agent.
#
# DIMENSIONNEMENT — calé sur le POC : **5 tâches concurrentes**, pas sur la capacité du cluster.
# Un quota large ne protège de rien ; celui-ci doit gêner avant que le cluster ne souffre.
# Les valeurs se lisent contre limitrange.yaml, qui fixe le coût d'UNE tâche :
#
# Le dimensionnement se lit contre DEUX choses : limitrange.yaml (plafond d'un conteneur) et les
# `resources` de ../templates/task-job.yaml (coût d'une tâche STANDARD).
#
# N = 2 tâches concurrentes.
#
#   source                        × 2 tâches      quota ici
#   task-job.yaml  limits  1 / 1Gi / 2Gi          2 / 2Gi / 4Gi    2 / 2Gi / 4Gi   ← exact
#   task-job.yaml  requests 100m / 256Mi / 256Mi  200m / 512Mi     1 / 1Gi / 2Gi   ← marge
#   LimitRange     max     1 / 1Gi / 2Gi          2 / 2Gi / 4Gi    2 / 2Gi / 4Gi   ← exact
#
# Les dimensions par POD valent EXACTEMENT N × le coût d'une tâche standard, et le `max` du
# LimitRange vaut exactement ce coût. Conséquence voulue : aucune tâche ne peut être plus grosse
# que la standard, donc N tâches tiennent toujours, et la seule voie de saturation est
# `count/jobs.batch`.
#
# C'est ce qui rend le refus LISIBLE. Les deux voies de refus du quota ne se valent pas :
#   - `count/jobs.batch` épuisé      → la création du JOB est refusée, `exceeded quota` rendu
#                                      à l'appelant. Voie lisible.
#   - une dimension par POD épuisée  → le Job se crée, son pod est refusé en boucle. Le Job
#                                      reste `Running 0/1` sans aucun pod et le motif n'existe
#                                      que dans les events. `backoffLimit: 0` ne l'arrête pas
#                                      (il compte les pods en échec, pas les créations
#                                      refusées) ; seul `activeDeadlineSeconds` y met fin.
#                                      Voie muette — observée avant correction.
#
# POUR SCALER : multiplier les six dimensions par le nouveau N, et `pods` = `count/jobs.batch`
# = N. Pour autoriser des tâches PLUS GROSSES, il faut en plus relever le `max` du LimitRange
# ET les `resources` du template — mais alors la garantie ci-dessus tombe et la voie muette
# redevient atteignable.
#
# Revoir CES TROIS FICHIERS ENSEMBLE : quota, LimitRange, resources du template.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hermes-exec-quota
  namespace: hermes-exec
  labels:
    app.kubernetes.io/name: hermes-exec
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    requests.ephemeral-storage: 2Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    limits.ephemeral-storage: 4Gi
    # Borne le parallélisme. Un dépassement fait échouer la CRÉATION du Job avec un message
    # explicite ("exceeded quota"), pas un pod qui se fait évincer plus tard sans raison lisible.
    pods: "2"
    count/jobs.batch: "2"
    # ZÉRO stockage persistant : « jetable » veut dire que rien ne survit au pod. Un PVC dans ce
    # namespace serait un canal de persistance entre deux tâches, donc entre deux contextes
    # d'exécution qui ne doivent rien partager. Le volume de travail est un emptyDir.
    persistentvolumeclaims: "0"
    # Rien n'est joignable ici (l'ingress est en défaut-refus de toute façon) : interdire les
    # Services évite qu'on rende un exécuteur adressable par erreur.
    services: "0"
