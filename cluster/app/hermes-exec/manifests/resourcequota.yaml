# Plafond du namespace entier. La phase 1 n'a trouvé AUCUN ResourceQuota ni LimitRange sur ce
# cluster : sans ce fichier, un orchestrateur qui boucle sur la création de tâches peut consommer
# les 3 nœuds. Le quota est le seul frein qui ne dépend pas du bon comportement de l'agent.
#
# DIMENSIONNEMENT — calé sur le POC : **5 tâches concurrentes**, pas sur la capacité du cluster.
# Un quota large ne protège de rien ; celui-ci doit gêner avant que le cluster ne souffre.
# Les valeurs se lisent contre limitrange.yaml, qui fixe le coût d'UNE tâche :
#
# Le dimensionnement se lit contre DEUX choses : limitrange.yaml (coût plancher/plafond d'un
# conteneur) et les `resources` de ../templates/task-job.yaml (coût d'une tâche STANDARD).
#
#   source                       × 5 tâches     quota ici
#   task-job.yaml  limits  1 / 1Gi / 2Gi        5 / 5Gi / 10Gi   5 / 6Gi / 12Gi   ← tient juste
#   task-job.yaml  requests 100m/256Mi/256Mi    500m/1.25Gi      2 / 3Gi          ← marge
#   LimitRange     max     2 / 2Gi / 4Gi        10 / 10Gi        5 / 6Gi          ← le quota borne
#
# `limits.cpu: 5` et pas 4 : à 4, la 5ᵉ tâche STANDARD passait la création du Job puis voyait
# son pod refusé indéfiniment. Symptôme observé : Job `Running 0/1` sans aucun pod, boucle de
# `FailedCreate` visible NULLE PART ailleurs que dans les events, jusqu'à ce que
# `activeDeadlineSeconds` le tue. `backoffLimit: 0` ne l'arrête pas — il compte les pods en
# échec, pas les créations refusées.
#
# D'où la règle de dimensionnement : les dimensions par POD (cpu/mémoire/stockage/pods) doivent
# permettre exactement autant de tâches standard que `count/jobs.batch`. Sinon la saturation se
# manifeste par la voie muette (event sur le Job) au lieu de la voie lisible (refus à la
# création du Job, message `exceeded quota` rendu à l'appelant).
#
# Revoir CES TROIS FICHIERS ENSEMBLE : quota, LimitRange, et les resources du template.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hermes-exec-quota
  namespace: hermes-exec
  labels:
    app.kubernetes.io/name: hermes-exec
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    requests.ephemeral-storage: 4Gi
    limits.cpu: "5"
    limits.memory: 6Gi
    limits.ephemeral-storage: 12Gi
    # Borne le parallélisme. Un dépassement fait échouer la CRÉATION du Job avec un message
    # explicite ("exceeded quota"), pas un pod qui se fait évincer plus tard sans raison lisible.
    pods: "5"
    count/jobs.batch: "5"
    # ZÉRO stockage persistant : « jetable » veut dire que rien ne survit au pod. Un PVC dans ce
    # namespace serait un canal de persistance entre deux tâches, donc entre deux contextes
    # d'exécution qui ne doivent rien partager. Le volume de travail est un emptyDir.
    persistentvolumeclaims: "0"
    # Rien n'est joignable ici (l'ingress est en défaut-refus de toute façon) : interdire les
    # Services évite qu'on rende un exécuteur adressable par erreur.
    services: "0"
