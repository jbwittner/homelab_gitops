# ServiceAccount des exécuteurs jetables. VOLONTAIREMENT SANS AUCUN DROIT.
#
# ⚠️ Il n'existe et ne doit exister NI Role, NI RoleBinding, NI ClusterRoleBinding qui le
# référence. Ce n'est pas un oubli à combler : le code exécuté dans ces pods est décidé par un
# LLM. Lui donner le moindre verbe sur l'API kube revient à donner ce verbe à une injection de
# prompt.
#
# Deuxième couche : `automountServiceAccountToken: false`. Posé ICI (sur le SA) *et* sur chaque
# pod de tâche. Les deux, parce qu'ils ne couvrent pas le même oubli :
#   - sur le SA        → protège un pod dont le manifeste aurait omis la ligne ;
#   - sur le pod       → protège du cas où quelqu'un remettrait `true` ici.
# Un `true` explicite côté pod l'emporte sur le `false` du SA. C'est le seul chemin qui remet un
# token dans le conteneur — il ne doit jamais être pris.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-exec-runner
  namespace: hermes-exec
  labels:
    app.kubernetes.io/name: hermes-exec
automountServiceAccountToken: false
---
# Le SA `default` est créé par le control-plane dans tout namespace, et un pod qui ne déclare
# aucun `serviceAccountName` le reçoit. On le neutralise de la même façon : sans ça, un Job de
# tâche mal écrit (oubli du `serviceAccountName`) monterait un token — celui du SA `default`,
# certes sans droits par défaut, mais suffisant pour interroger l'API et énumérer.
#
# ArgoCD adopte l'objet existant (ServerSideApply=true côté app.bootstrap.yaml) : il ne le
# recrée pas, il lui ajoute ce champ.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: hermes-exec
automountServiceAccountToken: false
