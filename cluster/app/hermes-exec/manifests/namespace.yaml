# Namespace dédié aux environnements d'exécution jetables d'Hermes.
#
# SÉPARÉ de `hermes` pour une raison précise : le namespace `hermes` ne peut PAS porter de label
# PodSecurity restrictif (l'image amont démarre en root pour laisser s6-overlay chown /opt/data,
# cf. ../../hermes/manifests/namespace.yaml). Les exécuteurs, eux, n'ont aucune contrainte de ce
# genre — ils peuvent donc vivre sous `restricted`, où l'admission REFUSE un pod privilégié au
# lieu de compter sur le fait que le manifeste soit bien écrit.
#
# C'est la seule ressource cluster-scoped de ce composant. Validée explicitement.
apiVersion: v1
kind: Namespace
metadata:
  name: hermes-exec
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    # `restricted` = le niveau le plus strict du Pod Security Standard. Un Job de tâche qui
    # oublierait `runAsNonRoot`, `allowPrivilegeEscalation: false`, le drop de capabilities ou
    # le seccompProfile est REJETÉ à la création, pas silencieusement accepté.
    #
    # ⚠️ C'est le seul garde-fou de ce composant qui ne dépend pas du contenu du manifeste de
    # tâche. Le retirer transforme chaque oubli d'écriture en trou d'isolation muet.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
