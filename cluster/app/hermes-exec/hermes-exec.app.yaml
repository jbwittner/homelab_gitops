# Livré DÉSACTIVÉ : le glob de ../app.bootstrap.yaml n'accepte que `*.app.yaml` / `*.appset.yaml`.
# Tant que ce fichier porte le suffixe `.noapp.yaml`, ArgoCD ne le voit pas et rien n'est déployé.
# Activation : cf. README §Activation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-exec
  namespace: argocd
  labels:
    app.kubernetes.io/name: hermes-exec
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: agent
  # NE PAS RETIRER — convention documentée dans ../app.bootstrap.yaml. Sans lui, renommer ce
  # fichier en `.noapp.yaml` supprime l'objet Application et LAISSE le namespace, les policies et
  # le quota dans le cluster, vivants et plus réconciliés par personne.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jbwittner/homelab_gitops.git
    targetRevision: main
    # `manifests/` seulement. `templates/` est délibérément hors du chemin : ce sont des objets
    # éphémères créés à la demande, pas de l'état désiré. Cf. manifests/kustomization.yaml.
    path: cluster/app/hermes-exec/manifests
  destination:
    name: bleu-kalecgos
    namespace: hermes-exec
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
