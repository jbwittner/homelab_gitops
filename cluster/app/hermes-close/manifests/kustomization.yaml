apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes-close
resources:
  - namespace.yaml
  # Produit par kubeseal, POUR CE NAMESPACE (cf. README §Câblage des secrets). Le StatefulSet ne
  # démarre pas sans : `envFrom` sur un Secret absent bloque le pod en
  # CreateContainerConfigError.
  - hermes-env.sealed.yaml
  - statefulset.yaml
  - service.yaml
  - hermes-httproute.yaml
  # LA différence avec [hermes](../../hermes/README.md), qui est la copie conforme SANS policy.
  # Les deux seules sorties de cette instance sont le fournisseur LLM et Discord.
  # La retirer, ou y ajouter des destinations « juste pour dépanner », supprime le témoin de
  # l'expérience — les deux instances deviennent la même.
  - hermes-egress.ciliumnetworkpolicy.yaml

# `config.yaml` d'Hermes. Canal de configuration NON secrète — les clés d'API passent par le
# Secret `hermes-env`, jamais ici.
#
# Généré plutôt qu'écrit à la main pour le suffixe de hash : kustomize nomme le ConfigMap
# `hermes-config-<hash du contenu>` et réécrit la référence dans le `volumes:` du StatefulSet.
# Éditer `config/config.yaml` change donc le pod template, ce qui suffit à déclencher le rollout
# — indispensable ici, parce que l'initContainer ne recopie le fichier dans le volume qu'au
# démarrage du pod. Sans ce mécanisme, un ConfigMap mis à jour resterait sans effet jusqu'à un
# `rollout restart` manuel, et rien ne le signalerait (ArgoCD `Synced`, aucun log).
configMapGenerator:
  - name: hermes-config
    files:
      - config/config.yaml
      # Identité de l'agent, chargée par Hermes UNIQUEMENT depuis `$HERMES_HOME/SOUL.md`
      # (= `/opt/data/SOUL.md` ici) et injectée verbatim en tête du system prompt. C'est ce qui
      # apprend à l'agent qu'il est dans un réseau fermé — sans elle, il découvre la contrainte
      # en enchaînant des timeouts qu'il interprète comme des pannes passagères, et réessaie.
      #
      # ⚠️ Le contenu passe par le scanner d'injection de prompt d'Hermes avant chargement. Il
      # bloque le fichier ENTIER sur des motifs comme « ignore previous instructions », « do not
      # tell the user », `cat .env` ou `curl ... $API_KEY` — y compris cités en exemple. Un
      # fichier bloqué ne produit qu'une ligne `[BLOCKED: ...]` : l'agent démarre sans identité
      # et rien d'autre ne le signale. Rester sur du descriptif.
      #
      # ⚠️ Ce fichier n'existe PAS côté `hermes` : c'est une SECONDE différence entre les deux
      # arbres, en plus de la policy réseau. Cf. README §Ce que SOUL.md change à l'expérience.
      - config/SOUL.md
      # Semé en /opt/data/home/.profile. Rétablit /opt/hermes/bin dans le PATH des shells de
      # login de l'outil terminal, que /etc/profile écrase. Le fichier documente le détail.
      # Doit rester IDENTIQUE à celui de hermes : c'est un correctif d'environnement, pas une
      # variable de l'expérience.
      - config/profile
      # `hermes-env.sealed.yaml` n'est PAS de la configuration : il est là uniquement pour que
      # la révision du secret entre dans le hash. Le Secret est produit par le contrôleur
      # sealed-secrets, pas par kustomize — son contenu ne peut donc pas influencer le pod
      # template, et un `envFrom` dont le Secret change ne redémarre rien. Resceller change ce
      # fichier (kubeseal régénère un nonce à chaque passe, même à valeurs égales), donc le
      # hash, donc le nom du ConfigMap, donc le pod template : le rollout part avec le nouveau
      # secret.
      #
      # ⚠️ À décommenter EN MÊME TEMPS que la ligne `resources:` ci-dessus — le
      # configMapGenerator échoue sur un fichier absent, ce qui casse le rendu entier.
      # - hermes-env.sealed.yaml

  # Variables d'environnement NON secrètes du conteneur, injectées par `envFrom` (cf.
  # statefulset.yaml). `envs:` et non `files:` : kustomize parse le KEY=VALUE et produit une clé
  # de ConfigMap par variable, ce que `envFrom` sait exporter.
  #
  # ConfigMap SÉPARÉ de `hermes-config`, et pas une entrée de plus dans celui-ci : `hermes-config`
  # est monté comme volume et ses clés sont des noms de FICHIERS (`config.yaml`, `profile`). Un
  # `envFrom` dessus tenterait d'en faire des noms de variables — un point est interdit, le kubelet
  # les rejette avec un event et sans autre signal.
  #
  # Même bénéfice de hash que `hermes-config` : éditer `config/hermes.env` renomme le ConfigMap,
  # kustomize réécrit le `configMapRef` du StatefulSet, le rollout part. Pas de `rollout restart`
  # manuel.
  - name: hermes-vars
    envs:
      - config/hermes.env
