# Egress par défaut-refus pour le pod Hermes. C'est le garde-fou qui manquait au triptyque
# `automountServiceAccountToken: false` / pas de RBAC : l'agent exécute du code décidé par un
# LLM dans ce pod, cette policy borne ce que ce code peut joindre.
#
# ⚠️ CE FICHIER EST LA VARIABLE DE L'EXPÉRIENCE. `hermes-close` et [hermes](../../hermes/) sont
# deux copies conformes de la même instance ; ce fichier n'existe que d'un seul côté. Y ajouter
# une destination revient à déplacer la frontière qu'on mesure — le faire pour dépanner, puis
# oublier de revenir en arrière, rend les deux instances indiscernables sans que rien ne le
# signale.
#
# ⚠️ Poser une `CiliumNetworkPolicy` qui ne déclare QUE `egress` bascule l'endpoint en
# défaut-refus **sur la seule direction sortante**. L'ingress reste non appliqué, donc le
# `shared-gw` continue de joindre 8642/9119 sans règle supplémentaire. Ajouter un bloc
# `ingress:` ici, même permissif, changerait ce comportement et couperait le Gateway.
#
# Les règles `toFQDNs` dépendent du proxy DNS L7 de Cilium : un nom n'est joignable que s'il a
# d'abord été résolu via une requête DNS elle-même autorisée par la règle `rules.dns` ci-dessous.
# Les deux listes doivent donc rester alignées — un `toFQDNs` sans `matchName` DNS correspondant
# ne matche jamais rien. Le proxy L7 est actif parce que `gatewayAPI.enabled: true` dans les
# values Cilium l'impose (cf. cluster/infra/cilium/helm-values.yaml).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-egress
  namespace: hermes-close
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  egress:
    # 1. Résolution DNS — CoreDNS uniquement, et seulement pour les noms explicitement listés.
    #    Tout autre nom échoue à la résolution : c'est le premier filet, avant même le filtre IP.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchName: "chatgpt.com"
              - matchName: "auth.openai.com"
              # Discord : REST sur discord.com, WebSocket temps réel sur gateway.discord.gg,
              # pièces jointes sur les deux CDN. Les quatre sont nécessaires — sans le CDN, le
              # bot répond mais toute image reçue échoue au téléchargement.
              - matchName: "discord.com"
              - matchName: "gateway.discord.gg"
              - matchName: "cdn.discordapp.com"
              - matchName: "media.discordapp.net"

    # 2. Fournisseur LLM. Deux hosts, relevés dans `hermes_cli/auth.py` :
    #      chatgpt.com      inférence  (DEFAULT_CODEX_BASE_URL = https://chatgpt.com/backend-api/codex)
    #      auth.openai.com  OAuth      (CODEX_OAUTH_TOKEN_URL, rafraîchissement du jeton)
    #    Oublier le second ne casse rien au démarrage : l'agent tourne jusqu'à l'expiration du
    #    jeton, puis échoue sans que le réseau soit suspecté. `api.openai.com` n'est PAS utilisé
    #    par ce provider — il ne servirait qu'à un repli sur `openai-api`, qui exigerait une clé
    #    d'API et une bascule dans config.yaml.
    #    Changer de fournisseur impose d'ajouter le nom ICI **et** dans la liste DNS ci-dessus.
    - toFQDNs:
        - matchName: "chatgpt.com"
        - matchName: "auth.openai.com"
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }

    # 3. Passerelle messagerie : Discord. Ouvert même tant que `DISCORD_BOT_TOKEN` reste
    #    commenté — une FQDN autorisée que personne ne contacte ne coûte rien, alors qu'un
    #    oubli ici se manifeste par des timeouts sans rapport apparent avec le réseau.
    - toFQDNs:
        - matchName: "discord.com"
        - matchName: "gateway.discord.gg"
        - matchName: "cdn.discordapp.com"
        - matchName: "media.discordapp.net"
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }

  # Volontairement ABSENT du minimum : GitHub, PyPI, npm, registry.docker.io. L'image interdit
  # les installs paresseux à l'exécution (`/opt/hermes` est en lecture seule pour l'uid 10000) et
  # les pulls d'image sont faits par le kubelet, pas par ce pod — aucun des deux ne passe par
  # cette policy. Les skills qui téléchargent quelque chose, la mise à jour d'Hermes depuis le
  # pod, et le MCP distant échoueront tant que leur host n'est pas ajouté explicitement.
