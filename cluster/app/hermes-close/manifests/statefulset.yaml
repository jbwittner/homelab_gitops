# `StatefulSet` et pas `Deployment` : tout l'état d'Hermes (sessions, mémoires, skills, cron,
# .env semé) vit dans un unique volume `/opt/data` en RWO. Un seul replica, et la garantie
# d'ordre du StatefulSet évite deux pods qui montent le même PVC pendant un rollout.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: hermes-close
  labels:
    app.kubernetes.io/name: hermes
spec:
  serviceName: hermes
  replicas: 1
  # Le PVC est RWO : le pod sortant doit être terminé avant que le nouveau monte le volume.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      # L'agent exécute du code arbitraire décidé par un LLM, dans CE pod. Aucun token de
      # ServiceAccount ne doit traîner dans son système de fichiers : sans ça, une injection de
      # prompt donne un accès à l'API kube avec les droits du SA.
      automountServiceAccountToken: false
      # PAS de `runAsNonRoot: true` ni de `runAsUser` : l'entrypoint s6-overlay doit démarrer en
      # root pour chown le volume, puis descend lui-même sur l'uid 10000. Cf. namespace.yaml.
      securityContext:
        fsGroup: 10000
      initContainers:
        # Pose le config.yaml et le SOUL.md de Git dans le volume avant que l'entrypoint ne sème
        # les siens. Recopiés à CHAQUE démarrage, sans condition : Git reste la source de vérité
        # et toute dérive introduite dans le pod est écrasée. Le ConfigMap est généré avec un
        # suffixe de hash (cf. kustomization.yaml), donc éditer un de ces fichiers renomme le
        # volume et déclenche le rollout — sans quoi la recopie n'aurait lieu à aucun moment.
        #
        # `/opt/data` est le HERMES_HOME de cette image, et `SOUL.md` n'est chargé QUE depuis là
        # — Hermes ne le cherche jamais dans le répertoire de travail. C'est ce qui en fait le
        # seul emplacement fiable ici : le cwd de l'agent n'est pas fixé par ce manifeste.
        #
        # Hermes sème un SOUL.md par défaut si le fichier est ABSENT, et ne réécrit jamais un
        # fichier existant. Le poser ici avant le démarrage suffit donc à gagner ; l'écrasement
        # inconditionnel est ce qui garantit qu'un `SOUL.md` modifié depuis le dashboard ne
        # survit pas au redémarrage suivant.
        - name: seed-config
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              set -eu
              install -o 10000 -g 10000 -m 0600 /config/config.yaml /opt/data/config.yaml
              install -o 10000 -g 10000 -m 0600 /config/SOUL.md /opt/data/SOUL.md
              # HOME des sous-processus lancés par l'outil terminal. Créé seulement s'il manque :
              # le répertoire existant porte un bit setgid qu'un `install -d` inconditionnel
              # effacerait.
              [ -d /opt/data/home ] || install -d -o 10000 -g 10000 -m 0755 /opt/data/home
              # Rétablit /opt/hermes/bin dans le PATH des shells de login — cf. config/profile,
              # qui documente pourquoi /etc/profile l'en retire.
              install -o 10000 -g 10000 -m 0644 /config/profile /opt/data/home/.profile
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: config, mountPath: /config, readOnly: true }
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.8.27
          # PAS de `command:` — l'ENTRYPOINT de l'image est le dispatcher qui lance s6-overlay.
          # L'écraser fait sauter la supervision (dashboard, redémarrage auto de la gateway) et
          # le drop de privilèges. Seuls les arguments changent.
          args: ["gateway", "run"]
          env:
            # --- API OpenAI-compatible ---
            - { name: API_SERVER_ENABLED, value: "true" }
            # Sans 0.0.0.0 le serveur reste sur la loopback du conteneur et le Service ne joint
            # rien. La clé (API_SERVER_KEY, dans hermes-env) est ce qui le protège.
            - { name: API_SERVER_HOST, value: "0.0.0.0" }
            - { name: API_SERVER_CORS_ORIGINS, value: "https://hermes-close.lan.wittner.tech" }
            # --- Dashboard ---
            - { name: HERMES_DASHBOARD, value: "1" }
            - { name: HERMES_DASHBOARD_HOST, value: "0.0.0.0" }
            - { name: HERMES_DASHBOARD_PORT, value: "9119" }
            # --- Discord ---
            # IDs Discord autorisés à parler au bot, séparés par des virgules. Pas un secret :
            # ce sont des identifiants publics, et les garder hors du SealedSecret permet de
            # modifier l'allow-list sans repasser par kubeseal.
            # Contrairement au token, une valeur fausse est SANS danger : le plugin refuse alors
            # tout le monde. Ne jamais lui substituer `DISCORD_ALLOW_ALL_USERS` — la doc amont
            # le réserve au développement.
            - { name: DISCORD_ALLOWED_USERS, value: "148029630308155392" }
          envFrom:
            - secretRef:
                name: hermes-env
          ports:
            - { name: api, containerPort: 8642, protocol: TCP }
            - { name: dashboard, containerPort: 9119, protocol: TCP }
          # Sondes TCP et non HTTP : les deux endpoints sont derrière une auth (clé d'API,
          # gate de login), une sonde HTTP se ferait renvoyer un 401 lu comme un échec.
          startupProbe:
            tcpSocket: { port: dashboard }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: dashboard }
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket: { port: api }
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - { name: data, mountPath: /opt/data }
      volumes:
        - name: config
          configMap:
            name: hermes-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: openebs-lvm-thin
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
