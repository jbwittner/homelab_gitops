# helm-values — alloy (collecteur de logs des pods → loki)

controller:
  # Un pod par nœud : les fichiers de logs ne sont lisibles que localement.
  type: daemonset

# CRDs `monitoring.grafana.com` (PodLogs) : utiles seulement au composant `loki.source.podlogs`,
# que cette configuration n'utilise pas. Pas d'objets cluster-wide inutiles.
crds:
  create: false

alloy:
  mounts:
    # Monte /var/log de l'hôte (hostPath) → d'où le namespace labellisé `privileged`.
    varlog: true

  # Les fichiers sous /var/log/pods appartiennent à root. Le défaut du chart ne fixe aucun
  # securityContext (l'image tourne en root), on l'explicite pour que la lecture ne dépende
  # pas d'un changement de défaut côté image.
  securityContext:
    runAsUser: 0

  configMap:
    # Values inline autorisées ici : la règle du repo interdit les values dans le `.app.yaml`,
    # pas la configuration applicative dans `helm-values.yaml`.
    content: |-
      // Découverte de tous les pods du cluster via l'API Kubernetes (RBAC fourni par le chart).
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Labels d'INDEXATION Loki : garder une cardinalité faible. Surtout pas d'UID de pod
        // ni d'identifiant qui change à chaque redémarrage — chaque combinaison de labels crée
        // un flux distinct, et c'est ce qui fait exploser un Loki.
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }

        // Chemin réel des fichiers écrits par containerd :
        //   /var/log/pods/<namespace>_<pod>_<uid>/<container>/0.log
        // La concaténation uid + nom de conteneur (séparateur "/") est injectée dans le glob.
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        // Décode le format CRI (`<timestamp> <stream> <flags> <message>`) écrit par containerd :
        // sans ce stage, chaque ligne stockée dans Loki commence par ces métadonnées et
        // l'horodatage est celui de la lecture, pas celui de l'application.
        stage.cri {}

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
        }
      }

# Métriques d'Alloy scrapées par le prometheus-operator déjà en place : nombre de cibles
# découvertes, lignes envoyées, erreurs de push — le seul moyen de voir qu'un collecteur décroche.
serviceMonitor:
  enabled: true
  additionalLabels:
    # OBLIGATOIRE : le Prometheus du chart ne sélectionne que les ServiceMonitors portant ce
    # label (serviceMonitorSelectorNilUsesHelmValues).
    release: kube-prometheus-stack
