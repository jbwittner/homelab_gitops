# Forge Git du homelab. Chart `code.forgejo.org/forgejo-helm/forgejo` (voir forgejo.app.yaml).
#
# ⚠️ Depuis la v14 du chart, les sous-charts PostgreSQL, PostgreSQL-HA, Valkey et Valkey-Cluster
# ont été RETIRÉS (conséquence de l'arrêt des images Bitnami gratuites). Il n'y a plus de bascule
# `postgresql.enabled: false` à poser comme chez authentik : sans configuration de base externe,
# le chart retombe sur SQLite. La base est donc fournie ici par le `Cluster` CNPG `forgejo-db`
# de `manifests/`, et c'est un choix explicite, pas une désactivation.

# --- Image ---
image:
  # Défaut du chart, explicité car LOAD-BEARING pour tout le bloc SSH plus bas : en rootless, le
  # serveur SSH interne de Forgejo ne peut pas se lier au port 22 (privilégié) et écoute sur 2222.
  # Le port ANNONCÉ dans les URLs de clone (`SSH_PORT`) et le port ÉCOUTÉ (`SSH_LISTEN_PORT`) sont
  # alors deux choses différentes ; le Service fait la traduction 22 → 2222.
  rootless: true

# Forgejo n'est pas HA-ready : le chart lui-même refuse plusieurs configurations au-delà de 1
# replica (indexeur bleve, GC par cron, accessMode RWO). Un seul pod, stratégie `Recreate`
# (défaut du chart) — le volume est RWO sur du stockage node-local, deux pods ne peuvent pas
# se chevaucher pendant un rollout.
replicaCount: 1

# --- Compte de service ---
# ⚠️ Le chart NE POSE PAS de `serviceAccountName` tant que `serviceAccount.create` et
# `serviceAccount.name` sont tous deux vides — ce sont les défauts. Le pod retombe alors sur le
# ServiceAccount `default` du namespace, dont le jeton EST monté dans les conteneurs
# (`/var/run/secrets/kubernetes.io/serviceaccount/token`), et le chart ne pose aucun
# `automountServiceAccountToken: false` sur le podTemplate pour compenser.
#
# Forgejo ne parle jamais à l'API Kubernetes. Sur une instance au hostname public, ce jeton
# n'est donc qu'une primitive offerte à qui obtiendrait une exécution de code dans le pod.
#
# `create: true` fait poser un SA dédié `forgejo`, sur lequel le chart écrit
# `automountServiceAccountToken` — c'est le SA, et non le podTemplate, qui porte la bascule
# (cf. templates/gitea/serviceaccount.yaml). Aucun RBAC n'accompagne ce SA : il n'a aucun droit.
serviceAccount:
  create: true
  automountServiceAccountToken: false

# --- Contextes de sécurité ---
# ⚠️ Ne tient QU'AVEC l'image rootless (`image.rootless: true` plus haut) — le values.yaml amont
# le dit lui-même : « Security context is only usable with rootless image due to image design ».
# Repasser en rootful sans retirer ce bloc casse le démarrage.
#
# `containerSecurityContext` s'applique à TOUS les conteneurs, les trois init compris. Le chart
# force déjà `runAsUser: 1000` sur `configure-gitea` quand la clé est absente ; elle est écrite
# ici pour que les cinq conteneurs partagent le même contexte sans dépendre de ce repli.
podSecurityContext:
  # Défaut du chart, conservé : le PVC est monté en 1000:1000.
  fsGroup: 1000
  # Posé au niveau du POD, donc hérité par les init-containers ET le conteneur principal.
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
  # ⚠️ PAS de `add: [SYS_CHROOT]` : la capability n'est nécessaire que sur les nœuds en CRI-O
  # (cf. le commentaire du values.yaml amont et gitea/helm-chart#161). Ce cluster est en
  # Talos/containerd. Symptôme si elle manquait vraiment : le serveur SSH répond qu'il ne peut
  # pas lire le dépôt.
  #
  # ⚠️ PAS de `readOnlyRootFilesystem: true` : les scripts d'init du chart écrivent hors de
  # /data et /tmp et rien ne l'a vérifié ici. À n'activer qu'après un essai conteneur par
  # conteneur — le mode d'échec est un CrashLoopBackOff au démarrage, pas une dégradation.

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    # Pas de limite CPU : un `git gc` ou une indexation qui se fait throttler allonge la
    # transaction sans rien protéger. La limite mémoire, elle, borne le coût des adaptateurs
    # `memory` de session/cache (cf. plus bas).
    memory: 2Gi

# --- Exposition HTTP ---
# Les deux mécanismes d'exposition du chart restent coupés (`ingress` par défaut, `httpRoute`
# explicitement) : la route vit dans `manifests/forgejo-httproute.yaml` comme pour tous les
# composants du repo. Un seul endroit où lire un hostname, et les manifestes annexes sont déjà
# la source des `group`/`kind`/`weight` que le CRD Gateway réinjecte.
#
# Conséquence directe : le chart ne peut PLUS dériver `DOMAIN` / `ROOT_URL` / `SSH_DOMAIN` de
# l'ingress (il retomberait sur `git.example.com`). Ils sont donc écrits à la main dans
# `gitea.config.server` — les oublier ne casse rien au démarrage mais produit des URLs de clone
# et des liens de mail pointant vers `git.example.com`.
ingress:
  enabled: false
httpRoute:
  enabled: false

# --- Services ---
service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    # SSH ne passe PAS par `shared-gw` : le Gateway n'a que des listeners HTTPS, et Gateway API ne
    # route pas du TCP brut sans `TCPRoute` + un listener TCP dédié. Le chart sait poser un
    # `TCPRoute` (`tcpRoute.enabled`), mais il faudrait alors ajouter un listener `ssh` au Gateway
    # partagé — modifier un composant d'infra commun pour un seul consommateur. Un Service
    # LoadBalancer sur le pool Cilium fait le même travail, localement.
    type: LoadBalancer
    # Port ANNONCÉ et écouté côté LAN. Le Service cible le port nommé `ssh` du pod, soit 2222.
    port: 22
    annotations:
      # IP fixe prise dans `CiliumLoadBalancerIPPool` bleu-kalecgos-pool (192.168.1.80-89,
      # cf. infra/cilium/manifests/ip-pool.yaml), annoncée en L2 sur le LAN.
      #
      # ⚠️ Elle est FIXE parce qu'un enregistrement DNS la vise : `forgejo.lan.wittner.tech`
      # (cf. `SSH_DOMAIN`). Une IP laissée à l'allocateur changerait au premier recréage du
      # Service et casserait tous les remotes `git@…` en silence.
      #
      # ⚠️ Cette IP est DISTINCTE de celle de `shared-gw` : le trafic web et le trafic SSH
      # n'atterrissent pas au même endroit, d'où deux hostnames (cf. README §Réseau).
      #
      # `lbipam.cilium.io/ips` et non le champ `spec.loadBalancerIP` (déprécié côté Kubernetes)
      # ni l'ancien `io.cilium/lb-ipam-ips` (déprécié côté Cilium depuis la 1.16).
      lbipam.cilium.io/ips: 192.168.1.85
    # ⚠️ Le SSH reste un service de LAN, pas d'Internet : `forgejo.lan.wittner.tech` est annoncé
    # en ARP sur 192.168.1.0/24 et n'est de toute façon pas routable depuis l'extérieur. Cette
    # liste l'écrit noir sur blanc plutôt que de s'en remettre à la topologie — Cilium applique
    # le filtre en eBPF sur le nœud d'entrée, AVANT le DNAT vers le pod.
    #
    # C'est aussi ce qui rend acceptable la règle d'ingress large du port 2222 dans
    # manifests/forgejo-netpol.yaml : en `externalTrafficPolicy` par défaut (`Cluster`), un
    # paquet relayé d'un nœud à l'autre est SNATé, l'identité Cilium vue par la policy n'est
    # alors plus `world` mais celle du nœud — le filtrage par source se fait donc ici, pas là-bas.
    #
    # ⚠️ Élargir cette plage est le SEUL geste qui exposerait le SSH ailleurs que sur le LAN.
    loadBalancerSourceRanges:
      - 192.168.1.0/24

# --- Stockage ---
# Le PVC porte TOUT l'état non-SQL. Le `[storage]` de Forgejo est en `local` par défaut et
# enracine HUIT sous-systèmes sous `APP_DATA_PATH` (= /data) — y compris ceux qui grossissent
# sans qu'on les surveille :
#   /data/git/gitea-repositories   dépôts Git
#   /data/gitea/lfs                objets LFS
#   /data/gitea/packages           REGISTRE DE PAQUETS (conteneurs, npm, maven, PyPI…)
#   /data/gitea/actions_artifacts  artefacts de builds Actions (rétention 90 j par défaut)
#   /data/gitea/actions_log        logs de jobs Actions (rétention 365 j, compressés zstd)
#   /data/gitea/attachments        pièces jointes d'issues et de releases
#   /data/gitea/repo-archive       archives .zip/.tar.gz générées à la demande
#   /data/gitea/avatars, repo-avatars, indexers/  avatars et index bleve
# et surtout `/data/gitea/conf/app.ini` — donc les 4 secrets générés au premier démarrage
# (SECRET_KEY, INTERNAL_TOKEN, JWT_SECRET, LFS_JWT_SECRET). Voir README §Contraintes : le perdre
# n'est pas « repartir d'une base vide », c'est perdre de quoi déchiffrer ce qui reste en base.
#
# ⚠️ Dimensionnement : ces 100Gi ne bornent RIEN, et c'est un choix — instance mono-utilisateur,
# surveillance à la main. Le registre de paquets et Actions sont actifs par défaut côté Forgejo,
# `[quota] ENABLED` reste à `false`, et la StorageClass est en `thinProvision: "no"` : le LV est
# réservé en entier dans le VG dès la création, mais rien n'empêche de le remplir. Volume plein =
# écritures en échec, pas de dégradation progressive. Leviers et commandes de surveillance dans le
# README, §Dimensionnement du volume.
persistence:
  enabled: true
  create: true
  claimName: forgejo-data
  # 100Gi. Deux propriétés de la StorageClass gouvernent ce chiffre, et elles tirent en sens
  # inverse :
  #   - `thinProvision: "no"` → le LV réserve ses 100Gi dans le VG DÈS la création, utilisés ou
  #     non. Ce qui est pris ici n'est pas disponible pour les autres composants du nœud (et la
  #     base CNPG co-localisée en prend 10 de plus, cf. manifests/forgejo-db.yaml).
  #   - `allowVolumeExpansion: true` → agrandir plus tard se fait À CHAUD : bumper cette valeur,
  #     committer, et le CSI étend le LV puis le système de fichiers, sans recréer le PVC ni
  #     redémarrer le pod (cf. README §Opérations).
  # Autrement dit, sous-dimensionner se rattrape sans interruption ; surdimensionner immobilise du
  # VG tout de suite. ⚠️ L'opération n'est PAS symétrique : on ne rétrécit jamais un PVC.
  size: 100Gi
  accessModes:
    - ReadWriteOnce
  # StorageClass laissée vide → `openebs-lvm-thin`, classe par défaut du cluster
  # (`volumeBindingMode: WaitForFirstConsumer` : le PVC reste `Pending` tant que le pod n'est pas
  # schedulé, c'est normal).
  storageClass:
  annotations:
    # Défaut du chart, conservé pour un `helm uninstall` — INOPÉRANT sous ArgoCD, qui ne lit pas
    # les annotations Helm. C'est la ligne suivante qui protège réellement ce volume.
    helm.sh/resource-policy: keep
    # ⚠️ LOAD-BEARING. `Prune=false` : le PVC survit s'il sort de l'ensemble désiré (bump de chart
    # qui renommerait la ressource, valeur `persistence.create` basculée par erreur).
    # `Delete=false` : il survit aussi à la suppression de l'`Application` elle-même, que le
    # finalizer `resources-finalizer.argocd.argoproj.io` propagerait sinon jusqu'ici.
    # Le repo a déjà perdu un PVC de cette façon (cf. `application.resourceTrackingMethod` dans
    # infra/argocd/manifests/argocd-cm.yaml) ; la StorageClass étant en `reclaimPolicy: Delete`,
    # la suppression du PVC détruit le LV dans la foulée. Décommissionner Forgejo demande donc un
    # `kubectl delete pvc forgejo-data` explicite — c'est voulu.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

# --- robots.txt ---
# Forgejo ne sait servir un `robots.txt` que depuis un FICHIER de son `CUSTOM_PATH` (= /data/gitea
# ici, cf. `GITEA_CUSTOM` posé par le chart) : il n'y a aucune clé d'`app.ini` pour ça. D'où ce
# montage d'un ConfigMap (manifests/forgejo-robots.yaml) sur le chemin exact `/data/gitea/robots.txt`.
#
# ⚠️ `extraContainerVolumeMounts` et NON `extraVolumeMounts` (déprécié, qui monterait aussi dans
# les init-containers) : le montage doit arriver APRÈS `init-directories`, qui crée `/data/gitea`.
# Monté dans les init, kubelet créerait le point de montage lui-même, en root, dans le PVC — et
# `configure-gitea`, qui tourne en 1000, ne pourrait plus écrire son `app.ini` à côté.
#
# ⚠️ Forgejo teste la présence du fichier UNE SEULE FOIS, au démarrage (`setting.HasRobotsTxt`).
# Éditer le ConfigMap ne suffit donc pas : il faut un `kubectl -n forgejo rollout restart deploy/forgejo`.
extraVolumes:
  - name: robots
    configMap:
      name: forgejo-robots
extraContainerVolumeMounts:
  - name: robots
    mountPath: /data/gitea/robots.txt
    subPath: robots.txt
    readOnly: true

# Pod de test `wget` livré par le chart. Coupé : son annotation `helm.sh/hook: test` ne fait pas
# partie des hooks qu'ArgoCD sait traduire, il ne serait donc pas traité comme un hook mais comme
# une ressource ordinaire — un Pod `Completed` permanent dans l'arbre de l'Application.
test:
  enabled: false

gitea:
  # --- Compte d'administration ---
  admin:
    # `SealedSecret` `forgejo-admin` (manifests/forgejo-admin.sealed.yaml), clés `username` et
    # `password`. Sans lui, le pod reste bloqué en CreateContainerConfigError : le `secretKeyRef`
    # est monté en variable d'environnement de l'init-container `configure-gitea`.
    existingSecret: forgejo-admin
    email: jeanbaptiste.wittner@outlook.com
    # `keepUpdated` (défaut) : à CHAQUE démarrage de pod, le mot de passe du compte admin est
    # réaligné sur la valeur du Secret. C'est ce qu'on veut d'un secret géré en GitOps — le
    # `SealedSecret` de Git est la source de vérité ; une rotation se fait en rescellant PUIS en
    # redémarrant le pod (le commit seul ne change rien au compte déjà créé).
    # Contrepartie assumée : un changement de mot de passe fait DEPUIS L'UI est écrasé au prochain
    # redémarrage, sans avertissement. Les alternatives (`initialOnlyNoReset`,
    # `initialOnlyRequireReset`) ne posent le mot de passe qu'à la création du compte.
    passwordMode: keepUpdated

  # Endpoint Prometheus `/metrics` : laissé COUPÉ (défaut du chart), et c'est une décision.
  # Il est servi sur le port HTTP applicatif, donc derrière le même HTTPRoute que l'UI — sur un
  # hostname PUBLIC. Sans `[metrics] TOKEN`, il serait lisible par n'importe qui sur Internet
  # (noms de dépôts, volumétrie, comptes). L'activer proprement demande un token scellé ET un
  # ServiceMonitor écrit à la main (celui du chart ne sait pas porter d'`authorization`) :
  # cf. README §Métriques.
  metrics:
    enabled: false

  # --- app.ini ---
  # Chaque clé de ce bloc devient une entrée d'`app.ini`. Le nom de section est en minuscules,
  # les clés en MAJUSCULES (cf. config-cheat-sheet amont).
  config:
    APP_NAME: 'Forgejo — wittner.tech'

    server:
      # Réécrits à la main : `ingress`/`httpRoute` du chart étant coupés, le chart n'a rien d'où
      # les dériver et retomberait sur `git.example.com`.
      DOMAIN: forgejo.wittner.tech
      ROOT_URL: https://forgejo.wittner.tech/
      # ⚠️ `PROTOCOL` (http) et `ROOT_URL` (https) divergent VOLONTAIREMENT : TLS est terminé au
      # Gateway, le backend parle en clair dans le cluster. C'est `ROOT_URL` qui gouverne les URLs
      # émises (liens de mails, redirections OAuth2, flag `Secure` des cookies de session) ;
      # `PROTOCOL` ne décrit que la socket d'écoute. Mettre `https` ici ferait attendre à Forgejo
      # un certificat qu'il n'a pas.
      HTTP_PORT: 3000

      # Hostname SSH DIFFÉRENT du hostname web, parce que les deux ne pointent pas sur la même IP :
      # le web arrive par `shared-gw`, le SSH par le Service LoadBalancer ci-dessus. C'est la
      # valeur affichée dans le bouton « Clone » de l'UI — une erreur ici ne casse rien côté
      # serveur et rend juste toutes les commandes copiées inutilisables.
      SSH_DOMAIN: forgejo.lan.wittner.tech
      # Port ANNONCÉ dans les URLs de clone (celui du Service).
      SSH_PORT: 22
      # Port réellement ÉCOUTÉ dans le conteneur : 2222, imposé par l'image rootless. C'est le
      # défaut que le chart poserait de toute façon ; explicité parce que le Service le cible.
      SSH_LISTEN_PORT: 2222
      # Serveur SSH interne (Go), pas un OpenSSH : pas de gestion de `authorized_keys` sur disque,
      # Forgejo authentifie les clés depuis sa base. Défaut du chart en rootless.
      START_SSH_SERVER: true

    database:
      DB_TYPE: postgres
      # Service RW généré par l'opérateur pour le `Cluster` `forgejo-db`. Pointer le RW et non un
      # RO : Forgejo écrit.
      HOST: forgejo-db-rw:5432
      # `app` / `app` : noms par défaut de la base et du rôle applicatif créés par CNPG quand le
      # `Cluster` ne déclare pas de `bootstrap.initdb`. Le mot de passe n'est PAS ici, il vient du
      # secret auto-généré `forgejo-db-app` (cf. `additionalConfigFromEnvs`).
      NAME: app
      USER: app
      # Le pg_hba par défaut de CNPG accepte les connexions applicatives en clair depuis le
      # cluster (ligne `host all all all scram-sha-256`) ; seuls la réplication et le pooler
      # exigent TLS. Explicité pour que la valeur ne soit pas prise pour un oubli.
      SSL_MODE: disable

    security:
      # Le chart le pose DÉJÀ à `true` tout seul (`gitea.inline_configuration.defaults` :
      # « if not .Values.gitea.config.security.INSTALL_LOCK → set true »). Explicité parce que
      # c'est LE point de contrôle d'une exposition publique : sans lui, `/install` est servi à
      # n'importe qui et permet de réécrire la configuration entière, base comprise. Laissé
      # implicite, sa disparition dans un bump de chart ne se verrait dans aucune revue.
      INSTALL_LOCK: true

    service:
      # Instance PUBLIQUE : sans ça, n'importe qui crée un compte. Les comptes se créent à la main
      # depuis l'UI d'admin (ou par OIDC le jour où authentik revient, cf. README).
      DISABLE_REGISTRATION: true
      # ⚠️ `false` VOLONTAIREMENT, et ce n'est pas un oubli : c'est ce qui laisse un visiteur
      # anonyme voir les dépôts PUBLICS. Les dépôts privés restent absents des listings, de la
      # recherche et de l'API — c'est `DEFAULT_PRIVATE` plus bas qui décide de ce qui est public,
      # pas ce réglage-ci. Le passer à `true` fermerait la forge entière derrière le login.
      REQUIRE_SIGNIN_VIEW: false
      # Les adresses mail ne sortent pas.
      # ⚠️ Ne vaut que pour les comptes créés APRÈS ce réglage : un compte existant garde le
      # choix enregistré dans son profil, à corriger à la main (Paramètres → Compte).
      DEFAULT_KEEP_EMAIL_PRIVATE: true
      # Domaine des adresses de substitution (`<user>@<NO_REPLY_ADDRESS>`) écrites dans les
      # commits faits depuis l'UI quand l'utilisateur garde son mail privé.
      # ⚠️ Sous-domaine DÉDIÉ et sans MX : ces adresses n'ont pas à recevoir de courrier, et un
      # domaine réel ici transformerait chaque commit en fuite d'adresse valide.
      NO_REPLY_ADDRESS: noreply.forgejo.wittner.tech

    openid:
      # ⚠️ Section `[openid]` et NON `[service]` : Forgejo lit ces deux clés dans `[openid]`
      # (modules/setting/service.go). Les écrire sous `service:` ne produirait aucune erreur et
      # n'aurait simplement aucun effet — le pire des deux mondes.
      #
      # Aucun fournisseur OpenID n'est câblé (cf. README §Non retenu) : laisser le formulaire
      # ouvert n'ajoute qu'une surface d'authentification. `ENABLE_OPENID_SIGNUP` mérite d'être
      # posé explicitement même s'il vaut déjà `false` : son défaut est `!DISABLE_REGISTRATION`,
      # donc il SUIT l'inscription libre — la rouvrir un jour rouvrirait aussi l'inscription par
      # OpenID, sans que rien ne le signale.
      ENABLE_OPENID_SIGNIN: false
      ENABLE_OPENID_SIGNUP: false

    ui:
      # Pas d'adresse mail sur les profils publics.
      SHOW_USER_EMAIL: false

    repository:
      # Tout dépôt créé naît PRIVÉ. `private`, et non `last` (qui rejoue le dernier choix) ni
      # `public` : sur une instance publique, l'oubli doit pencher du côté fermé. Rendre un dépôt
      # public reste un geste explicite, dépôt par dépôt.
      DEFAULT_PRIVATE: private
      # Même logique pour un dépôt créé par un `git push` vers une URL inexistante — c'est le
      # chemin par lequel un dépôt apparaît sans jamais passer par l'UI.
      DEFAULT_PUSH_CREATE_PRIVATE: true

    migrations:
      # --- Anti-SSRF (1/2) : migrations ---
      # Une migration est une requête HTTP émise PAR LE SERVEUR vers une URL fournie par
      # l'utilisateur : la primitive SSRF classique. `false` interdit les cibles en 127.0.0.0/8,
      # 10/8, 172.16/12, 192.168/16 et link-local — donc l'API Kubernetes, les services du
      # cluster et le LAN. C'est le défaut amont, explicité parce qu'il est load-bearing, et
      # doublé au niveau réseau par manifests/forgejo-netpol.yaml.
      ALLOW_LOCALNETWORKS: false
      # Liste BLANCHE de domaines migrables, plutôt qu'une liste noire toujours incomplète.
      # Vide (défaut) = tout est autorisé ; renseignée, elle prime sur `BLOCKED_DOMAINS`.
      # ⚠️ Le joker ne couvre qu'UN niveau : `*.github.com` ne matche pas `a.b.github.com`.
      # ⚠️ Toute forge dont on veut importer un dépôt doit être ajoutée ici, sinon la migration
      # échoue sur « migrate from %s is not allowed » — message qui ne désigne pas ce réglage.
      ALLOWED_DOMAINS: 'github.com,*.github.com,gitlab.com,*.gitlab.com,codeberg.org,*.codeberg.org,git.sr.ht'

    webhook:
      # --- Anti-SSRF (2/2) : webhooks ---
      # Même primitive que les migrations, déclenchée cette fois par un événement de dépôt.
      # `external` est un mot-clé Forgejo : « toutes les adresses SAUF celles qui résolvent en
      # loopback, privé ou link-local ». C'est l'inverse exact du défaut amont `*`, qui laisse
      # un webhook viser `https://kubernetes.default.svc` ou `192.168.1.x`.
      # ⚠️ Ne JAMAIS y ajouter de plage privée : c'est le dernier filet applicatif si la
      # CiliumNetworkPolicy venait à sauter.
      ALLOWED_HOST_LIST: external

    api:
      # La doc Swagger décrit toute la surface d'API et la version exacte du serveur, sur un
      # hostname public et sans authentification. Rien ne la consomme ici.
      ENABLE_SWAGGER: false

    other:
      # Version de Forgejo retirée du pied de page : c'est ce qui transforme une CVE publiée en
      # cible désignée, sans rien apporter à un utilisateur.
      SHOW_FOOTER_VERSION: false

    # --- Mailer : relais externe Brevo ---
    # ⚠️ Sans mailer, Forgejo ne peut envoyer NI réinitialisation de mot de passe, NI notification
    # de connexion. Sur une instance publique à compte unique, la perte du mot de passe admin ne
    # se répare alors que par `kubectl exec` (cf. README §Reste) — ce qui suppose de garder un
    # accès au cluster, pas seulement à la forge. Procédure complète : README §Mailer.
    #
    # ⚠️ `SMTP_ADDR` est `smtp-relay.brevo.com`, PAS `relay.brevo.com` : ce dernier n'existe pas
    # dans le DNS et l'envoi échoue sur un NXDOMAIN remonté tel quel par gomail
    # (`lookup relay.brevo.com on 10.96.0.10:53: no such host`). Le symptôme ressemble à un blocage
    # réseau mais n'en est pas un : une CiliumNetworkPolicy qui refuse échoue en TIMEOUT, jamais en
    # « no such host » — une réponse négative prouve que le paquet DNS est allé jusqu'à CoreDNS et
    # en est revenu. Ne pas partir chercher dans forgejo-netpol.yaml sur cette erreur-là.
    mailer:
      ENABLED: true
      PROTOCOL: smtp+starttls
      SMTP_ADDR: smtp-relay.brevo.com
      SMTP_PORT: 587
      FROM: forgejo@wittner.tech
      # Identifiant Brevo (`<id>@smtp-brevo.com`), et NON l'adresse d'expédition : les deux
      # diffèrent, et intervertir les deux donne un échec d'authentification côté relais.
      USER: b66e7b001@smtp-brevo.com
      # PASSWD n'est PAS ici — ce fichier est dans Git. Il arrive par
      # `additionalConfigFromEnvs` (FORGEJO__MAILER__PASSWD), câblé plus bas.

    indexer:
      # Recherche de code (et pas seulement de dépôts). Indexeur `bleve` par défaut, écrit sur le
      # PVC, et compte dans son occupation. C'est la configuration mono-pod recommandée par le
      # chart ; elle interdit à elle seule de passer à plusieurs replicas.
      REPO_INDEXER_ENABLED: true

  # --- Mot de passe de la base ---
  # Injecté en VARIABLE D'ENVIRONNEMENT et non dans `gitea.config.database.PASSWD` : ce fichier est
  # dans Git. Le préfixe `FORGEJO__<SECTION>__<CLÉ>` est lu par `environment-to-ini` au démarrage
  # de l'init-container, qui l'écrit dans l'`app.ini` du volume. Les variables d'environnement ont
  # la priorité la plus haute (au-dessus de `additionalConfigSources`, puis de `gitea.config`).
  #
  # Secret auto-généré par CNPG pour le `Cluster` `forgejo-db` : jamais scellé, jamais figé dans
  # Git, régénéré avec la base.
  #
  # --- Secrets cryptographiques : à sortir du volume ---
  # ⚠️ Les quatre valeurs ci-dessous sont normalement GÉNÉRÉES au premier démarrage et écrites
  # dans `/data/gitea/conf/app.ini`, sur le PVC (cf. README §Contraintes). Elles n'existent alors
  # nulle part ailleurs : perdre le volume, ce n'est pas repartir d'une base vide, c'est perdre de
  # quoi déchiffrer ce qui reste en base. Les injecter depuis un `SealedSecret` les met dans Git
  # sous forme chiffrée et rend le PVC restaurable indépendamment.
  #
  # ⚠️ `optional: true` est LOAD-BEARING. Tant que le Secret `forgejo-secrets` n'existe pas, la
  # variable n'est pas posée du tout, `environment-to-ini` n'écrit rien, et Forgejo garde les
  # valeurs de son `app.ini`. Le câblage est donc INERTE aujourd'hui et s'active au seul
  # scellement, sans nouvelle modification de ce fichier. Sans `optional`, le pod partirait en
  # CreateContainerConfigError dès ce commit.
  #
  # ⚠️⚠️ NE PAS SCELLER DES VALEURS NEUVES SUR UNE INSTANCE DÉJÀ EN SERVICE. Il faut sceller
  # celles qui sont DÉJÀ dans l'`app.ini` du volume : des valeurs neuves invalident d'un coup
  # toutes les sessions, tous les jetons d'API et tous les objets LFS existants. Extraction puis
  # scellement : README §Sceller les secrets cryptographiques.
  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-db-app
          key: password
    - name: FORGEJO__SECURITY__SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: forgejo-secrets
          key: SECRET_KEY
          optional: true
    - name: FORGEJO__SECURITY__INTERNAL_TOKEN
      valueFrom:
        secretKeyRef:
          name: forgejo-secrets
          key: INTERNAL_TOKEN
          optional: true
    # ⚠️ Section `[oauth2]`, clé `JWT_SECRET` — pas `OAUTH2_JWT_SECRET`. Le nom de la clé du
    # Secret, lui, est préfixé pour rester lisible à côté de `LFS_JWT_SECRET`.
    - name: FORGEJO__OAUTH2__JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: forgejo-secrets
          key: OAUTH2_JWT_SECRET
          optional: true
    # ⚠️ Section `[server]` et non `[lfs]`.
    - name: FORGEJO__SERVER__LFS_JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: forgejo-secrets
          key: LFS_JWT_SECRET
          optional: true
    # Mot de passe du relais SMTP (clé Brevo). ⚠️ `optional: true` reste LOAD-BEARING : si le
    # Secret `forgejo-smtp` n'est pas scellé, le pod démarre quand même mais le mailer est ACTIF
    # sans mot de passe — l'échec est alors une authentification refusée par le relais, pas un
    # CreateContainerConfigError. Cf. README §Mailer.
    - name: FORGEJO__MAILER__PASSWD
      valueFrom:
        secretKeyRef:
          name: forgejo-smtp
          key: PASSWD
          optional: true
