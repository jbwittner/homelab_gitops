# UI et API HTTP de Forgejo. Listener `https-public` (*.wittner.tech) : une forge n'a d'intérêt
# que joignable de l'extérieur, et le clone HTTPS passe par cette même route.
#
# ⚠️ C'est le SEUL chemin d'entrée de la forge depuis le 2026-09-06. Le clone SSH a été coupé et
# tout le Git passe maintenant par cette route, en HTTPS. Il n'y a plus de second hostname, plus de
# port ouvert sur la box, et rien à router en TCP — un HTTPRoute ne transporte de toute façon pas
# de TCP brut, et `shared-gw` n'a que des listeners HTTPS. Cf. README §Réseau.
#
# ⚠️ Conséquence à connaître avant de diagnostiquer un `git push` qui échoue : le trafic traverse
# le proxy Cloudflare, qui plafonne une requête à 100 Mo sur le plan gratuit. Un push volumineux se
# prend un `413` que git ne sait pas expliquer. L'échappatoire est documentée dans README §Réseau —
# depuis le LAN, le DNS interne court-circuite l'edge et le plafond disparaît.
#
# ⚠️ Cette route exposerait TOUS les chemins, `/metrics` compris — et les métriques sont ACTIVÉES
# depuis le 2026-09-09. D'où la première règle ci-dessous, qui intercepte ce seul chemin. Elle est
# l'une des trois couches qui tiennent `/metrics` hors d'Internet ; les deux autres sont le
# `[metrics] TOKEN` (helm-values.yaml) et la CiliumNetworkPolicy. Cf. README §Métriques.
#
# group/kind/weight/sectionName et matches explicites : le CRD les injecte comme défauts côté
# live — sans eux, OutOfSync permanent dans ArgoCD.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gw
      namespace: gateway
      sectionName: https-public
  hostnames:
    - forgejo.wittner.tech
  rules:
    # --- `/metrics` : intercepté ici, jamais transmis au backend ---
    # Forgejo sert son endpoint Prometheus sur le port applicatif (3000), donc sur cette route
    # publique. Cette règle le renvoie vers la page d'accueil au niveau du Gateway : le chemin
    # n'atteint pas le pod depuis Internet, et il n'y a donc rien à deviner ni à forcer côté edge.
    #
    # ⚠️ Elle ne gêne PAS le scrape. Prometheus vise le Service `forgejo-http` (ClusterIP →
    # IP de pod) et ne passe pas par `shared-gw` — la CiliumNetworkPolicy lui ouvre ce chemin-là
    # explicitement.
    #
    # ⚠️ `type: Exact` est LOAD-BEARING, deux fois :
    #   - la précédence de Gateway API donne la priorité à une correspondance exacte sur le
    #     `PathPrefix: /` de la règle suivante. En `PathPrefix`, les deux règles seraient
    #     départagées par la longueur — ce qui marcherait ici, mais capturerait aussi
    #     `/metrics-quelque-chose`, y compris un futur dépôt nommé ainsi ;
    #   - un dépôt PEUT s'appeler `metrics`. Son URL est `/<propriétaire>/metrics`, jamais
    #     `/metrics` : la règle exacte ne l'attrape pas.
    #
    # ⚠️ Le bloc `ResponseHeaderModifier` de la règle suivante n'est délibérément PAS recopié ici :
    # une redirection 302 n'a pas de corps, il n'y a ni type MIME à ne pas renifler ni cadre à
    # refuser. Le seul en-tête qui aurait du sens est HSTS, et il est déjà posé par toutes les
    # autres réponses du même hostname.
    - matches:
        - path:
            type: Exact
            value: /metrics
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            # 302 et non 301 : une redirection permanente serait mise en cache par les
            # navigateurs et par l'edge Cloudflare, et survivrait donc au retrait de cette règle.
            statusCode: 302

    - matches:
        - path:
            type: PathPrefix
            value: /
      # En-têtes de sécurité posés PAR LE GATEWAY, et non par Forgejo. Deux raisons :
      #   - HSTS ne peut pas venir du backend. Forgejo parle en clair dans le cluster
      #     (`PROTOCOL` non posé, donc `http` par défaut) ; c'est ici, au point où TLS est
      #     terminé, que l'en-tête a un sens.
      #   - `ResponseHeaderModifier` est un filtre de base de Gateway API, implémenté par Cilium
      #     depuis la 1.16 — rien à installer.
      #
      # ⚠️ `set` et non `add` : l'en-tête est REMPLACÉ s'il existe déjà. Forgejo émet lui-même
      # `X-Content-Type-Options` et `X-Frame-Options` ; `add` en produirait deux exemplaires, ce
      # que certains navigateurs traitent comme une valeur invalide, donc absente.
      #
      # ⚠️ Une seule règle dans cette route, donc un seul endroit où poser ces filtres. Ajouter
      # une seconde règle (un jour, pour un chemin particulier) DEMANDE de recopier ce bloc :
      # les filtres sont attachés à la règle, pas à la route.
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              # 1 an, sous-domaines compris. ⚠️ Volontairement SANS `preload` : l'inscription à
              # la liste de préchargement des navigateurs porte sur le domaine entier et se
              # défait en des mois. `max-age` seul reste réversible en changeant cette ligne.
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              # Pas de reniflage de type MIME : décisif sur une forge, qui sert des fichiers
              # arbitraires téléversés par des utilisateurs (pièces jointes, paquets, `raw/`).
              - name: X-Content-Type-Options
                value: nosniff
              # `SAMEORIGIN` et non `DENY` : Forgejo utilise ses propres iframes (aperçus,
              # éditeur). `DENY` casserait l'interface.
              - name: X-Frame-Options
                value: SAMEORIGIN
              # L'URL complète n'est envoyée qu'aux pages du même site ; vers l'extérieur, seule
              # l'origine part. Un chemin de dépôt privé ne fuite donc pas dans le `Referer`
              # d'un lien sortant.
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
      backendRefs:
        - group: ""
          kind: Service
          # Service posé par le chart : `<releaseName>-http`, soit `forgejo-http`.
          name: forgejo-http
          port: 3000
          weight: 1
