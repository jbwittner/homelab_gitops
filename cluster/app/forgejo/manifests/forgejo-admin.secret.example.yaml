# EXEMPLE — versionné, sans aucune valeur réelle. C'est la copie de référence du template de
# scellement `forgejo-admin.secret.yaml`, qui est gitignoré (`*.secret.yaml`) ET dont la procédure
# de scellement demande la SUPPRESSION une fois `kubeseal` passé. Sans ce fichier-ci, tout ce qui
# est écrit ci-dessous — la raison de chaque valeur, les deux pièges qui coûtent des données —
# disparaîtrait avec lui, et `forgejo-admin.sealed.yaml` ne conserve rien : un `SealedSecret` ne
# porte que du chiffré, pas les commentaires du clair dont il est issu.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient que
# des `REMPLACER`. Il se recopie, il ne s'applique pas.
#
#   cp manifests/forgejo-admin.secret.example.yaml manifests/forgejo-admin.secret.yaml
#   # renseigner les valeurs, puis sceller (voir plus bas)
#
# ⚠️ Le nom de la copie compte : `*.secret.yaml` est le motif du `.gitignore`. Un fichier nommé
# autrement (`forgejo-admin-clair.yaml`, `secret.yml`…) serait suivi par Git en clair.
#
# ⚠️ Ne jamais renseigner ce fichier-ci « juste pour tester » : son nom ne correspond PAS au motif
# gitignoré, il serait committé avec ses valeurs.
#
# --------------------------------------------------------------------------------------------
#
# Trois Secrets distincts en trois documents YAML, et un seul fichier à sceller : `kubeseal` lit
# un flux multi-documents (`readSecrets` boucle jusqu'à EOF, `Seal` scelle chacun et les sépare
# par `---`), et `forgejo-admin.sealed.yaml` porte donc les trois `SealedSecret`. C'est la raison
# pour laquelle `kustomization.yaml` n'a qu'UNE ligne pour les trois, pas trois.
#
# Le seul secret que le pod exige pour démarrer reste `forgejo-admin` : les deux autres sont
# câblés en `optional: true` (cf. `additionalConfigFromEnvs` dans helm-values.yaml) et leur
# absence ne bloque pas le démarrage.
#
#   ┌─ 1. forgejo-admin   compte d'administration          REQUIS au démarrage
#   ├─ 2. forgejo-secrets 4 secrets cryptographiques       optionnel — cf. AVERTISSEMENT
#   └─ 3. forgejo-smtp    mot de passe du relais SMTP      optionnel au démarrage, mais le mailer
#   │                                                      est ACTIF : son absence casse les envois
#
# ⚠️⚠️ AVERTISSEMENT — NE PAS SCELLER AVEC DES `REMPLACER` DANS LE DOCUMENT 2.
# Les quatre valeurs du document 2 chiffrent ou signent des données DÉJÀ en base. Les sceller
# telles quelles écrirait `SECRET_KEY=REMPLACER` dans l'`app.ini` au prochain démarrage et
# rendrait illisibles, d'un coup, toutes les sessions, tous les jetons d'API, tous les jetons LFS
# et OAuth2 existants. Ce n'est pas « repartir d'une base vide », c'est une perte.
# Deux façons de ne pas se faire piéger, au choix :
#   - renseigner le document 2 AVANT de sceller (procédure dans le document lui-même) ;
#   - ou supprimer temporairement les documents 2 et 3 de la copie, sceller, les remettre.
#
# Scellement (cf. README §Câblage des secrets) :
#   kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#     < cluster/app/forgejo/manifests/forgejo-admin.secret.yaml \
#     > cluster/app/forgejo/manifests/forgejo-admin.sealed.yaml
#   rm cluster/app/forgejo/manifests/forgejo-admin.secret.yaml
#
# ⚠️ Le fichier scellé REMPLACE l'ancien : sceller à nouveau pour ajouter ou changer un document
# oblige à re-fournir AUSSI les valeurs des documents déjà scellés (un `SealedSecret` ne se relit
# pas). D'où l'intérêt de tout renseigner en une fois — ou de garder ces valeurs dans un
# gestionnaire de mots de passe, ce que le README recommande déjà pour le mot de passe admin.
# C'est aussi pour cela que le `rm` ci-dessus n'est pas une précaution excessive mais un choix :
# la source de vérité est le gestionnaire de mots de passe, pas un fichier oublié sur un poste.

# --- 1. Compte d'administration -----------------------------------------------------------------
# Le chart attend un Secret à DEUX clés exactement, `username` et `password`
# (cf. `gitea.admin.existingSecret` dans helm-values.yaml). Les deux sont scellées ensemble : le
# nom d'utilisateur n'est pas un secret, mais un SealedSecret chiffre clé par clé et il n'y a pas
# d'intérêt à le sortir du même objet.
#
# ⚠️ `username` ne peut pas valoir `admin` — Forgejo réserve ce nom, et le `gitea admin user
# create` de l'init-container `configure-gitea` échouerait en boucle.
#
# Valeur de `password` :
#   openssl rand -base64 24
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-admin
  namespace: forgejo
type: Opaque
stringData:
  username: forgejo_admin
  password: "REMPLACER"
---
# --- 2. Secrets cryptographiques ----------------------------------------------------------------
# Les quatre valeurs que le chart génère sinon tout seul au premier démarrage et n'écrit QUE dans
# `/data/gitea/conf/app.ini`, sur le PVC (cf. README §Contraintes). Les sceller les met dans Git
# sous forme chiffrée et rend le volume restaurable indépendamment.
#
# ⚠️⚠️ SUR UNE INSTANCE DÉJÀ EN SERVICE : NE PAS GÉNÉRER DE VALEURS NEUVES. Il faut sceller
# celles que le pod utilise EN CE MOMENT — cf. l'avertissement en tête de fichier.
#
#   kubectl -n forgejo exec deploy/forgejo -- \
#     sh -c 'grep -E "^(SECRET_KEY|INTERNAL_TOKEN|JWT_SECRET|LFS_JWT_SECRET) " /data/gitea/conf/app.ini'
#
# ⚠️ Deux clés portent le MÊME NOM dans deux sections différentes de l'`app.ini` : `JWT_SECRET`
# est celle d'`[oauth2]`, `LFS_JWT_SECRET` celle de `[server]`. Vérifier la section au-dessus de
# chaque ligne avant de recopier — les intervertir casse LFS et OAuth2 en même temps, et le seul
# signal est un jeton refusé à l'usage.
#
# Sur une instance JAMAIS démarrée, et seulement dans ce cas :
#   openssl rand -base64 48   # pour chacune des quatre valeurs
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-secrets
  namespace: forgejo
type: Opaque
stringData:
  # [security] SECRET_KEY      -> FORGEJO__SECURITY__SECRET_KEY
  SECRET_KEY: "REMPLACER"
  # [security] INTERNAL_TOKEN  -> FORGEJO__SECURITY__INTERNAL_TOKEN
  INTERNAL_TOKEN: "REMPLACER"
  # [oauth2]   JWT_SECRET      -> FORGEJO__OAUTH2__JWT_SECRET
  # Le préfixe du nom de clé n'existe que pour lever l'ambiguïté avec la ligne suivante.
  OAUTH2_JWT_SECRET: "REMPLACER"
  # [server]   LFS_JWT_SECRET  -> FORGEJO__SERVER__LFS_JWT_SECRET
  LFS_JWT_SECRET: "REMPLACER"
---
# --- 3. Relais SMTP -----------------------------------------------------------------------------
# ⚠️ Le mailer est ACTIF (`gitea.config.mailer.ENABLED: true`, helm-values.yaml, relais Brevo
# `smtp-relay.brevo.com:587`). Ce document n'est donc plus le brouillon inerte qu'il a été : la
# variable `FORGEJO__MAILER__PASSWD` est câblée en `optional: true`, si bien que le pod démarre
# SANS ce Secret — mais Forgejo tente alors ses envois sans mot de passe et le relais les refuse.
# L'oubli ne se voit pas au démarrage, seulement au premier courrier. Cf. README §Mailer.
#
# ⚠️ Le LOGIN SMTP n'est pas ici : il est écrit en clair dans `gitea.config.mailer.USER`, comme
# côté Alertmanager (cf. kube-prometheus-stack/manifests/alertmanager-smtp.externalsecret.yaml,
# qui documente le même partage). Seul le mot de passe est secret. Chez Brevo, ce login est un
# identifiant de la forme `<id>@smtp-brevo.com` et NON l'adresse d'expédition (`FROM`) — les
# confondre donne une authentification refusée, pas une erreur de configuration lisible.
#
# ⚠️ Le relais doit être JOIGNABLE DEPUIS LE POD : la CiliumNetworkPolicy n'ouvre la sortie que
# vers des adresses publiques. Un relais sur le LAN demanderait une règle `toCIDR` explicite dans
# manifests/forgejo-netpol.yaml.
#
# ⚠️ Sceller un `REMPLACER` ici ne détruit rien — contrairement au document 2, un mot de passe
# SMTP faux ne fait échouer que des envois. Mais il en fait échouer TOUS, mailer actif : ce n'est
# plus sans conséquence comme lorsque le bloc `mailer` était encore commenté.
#
# Valeur : clé SMTP Brevo (`xsmtpsib-…`), tableau de bord Brevo → SMTP & API → SMTP.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-smtp
  namespace: forgejo
type: Opaque
stringData:
  # [mailer] PASSWD -> FORGEJO__MAILER__PASSWD
  PASSWD: "REMPLACER"
