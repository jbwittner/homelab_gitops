# Base PostgreSQL dédiée à Forgejo, portée par l'opérateur CNPG (composant `cnpg`, qui doit
# tourner AVANT : sans la CRD `Cluster`, cet objet échoue en `no matches for kind`).
#
# L'opérateur en dérive lui-même, sans rien à déclarer ici :
#   - le service `forgejo-db-rw` (référencé par `gitea.config.database.HOST`),
#   - le secret `forgejo-db-app` (référencé par `additionalConfigFromEnvs`), qui contient le mot
#     de passe du rôle applicatif `app` sur la base `app`.
# Ce secret n'est ni scellé ni figé dans Git : il vit et meurt avec la base.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
spec:
  # Mono-nœud, comme le reste du cluster. Un `instances: 2` ne serait de toute façon pas exploité :
  # Forgejo ne tourne qu'en un seul replica.
  instances: 1
  storage:
    # Métadonnées uniquement (issues, PR, comptes, sessions). Les dépôts Git, le LFS et les
    # attachements sont sur le PVC `forgejo-data`, pas ici.
    size: 10Gi

  # --- Reprise depuis le bucket ---
  #
  # ⚠️ CE BLOC N'EST LU QU'À LA CRÉATION DU CLUSTER. Sur un cluster déjà bootstrappé, CNPG ne le
  # relit jamais : il est inerte tant que le `Cluster` existe, et ne reprend un sens que le jour où
  # on le SUPPRIME pour le reconstruire depuis les sauvegardes. Ce n'est donc pas un résidu à
  # nettoyer — c'est la procédure de reprise, écrite à l'avance et versionnée.
  #
  # POURQUOI IL EST ICI plutôt que dans un manifeste `forgejo-db-restore.yaml` : `forgejo-db-rw` et
  # `forgejo-db-app` sont DÉRIVÉS du nom du `Cluster`. Une reprise sous un autre nom obligerait à
  # suivre dans `helm-values.yaml` (`gitea.config.database.HOST` et `additionalConfigFromEnvs`), à
  # chaque sinistre, et le nom dériverait un peu plus à chaque fois. En reprenant SOUS LE MÊME NOM,
  # la forge n'a jamais rien à changer : c'est le `serverName` qui porte les générations.
  #
  # ⚠️ `cnpg-barman-plugin-script.sh restore` REFUSE de générer ce manifeste sous le nom de sa
  # source, et il a raison : il ne peut pas garantir que le `serverName` d'ÉCRITURE sera bumpé. Ce
  # bump est fait plus bas, à la main. Sans lui, le cluster repris archiverait par-dessus les WAL
  # dont il vient et détruirait sa propre source (piège n°6 du script).
  #
  # Pas de `recoveryTarget` : on rejoue TOUT le WAL disponible et on atterrit au dernier point
  # archivé. Un `targetTime` figé dans Git serait faux dès la reprise suivante. Pour viser un
  # instant précis — l'alignement avec le PVC du §1 du plan — le passer à la main au moment de la
  # reprise, puis le retirer.
  bootstrap:
    recovery:
      source: origin
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: forgejo-db-store
          # serverName de LECTURE : celui de la génération PRÉCÉDENTE, où sont les sauvegardes à
          # rejouer. À faire suivre d'une génération à chaque reprise, avec celui d'écriture.
          serverName: forgejo-db-v4

  # --- Sauvegarde native ---
  #
  # C'est CETTE clé qui met la base sous sauvegarde, pas l'`ObjectStore` ni la `ScheduledBackup` :
  # elle injecte le sidecar barman-cloud dans le pod d'instance et bascule `archive_command` vers
  # lui. À partir de son application, l'archivage WAL est CONTINU (un segment toutes les 5 minutes
  # au pire, `archive_timeout = 300`), indépendamment de toute sauvegarde de base.
  #
  # ⚠️ Le pod d'instance est RECRÉÉ à la pose de cette clé (injection du sidecar) : c'est le seul
  # moment d'indisponibilité de la bascule, et il dure **environ 200 s**, pas quelques secondes.
  # Mesuré le 2026-09-08 : 180 s d'arrêt de PostgreSQL puis ~20 s de redémarrage. Les 180 s sont
  # `smartShutdownTimeout` (défaut CNPG) — l'arrêt SMART attend que les clients ferment leurs
  # connexions, or Forgejo maintient un pool de connexions inactives qui ne se ferment jamais
  # d'elles-mêmes. Le délai est donc consommé EN ENTIER avant l'escalade en arrêt fast.
  # Pendant ce temps le `Cluster` affiche « Primary instance is being restarted without a
  # switchover » et Forgejo rend des erreurs 500. C'est le comportement attendu, pas une panne.
  #
  # ⚠️ Ne PAS écrire `spec.backup.barmanObjectStore` à la place : c'est le support IN-TREE, retiré
  # de CloudNativePG depuis la 1.26 (l'opérateur tourne en 1.30). Il serait accepté par la CRD et
  # ne sauvegarderait rien.
  #
  # Les trois pièces sont indissociables et se déplacent ensemble :
  #   - cette clé                              → archivage WAL continu
  #   - forgejo-db-objectstore.yaml            → où, avec quelles clés, pour combien de temps
  #   - forgejo-db-scheduledbackup.yaml        → sauvegardes de base quotidiennes
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # ⚠️ LOAD-BEARING. Sans `isWALArchiver: true`, le plugin est chargé mais `archive_command`
      # n'est pas réécrite : les sauvegardes de base partiraient bien dans le bucket, sans aucun
      # WAL pour les compléter. Elles seraient vertes, et le PITR silencieusement inexistant.
      isWALArchiver: true
      parameters:
        barmanObjectName: forgejo-db-store
        # ⚠️ serverName d'ÉCRITURE, explicite et OBLIGATOIREMENT distinct de celui lu par
        # `bootstrap.recovery` ci-dessus. Omis, il vaudrait le nom du `Cluster` (`forgejo-db`) :
        # le cluster repris archiverait alors par-dessus les WAL de sa source et DÉTRUIRAIT la
        # sauvegarde dont il vient. C'est le piège n°6 de `cnpg-barman-plugin-script.sh`, et c'est
        # la seule raison pour laquelle le script refuse de restaurer sous le nom d'origine.
        #
        # ⚠️ À INCRÉMENTER À CHAQUE REPRISE (v2 → v3 → …), en recopiant l'ancienne valeur dans
        # `externalClusters[0].plugin.parameters.serverName`. Les deux se déplacent ensemble.
        #
        # ⚠️ ET LA CIBLE DOIT N'AVOIR JAMAIS SERVI, pas seulement être différente de la source :
        # barman refuse de démarrer sur un prefix non vide — « WAL archive check failed for server
        # <nom>: Expected empty archive ». Un `serverName` où quoi que ce soit a déjà été archivé,
        # ne serait-ce que par un cluster jetable, est BRÛLÉ définitivement. Constaté le 2026-09-09 :
        # `forgejo-db-v2` a été consommé par un `initdb` accidentel de quelques minutes, ce qui a
        # fait échouer la reprise suivante — d'où le saut direct à v3. En cas de doute sur un
        # numéro, en prendre un neuf : ils ne coûtent rien, et vérifier coûte un aller-retour GCS.
        #
        # ⚠️ Juste après une reprise, ce serverName n'a AUCUNE sauvegarde de base : la fenêtre PITR
        # de la nouvelle génération est vide jusqu'à la première. En prendre une IMMÉDIATEMENT —
        # `script/cnpg-barman-plugin-script.sh backup` — sans attendre la ScheduledBackup.
        serverName: forgejo-db-v5

  # --- Métriques ---
  # Expose le collecteur sur le port `metrics` (9187) de chaque pod d'instance. C'est là que se
  # lisent `cnpg_pg_stat_archiver_*` et `cnpg_collector_last_available_backup_timestamp`, donc
  # tout ce qui permet de voir mourir la chaîne de sauvegarde.
  #
  # ⚠️ `enablePodMonitor` reste à FALSE, et c'est délibéré : l'opérateur poserait bien un
  # PodMonitor, mais sans le label `release: kube-prometheus-stack` qu'exige le sélecteur de
  # Prometheus — il ne serait jamais scrapé, et rien ne le dirait. Le PodMonitor est donc écrit à
  # la main dans [cnpg-monitoring](../../cnpg-monitoring/README.md), comme celui de
  # velero-monitoring. Les métriques, elles, sont servies sans condition par le collecteur : il
  # n'y a rien à activer ici.
  monitoring:
    enablePodMonitor: false

  # --- Co-localisation avec Forgejo ---
  #
  # Ce n'est pas une optimisation de latence, c'est une réduction du domaine de panne. Le stockage
  # du cluster est node-local et NON répliqué (`openebs-lvm-thin`, cf. infra/openebs/README.md) :
  # le PV colle son pod à un nœud par `nodeAffinity`, et perdre le nœud rend le volume injoignable.
  # Laisser le scheduler séparer la base et l'applicatif fait donc dépendre Forgejo de DEUX nœuds
  # au lieu d'un, sans rien gagner en disponibilité — aucun des deux volumes n'a de copie
  # ailleurs. Les réunir borne la casse à une seule machine, et supprime au passage un aller-retour
  # réseau sur chaque requête SQL.
  affinity:
    # ⚠️ Règle en SENS UNIQUE : c'est la base qui suit Forgejo, jamais l'inverse. Deux règles
    # `required` symétriques se bloqueraient mutuellement — une affinité de pod exige que la
    # cible soit DÉJÀ schedulée, donc aucun des deux pods ne pourrait partir en premier.
    #
    # Ordre d'atterrissage attendu au premier déploiement : le pod Forgejo n'a aucune contrainte,
    # il est schedulé et son PVC se lie (`WaitForFirstConsumer`) ; le pod CNPG reste `Pending`
    # tant que ce pod n'existe pas, puis le rejoint. Entre les deux, l'init-container
    # `configure-gitea` boucle sur `gitea migrate` faute de base — comportement prévu par le
    # chart, qui journalise « Forgejo migrate might fail due to database connection ».
    #
    # ⚠️ À ne PAS ajouter après coup sur un déploiement vivant dont les deux volumes seraient
    # déjà sur des nœuds différents : les PV épinglant chacun leur pod, la contrainte devient
    # insatisfiable et le pod CNPG reste `Pending` indéfiniment. Il faudrait alors migrer un
    # volume (sauvegarde, suppression du PVC, recréation) avant de poser la règle.
    additionalPodAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        # Sélecteur des pods Forgejo (`gitea.selectorLabels` du chart). Pas de champ `namespaces` :
        # une affinité de pod se limite par défaut au namespace du pod schedulé, soit `forgejo`.
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo
              app.kubernetes.io/instance: forgejo
          topologyKey: kubernetes.io/hostname

    # Anti-affinité générée par l'opérateur : coupée. Elle n'écarte que les instances D'UN MÊME
    # `Cluster` les unes des autres — avec `instances: 1` elle n'a aucun pair à écarter et ne
    # produit qu'une règle morte. Elle est de toute façon `preferred` (un score, pas une
    # contrainte) et ne pourrait pas contredire l'affinité `required` ci-dessus ; la couper rend
    # simplement l'intention lisible dans le pod rendu.
    #
    # ⚠️ À REMETTRE À `true` le jour où `instances` passe à 2 ou plus : sans elle, deux instances
    # de la même base peuvent atterrir sur le même nœud, ce qui annule la réplication.
    enablePodAntiAffinity: false
