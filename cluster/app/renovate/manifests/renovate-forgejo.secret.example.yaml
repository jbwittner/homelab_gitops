# EXEMPLE — versionné, sans aucune valeur réelle. Copie de référence du template de scellement
# `renovate-forgejo.secret.yaml`, qui est gitignoré (`*.secret.yaml`) ET que la procédure de
# scellement demande de SUPPRIMER une fois `kubeseal` passé. Sans ce fichier-ci, la raison d'être
# des deux clés disparaîtrait avec lui : `renovate-forgejo.sealed.yaml` ne conserve rien, un
# `SealedSecret` ne porte que du chiffré, pas les commentaires du clair dont il est issu.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient que
# des `REMPLACER`. Il se recopie, il ne s'applique pas.
#
#   cp manifests/renovate-forgejo.secret.example.yaml manifests/renovate-forgejo.secret.yaml
#
# ⚠️ Le nom de la copie compte : `*.secret.yaml` est le motif du `.gitignore`. Un fichier nommé
# autrement serait suivi par Git en clair — avec un jeton de forge dedans.
#
# ⚠️ Ne jamais renseigner ce fichier-ci « juste pour tester » : son nom ne correspond PAS au motif
# gitignoré, il serait committé avec ses valeurs.
#
# --------------------------------------------------------------------------------------------
#
# Scellement (cf. cluster/infra/sealed-secrets/README.md) :
#
#   kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#     < cluster/app/renovate/manifests/renovate-forgejo.secret.yaml \
#     > cluster/app/renovate/manifests/renovate-forgejo.sealed.yaml
#   rm cluster/app/renovate/manifests/renovate-forgejo.secret.yaml
#
# Puis DÉCOMMENTER la ligne correspondante dans `kustomization.yaml`, dans le même commit.
#
# ⚠️ Le `SealedSecret` est chiffré pour le couple (`renovate-forgejo`, `renovate`) : le
# renommer ou le déplacer de namespace le rend indéchiffrable, il faut resceller.
#
# --------------------------------------------------------------------------------------------
#
# DEUX clés, DEUX jetons DIFFÉRENTS — c'est la différence avec `renovate-github` (bot GitHub), où le
# même PAT est saisi deux fois :
#
#   - `RENOVATE_TOKEN`            → jeton d'accès **Forgejo** du compte bot : authentification à
#                                   la plateforme, découverte des dépôts, création des PR.
#                                   Forgejo → Paramètres → Applications → Générer un jeton, avec
#                                   les scopes `write:repository`, `write:issue`, `write:user`,
#                                   `read:organization`.
#
#   - `RENOVATE_GITHUB_COM_TOKEN` → PAT **github.com**, en LECTURE PUBLIQUE seulement (un
#                                   fine-grained PAT sans aucune permission suffit). Il ne sert
#                                   pas à la forge : il sert aux lookups de releases et aux
#                                   changelogs (datasources `github-releases`, `github-tags`),
#                                   dont les dépendances des dépôts Forgejo dépendent aussi.
#
# ⚠️ Omettre `RENOVATE_GITHUB_COM_TOKEN` ne casse rien au démarrage : le Job monte le Secret en
# `envFrom` et tourne. Le symptôme est plus loin — les lookups partent en anonyme et se font
# rate-limiter (60 req/h par IP) : PR sans changelog, et surtout updates silencieusement manquées.
#
# ⚠️ Le périmètre scanné ne se règle PAS ici, ni dans le CronJob (il est en autodiscover) : il est
# exactement l'ensemble des dépôts auxquels le compte bot a accès dans Forgejo.
apiVersion: v1
kind: Secret
metadata:
  name: renovate-forgejo
  namespace: renovate
type: Opaque
stringData:
  RENOVATE_TOKEN: "REMPLACER"
  RENOVATE_GITHUB_COM_TOKEN: "REMPLACER"
