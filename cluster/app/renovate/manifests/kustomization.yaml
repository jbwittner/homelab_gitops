apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renovate
resources:
  - namespace.yaml
  #
  # --- Secrets scellés : DEUX lignes commentées, une par forge ---------------------------------
  #
  # ⚠️ Elles sont commentées et non simplement absentes parce qu'un `resources:` pointant un
  # fichier MANQUANT fait échouer le `kustomize build` ENTIER : l'Application partirait en
  # `ComparisonError` et ni le namespace ni les CronJobs ne seraient posés. Commentées, tout se
  # déploie et seul le Job concerné échoue — localement et lisiblement
  # (`CreateContainerConfigError`, `secretKeyRef` introuvable).
  #
  # Décommenter une ligne DANS LE MÊME COMMIT que la production du fichier scellé correspondant
  # (cf. README §Câblage des secrets, et les en-têtes des `*.secret.example.yaml`).
  #
  # ⚠️ Un fichier scellé VIDE (0 octet) ne fait PAS échouer le build : kustomize l'accepte et ne
  # rend rien. C'est précisément le piège dans lequel ce dépôt est déjà tombé une fois — le Job
  # tournait sur un Secret orphelin que plus personne ne gérait, et rien ne le signalait.
  #
  - renovate-forgejo.sealed.yaml    # bot Forgejo → Secret `renovate-forgejo`
  #
  # ⚠️ Les `*.secret.example.yaml` ne vont JAMAIS ici : ils ne contiennent que des `REMPLACER`.
  #
  - cron-job-forgejo.yaml
