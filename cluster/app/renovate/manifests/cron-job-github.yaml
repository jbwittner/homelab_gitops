# Bot Renovate de la forge **GitHub** (github.com). Son jumeau pour la forge auto-hébergée est
# `cron-job-forgejo.yaml` : deux CronJobs et non un seul parce que `platform` est un réglage
# GLOBAL de Renovate, pas un réglage par dépôt — un même run ne peut pas parler aux deux forges.
#
# ⚠️ Les deux fichiers portent le MÊME tag d'image, et ce n'est pas cosmétique : le manager
# `kubernetes` de `renovate.json` (racine) voit les deux, et le bump de `renovate/renovate` arrive
# en une seule PR touchant les deux lignes, automergée. Les désaligner casse cette propriété.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-github
spec:
  # Tous les soirs : le cooldown supply-chain est porté par minimumReleaseAge (7 jours)
  # dans renovate.json, pas par la cadence du cron. Un run quotidien évite d'ajouter
  # jusqu'à 7 jours d'attente par-dessus le cooldown.
  #
  # ⚠️ 02:00 et non 01:00 pour ne PAS chevaucher le bot Forgejo : les deux consomment le même
  # quota d'API github.com pour les lookups de releases (`RENOVATE_GITHUB_COM_TOKEN` est présent
  # dans les deux Secrets). `concurrencyPolicy: Forbid` ne protège de rien ici — il s'applique
  # par CronJob et n'empêche pas deux CronJobs distincts de tourner ensemble.
  schedule: "0 2 * * *"
  timeZone: "Europe/Paris"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate
              image: renovate/renovate:44.14.10
              # Liste explicite (`RENOVATE_AUTODISCOVER: "false"` plus bas) : ajouter un dépôt
              # GitHub = éditer ces args, commit + push. Le bot Forgejo, lui, est en autodiscover.
              #
              # ⚠️ `jbwittner/homelab_gitops` a été RETIRÉ de cette liste : depuis la bascule de la
              # source du GitOps vers Forgejo, le dépôt GitHub du même nom n'est plus qu'un
              # MIROIR en lecture seule (cf. README.md racine). Une PR ouverte ici serait soit
              # refusée au push, soit écrasée à la synchro suivante du miroir. C'est le bot
              # `renovate-forgejo`, en autodiscover, qui le prend en charge — sans rien à
              # déclarer, le dépôt étant visible par son compte bot.
              args:
                - jbwittner/homelab_gitops
                - jbwittner/homelab_terraform
              env:
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                - name: RENOVATE_GIT_AUTHOR
                  value: "jbwittner <jeanbaptiste.wittner@outlook.com>"
                # Plafonne le heap V8 sous la limite du conteneur : Node déclenche un GC au lieu
                # de se faire tuer par le cgroup (exit 137, logs trompeurs car ils semblent complets).
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=2048"
              # ⚠️ Ce Secret s'appelait `renovate-env` jusqu'au renommage. Un objet de ce nom
              # traîne peut-être encore dans le namespace : c'est le Secret ORPHELIN laissé par
              # l'ancien ExternalSecret (`deletionPolicy: Retain`), et c'est lui qui
              # servait ce bot. Il ne correspond plus. Tant que le SealedSecret `renovate-github`
              # n'est pas produit, ce Job échoue en `CreateContainerConfigError` — échec franc et
              # immédiat, à la différence de la situation d'avant où il tournait sur un Secret
              # que plus personne ne gérait. Récupérer le PAT dans l'orphelin avant de le purger :
              #   kubectl -n renovate get secret renovate-env -o jsonpath='{.data.RENOVATE_TOKEN}' | base64 -d
              envFrom:
                - secretRef:
                    name: renovate-github
              resources:
                requests:
                  memory: 1Gi
                  cpu: 100m
                limits:
                  memory: 3Gi
          restartPolicy: Never