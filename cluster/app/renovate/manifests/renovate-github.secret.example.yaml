# EXEMPLE — versionné, sans aucune valeur réelle. Copie de référence du clair
# `renovate-github.secret.yaml` (gitignoré par `*.secret.yaml`, et SUPPRIMÉ une fois scellé). Un
# `SealedSecret` ne porte que du chiffré : sans ce fichier, la procédure disparaîtrait.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient que
# des `REMPLACER`. Il se recopie, il ne s'applique pas.
#
# ⚠️ Ne jamais renseigner ce fichier-ci « juste pour tester » : son nom ne correspond PAS au motif
# gitignoré, il serait committé avec ses valeurs.
#
# --------------------------------------------------------------------------------------------
#
# CE QUE C'EST : l'identité **GitHub App** du bot `renovate-github`. Trois fichiers, montés en
# volume sous /etc/renovate-github-app, à partir desquels `config.mjs` fabrique à chaque run un
# jeton d'installation (1 h) — Renovate ne sait pas le faire seul.
#
# Pourquoi une App et pas un PAT : pas d'expiration (un fine-grained PAT expire au plus tard à un
# an, et la panne est silencieuse — plus de PR, aucune alerte), rattachée à aucun compte humain
# (PR et automerges signés `<slug>[bot]`), périmètre fixé par l'installation.
#
# ⚠️ App DÉDIÉE, distincte de celle d'ArgoCD (`repo-homelab-gitops-github`) : celle-ci écrit,
# celle d'ArgoCD ne fait que lire. Les fusionner donnerait l'écriture au moteur GitOps.
#
# --------------------------------------------------------------------------------------------
#
# 1. Créer l'App : GitHub → Settings → Developer settings → GitHub Apps → New GitHub App
#      Nom          : unique sur tout GitHub, ex. `renovate-bleu-kalecgos` — il devient le
#                     `<slug>[bot]` qui signe PR et commits
#      Homepage URL : obligatoire, sans effet (https://docs.renovatebot.com)
#      Webhook      : DÉCOCHER « Active » — le bot est un CronJob, il n'écoute rien
#      Permissions  : Repository, et rien d'autre (cf. README §Droits de la GitHub App) :
#                       Administration      Read-only
#                       Checks              Read and write
#                       Commit statuses     Read and write
#                       Contents            Read and write
#                       Dependabot alerts   Read-only
#                       Issues              Read and write
#                       Metadata            Read-only (imposé)
#                       Pull requests       Read and write
#                       Workflows           Read and write
#      Installable  : Only on this account
#    → noter l'**App ID** (page de l'App, en haut).
#
# 2. Générer la clé privée : page de l'App → Private keys → Generate a private key (un `.pem` est
#    téléchargé). ⚠️ Affichée une seule fois ; GitHub n'en garde que l'empreinte.
#
# 3. Installer l'App : page de l'App → Install App → compte `jbwittner` → **Only select
#    repositories** → `homelab_gitops`, `homelab_terraform`. L'**Installation ID** est le nombre
#    en fin d'URL de la page d'installation (`github.com/settings/installations/<ID>`).
#
#    ⚠️ Cette sélection EST le périmètre de Renovate (autodiscover) : tout dépôt coché sera scanné,
#    et recevra une PR d'onboarding au run suivant. « All repositories » = tous les dépôts du
#    compte, avec l'écriture donnée à l'App sur chacun.
#
# 4. Produire le clair. La clé PEM est multi-ligne : on ne la colle PAS dans ce template à la
#    main (une indentation de travers = clé illisible). On génère l'objet :
#
#      SEC=cluster/app/renovate/manifests/renovate-github.secret.yaml
#      kubectl -n renovate create secret generic renovate-github --dry-run=client -o yaml \
#          --from-literal=app-id=REMPLACER \
#          --from-literal=installation-id=REMPLACER \
#          --from-file=private-key.pem=REMPLACER.pem \
#        > "$SEC"
#
#    ⚠️ Les noms de clés (`app-id`, `installation-id`, `private-key.pem`) sont les noms de fichiers
#    que lit `config.mjs` : une faute de frappe = « ENOENT … » dans les logs du Job.
#    ⚠️ Le nom de la copie compte : `*.secret.yaml` est le motif du `.gitignore`.
#
# 5. Sceller (cf. cluster/infra/sealed-secrets/README.md §Sceller un Secret) :
#
#      kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#        < "$SEC" > cluster/app/renovate/manifests/renovate-github.sealed.yaml
#      rm "$SEC" REMPLACER.pem
#
#    ⚠️ Vérifier le CONTENU du `.sealed.yaml` (trois clés sous `encryptedData`), pas son existence :
#    un fichier scellé vide ne fait pas échouer `kustomize build`, il ne rend rien.
#    ⚠️ Chiffré pour le couple (`renovate-github`, `renovate`) : le renommer ou le changer de
#    namespace le rend indéchiffrable.
#    ⚠️ Supprimer le `.pem` : il est dans le `SealedSecret`, et GitHub en régénère un à la demande.
#
# ROTATION : générer une NOUVELLE clé privée (étape 2), refaire 4 → 5, committer, attendre que le
# Secret soit à jour dans le cluster, PUIS supprimer l'ancienne clé côté GitHub. Le run suivant
# prend la nouvelle clé d'office : elle est relue à chaque démarrage.
apiVersion: v1
kind: Secret
metadata:
  name: renovate-github
  namespace: renovate
type: Opaque
stringData:
  app-id: "REMPLACER"
  installation-id: "REMPLACER"
  private-key.pem: |
    REMPLACER
