# EXEMPLE — versionné, sans aucune valeur réelle. C'est la copie de référence du template de
# scellement `renovate-env.secret.yaml`, qui est gitignoré (`*.secret.yaml`) ET dont la procédure
# de scellement demande la SUPPRESSION une fois `kubeseal` passé. Sans ce fichier-ci, la raison
# de la duplication du token disparaîtrait avec lui : `renovate-env.sealed.yaml` ne conserve rien,
# un `SealedSecret` ne porte que du chiffré, pas les commentaires du clair dont il est issu.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient que
# des `REMPLACER`. Il se recopie, il ne s'applique pas.
#
#   cp manifests/renovate-env.secret.example.yaml manifests/renovate-env.secret.yaml
#   # renseigner les deux valeurs, puis sceller (voir plus bas)
#
# ⚠️ Le nom de la copie compte : `*.secret.yaml` est le motif du `.gitignore`. Un fichier nommé
# autrement (`renovate-clair.yaml`, `secret.yml`…) serait suivi par Git en clair — avec un PAT
# GitHub dedans.
#
# ⚠️ Ne jamais renseigner ce fichier-ci « juste pour tester » : son nom ne correspond PAS au motif
# gitignoré, il serait committé avec ses valeurs.
#
# --------------------------------------------------------------------------------------------
#
# Récupérer le PAT existant (il est encore dans openbao tant que la migration n'est pas purgée) :
#
#   kubectl -n openbao exec -ti openbao-0 -- bao kv get -field=github_token kv/homelab/renovate
#
# ⚠️ Le README parlait d'un chemin `kv/homelab/renovate/github` avec un champ `token`, alors que
# l'`ExternalSecret` lisait `key: homelab/renovate` / `property: github_token`. Seule la seconde
# forme correspond à ce qui était réellement servi. En cas de doute :
#
#   kubectl -n renovate get secret renovate-env -o jsonpath='{.data.RENOVATE_TOKEN}' | base64 -d
#
# À défaut (PAT perdu), en régénérer un sur GitHub avec les droits listés au README §Droits du
# token — un fine-grained PAT `github_pat_…`.
#
# Scellement (cf. cluster/infra/sealed-secrets/README.md §Sceller un Secret) :
#
#   kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#     < cluster/app/renovate/manifests/renovate-env.secret.yaml \
#     > cluster/app/renovate/manifests/renovate-env.sealed.yaml
#   rm cluster/app/renovate/manifests/renovate-env.secret.yaml
#
# ⚠️ Le `SealedSecret` est chiffré pour le couple (`renovate-env`, `renovate`) : le renommer ou le
# déplacer de namespace le rend indéchiffrable, il faut resceller.
#
# --------------------------------------------------------------------------------------------
#
# Renovate attend le MÊME token sous DEUX noms :
#   - `RENOVATE_TOKEN`            → authentification à la plateforme (création des PR)
#   - `RENOVATE_GITHUB_COM_TOKEN` → lookups de releases sur github.com (changelogs, tags)
#
# Contrairement à l'`ExternalSecret` qu'il remplace — une seule entrée au coffre alimentait les
# deux clés — un `SealedSecret` chiffre clé par clé : la valeur est donc à SAISIR DEUX FOIS
# ci-dessous, et la rotation demande de resceller le fichier entier avec les deux valeurs.
#
# ⚠️ Ne renseigner qu'une des deux clés ne casse rien au démarrage : le CronJob monte le Secret en
# `envFrom` et démarre. Le symptôme est plus loin — soit les PR ne se créent pas, soit elles se
# créent sans changelog et avec du rate-limiting github.com anonyme.
apiVersion: v1
kind: Secret
metadata:
  name: renovate-env
  namespace: renovate
type: Opaque
stringData:
  RENOVATE_TOKEN: "REMPLACER"
  RENOVATE_GITHUB_COM_TOKEN: "REMPLACER"
