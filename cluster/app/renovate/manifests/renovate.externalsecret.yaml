# PAT GitHub de Renovate, servi par openbao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-env
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: renovate-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Renovate attend le MÊME token sous deux noms : `RENOVATE_TOKEN` pour la plateforme, et
    # `RENOVATE_GITHUB_COM_TOKEN` pour les lookups de releases sur github.com. Une seule entrée
    # au coffre, deux clés dans le Secret — la rotation se fait donc en un seul `bao kv put`.
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: homelab/renovate
        property: github_token
    - secretKey: RENOVATE_GITHUB_COM_TOKEN
      remoteRef:
        key: homelab/renovate
        property: github_token
