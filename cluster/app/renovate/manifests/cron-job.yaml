apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  # Tous les soirs : le cooldown supply-chain est porté par minimumReleaseAge (7 jours)
  # dans renovate.json, pas par la cadence du cron. Un run quotidien évite d'ajouter
  # jusqu'à 7 jours d'attente par-dessus le cooldown.
  schedule: "0 1 * * *"
  timeZone: "Europe/Paris"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate
              image: renovate/renovate:44.14.10
              args:
                - jbwittner/homelab_gitops
                - jbwittner/homelab_terraform
              env:
                - name: LOG_LEVEL
                  value: info
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_AUTODISCOVER
                  value: "false"
                - name: RENOVATE_GIT_AUTHOR
                  value: "jbwittner <jeanbaptiste.wittner@outlook.com>"
                # Plafonne le heap V8 sous la limite du conteneur : Node déclenche un GC au lieu
                # de se faire tuer par le cgroup (exit 137, logs trompeurs car ils semblent complets).
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=2048"
              envFrom:
                - secretRef:
                    name: renovate-env
              resources:
                requests:
                  memory: 1Gi
                  cpu: 100m
                limits:
                  memory: 3Gi
          restartPolicy: Never