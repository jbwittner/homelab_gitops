# Scrape des CONTENEURS de `vert-emeriss` — `cadvisor-emeriss.lan.wittner.tech`.
#
# ⚠️ CE QU'IL AJOUTE. `scrapeconfig-vert-emeriss.yaml` mesure la MACHINE : il dit qu'il reste 8 Go
# de RAM, jamais QUI les consomme. Depuis la bascule de la forge vers Docker, cette question
# n'avait plus de réponse — le DaemonSet cAdvisor de kube-prometheus-stack ne voit que les nœuds
# Talos. C'est le seul trou que cet objet comble.
#
# ⚠️ `job="external-cadvisor"` ET NON `external-node`, alors que c'est la MÊME machine. Deux
# raisons, la première étant dirimante :
#   1. `instance` vaut `vert-emeriss` des deux côtés (voir le relabeling en bas). Avec le même
#      `job`, les deux cibles porteraient job+instance identiques : Prometheus les traiterait comme
#      des doublons et `up{job="external-node",instance="vert-emeriss"}` deviendrait ambigu — donc
#      `ExternalNodeDown` aussi.
#   2. Les règles de `prometheusrule.yaml` sélectionnent `job="external-node"` et parlent de
#      disque, de mémoire et du collecteur textfile. Aucune ne s'applique à des séries
#      `container_*`.
# ⚠️ Corollaire : `instance` étant commun aux deux jobs, une requête peut joindre les deux sources
# sur cette étiquette — « la machine manquait de RAM, et voici le conteneur qui la tenait ».
#
# ⚠️ MÊME SECRET que le scrape de node-exporter (`node-exporters`), et c'est délibéré : les deux
# piles mesurent la MÊME machine, survivent à la forge et relèvent de ce composant. Côté hôte, le
# credential vit en deux exemplaires — `/etc/node-exporter/web-config.yml` et
# `/etc/cadvisor/htpasswd` — et rien ne les synchronise. Une rotation touche donc TROIS fichiers.
# ⚠️ Et un seul des deux prend effet tout seul : nginx ne relit pas son `htpasswd` à chaud,
# contrairement à `exporter-toolkit`. Oublier `nginx -s reload` laisse cette cible seule en 401,
# ce qui ressemble à une panne plutôt qu'à une rotation inachevée.
#
# ⚠️ L'AUTHENTIFICATION EST DANS UN NGINX, pas dans l'exportateur. cAdvisor ne sait pas protéger
# `/metrics` — ni son UI, ni son API JSON, qui en dit bien plus que les métriques. Un mandataire
# local le fait à sa place et n'expose que `/metrics`. Vu d'ici, rien ne change ; vu de la machine,
# c'est ce qui empêche l'inventaire complet des conteneurs de sortir sur le LAN.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: cadvisor-vert-emeriss
  namespace: monitoring
  labels:
    # ⚠️ OBLIGATOIRE : sélecteur du prometheus-operator
    # (`scrapeConfigSelectorNilUsesHelmValues`). Sans ce label, l'objet est ignoré SANS ERREUR — la
    # cible n'apparaît simplement jamais dans /targets.
    release: kube-prometheus-stack
spec:
  staticConfigs:
    - targets:
        # Host SANS schéma ni chemin : ils sont portés par `scheme` et `metricsPath` ci-dessous.
        - cadvisor-emeriss.lan.wittner.tech
  scheme: HTTPS
  metricsPath: /metrics
  # 30s, comme le scrape de la machine. En face, `--housekeeping_interval=10s` : trois relevés par
  # scrape, assez pour que les compteurs soient frais sans brûler du CPU pour des points jetés.
  scrapeInterval: 30s
  # ⚠️ ÉGAL au `proxy_read_timeout` du nginx d'en face (10s), et ce n'est pas un hasard : au-delà,
  # c'est nginx qui coupe et renvoie 504. Mettre PLUS ici ne donnerait pas plus de temps à
  # cAdvisor, ça retarderait seulement le constat d'échec.
  scrapeTimeout: 10s
  basicAuth:
    username:
      name: node-exporters
      key: username
    password:
      name: node-exporters
      key: password
  # TLS : le proxy sert le wildcard Let's Encrypt `*.lan.wittner.tech`, CA publique déjà dans le
  # magasin du conteneur Prometheus. Pas de `tlsConfig`, et surtout PAS d'`insecureSkipVerify`.
  relabelings:
    # Sans ça, le job vaut `scrapeConfig/monitoring/cadvisor-vert-emeriss`.
    - targetLabel: job
      replacement: external-cadvisor
    # ⚠️ MÊME valeur que dans `scrapeconfig-vert-emeriss.yaml` : c'est la même machine, et c'est
    # cette étiquette qui permet de joindre les deux sources. Sans ce relabeling, `instance`
    # vaudrait le hostname de scrape — le nom du CHEMIN D'ACCÈS, pas celui de la machine.
    - targetLabel: instance
      replacement: vert-emeriss
