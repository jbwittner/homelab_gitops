apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ⚠️ ns `monitoring` : c'est celui du prometheus-operator, et la ScrapeConfig doit partager le
# namespace du Secret de son authentification.
namespace: monitoring
resources:
  - prometheusrule.yaml
  # Un fichier par MACHINE **et par exportateur**. En ajouter une seconde est une ligne de plus ici
  # et un fichier de plus à côté — jamais une modification des règles, qui sont écrites sur
  # `job="external-node"` et se ventilent par `instance`.
  - scrapeconfig-vert-emeriss.yaml
  # ⚠️ MÊME machine que la ligne ci-dessus, autre exportateur, donc autre `job`
  # (`external-cadvisor`) : `instance` valant `vert-emeriss` des deux côtés, un job commun ferait
  # deux cibles job+instance identiques — des doublons, et un `up` ambigu. Le fichier l'explique.
  - scrapeconfig-cadvisor-vert-emeriss.yaml
  #
  # --- Secret scellé du basic auth des node-exporter : ligne COMMENTÉE ------------------------
  #
  # ⚠️ Commentée et non absente : un `resources:` pointant un fichier MANQUANT fait échouer le
  # `kustomize build` ENTIER — l'Application partirait en `ComparisonError` et les règles ne
  # seraient pas posées non plus. Commentée, tout se déploie et seul le scrape échoue,
  # lisiblement (cible en erreur `secret "node-exporters" not found`).
  #
  # ⚠️ Un fichier scellé VIDE (0 octet) ne fait PAS échouer le build : kustomize l'accepte et ne
  # rend rien. Vérifier le CONTENU, pas l'existence — ce dépôt est déjà tombé dans ce piège.
  #
  # Tant qu'elle est commentée, la machine n'est pas surveillée — ET les trois alertes de
  # sauvegarde de `forgejo-monitoring` sont aveugles, puisqu'elles transitent par ce scrape.
  #
  # Décommenter DANS LE MÊME COMMIT que la production du fichier scellé
  # (cf. `node-exporters.secret.example.yaml`).
  #
  - node-exporters.sealed.yaml
  #
  # ⚠️ Les `*.secret.example.yaml` ne vont JAMAIS ici : ils ne contiennent que des `REMPLACER`.
