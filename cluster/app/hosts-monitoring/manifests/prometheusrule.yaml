# Alertes des machines HORS CLUSTER.
#
# ⚠️ PRINCIPE DIRECTEUR, hérité de `forgejo-monitoring` et de l'incident du 2026-09-09 : une
# expression qui compare une série ABSENTE ne se déclenche JAMAIS. **Série absente ≠ série à
# zéro.** Chaque valeur surveillée ici est donc doublée d'un `absent(...)`, exactement comme
# `VeleroBackupTooOld` / `VeleroNoBackupMetric`. Les deux se déplacent ensemble ; en garder une
# seule rouvre le trou.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-node-alerts
  namespace: monitoring
  labels:
    # ⚠️ OBLIGATOIRE : sélecteur du prometheus-operator (`ruleSelectorNilUsesHelmValues`). Sans ce
    # label, l'objet est ignoré SANS ERREUR — les règles n'existent simplement jamais.
    release: kube-prometheus-stack
spec:
  groups:
    # ═══════════════════════════════════════════════════════════════════════════════════════════
    - name: external-node.rules
    # ═══════════════════════════════════════════════════════════════════════════════════════════
    # Les machines HORS CLUSTER, une seule aujourd'hui : `vert-emeriss`
    # (`scrapeconfig-vert-emeriss.yaml`). Ces règles n'existaient pas avant le 2026-09-11 : le
    # DaemonSet node-exporter du cluster couvrait cette charge tant qu'elle y tournait, et la
    # bascule vers Docker a emporté cette source sans la remplacer.
    #
    # ⚠️ AUCUNE RÈGLE ICI NE NOMME UNE MACHINE. Elles sélectionnent `job="external-node"` et se
    # ventilent par `instance` : ajouter une machine au composant est un fichier de ScrapeConfig
    # de plus, et rien d'autre. C'est la raison pour laquelle ce groupe ne s'appelle pas
    # `vert-emeriss.rules`.
    #
    # ⚠️ AUCUNE DES ~40 RÈGLES `node-exporter.rules` DE kube-prometheus-stack NE S'APPLIQUE ICI.
    # Elles sélectionnent toutes `job="node-exporter"`, et ces cibles portent `job="external-node"`
    # (choix documenté dans `scrapeconfig-vert-emeriss.yaml` : prendre l'autre nom ferait entrer une
    # machine hors cluster dans les dashboards et les agrégations des nœuds Talos). Le prix se paie
    # ici, en écrivant à la main les quelques règles qui comptent — et le piège est de croire
    # qu'elles arrivent gratuitement.
      rules:
        # La machine ne répond plus, ou le chemin qui y mène est coupé : hôte éteint, conteneur
        # node-exporter arrêté, reverse proxy qui ne route plus le hostname, certificat expiré, ou
        # mot de passe de scrape divergent (401).
        #
        # ⚠️ 10 min, comme `ForgejoDown` : un redémarrage de l'hôte ou une montée de version de
        # l'exportateur ne doit pas devenir une alerte critique.
        - alert: ExternalNodeDown
          expr: up{job="external-node"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} : la machine ne répond plus"
            description: "Le scrape du node-exporter de {{ $labels.instance }} échoue depuis 10 min. ⚠️ CETTE CIBLE TRANSPORTE AUSSI LES MÉTRIQUES DE SAUVEGARDE DE LA FORGE (`forgejo_backup_*`, déposées dans le collecteur textfile) : les trois alertes de `forgejo-backup.rules`, dans le composant forgejo-monitoring, sont aveugles tant que cet état dure. Diagnostic dans l'ordre : le message d'erreur exact de la cible dans Prometheus (/targets), puis le service que porte la machine — s'il répond, c'est la supervision qui est morte, pas la machine. Un 401 n'est pas une panne : c'est le mot de passe de scrape qui a divergé (cf. node-exporters.secret.example.yaml)."

        # Complément INDISPENSABLE de la précédente : `== 0` ne peut rien dire d'une série qui
        # n'existe plus. Même raisonnement que `ForgejoScrapeMissing` ci-dessus, et même couple
        # valeur + `absent(...)` — en garder une seule rouvre le trou.
        - alert: ExternalNodeScrapeMissing
          expr: absent(up{job="external-node"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "plus aucune machine hors cluster n'est surveillée"
            description: "Plus aucune série `up{job=\"external-node\"}` depuis 15 min : ce n'est pas une panne de machine, c'est la SURVEILLANCE qui a disparu — et avec elle celle des sauvegardes de la forge, qui transitent par ce scrape. Vérifier `kubectl -n monitoring get scrapeconfig -l release=kube-prometheus-stack` (le label manquant fait ignorer l'objet SANS erreur), puis `kubectl -n argocd get app hosts-monitoring`. Tant que cette alerte sonne, l'absence d'ExternalNodeDown et de ForgejoBackupTooOld ne prouve RIEN."

        # --- cAdvisor : la question « QUI consomme » ------------------------------------------
        # ⚠️ `warning` et non `critical`, contrairement aux deux règles ci-dessus, et l'écart est
        # voulu : perdre cette cible ne fait perdre aucune surveillance de PANNE. Le disque, la
        # mémoire et la fraîcheur des sauvegardes continuent d'être vus par `external-node`. Ce
        # qu'on perd, c'est l'ATTRIBUTION — « la machine manquait de RAM » sans pouvoir dire quel
        # conteneur la tenait. Un réveil nocturne pour ça serait mal payé.
        #
        # ⚠️ PAS de `absent(...)` en complément, contrairement au couple `external-node`. Ici la
        # disparition de la série est couverte par `ExternalNodeScrapeMissing` : les deux cibles
        # sont posées par le MÊME composant et le même Secret, donc ce qui efface l'une efface
        # l'autre. Une règle `absent` de plus sonnerait en double sans rien apprendre.
        #
        # ⚠️ UN 401 ICI ALORS QUE `external-node` VA BIEN a une cause et une seule : la rotation du
        # mot de passe a été faite dans `/etc/node-exporter/web-config.yml` et dans le Secret, mais
        # pas dans `/etc/cadvisor/htpasswd` — ou bien elle y a été faite sans `nginx -s reload`,
        # nginx ne relisant pas ce fichier à chaud. Ce n'est pas une panne, c'est une rotation
        # inachevée.
        - alert: ExternalCadvisorDown
          expr: up{job="external-cadvisor"} == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} : plus de métriques par conteneur"
            description: "Le scrape de cAdvisor sur {{ $labels.instance }} échoue depuis 30 min. La surveillance de la MACHINE n'est pas touchée — disque, mémoire et sauvegardes passent par `external-node`. Ce qui est perdu est l'attribution par conteneur. Diagnostic : `docker compose -f cadvisor/compose.yaml logs cadvisor` sur l'hôte (un 502 côté nginx veut dire que cAdvisor ne répond pas, nginx allant bien — il résout à chaque requête). Un 401 pendant qu'`external-node` va bien n'est PAS une panne : c'est `/etc/cadvisor/htpasswd` qui a manqué la rotation, ou le `nginx -s reload` qui a été oublié."

        # ⚠️ LE MODE DE PANNE LE PLUS PROBABLE DE CETTE FORGE, et celui qui n'était couvert par
        # rien entre le 2026-09-11 et ce composant. Dépôts (`/srv`), base (`/srv`) et dumps
        # (`/var/backups/forgejo`) se partagent le stockage d'une seule machine : un disque plein
        # arrête la forge ET la sauvegarde, donc supprime en même temps le service et le moyen de
        # le reconstruire.
        #
        # ⚠️ `fstype` N'EST PAS FILTRÉ ICI : il l'est AU SCRAPE, par les deux
        # `--collector.filesystem.*-exclude` de la pile node-exporter. Filtrer aux deux endroits
        # ferait diverger les deux listes en silence ; le seul filtre est celui de l'exportateur.
        - alert: ExternalNodeDiskAlmostFull
          expr: node_filesystem_avail_bytes{job="external-node"} / node_filesystem_size_bytes{job="external-node"} < 0.10
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} : {{ $labels.mountpoint }} à moins de 10 % libres"
            description: "Il reste moins de 10 % sur {{ $labels.mountpoint }} de {{ $labels.instance }} ({{ $value | humanizePercentage }} libres). ⚠️ Sur `vert-emeriss`, dépôts, base et dumps partagent le stockage : un disque plein arrête la forge ET sa sauvegarde, donc supprime en même temps le service et le moyen de le reconstruire. `/var/backups/forgejo` a un volume dédié et s'élague avec `forgejo-ctl` (KEEP_LOCAL=2) ; `/srv` s'agrandit en ligne par `lvextend -r` s'il reste des extents au VG."

        # Le complément TEMPOREL du seuil ci-dessus, et il attrape ce qu'un seuil ne peut pas : un
        # remplissage lent et régulier. À 12 % libres et une pente constante, `ExternalNodeDiskAlmostFull`
        # se tait — et se réveillera un dimanche. Quatre jours de préavis, c'est le temps de
        # décider d'un `lvextend` plutôt que de le subir.
        #
        # ⚠️ `predict_linear` sur 6 h de fenêtre : trop court, il s'affole sur le pic d'une
        # sauvegarde ; trop long, il lisse la fuite qu'on cherche. La `for: 1h` filtre le reste.
        # ⚠️ Le second terme est LOAD-BEARING : sans lui, un système de fichiers à 2 % libres et
        # stable ne déclenche pas (pente nulle, prédiction plate) alors qu'il est déjà critique —
        # et un système à 95 % libres qui décroît vite déclencherait pour rien.
        - alert: ExternalNodeDiskWillFill
          expr: |
            predict_linear(node_filesystem_avail_bytes{job="external-node"}[6h], 4 * 24 * 3600) < 0
            and
            node_filesystem_avail_bytes{job="external-node"} / node_filesystem_size_bytes{job="external-node"} < 0.30
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} : {{ $labels.mountpoint }} sera plein sous 4 jours"
            description: "À la pente des 6 dernières heures, {{ $labels.mountpoint }} de {{ $labels.instance }} atteint zéro sous 4 jours. C'est un préavis, pas un incident : agir maintenant (élagage, `lvextend -r`) coûte une commande, attendre `ExternalNodeDiskAlmostFull` coûte une indisponibilité."

        # Mémoire réellement disponible, pas « libre » : `MemAvailable` tient compte du cache
        # récupérable, `MemFree` ne le fait pas et affolerait en permanence sur une machine saine.
        #
        # ⚠️ 20 min de `for`, et pas moins : `vert-emeriss` a un plancher de 2 Go et l'indexeur de
        # dépôts de Forgejo (`REPO_INDEXER_ENABLED`) fait un pic mémoire à la réindexation. Le
        # `for` laisse passer ce pic ; un OOM, lui, tue le conteneur et se voit par `ForgejoDown`,
        # dans l'AUTRE composant — d'où l'intérêt de celle-ci, qui nomme la cause.
        - alert: ExternalNodeMemoryPressure
          expr: node_memory_MemAvailable_bytes{job="external-node"} / node_memory_MemTotal_bytes{job="external-node"} < 0.10
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} : moins de 10 % de mémoire disponible"
            description: "Moins de 10 % de `MemAvailable` depuis 20 min sur {{ $labels.instance }}. Le swap y est un filet pour les pics, pas un étage de stockage : une pression durable finit en OOM-kill — qui se verra par une alerte de service (ForgejoDown) sans en nommer la cause. C'est cette alerte-ci qui la nomme."

        # ⚠️ RÈGLE MÉTA : elle ne surveille pas la machine, elle surveille le CANAL par lequel
        # arrivent les métriques de sauvegarde. node-exporter qui rencontre un `.prom` illisible
        # ou mal formé n'abandonne PAS ce fichier — il abandonne TOUT le collecteur textfile.
        # Vérifié en conditions réelles le 2026-09-11 : un fichier tronqué fait disparaître
        # l'intégralité des séries `forgejo_backup_*` et lever ce compteur à 1.
        #
        # Sans cette règle, la panne se présenterait comme `ForgejoBackupNoMetric` — c'est-à-dire
        # comme « aucune sauvegarde n'a jamais abouti », ce qui est faux et envoie diagnostiquer au
        # mauvais endroit. Causes usuelles : mode 0600 au lieu de 0644 (le conteneur tourne en
        # `nobody`), ou une écriture non atomique surprise en plein scrape.
        - alert: ExternalNodeTextfileCollectorFailing
          expr: node_textfile_scrape_error{job="external-node"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} : le collecteur textfile est en erreur"
            description: "node-exporter ne parvient pas à lire un fichier de `/var/lib/node_exporter/textfile` sur {{ $labels.instance }} et abandonne de ce fait TOUT le collecteur. Aujourd'hui un seul producteur en dépend : `forgejo_backup_*`, qui n'arrive donc plus. ⚠️ Ne pas lire ForgejoBackupNoMetric comme « aucune sauvegarde » tant que celle-ci sonne — la sauvegarde tourne peut-être très bien. Sur l'hôte : `sudo forgejo-ctl status`, section « Métrique publiée à node-exporter » — elle nomme le fichier et son mode (0644 attendu)."
