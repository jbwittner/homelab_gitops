# Modèle EN CLAIR du Secret `donetick-env`. Ce fichier-ci est un *exemple* versionné : il ne
# contient aucune valeur réelle et n'est PAS référencé par kustomization.yaml.
#
# Le fichier de travail se nomme `donetick-env.secret.yaml` — le glob `*.secret.yaml` du
# .gitignore le tient hors de Git. Le remplir, le sceller, puis le supprimer (cf. README.md
# §Câblage du secret).
#
# ⚠️ DT_JWT_SECRET signe les sessions. L'image donetick embarque un défaut dans son
# `config/selfhosted.yaml` amont — `change_this_to_a_secure_random_string_32_characters_long`,
# une valeur PUBLIQUE, identique pour toutes les instances : quiconque la connaît peut forger un
# jeton de session valide. C'est la raison pour laquelle ce Secret est en `envFrom` obligatoire
# et non `optional: true` : sans lui le pod refuse de démarrer, ce qui est l'échec voulu. Ne
# JAMAIS « débloquer » le composant en rendant la référence optionnelle — ça ne le répare pas,
# ça le met en ligne avec une clé connue de tous.
#
# Une rotation invalide toutes les sessions en cours. ⚠️ Elle N'EST PAS prise en compte toute
# seule : contrairement à `hermes` et `forgejo-runner`, le fichier scellé n'entre dans AUCUN
# configMapGenerator ici — le seul générateur (`donetick-vars`) est en `envs:` et est consommé par
# `envFrom.configMapRef`, donc y ajouter ce fichier créerait une variable d'environnement parasite.
# Le pod template ne bouge donc pas quand le Secret change, et ArgoCD reste `Synced` sans rien
# redémarrer. Après un rescellement : `kubectl -n donetick rollout restart statefulset/donetick`.
apiVersion: v1
kind: Secret
metadata:
  name: donetick-env
  namespace: donetick
type: Opaque
stringData:
  # openssl rand -base64 48
  DT_JWT_SECRET: REMPLACER
