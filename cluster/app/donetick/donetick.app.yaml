apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: donetick
  namespace: argocd
  labels:
    app.kubernetes.io/name: donetick
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: task-manager
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://forgejo.wittner.tech/jbwittner/homelab_gitops.git
    targetRevision: main
    path: cluster/app/donetick/manifests
  destination:
    name: bleu-kalecgos
    namespace: donetick
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
