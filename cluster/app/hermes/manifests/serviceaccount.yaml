# Identité de l'agent auprès de l'API kube. Elle ne sert QU'À une chose : lancer et relire des
# tâches dans le namespace hermes-exec (Role + RoleBinding en
# ../../hermes-exec/manifests/rbac-hermes.yaml).
#
# `automountServiceAccountToken: false` est conservé ici ET sur le pod. Le token n'arrive PAS
# par l'automount : il est monté explicitement, par un volume projeté, dans le seul conteneur
# `hermes` (cf. statefulset.yaml). La différence est réelle — l'automount pose le token dans
# TOUS les conteneurs du pod, initContainers compris ; le volume projeté le pose là où on le
# monte, et nulle part ailleurs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
automountServiceAccountToken: false
