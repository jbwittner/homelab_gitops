# `StatefulSet` et pas `Deployment` : tout l'état d'Hermes (sessions, mémoires, skills, cron,
# .env semé) vit dans un unique volume `/opt/data` en RWO. Un seul replica, et la garantie
# d'ordre du StatefulSet évite deux pods qui montent le même PVC pendant un rollout.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  serviceName: hermes
  replicas: 1
  # Le PVC est RWO : le pod sortant doit être terminé avant que le nouveau monte le volume.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  # Aucune ControllerRevision ancienne conservée : seule la révision courante reste dans etcd.
  # Le rollback via `kubectl rollout undo` n'est donc plus possible — la source de vérité est
  # Git, ArgoCD resynchronise le template précédent en revenant sur le commit.
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      # L'agent exécute du code arbitraire décidé par un LLM, dans CE pod. Aucun token de
      # ServiceAccount ne doit traîner dans son système de fichiers : sans ça, une injection de
      # prompt donne un accès à l'API kube avec les droits du SA.
      automountServiceAccountToken: false
      # PAS de `runAsNonRoot: true` ni de `runAsUser` : l'entrypoint s6-overlay doit démarrer en
      # root pour chown le volume, puis descend lui-même sur l'uid 10000. Cf. namespace.yaml.
      securityContext:
        fsGroup: 10000
      initContainers:
        # Rend /opt/data versionnable SANS jamais écraser un PVC vivant : pose .git, le remote et
        # le .gitignore autoritaire, et ne restaure depuis la forge que si le dépôt n'a aucun
        # commit (donc PVC neuf). Tourne AVANT seed-profile : sur un PVC neuf, le `reset --hard`
        # travaille dans un répertoire vide.
        - name: seed-git
          image: alpine/git:v2.54.0
          # L'ENTRYPOINT de l'image est `git` : il faut l'écraser pour lancer un shell.
          command:
            - sh
            - -c
            - |
              set -eu
              REPO=/opt/data
              BRANCH=main
              URL=https://forgejo.wittner.tech/jbwittner/homelab_hermes.git

              # Le jeton passe par GIT_ASKPASS, jamais par l'URL : il ne doit pas finir écrit dans
              # .git/config, qui vit dans le PVC et que l'agent lit.
              umask 077
              cat > /tmp/git-askpass.sh <<'ASKPASS'
              #!/bin/sh
              case "$1" in
                Username*) printf '%s\n' "hermes_agent" ;;
                Password*) printf '%s\n' "${FORGEJO_TOKEN:-}" ;;
              esac
              ASKPASS
              chmod 0700 /tmp/git-askpass.sh
              export GIT_ASKPASS=/tmp/git-askpass.sh GIT_TERMINAL_PROMPT=0

              # Le dépôt appartient à l'uid 10000 et on opère en root : sans cette exception git
              # refuse tout avec « detected dubious ownership ».
              git config --global --add safe.directory "$REPO"

              [ -d "$REPO/.git" ] || git init -q -b "$BRANCH" "$REPO"

              # Allow-list autoritaire, réécrite à chaque démarrage : l'agent ne peut l'affaiblir
              # que jusqu'au prochain rollout. Le fichier est aussi SUIVI par le dépôt distant —
              # d'où l'obligation qu'il soit identique au contenu poussé, sinon chaque boot
              # produit un commit de bruit.
              install -o 10000 -g 10000 -m 0644 /bootstrap/gitignore "$REPO/.gitignore"

              git -C "$REPO" remote remove origin 2>/dev/null || true
              git -C "$REPO" remote add origin "$URL"
              git -C "$REPO" config user.name "hermes_agent"
              git -C "$REPO" config user.email "hermes_agent@wittner.tech"

              if git -C "$REPO" rev-parse --verify HEAD >/dev/null 2>&1; then
                echo "[seed-git] dépôt déjà peuplé — aucune restauration, le PVC fait foi"
              else
                echo "[seed-git] aucun commit local (PVC neuf) — restauration depuis origin/$BRANCH"
                if git -C "$REPO" fetch -q --depth=1 origin "$BRANCH"; then
                  git -C "$REPO" reset --hard -q FETCH_HEAD
                  echo "[seed-git] restauré à $(git -C "$REPO" rev-parse --short HEAD)"
                else
                  # Dépôt distant vide au tout premier déploiement, ou forge injoignable : on ne
                  # bloque pas le démarrage d'Hermes pour ça.
                  echo "[seed-git] origin vide ou injoignable — on démarre sur un dépôt neuf"
                fi
              fi

              chown -R 10000:10000 "$REPO/.git" "$REPO/.gitignore"
          env:
            # Seule clé du Secret injectée ici : pas d'`envFrom` global sur un conteneur qui n'a
            # besoin que du jeton de forge.
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: FORGEJO_TOKEN
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: bootstrap, mountPath: /bootstrap, readOnly: true }
            - { name: seed-tmp, mountPath: /tmp }
        - name: seed-profile
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              set -eu
              # HOME des sous-processus lancés par l'outil terminal. Créé seulement s'il manque :
              # le répertoire existant porte un bit setgid qu'un `install -d` inconditionnel
              # effacerait.
              [ -d /opt/data/home ] || install -d -o 10000 -g 10000 -m 0755 /opt/data/home
              # Rétablit /opt/hermes/bin dans le PATH des shells de login — cf. profile,
              # qui documente pourquoi /etc/profile l'en retire.
              install -o 10000 -g 10000 -m 0644 /bootstrap/profile /opt/data/home/.profile
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: bootstrap, mountPath: /bootstrap, readOnly: true }
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.9.14
          # PAS de `command:` — l'ENTRYPOINT de l'image est le dispatcher qui lance s6-overlay.
          # L'écraser fait sauter la supervision (dashboard, redémarrage auto de la gateway) et
          # le drop de privilèges. Seuls les arguments changent.
          args: ["gateway", "run"]
          # Toutes les variables NON secrètes vivent dans config/hermes.env, généré en ConfigMap
          # `hermes-vars` avec un suffixe de hash — l'éditer change le pod template et déclenche
          # donc le rollout.
          # ORDRE SIGNIFICATIF : le dernier `envFrom` l'emporte. `hermes-env` peut donc écraser
          # une valeur de `hermes-vars`, jamais l'inverse. Ne pas permuter les deux entrées.
          envFrom:
            - configMapRef:
                name: hermes-vars
            - secretRef:
                name: hermes-env
          ports:
            - { name: api, containerPort: 8642, protocol: TCP }
            - { name: dashboard, containerPort: 9119, protocol: TCP }
          # Sondes TCP et non HTTP : les deux endpoints sont derrière une auth (clé d'API,
          # gate de login), une sonde HTTP se ferait renvoyer un 401 lu comme un échec.
          startupProbe:
            tcpSocket: { port: dashboard }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: dashboard }
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket: { port: api }
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - { name: data, mountPath: /opt/data }
        # Une passe de commit + push par jour vers homelab_hermes. Sidecar et non `CronJob` : le
        # PVC est RWO et déjà monté par ce pod — un Job devrait atterrir sur le même nœud pour
        # monter le volume, ce que rien ne garantit.
        # ⚠️ Le script ne sort JAMAIS en erreur : le pod n'est `Ready` que si tous ses conteneurs
        # le sont, et un sidecar en CrashLoopBackOff masquerait la santé réelle de la gateway.
        - name: git-sync
          image: alpine/git:v2.54.0
          # Écrase l'ENTRYPOINT `git` de l'image. Le script vient du ConfigMap de bootstrap.
          command: ["sh", "/bootstrap/git-sync.sh"]
          env:
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: FORGEJO_TOKEN
            # Racine en lecture seule : git a besoin d'un HOME inscriptible, ce sera l'emptyDir.
            - name: HOME
              value: /tmp
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            # Le sidecar est le seul conteneur du pod qui tient le niveau `restricted` — les
            # autres ne le peuvent pas (cf. namespace.yaml). Aucune raison de le relâcher ici.
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "10m"
              memory: 64Mi
            limits:
              cpu: "200m"
              memory: 256Mi
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: bootstrap, mountPath: /bootstrap, readOnly: true }
            - { name: git-tmp, mountPath: /tmp }
      volumes:
        # /tmp inscriptible (askpass, objets temporaires de git) alors que la racine des conteneurs
        # git est en lecture seule. Les emptyDir sont exclus de Velero par la ConfigMap
        # `velero-volume-policies` — rien à ajouter côté sauvegarde.
        # Un emptyDir PAR conteneur git : seed-git écrit son askpass en root avec umask 077,
        # git-sync tourne sur l'uid 10000 et ne pourrait pas le réécrire s'ils partageaient /tmp.
        - name: seed-tmp
          emptyDir: {}
        - name: git-tmp
          emptyDir: {}
        - name: bootstrap
          configMap:
            name: hermes-bootstrap
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: openebs-lvm-thin
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
