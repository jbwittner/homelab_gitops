# `StatefulSet` et pas `Deployment` : tout l'état d'Hermes (sessions, mémoires, skills, cron,
# .env semé) vit dans un unique volume `/opt/data` en RWO. Un seul replica, et la garantie
# d'ordre du StatefulSet évite deux pods qui montent le même PVC pendant un rollout.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  serviceName: hermes
  replicas: 1
  # Le PVC est RWO : le pod sortant doit être terminé avant que le nouveau monte le volume.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  # Aucune ControllerRevision ancienne conservée : seule la révision courante reste dans etcd.
  # Le rollback via `kubectl rollout undo` n'est donc plus possible — la source de vérité est
  # Git, ArgoCD resynchronise le template précédent en revenant sur le commit.
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      # L'agent exécute du code arbitraire décidé par un LLM, dans CE pod. Aucun token de
      # ServiceAccount ne doit traîner dans son système de fichiers : sans ça, une injection de
      # prompt donne un accès à l'API kube avec les droits du SA.
      automountServiceAccountToken: false
      # PAS de `runAsNonRoot: true` ni de `runAsUser` : l'entrypoint s6-overlay doit démarrer en
      # root pour chown le volume, puis descend lui-même sur l'uid 10000. Cf. namespace.yaml.
      securityContext:
        fsGroup: 10000
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.9.24
          # PAS de `command:` — l'ENTRYPOINT de l'image est le dispatcher qui lance s6-overlay.
          # L'écraser fait sauter la supervision (dashboard, redémarrage auto de la gateway) et
          # le drop de privilèges. Seuls les arguments changent.
          args: ["gateway", "run"]
          # Toutes les variables NON secrètes vivent dans config/hermes.env, généré en ConfigMap
          # `hermes-vars` avec un suffixe de hash — l'éditer change le pod template et déclenche
          # donc le rollout.
          # ORDRE SIGNIFICATIF : le dernier `envFrom` l'emporte. `hermes-env` peut donc écraser
          # une valeur de `hermes-vars`, jamais l'inverse. Ne pas permuter les deux entrées.
          envFrom:
            - configMapRef:
                name: hermes-vars
            - secretRef:
                name: hermes-env
          ports:
            - { name: api, containerPort: 8642, protocol: TCP }
            - { name: dashboard, containerPort: 9119, protocol: TCP }
          # Sondes TCP et non HTTP : les deux endpoints sont derrière une auth (clé d'API,
          # gate de login), une sonde HTTP se ferait renvoyer un 401 lu comme un échec.
          # Sur l'API (8642) et PAS sur le dashboard : le dashboard bind bien avant la fin du
          # démarrage de la gateway. Tant qu'une startupProbe court, readiness et liveness sont
          # suspendues — c'est ce qui évite les `Unhealthy` en rafale pendant tout le boot, et le
          # pod passe 1/1 pile quand l'API répond.
          # 60 × 10 s = 10 min avant que kubelet ne redémarre le conteneur. Marge volontairement
          # large : un premier boot sur PVC neuf repeuple /opt/data et réinstalle lazy-packages.
          # Passé ce délai, un redémarrage vaut mieux qu'un pod NotReady indéfiniment — la gateway
          # peut se figer au démarrage sans jamais sortir (vécu le 2026-09-25).
          # ⚠️ SUR UN PVC NEUF, COMMENTER CE BLOC LE TEMPS DE L'INIT MANUELLE.
          # Tant que l'init n'est pas faite, la gateway ne monte pas jusqu'à 8642 : la
          # startupProbe échoue, kubelet redétruit le conteneur au bout de 10 minutes, en plein
          # milieu de la manipulation. Procédure complète : README §`$HERMES_HOME` : ni versionné,
          # ni semé, « Premier boot sur un PVC neuf ». Les sondes se remettent une fois 8642 vivant.
          startupProbe:
            tcpSocket: { port: api }
            # Une minute de silence avant la première sonde : le démarrage passe par s6, le
            # chown du volume, la synchronisation des skills et l'init de la gateway, et rien
            # n'écoute 8642 avant. Sans ce délai la première salve d'échecs est garantie.
            # Budget total avant redémarrage : 60 s + 60 × 10 s = 11 min.
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 60
          # `initialDelaySeconds` est inerte sur ces deux-là tant qu'une startupProbe existe :
          # kubelet les suspend entièrement jusqu'à ce qu'elle réussisse. Il est posé quand même,
          # pour que le délai reste explicite si la startupProbe est un jour commentée — ce que
          # la procédure de premier boot demande justement de faire (README, « Premier boot »).
          livenessProbe:
            tcpSocket: { port: dashboard }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket: { port: api }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - { name: data, mountPath: /opt/data }
      volumes:
        # ⚠️ Déclaré et monté NULLE PART, et c'est voulu : ce volume n'existe que pour que le nom
        # haché du ConfigMap `hermes-bootstrap` figure dans le pod template. Le ConfigMap porte
        # `hermes-env.sealed.yaml` ; un rescellement change son hash, donc ce nom, donc le
        # template — c'est le SEUL déclencheur de rollout sur un changement de secret (un
        # `envFrom` dont le Secret change ne redémarre rien). Le retirer = des secrets rescellés
        # qui n'atteignent le pod qu'au prochain redémarrage fortuit.
        - name: bootstrap
          configMap:
            name: hermes-bootstrap
            defaultMode: 0555
  # ⚠️ `volumeClaimTemplates` est IMMUABLE sur un StatefulSet existant : l'API rejette toute
  # modification de ce bloc (« updates to statefulset spec for fields other than 'replicas',
  # 'ordinals', 'template', 'updateStrategy', 'persistentVolumeClaimRetentionPolicy' and
  # 'minReadySeconds' are forbidden »), et ArgoCD boucle en SyncFailed. Y toucher impose de
  # supprimer le StatefulSet en `--cascade=orphan` d'abord — les PVC, eux, sont conservés.
  # ET la taille ci-dessous ne s'applique QU'AUX PVC À CRÉER : `data-hermes-0`, qui existe déjà,
  # n'est jamais redimensionné par ce champ. Procédure complète : README §Agrandir le PVC.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: openebs-lvm-thin
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            # 15 Gi : la base du provider mémoire vit ici, à côté des sessions et des caches.
            # ⚠️ La SC s'appelle `openebs-lvm-thin` mais porte `thinProvision: "no"` — les LV
            # sont THICK, la taille est réservée dans le VG dès la création. Ce n'est donc pas
            # gratuit (cf. cluster/infra/openebs/manifests/storageclass.yaml).
            storage: 15Gi
