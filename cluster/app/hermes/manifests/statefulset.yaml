# `StatefulSet` et pas `Deployment` : tout l'état d'Hermes (sessions, mémoires, skills, cron,
# .env semé) vit dans un unique volume `/opt/data` en RWO. Un seul replica, et la garantie
# d'ordre du StatefulSet évite deux pods qui montent le même PVC pendant un rollout.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  serviceName: hermes
  replicas: 1
  # Le PVC est RWO : le pod sortant doit être terminé avant que le nouveau monte le volume.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: hermes
      # RESTE À `false`, et ce n'est pas contradictoire avec le volume projeté plus bas.
      # L'automount poserait le token dans TOUS les conteneurs du pod, initContainer compris.
      # Le volume projeté le pose dans le seul conteneur `hermes`. La surface est la même pour
      # l'agent, plus petite pour le reste.
      #
      # ⚠️ Ce pod exécute du code décidé par un LLM. Depuis qu'il porte une identité kube, le
      # raisonnement de sûreté n'est plus « aucun accès à l'API » mais « un accès dont la portée
      # est entièrement contenue » : le Role ne couvre que jobs/pods/pods-log dans hermes-exec,
      # sans exec ni portforward, et sans aucun verbe sur les Role/RoleBinding. Cf.
      # ../../hermes-exec/manifests/rbac-hermes.yaml, qui documente ce qui est refusé et pourquoi.
      automountServiceAccountToken: false
      # PAS de `runAsNonRoot: true` ni de `runAsUser` : l'entrypoint s6-overlay doit démarrer en
      # root pour chown le volume, puis descend lui-même sur l'uid 10000. Cf. namespace.yaml.
      securityContext:
        fsGroup: 10000
      initContainers:
        # Pose le config.yaml de Git dans le volume avant que l'entrypoint ne sème le sien.
        # Recopié à CHAQUE démarrage, sans condition : Git reste la source de vérité et toute
        # dérive introduite dans le pod est écrasée. Le ConfigMap est généré avec un suffixe de
        # hash (cf. kustomization.yaml), donc éditer `config/config.yaml` renomme le volume et
        # déclenche le rollout — sans quoi la recopie n'aurait lieu à aucun moment.
        - name: seed-config
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              set -eu
              install -o 10000 -g 10000 -m 0600 /config/config.yaml /opt/data/config.yaml
              # HOME des sous-processus lancés par l'outil terminal. Créé seulement s'il manque :
              # le répertoire existant porte un bit setgid qu'un `install -d` inconditionnel
              # effacerait.
              [ -d /opt/data/home ] || install -d -o 10000 -g 10000 -m 0755 /opt/data/home
              # Rétablit /opt/hermes/bin dans le PATH des shells de login — cf. config/profile,
              # qui documente pourquoi /etc/profile l'en retire.
              install -o 10000 -g 10000 -m 0644 /config/profile /opt/data/home/.profile
              # Lanceur de tâches jetables, rendu exécutable et posé dans le PATH des shells de
              # login (cf. config/profile). Recopié à chaque démarrage comme le reste : Git
              # reste la source de vérité, une modification faite dans le pod est écrasée.
              [ -d /opt/data/bin ] || install -d -o 10000 -g 10000 -m 0755 /opt/data/bin
              install -o 10000 -g 10000 -m 0755 /config/hermes-exec-run /opt/data/bin/hermes-exec-run
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: config, mountPath: /config, readOnly: true }
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.8.27
          # PAS de `command:` — l'ENTRYPOINT de l'image est le dispatcher qui lance s6-overlay.
          # L'écraser fait sauter la supervision (dashboard, redémarrage auto de la gateway) et
          # le drop de privilèges. Seuls les arguments changent.
          args: ["gateway", "run"]
          # Toutes les variables NON secrètes vivent dans config/hermes.env, généré en ConfigMap
          # `hermes-vars` avec un suffixe de hash — l'éditer change le pod template et déclenche
          # donc le rollout, comme pour `hermes-config`.
          # ORDRE SIGNIFICATIF : le dernier `envFrom` l'emporte. `hermes-env` peut donc écraser
          # une valeur de `hermes-vars`, jamais l'inverse. Ne pas permuter les deux entrées.
          envFrom:
            - configMapRef:
                name: hermes-vars
            - secretRef:
                name: hermes-env
          ports:
            - { name: api, containerPort: 8642, protocol: TCP }
            - { name: dashboard, containerPort: 9119, protocol: TCP }
          # Sondes TCP et non HTTP : les deux endpoints sont derrière une auth (clé d'API,
          # gate de login), une sonde HTTP se ferait renvoyer un 401 lu comme un échec.
          startupProbe:
            tcpSocket: { port: dashboard }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: dashboard }
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket: { port: api }
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            # Monté ICI et nulle part ailleurs. Le chemin est celui de l'automount standard :
            # c'est ce qui permet au lanceur (et à tout client kube) de trouver token, ca.crt et
            # namespace sans configuration. Le déplacer casserait la détection in-cluster.
            - { name: kube-api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: hermes-config
        # Reproduit exactement ce que fait l'automount, mais en explicite et montable par
        # conteneur. Les trois sources sont nécessaires : sans `ca.crt` la vérification TLS
        # échoue, sans `namespace` la détection in-cluster de certains clients échoue.
        # Le token est à durée limitée et renouvelé par le kubelet — il ne vit pas dans un Secret.
        - name: kube-api-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - { key: ca.crt, path: ca.crt }
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: { fieldPath: metadata.namespace }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: openebs-lvm-thin
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
