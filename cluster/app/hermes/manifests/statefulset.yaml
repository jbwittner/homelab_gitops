# `StatefulSet` et pas `Deployment` : tout l'état d'Hermes (sessions, mémoires, skills, cron,
# .env semé) vit dans un unique volume `/opt/data` en RWO. Un seul replica, et la garantie
# d'ordre du StatefulSet évite deux pods qui montent le même PVC pendant un rollout.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  serviceName: hermes
  replicas: 1
  # Le PVC est RWO : le pod sortant doit être terminé avant que le nouveau monte le volume.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  # Aucune ControllerRevision ancienne conservée : seule la révision courante reste dans etcd.
  # Le rollback via `kubectl rollout undo` n'est donc plus possible — la source de vérité est
  # Git, ArgoCD resynchronise le template précédent en revenant sur le commit.
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      # L'agent exécute du code arbitraire décidé par un LLM, dans CE pod. Aucun token de
      # ServiceAccount ne doit traîner dans son système de fichiers : sans ça, une injection de
      # prompt donne un accès à l'API kube avec les droits du SA.
      automountServiceAccountToken: false
      # PAS de `runAsNonRoot: true` ni de `runAsUser` : l'entrypoint s6-overlay doit démarrer en
      # root pour chown le volume, puis descend lui-même sur l'uid 10000. Cf. namespace.yaml.
      securityContext:
        fsGroup: 10000
      initContainers:
        # Bootstrap homelab_hermes seulement sur un PVC sans checkout. Le worktree actif reste
        # autoritaire : aucun redémarrage ne le remplace par l'état Forgejo.
        - name: bootstrap-home
          image: alpine/git:2.47.2
          command: ["/bootstrap/bootstrap-home.sh"]
          env:
            # Dépôt source du profil. Défini une seule fois dans le ConfigMap `hermes-git`, que
            # le sidecar git-sync lit également : le clone initial et les push suivants visent
            # forcément le même dépôt.
            - name: HERMES_REPO_URL
              valueFrom:
                configMapKeyRef:
                  name: hermes-git
                  key: HERMES_REPO_URL
            - name: FORGEJO_USERNAME
              value: hermes_agent
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: FORGEJO_TOKEN
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: bootstrap, mountPath: /bootstrap, readOnly: true }
        - name: seed-profile
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - |
              set -eu
              # HOME des sous-processus lancés par l'outil terminal. Créé seulement s'il manque :
              # le répertoire existant porte un bit setgid qu'un `install -d` inconditionnel
              # effacerait.
              [ -d /opt/data/home ] || install -d -o 10000 -g 10000 -m 0755 /opt/data/home
              # Rétablit /opt/hermes/bin dans le PATH des shells de login — cf. profile,
              # qui documente pourquoi /etc/profile l'en retire.
              install -o 10000 -g 10000 -m 0644 /bootstrap/profile /opt/data/home/.profile
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: bootstrap, mountPath: /bootstrap, readOnly: true }
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.9.7
          # PAS de `command:` — l'ENTRYPOINT de l'image est le dispatcher qui lance s6-overlay.
          # L'écraser fait sauter la supervision (dashboard, redémarrage auto de la gateway) et
          # le drop de privilèges. Seuls les arguments changent.
          args: ["gateway", "run"]
          # Toutes les variables NON secrètes vivent dans config/hermes.env, généré en ConfigMap
          # `hermes-vars` avec un suffixe de hash — l'éditer change le pod template et déclenche
          # donc le rollout.
          # ORDRE SIGNIFICATIF : le dernier `envFrom` l'emporte. `hermes-env` peut donc écraser
          # une valeur de `hermes-vars`, jamais l'inverse. Ne pas permuter les deux entrées.
          envFrom:
            - configMapRef:
                name: hermes-vars
            - secretRef:
                name: hermes-env
          ports:
            - { name: api, containerPort: 8642, protocol: TCP }
            - { name: dashboard, containerPort: 9119, protocol: TCP }
          # Sondes TCP et non HTTP : les deux endpoints sont derrière une auth (clé d'API,
          # gate de login), une sonde HTTP se ferait renvoyer un 401 lu comme un échec.
          startupProbe:
            tcpSocket: { port: dashboard }
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: dashboard }
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket: { port: api }
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - { name: data, mountPath: /opt/data }
        # Hors du processus Hermes : ce sidecar détient une cadence Git déclarée dans GitOps.
        # Il partage le PVC RWO avec Hermes, mais le script et sa planification sont read-only.
        - name: git-sync
          image: alpine/git:2.47.2
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              while true; do
                /sync/sync-once.sh || \
                  printf '%s git-sync cycle failed\n' "$(date -Iseconds)" >&2
                sleep 300
              done
          env:
            # Même clé que l'init container bootstrap-home, cf. le ConfigMap `hermes-git`.
            - name: HERMES_REPO_URL
              valueFrom:
                configMapKeyRef:
                  name: hermes-git
                  key: HERMES_REPO_URL
            - name: FORGEJO_USERNAME
              value: hermes_agent
            # Intentionally inject only this key, never the complete hermes-env Secret.
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: FORGEJO_TOKEN
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: git-sync, mountPath: /sync, readOnly: true }
            - { name: git-sync-work, mountPath: /sync-work }
      volumes:
        - name: bootstrap
          configMap:
            name: hermes-bootstrap
            defaultMode: 0555
        - name: git-sync
          configMap:
            name: hermes-git-sync
            defaultMode: 0555
        # Private sidecar checkout. It is intentionally not mounted in the Hermes container.
        - name: git-sync-work
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: openebs-lvm-thin
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
