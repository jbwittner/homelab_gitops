# `StatefulSet` et pas `Deployment` : tout l'état d'Hermes (sessions, mémoires, skills, cron,
# .env semé) vit dans un unique volume `/opt/data` en RWO. Un seul replica, et la garantie
# d'ordre du StatefulSet évite deux pods qui montent le même PVC pendant un rollout.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  serviceName: hermes
  replicas: 1
  # Le PVC est RWO : le pod sortant doit être terminé avant que le nouveau monte le volume.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  # Aucune ControllerRevision ancienne conservée : seule la révision courante reste dans etcd.
  # Le rollback via `kubectl rollout undo` n'est donc plus possible — la source de vérité est
  # Git, ArgoCD resynchronise le template précédent en revenant sur le commit.
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      # L'agent exécute du code arbitraire décidé par un LLM, dans CE pod. Aucun token de
      # ServiceAccount ne doit traîner dans son système de fichiers : sans ça, une injection de
      # prompt donne un accès à l'API kube avec les droits du SA.
      automountServiceAccountToken: false
      # PAS de `runAsNonRoot: true` ni de `runAsUser` : l'entrypoint s6-overlay doit démarrer en
      # root pour chown le volume, puis descend lui-même sur l'uid 10000. Cf. namespace.yaml.
      securityContext:
        fsGroup: 10000
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.9.14
          # PAS de `command:` — l'ENTRYPOINT de l'image est le dispatcher qui lance s6-overlay.
          # L'écraser fait sauter la supervision (dashboard, redémarrage auto de la gateway) et
          # le drop de privilèges. Seuls les arguments changent.
          args: ["gateway", "run"]
          # Toutes les variables NON secrètes vivent dans config/hermes.env, généré en ConfigMap
          # `hermes-vars` avec un suffixe de hash — l'éditer change le pod template et déclenche
          # donc le rollout.
          # ORDRE SIGNIFICATIF : le dernier `envFrom` l'emporte. `hermes-env` peut donc écraser
          # une valeur de `hermes-vars`, jamais l'inverse. Ne pas permuter les deux entrées.
          envFrom:
            - configMapRef:
                name: hermes-vars
            - secretRef:
                name: hermes-env
          ports:
            - { name: api, containerPort: 8642, protocol: TCP }
            - { name: dashboard, containerPort: 9119, protocol: TCP }
          # Sondes TCP et non HTTP : les deux endpoints sont derrière une auth (clé d'API,
          # gate de login), une sonde HTTP se ferait renvoyer un 401 lu comme un échec.
          # Sur l'API (8642) et PAS sur le dashboard : le dashboard bind bien avant la fin du
          # démarrage de la gateway. Tant qu'une startupProbe court, readiness et liveness sont
          # suspendues — c'est ce qui évite les `Unhealthy` en rafale pendant tout le boot, et le
          # pod passe 2/2 pile quand l'API répond.
          # 60 × 10 s = 10 min avant que kubelet ne redémarre le conteneur. Marge volontairement
          # large : un premier boot sur PVC neuf repeuple /opt/data et réinstalle lazy-packages.
          # Passé ce délai, un redémarrage vaut mieux qu'un pod NotReady indéfiniment — la gateway
          # peut se figer au démarrage sans jamais sortir (vécu le 2026-09-25).
          # ⚠️ SUR UN PVC NEUF, COMMENTER CE BLOC LE TEMPS DE L'INIT MANUELLE.
          # Tant que l'init n'est pas faite, la gateway ne monte pas jusqu'à 8642 : la
          # startupProbe échoue, kubelet redétruit le conteneur au bout de 10 minutes, en plein
          # milieu de la manipulation. Procédure complète : README §Versionnement de $HERMES_HOME,
          # « Premier boot sur un PVC neuf ». Les sondes se remettent une fois 8642 vivant.
          startupProbe:
            tcpSocket: { port: api }
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: dashboard }
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket: { port: api }
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - { name: data, mountPath: /opt/data }
        # Une passe de commit + push par jour vers homelab_hermes. Sidecar et non `CronJob` : le
        # PVC est RWO et déjà monté par ce pod — un Job devrait atterrir sur le même nœud pour
        # monter le volume, ce que rien ne garantit.
        # ⚠️ Le script ne sort JAMAIS en erreur : le pod n'est `Ready` que si tous ses conteneurs
        # le sont, et un sidecar en CrashLoopBackOff masquerait la santé réelle de la gateway.
        - name: git-sync
          image: alpine/git:v2.54.0
          # Écrase l'ENTRYPOINT `git` de l'image. Le script vient du ConfigMap de bootstrap.
          command: ["sh", "/bootstrap/git-sync.sh"]
          env:
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-env
                  key: FORGEJO_TOKEN
            # Racine en lecture seule : git a besoin d'un HOME inscriptible, ce sera l'emptyDir.
            - name: HOME
              value: /tmp
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            # Le sidecar est le seul conteneur du pod qui tient le niveau `restricted` — les
            # autres ne le peuvent pas (cf. namespace.yaml). Aucune raison de le relâcher ici.
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "10m"
              memory: 64Mi
            limits:
              cpu: "200m"
              memory: 256Mi
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: bootstrap, mountPath: /bootstrap, readOnly: true }
            - { name: git-tmp, mountPath: /tmp }
      volumes:
        # /tmp inscriptible (askpass, objets temporaires de git) alors que la racine du conteneur
        # git-sync est en lecture seule. Les emptyDir sont exclus de Velero par la ConfigMap
        # `velero-volume-policies` — rien à ajouter côté sauvegarde.
        - name: git-tmp
          emptyDir: {}
        - name: bootstrap
          configMap:
            name: hermes-bootstrap
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: openebs-lvm-thin
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
