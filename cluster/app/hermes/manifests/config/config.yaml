# ⚠️ `_config_version` EN PREMIER, et il est load-bearing.
#
# Le script de migration du conteneur (`scripts/docker_config_migrate.py:70`) refuse tout
# config.yaml dont la version lue est sous le plancher 12 — et une version ABSENTE est lue 0.
# Il est plus strict que le chemin CLI (`config.py:2374`), qui, lui, épargne explicitement les
# fichiers sans clé de version. Un fichier écrit à la main comme celui-ci tombe donc du mauvais
# côté : migration refusée au boot, et les sessions ouvertes ensuite partent avec un modèle
# VIDE — « Codex Responses request 'model' must be a non-empty string ».
#
# Le symptôme se répare tout seul dès qu'on passe par `hermes auth` ou le sélecteur de modèle :
# ces commandes réécrivent le fichier via `save_config()`, qui y estampille la version. D'où
# l'impression que la panne ne survient qu'« après un déploiement » — c'est l'initContainer qui
# restaure la version de Git, non estampillée, à chaque démarrage.
#
# 39 = version courante de l'image v2026.8.27 (`config_defaults.py:3847`). À relire lors d'un
# bump majeur de l'image : une valeur trop haute ferait sauter des migrations légitimes.
_config_version: 39

model:
  # `openai-codex` s'authentifie en OAuth (`auth_type: oauth_external`) : les jetons vivent
  # dans `/opt/data/auth.json`, PAS dans une variable d'environnement. Aucune clé d'API à
  # sceller pour ce provider — `OPENAI_API_KEY` ne sert qu'au provider `openai-api`.
  provider: openai-codex
  # ⚠️ La clé est `default`, PAS `name`. `load_config()` normalise pourtant les deux vers la
  # même chose — mais un chemin du runtime lit la config BRUTE (`read_raw_config()`), où `name`
  # reste `name` : `model.default` y est absent, la session démarre avec un modèle vide et
  # chaque tour échoue en « Codex Responses request 'model' must be a non-empty string ».
  # `default` est la forme que l'application écrit elle-même (`auth.py:8016`,
  # `_save_model_choice`) ; `name` n'est qu'un alias du setter CLI. Ne pas « corriger » vers
  # `name` en lisant la doc amont, qui documente cette dernière forme.
  #
  # Corriger le modèle dans l'interface répare le pod COURANT et rien d'autre : l'initContainer
  # restaure ce fichier à chaque démarrage, la panne revient au déploiement suivant.
  #
  # L'identifiant lui-même est à confirmer contre l'abonnement utilisé (`hermes model` liste ce
  # que l'endpoint expose). Un id invalide fait échouer le premier tour d'agent, pas le boot.
  default: gpt-5.6-terra

terminal:
  # `local` = les commandes de l'agent s'exécutent DANS ce pod. Les backends `docker` et
  # `ssh` supposent un daemon Docker ou un hôte SSH joignable, dont on n'a ni l'un ni
  # l'autre ici. Conséquence directe : le blast radius de l'agent est le pod — d'où
  # `automountServiceAccountToken: false` et l'absence de RBAC côté StatefulSet.
  backend: local
  timeout: 180
  persistent_shell: true

plugins:
  # Allow-list des plugins. Les plugins bundlés de `kind: backend` — dont le provider
  # d'auth basic du dashboard — s'auto-chargent AVANT ce filtre (plugins.py:4297), la
  # ligne ci-dessous n'est donc pas ce qui les active. Elle est là pour ce qu'elle borne :
  # tout plugin standalone ou installé dans `$HERMES_HOME/plugins` reste ignoré tant qu'il
  # n'est pas listé ici. Sur un agent qui peut s'écrire des plugins tout seul, c'est le
  # garde-fou qui compte.
  enabled:
    - dashboard_auth/basic

dashboard:
  # Sert à construire les URLs de redirection de la page de login.
  # L'identifiant, le mot de passe et le secret de session viennent des variables
  # HERMES_DASHBOARD_BASIC_AUTH_* (Secret scellé) : l'env l'emporte sur config.yaml, ce qui
  # garde le hash scrypt hors de Git.
  public_url: "https://hermes.lan.wittner.tech"
  # Le proxy est l'Envoy de Cilium, dont l'IP source n'est pas fixe. Renseigner le CIDR
  # des pods ici SI la connexion au dashboard boucle sur le login (cookies sécurisés non
  # posés faute de X-Forwarded-Proto de confiance). Hermes refuse les entrées non bornées
  # (`*`, `0.0.0.0/0`).
  # trusted_proxies:
  #   - "10.0.0.0/8"
  theme: default-large

memory:
  memory_enabled: true
  user_profile_enabled: true

compression:
  enabled: true
