model:
  # `openai-codex` s'authentifie en OAuth (`auth_type: oauth_external`) : les jetons vivent
  # dans `/opt/data/auth.json`, PAS dans une variable d'environnement. Aucune clé d'API à
  # sceller pour ce provider — `OPENAI_API_KEY` ne sert qu'au provider `openai-api`.
  provider: openai-codex
  # ⚠️ Identifiant à confirmer contre le compte OpenAI utilisé (`hermes model` liste ce que
  # l'endpoint expose réellement). Un id invalide fait échouer le premier tour d'agent, pas
  # le démarrage du pod.
  name: gpt-5.6-terra

terminal:
  # `local` = les commandes de l'agent s'exécutent DANS ce pod. Les backends `docker` et
  # `ssh` supposent un daemon Docker ou un hôte SSH joignable, dont on n'a ni l'un ni
  # l'autre ici. Conséquence directe : le blast radius de l'agent est le pod — d'où
  # `automountServiceAccountToken: false` et l'absence de RBAC côté StatefulSet.
  backend: local
  timeout: 180
  persistent_shell: true

plugins:
  # Allow-list des plugins. Les plugins bundlés de `kind: backend` — dont le provider
  # d'auth basic du dashboard — s'auto-chargent AVANT ce filtre (plugins.py:4297), la
  # ligne ci-dessous n'est donc pas ce qui les active. Elle est là pour ce qu'elle borne :
  # tout plugin standalone ou installé dans `$HERMES_HOME/plugins` reste ignoré tant qu'il
  # n'est pas listé ici. Sur un agent qui peut s'écrire des plugins tout seul, c'est le
  # garde-fou qui compte.
  enabled:
    - dashboard_auth/basic

dashboard:
  # Sert à construire les URLs de redirection de la page de login.
  # L'identifiant, le mot de passe et le secret de session viennent des variables
  # HERMES_DASHBOARD_BASIC_AUTH_* (Secret scellé) : l'env l'emporte sur config.yaml, ce qui
  # garde le hash scrypt hors de Git.
  public_url: "https://hermes.lan.wittner.tech"
  # Le proxy est l'Envoy de Cilium, dont l'IP source n'est pas fixe. Renseigner le CIDR
  # des pods ici SI la connexion au dashboard boucle sur le login (cookies sécurisés non
  # posés faute de X-Forwarded-Proto de confiance). Hermes refuse les entrées non bornées
  # (`*`, `0.0.0.0/0`).
  # trusted_proxies:
  #   - "10.0.0.0/8"
  theme: default-large

memory:
  memory_enabled: true
  user_profile_enabled: true

compression:
  enabled: true
