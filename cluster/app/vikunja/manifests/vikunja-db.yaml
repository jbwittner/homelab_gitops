# CNPG dérive le Service d'écriture `vikunja-db-rw` et le Secret applicatif
# `vikunja-db-app`; ils sont consommés par helm-values.yaml et ne sont pas versionnés.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vikunja-db
spec:
  instances: 1
  bootstrap:
    initdb:
      database: vikunja
      # Explicite : sans ce champ CNPG fait déjà owner = database, mais le laisser
      # implicite avait fait croire à un rôle `app`.
      owner: vikunja
  storage:
    storageClass: openebs-lvm-thin
    size: 5Gi
  monitoring:
    enablePodMonitor: false
