# Le chart crée un Service ClusterIP `vikunja:3456`. L'exposition est déclarée séparément
# dans manifests/vikunja-httproute.yaml, conformément aux conventions du dépôt.
vikunja:
  image:
    repository: vikunja/vikunja

  # Vikunja ne conserve hors PostgreSQL que les fichiers joints.
  persistence:
    data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 2Gi
      storageClass: openebs-lvm-thin
    database:
      enabled: false

  ingress:
    main:
      enabled: false

  configMaps:
    config:
      data:
        config.yml: |
          service:
            publicurl: https://vikunja.lan.wittner.tech
            # Instance de test interne : l'inscription reste ouverte uniquement pour créer le
            # premier compte. La refermer après le test avant un usage durable.
            enableregistration: true
            # Sans sauvegarde CNPG, les liens publics ne doivent pas être utilisés comme dépôt
            # de données durable pendant ce test.
            enablelinksharing: false

  env:
    VIKUNJA_DATABASE_TYPE: postgres
    VIKUNJA_DATABASE_HOST: vikunja-db-rw
    VIKUNJA_DATABASE_DATABASE: vikunja
    VIKUNJA_DATABASE_USER: vikunja
    VIKUNJA_DATABASE_SSLMODE: disable
    VIKUNJA_DATABASE_PASSWORD:
      valueFrom:
        secretKeyRef:
          # Secret applicatif généré par CNPG pour le Cluster vikunja-db.
          name: vikunja-db-app
          key: password
