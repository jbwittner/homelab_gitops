# ⚠️ VESTIGE INERTE — le `ClusterSecretStore` que ce fichier référence n'existe plus dans le dépôt,
# et la CRD `ExternalSecret` n'est pas posée dans le cluster (external-secrets est en `.noapp.yaml`).
# Conservé comme modèle si un backend de secrets externe est un jour remonté ; à réécrire alors
# contre le nom du nouveau store. NON référencé dans `kustomization.yaml`.
#
# Token API Cloudflare du solver DNS-01 (Zone:DNS:Edit + Zone:Zone:Read).
# Consommé par les DEUX ClusterIssuer via apiTokenSecretRef → un seul chemin KV, une seule rotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: REMPLACER        # ⚠️ nom du futur ClusterSecretStore — aucun n'existe aujourd'hui
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
    # Obligatoire : sans lui, un coffre scellé supprimerait le Secret et le renouvellement
    # Let's Encrypt (tous les 60 j) échouerait en `secret not found` sur le solver DNS-01.
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: homelab/cert-manager
        property: cloudflare-api-token
