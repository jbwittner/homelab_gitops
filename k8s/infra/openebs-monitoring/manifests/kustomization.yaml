apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deux CRs `monitoring.coreos.com`, sans ordre entre elles (pas de sync-wave de ressource ici :
# l'ordonnancement du composant se joue à l'échelle de l'Application, wave 2).
# Chaque manifeste porte son propre `namespace: openebs` → pas de `namespace:` global.
resources:
  - servicemonitor.yaml
  - prometheusrule.yaml
