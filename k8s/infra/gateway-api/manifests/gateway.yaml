apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gw
  namespace: gateway
spec:
  gatewayClassName: cilium
  listeners:
    - name: https-public
      protocol: HTTPS
      port: 443
      hostname: "*.wittner.tech"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-public-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-internal
      protocol: HTTPS
      port: 443
      hostname: "*.lan.wittner.tech"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-lan-tls
      allowedRoutes:
        namespaces:
          from: All
    # Environnements de dev, `<app>.dev.lan.wittner.tech`. Listener à part parce que le wildcard
    # TLS `*.lan.wittner.tech` ne couvre qu'un niveau : servis par `https-internal`, ces noms
    # recevraient un certificat invalide. Le hostname le plus spécifique l'emporte au SNI.
    - name: https-dev
      protocol: HTTPS
      port: 443
      hostname: "*.dev.lan.wittner.tech"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-dev-lan-tls
      allowedRoutes:
        namespaces:
          from: All
