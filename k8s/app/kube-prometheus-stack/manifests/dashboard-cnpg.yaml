# k8s/app/kube-prometheus-stack/manifests/dashboard-cnpg.yaml
# Dashboard Grafana « PostgreSQL — cnpg »
# Chargé automatiquement par le sidecar de kube-prometheus-stack via le label
# grafana_dashboard: "1".
#
# Sources de métriques — TROIS, et elles ne tombent pas ensemble :
#   - collecteur d'instance (9187, PodMonitor `cnpg-instances` de
#     k8s/app/cnpg-monitoring) : cnpg_collector_*, cnpg_pg_* — l'essentiel du dashboard
#   - kube-state-metrics, customResourceState (k8s/app/kube-prometheus-stack/helm-values.yaml) :
#     cnpg_cluster_object_* — l'état des CRs `Cluster`, lisible même quand plus aucun pod ne répond
#   - kube-state-metrics et cadvisor, métriques cœur : santé du Deployment de l'opérateur
#
# ⚠️ L'OPÉRATEUR N'EST PAS SCRAPÉ. `cnpg/helm-values.yaml` n'active pas
# `monitoring.podMonitorEnabled`, et l'activer ne suffirait pas : le PodMonitor rendu par le chart
# ne porte pas le label `release: kube-prometheus-stack` qu'attend le sélecteur de Prometheus
# (même piège que celui documenté dans cnpg-monitoring/manifests/podmonitor.yaml). Les métriques
# `controller_runtime_*` et les temps de réconciliation ne sont donc PAS disponibles ici — la
# rangée « Opérateur » se rabat sur ce que kube-state-metrics et cadvisor savent en dire.
#
# ⚠️ DEUX SOURCES, DEUX NOMS POUR LA MÊME BASE. Le collecteur d'instance étiquette
# `cnpg_io_cluster` (remonté par `podTargetLabels`), kube-state-metrics étiquette `cnpg_cluster`
# (défini par `labelsFromPath`). Les requêtes qui croisent les deux passent par `label_replace` —
# sans lui, la jointure est vide sans erreur.
#
# Ce que ce dashboard ne montre PAS, à dessein :
#   - la sauvegarde et l'archivage WAL — dashboard « PostgreSQL backups — barman-cloud »
#   - le remplissage du PVC de la base — dashboard « Resources — volumes » (la taille logique
#     affichée ici ne descend jamais après une suppression de lignes, elle ne mesure pas le disque)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cnpg
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  cnpg.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "panels": [],
          "title": "State",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "PostgreSQL instance pods whose collector answers on 9187. This is NOT the number of desired instances: an instance whose pod is dead disappears from this tile without turning it red. The expected count is read on the \"Ready / desired instances\" tile, served by kube-state-metrics from the Cluster itself.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count(cnpg_collector_up{cnpg_io_cluster=~\"$cluster\"} == 1)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Instances scraped",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "id": 1
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "The `status.readyInstances / status.instances` ratio read on the `Cluster` CRs by kube-state-metrics. Below 100%, an instance is being created, waiting for a PVC or failing — the operator does not switch the `-rw` service over until one is ready.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(cnpg_cluster_object_ready_instances{cnpg_cluster=~\"$cluster\"}) / clamp_min(sum(cnpg_cluster_object_instances{cnpg_cluster=~\"$cluster\"}), 1)",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Ready / desired instances",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "id": 2
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Time elapsed since PostgreSQL last started on the oldest instance. A value dropping back to zero with no version change signals an unplanned restart (OOM, eviction, `failover`), not a planned operation.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "time() - max(cnpg_pg_postmaster_start_time{cnpg_io_cluster=~\"$cluster\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Postmaster age",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "id": 3
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "The major.minor version served by the collector (`server_version_num` reformatted). It comes from the pod's IMAGE: it only moves after the instance restarts, not when the `imageName` field changes in the Cluster.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max(cnpg_collector_postgres_version{cnpg_io_cluster=~\"$cluster\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "PostgreSQL version",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "id": 4
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "The operator needs a hand-decided switchover to finish what it started — typically a version upgrade under `primaryUpdateStrategy: supervised`. While this tile reads \"Yes\", the primary instance stays on the old image.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "color": "green",
                      "index": 0,
                      "text": "No"
                    },
                    "1": {
                      "color": "red",
                      "index": 1,
                      "text": "Yes"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max(cnpg_collector_manual_switchover_required{cnpg_io_cluster=~\"$cluster\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Manual switchover required",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "id": 5
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "A fenced instance is deliberately stopped by the operator (the `cnpg.io/fencedInstances` annotation): the pod runs, PostgreSQL does not. This is the state a database sits in during a manual restore — and a state one forgets to take it out of.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "color": "green",
                      "index": 0,
                      "text": "No"
                    },
                    "1": {
                      "color": "red",
                      "index": 1,
                      "text": "Yes"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max(cnpg_collector_fencing_on{cnpg_io_cluster=~\"$cluster\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "Fencing",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "id": 6
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "One row per `Cluster` CR, served by kube-state-metrics — hence readable even when NO pod answers any more, unlike the rest of this dashboard. The last two columns, on the contrary, come from the instance collector: they empty out when the database is stopped, while the phase keeps showing. `label_replace` realigns `cnpg_io_cluster` (collector) onto `cnpg_cluster` (kube-state-metrics): the two sources do not name the database the same way.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Total size"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Database"
              }
            ]
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "cnpg_cluster_object_info{cnpg_cluster=~\"$cluster\"}",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "cnpg_cluster_object_instances{cnpg_cluster=~\"$cluster\"}",
              "refId": "B",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "cnpg_cluster_object_ready_instances{cnpg_cluster=~\"$cluster\"}",
              "refId": "C",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cnpg_cluster) (label_replace(cnpg_collector_postgres_version{cnpg_io_cluster=~\"$cluster\"}, \"cnpg_cluster\", \"$1\", \"cnpg_io_cluster\", \"(.*)\"))",
              "refId": "D",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (cnpg_cluster) (label_replace(cnpg_pg_database_size_bytes{cnpg_io_cluster=~\"$cluster\"}, \"cnpg_cluster\", \"$1\", \"cnpg_io_cluster\", \"(.*)\"))",
              "refId": "E",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "title": "PostgreSQL clusters",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "cnpg_cluster",
                "mode": "outer"
              }
            },
