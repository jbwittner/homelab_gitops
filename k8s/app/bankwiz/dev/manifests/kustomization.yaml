apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bankwiz-dev
resources:
  - namespace.yaml
  - bankwiz-db.yaml
  - deployment.yaml
  - service.yaml
  - bankwiz-api-httproute.yaml

# `files:` et non `envs:` : le ConfigMap porte le fichier entier, monté tel quel dans /app/config/.
# Le suffixe de hash réécrit la référence dans le Deployment et déclenche un rollout à chaque
# modification de la configuration.
configMapGenerator:
  - name: bankwiz-api-config
    files:
      - application.yaml
