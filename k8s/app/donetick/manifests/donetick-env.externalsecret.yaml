# Le secret JWT reste hors de Git et est fourni par OpenBao.
# Une rotation invalide les sessions existantes ; redémarrer le StatefulSet après la rotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick-env
  namespace: donetick
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: donetick-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DT_JWT_SECRET
      remoteRef:
        key: homelab/donetick/secrets
        property: jwt-secret
