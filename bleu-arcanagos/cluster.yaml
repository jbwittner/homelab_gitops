apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bleu-arcanagos-cluster
  namespace: argocd
  labels:
    app.kubernetes.io/name: bleu-arcanagos
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: app-of-apps
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # App-of-apps TIER 1 du cluster bleu-arcanagos, appliqué sur le HUB (kubectl apply de bootstrap).
  # Découvre les deux bootstraps de partie (infra.bootstrap.yaml + app.bootstrap.yaml) via le
  # glob '*.bootstrap.yaml' ; chacun découvre ensuite ses propres '*.app.yaml'. Les deux
  # suffixes distincts (.bootstrap.yaml ici, .app.yaml en tier 2) évitent toute auto-récursion.
  source:
    repoURL: https://github.com/jbwittner/homelab_gitops.git
    targetRevision: main
    path: bleu-arcanagos
    directory:
      recurse: true
      include: '*.bootstrap.yaml'
  destination:
    # ⚠️ Le HUB, pas le spoke. Un tier-1/tier-2 ne produit que des objets `Application`, qui
    # doivent vivre là où tourne l'ArgoCD qui les lit — c'est-à-dire bleu-kalecgos. Seuls les
    # `.app.yaml` feuilles portent `destination.name: bleu-arcanagos`.
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
