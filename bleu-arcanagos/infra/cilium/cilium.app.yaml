apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Préfixe `<cluster>-` obligatoire sur un spoke : toutes les Applications des deux clusters
  # cohabitent dans le namespace `argocd` du hub, et `cilium` y est déjà pris par bleu-kalecgos.
  name: bleu-arcanagos-cilium
  namespace: argocd
  labels:
    app.kubernetes.io/name: cilium
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: cni
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.20.0
      helm:
        # ⚠️ releaseName DOIT rester `cilium` : la release a été adoptée depuis le
        # `helm install cilium` du bootstrap (Phase 3 du runbook). Le changer renommerait
        # toutes les ressources Cilium et détruirait le CNI.
        releaseName: cilium
        valueFiles:
          - $values/bleu-arcanagos/infra/cilium/helm-values.yaml
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: bleu-arcanagos/infra/cilium/manifests
  destination:
    # ⚠️ Cluster DISTANT (modèle hub-spoke : l'ArgoCD de bleu-kalecgos pilote ce cluster).
    # Surtout pas `https://kubernetes.default.svc` : l'Application vit dans l'ArgoCD du hub, ce
    # qui poserait Cilium sur le hub et entrerait en collision avec sa propre release `cilium`.
    # Le nom doit matcher le Secret de cluster côté hub (cf. infra/argocd-manager/README.md).
    name: bleu-arcanagos
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: cilium-config
      namespace: kube-system
      jsonPointers:
        - /data