apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"       # avant tout : c'est le credential d'accès au cluster
  labels:
    app.kubernetes.io/name: argocd-manager
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: gitops
  # ⚠️ PAS de `resources-finalizer.argocd.argoproj.io`, contrairement aux autres Applications :
  # la suppression en cascade détruirait le SA dont ArgoCD se sert pour joindre ce cluster, donc
  # ArgoCD ne pourrait plus terminer la suppression — Application bloquée sur son finalizer, à
  # débloquer à la main.
spec:
  project: default
  source:
    repoURL: https://github.com/jbwittner/homelab_gitops.git
    targetRevision: main
    path: bleu-arcanagos/infra/argocd-manager/manifests    # MÊME dossier que l'apply manuel du bootstrap
  destination:
    # Cluster distant, tel qu'enregistré dans l'ArgoCD du hub (bleu-kalecgos) — c'est justement
    # le SA de ce composant qui porte l'enregistrement. Le nom doit matcher le `name` du Secret
    # de cluster côté hub.
    name: bleu-arcanagos
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: false                            # ⚠️ prune désactivé — ArgoCD se couperait l'accès au cluster
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Le token controller remplit `token`, `ca.crt` et `namespace` dans le cluster ; le manifeste
    # committé n'a pas de `data`. Sans ça, l'Application est OutOfSync en permanence.
    - group: ""
      kind: Secret
      name: argocd-manager-token
      namespace: kube-system
      jsonPointers:
        - /data
