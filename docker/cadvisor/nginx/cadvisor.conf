# Mandataire authentifiant devant cAdvisor. Monté DEPUIS LE DÉPÔT (cf. `compose.yaml`) : ce fichier
# est celui qui tourne, pas une copie de référence. Il ne porte aucun secret — le hachage vit dans
# `/etc/cadvisor/htpasswd`.
#
# ⚠️ CE FICHIER EST LA SEULE PROTECTION DE cAdvisor. L'exportateur ne publie aucun port et n'est
# joignable que depuis le réseau de ce compose ; tout ce qui sort vers le LAN passe ici. Le
# relâcher, c'est ouvrir l'UI web et l'API JSON de cAdvisor au LAN — cf. l'en-tête de
# `compose.yaml` pour ce que ça révèle.

server {
    listen 8080;
    server_name _;

    # ⚠️ Journalisation des accès COUPÉE. Prometheus interroge toutes les 30 s, soit ~2 900 lignes
    # par jour qui ne disent rien d'autre que « le scrape a eu lieu » — l'information est déjà dans
    # la métrique `up` côté cluster, et bien mieux. Les ERREURS, elles, restent journalisées :
    # c'est là que se lit un 401 répété, donc une divergence de mot de passe.
    access_log off;
    error_log  /var/log/nginx/error.log warn;

    # ⚠️ `=` — correspondance EXACTE, pas un préfixe. Avec `location /metrics`, `/metricsfoo` et
    # `/metrics/../api/v1.3/containers` entreraient aussi dans ce bloc.
    location = /metrics {
        auth_basic           "metrics";
        # ⚠️ Chemin DANS LE CONTENEUR. Le fichier d'hôte est `/etc/cadvisor/htpasswd` ; c'est le
        # `volumes:` du compose qui fait le lien. Les deux se changent ensemble.
        auth_basic_user_file /etc/nginx/htpasswd;

        # ⚠️ RÉSOLUTION À LA REQUÊTE, ET NON AU DÉMARRAGE — c'est tout l'objet de ces trois lignes,
        # et elles ne sont pas interchangeables avec un simple `proxy_pass http://cadvisor:8080`.
        #
        # nginx traite un nom d'hôte ÉCRIT EN DUR dans `proxy_pass` au chargement de la conf : il le
        # résout une fois, met l'IP en cache pour toute la vie du processus, et **refuse de démarrer**
        # si le nom ne résout pas (`host not found in upstream`). Deux conséquences, toutes deux
        # constatées :
        #   - cAdvisor arrêté ou pas encore créé  -> nginx ne démarre PAS. Toute la pile tombe parce
        #     que la moitié qu'on protège est absente, alors qu'un 502 serait la bonne réponse.
        #   - cAdvisor recréé seul (nouvelle IP)  -> nginx vise l'ancienne et répond 502 jusqu'à ce
        #     qu'on le recrée LUI AUSSI.
        #
        # Passer par une VARIABLE force nginx à résoudre à chaque requête, via le `resolver`
        # ci-dessous. nginx démarre alors toujours, répond 502 tant que cAdvisor manque, et
        # repart tout seul dès qu'il revient — même avec une IP différente.
        #
        # ⚠️ `127.0.0.11` est le DNS embarqué de Docker. Il n'existe QUE sur un réseau défini par
        # l'utilisateur — ce qui est le cas du réseau implicite de ce compose. Il ne fonctionnerait
        # pas en `network_mode: host`.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream cadvisor:8080;
        proxy_pass http://$upstream/metrics;

        # ⚠️ Délai court ASSUMÉ. Un relevé cAdvisor qui dépasse 10 s sur trois conteneurs est un
        # incident, pas une lenteur : mieux vaut un 504 immédiat — que Prometheus enregistre en
        # `up == 0` — qu'un scrape qui traîne et fait déborder l'intervalle suivant.
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;

        # ⚠️ `Accept-Encoding` VIDÉ vers l'amont. Sans ça cAdvisor peut répondre en gzip, que nginx
        # relaie tel quel : correct, mais illisible au `curl` de diagnostic, et sans bénéfice sur
        # un LAN. La charge utile fait quelques dizaines de kilo-octets.
        proxy_set_header Accept-Encoding "";
    }

    # ⚠️ TOUT LE RESTE EN 404, ET C'EST LA MOITIÉ DE L'INTÉRÊT DE CE MANDATAIRE. cAdvisor sert sur
    # le même port une UI web (`/containers/`), une API JSON complète (`/api/v1.3/...`), des pages
    # de validation (`/validate/`) et, si `--profiling` était activé, `/debug/pprof/`. L'API en dit
    # bien plus que les métriques : variables d'environnement, commandes, points de montage de
    # chaque conteneur. Rien de tout ça n'a de client légitime ici — le seul est Prometheus, qui ne
    # demande que `/metrics`.
    #
    # ⚠️ `404` et non `403` : ne pas confirmer qu'il y a quelque chose derrière.
    location / {
        return 404;
    }
}
