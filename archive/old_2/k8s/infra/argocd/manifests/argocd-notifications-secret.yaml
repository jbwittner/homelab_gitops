# Patch du Secret `argocd-notifications-secret` livré VIDE par l'install.yaml upstream.
#
# Le contenu (`grafana-api-key`) est injecté par le SealedSecret
# `../post-bootstrap/argocd-notifications.sealed.yaml` — mais le contrôleur sealed-secrets
# REFUSE d'écrire dans un Secret qu'il n'a pas créé tant que celui-ci ne porte pas
# l'annotation ci-dessous (« Resource ... is not managed by SealedSecret » dans ses events).
# Elle doit donc être posée sur l'objet EXISTANT, ici, en plus d'être recopiée dans le
# template du SealedSecret.
#
# Ce patch reste dans `manifests/` (et non `post-bootstrap/`) : c'est un objet d'API cœur, il
# s'applique proprement à l'amorçage même si le contrôleur sealed-secrets n'existe pas encore.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
