# EXEMPLE — versionné, sans aucune valeur réelle. C'est la copie de référence du template de
# scellement `argocd-webhook.secret.yaml`, qui est gitignoré (`*.secret.yaml`) ET que la
# procédure de scellement demande de SUPPRIMER une fois `kubeseal` passé. Sans ce fichier-ci, la
# procédure disparaîtrait avec lui : un `SealedSecret` ne porte que du chiffré, pas les
# commentaires du clair.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient
# qu'un `REMPLACER`. Il se recopie, il ne s'applique pas.
#
# --------------------------------------------------------------------------------------------
#
# CE QUE C'EST : la clé HMAC avec laquelle `argocd-server` vérifie les livraisons reçues sur
# `/api/webhook` (en-tête `X-Hub-Signature-256`). AUCUN webhook n'est branché — GitHub ne joint
# pas le LAN, la sync se fait au polling. La clé reste posée parce que `/api/webhook` est un
# endpoint anonyme joignable depuis le LAN : sans clé, ArgoCD accepterait TOUTE livraison non
# signée, et n'importe qui pourrait déclencher en boucle des refresh de tout le parc. Personne
# n'a besoin de connaître la valeur. Cf. [README §Webhook](../README.md).
#
# ⚠️ Le nom de clé compte : ArgoCD ne lit que `webhook.github.secret`, `webhook.gitlab.secret`,
# `webhook.gogs.secret`, etc. Une clé inconnue est ignorée en silence — et l'endpoint redevient
# ouvert sans que rien ne le signale.
#
# ⚠️ Ce Secret s'appelle `argocd-secret` : il ne CRÉE pas un objet, il en complète un qui existe
# déjà et qui porte `server.secretkey` et le hash admin. C'est tout l'objet de l'annotation
# `patch` ci-dessous — sans elle, cet objet-ci écraserait les deux (cf.
# `../manifests/argocd-secret.yaml`, qui pose la même annotation sur l'objet existant).
#
# --------------------------------------------------------------------------------------------
#
# 1. Produire le fichier en clair à partir de ce template, avec un secret neuf :
#
#      SEC=k8s/infra/argocd/post-bootstrap/argocd-webhook.secret.yaml
#      grep -v '^#' k8s/infra/argocd/post-bootstrap/argocd-webhook.secret.example.yaml > "$SEC"
#      openssl rand -hex 32          # → la valeur à mettre dans "$SEC"
#
#    ⚠️ Le nom de la copie compte : `*.secret.yaml` est le motif du `.gitignore`. Un fichier
#    nommé autrement serait suivi par Git — avec le secret dedans.
#
# 2. Sceller (cf. k8s/infra/sealed-secrets/README.md §Sceller un Secret) :
#
#      kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#        < k8s/infra/argocd/post-bootstrap/argocd-webhook.secret.yaml \
#        > k8s/infra/argocd/post-bootstrap/argocd-webhook.sealed.yaml
#      rm k8s/infra/argocd/post-bootstrap/argocd-webhook.secret.yaml
#
#    ⚠️ Vérifier le CONTENU du `.sealed.yaml`, pas son existence : un fichier scellé vide
#    (0 octet) ne fait pas échouer `kustomize build`, il ne rend simplement rien.
#
# --------------------------------------------------------------------------------------------
#
# ROTATION : refaire 1 → 2, committer le `.sealed.yaml`. Aucun émetteur ne porte la valeur :
# rien d'autre à mettre à jour. Si un webhook est un jour rebranché, sa valeur devra être
# recopiée à l'identique côté émetteur — sinon chaque livraison est rejetée, sans autre effet que
# le retour au polling de 3 min.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  annotations:
    # Le contrôleur sealed-secrets AJOUTE la clé ci-dessous et ne touche à rien d'autre dans
    # `argocd-secret`. ⚠️ `patch` et non `managed` : `managed` remplacerait l'objet ENTIER —
    # exit `server.secretkey` et le hash `admin.password`.
    sealedsecrets.bitnami.com/patch: "true"
type: Opaque
stringData:
  # Clé HMAC de `/api/webhook`. 32 octets en hexadécimal (`openssl rand -hex 32`).
  webhook.github.secret: REMPLACER
