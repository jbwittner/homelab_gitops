# EXEMPLE — versionné, sans aucune valeur réelle. Copie de référence du clair
# `repo-homelab-gitops-github.secret.yaml` (gitignoré par `*.secret.yaml`, et SUPPRIMÉ une fois
# scellé). Un `SealedSecret` ne porte que du chiffré : sans ce fichier, la procédure disparaîtrait.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient que
# des `REMPLACER`. Il se recopie, il ne s'applique pas.
#
# --------------------------------------------------------------------------------------------
#
# CE QUE C'EST : le credential avec lequel `argocd-repo-server` clone CE dépôt sur GitHub
# (https://github.com/jbwittner/homelab_gitops, privé), sous l'identité d'une **GitHub App**.
#
# Pourquoi une App et pas une deploy key ou un PAT : pas d'expiration, rattachée à aucun compte
# humain, portée réduite à un dépôt et à la lecture. ArgoCD génère lui-même les jetons
# d'installation (1 h) à partir de la clé privée — rien à renouveler à la main.
#
# ⚠️ C'est le point de défaillance unique du moteur GitOps : s'il disparaît, si l'App est
# désinstallée ou sa clé révoquée, TOUTES les Applications tombent en `ComparisonError`, `argocd`
# compris. Symptôme côté
# `argocd-repo-server` : `authentication required` / HTTP 401, ou 404 (dépôt privé non couvert
# par l'installation).
#
# --------------------------------------------------------------------------------------------
#
# 1. Créer l'App : GitHub → Settings → Developer settings → GitHub Apps → New GitHub App
#      Nom          : unique sur tout GitHub, ex. `argocd-bleu-kalecgos-jbwittner`
#      Homepage URL : obligatoire, sans effet (https://argocd.lan.wittner.tech)
#      Webhook      : DÉCOCHER « Active » — la sync se fait au polling, cf. README §Webhook
#      Permissions  : Repository → Contents : Read-only — et RIEN d'autre
#                     (Metadata : Read-only est imposé par GitHub)
#      Installable  : Only on this account
#    → noter l'**App ID** (page de l'App, en haut).
#
#    ⚠️ Lecture seule, et pas par principe : un droit en écriture ferait de ce credential le seul
#    du dispositif capable de réécrire l'état désiré du cluster. ArgoCD ne fait que lire.
#
# 2. Générer la clé privée : page de l'App → Private keys → Generate a private key (un `.pem` est
#    téléchargé). ⚠️ Affichée une seule fois ; GitHub n'en garde que l'empreinte.
#
# 3. Installer l'App : page de l'App → Install App → compte `jbwittner` → **Only select
#    repositories** → `homelab_gitops`. L'**Installation ID** est le nombre en fin d'URL de la
#    page d'installation (`github.com/settings/installations/<ID>`).
#
#    ⚠️ « All repositories » marcherait aussi — et donnerait au cluster la lecture de tous les
#    dépôts privés du compte. Un seul dépôt.
#
# 4. Produire le clair. La clé PEM est multi-ligne : on ne la colle PAS dans ce template à la
#    main (une indentation de travers = clé illisible, et ArgoCD ne dit pas pourquoi). On génère
#    l'objet, puis on lui ajoute label et annotation :
#
#      SEC=k8s/infra/argocd/post-bootstrap/repo-homelab-gitops-github.secret.yaml
#      kubectl -n argocd create secret generic repo-homelab-gitops-github --dry-run=client -o yaml \
#          --from-literal=type=git \
#          --from-literal=url=https://github.com/jbwittner/homelab_gitops.git \
#          --from-literal=githubAppID=REMPLACER \
#          --from-literal=githubAppInstallationID=REMPLACER \
#          --from-file=githubAppPrivateKey=REMPLACER.pem \
#        | kubectl label --local -f - argocd.argoproj.io/secret-type=repository -o yaml \
#        | kubectl annotate --local -f - sealedsecrets.bitnami.com/managed=true -o yaml \
#        > "$SEC"
#
#    ⚠️ Le nom de la copie compte : `*.secret.yaml` est le motif du `.gitignore`.
#
# 5. Sceller (cf. k8s/infra/sealed-secrets/README.md §Sceller un Secret) :
#
#      kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#        < "$SEC" > k8s/infra/argocd/post-bootstrap/repo-homelab-gitops-github.sealed.yaml
#      rm "$SEC" REMPLACER.pem
#
#    puis décommenter la ligne `repo-homelab-gitops-github.sealed.yaml` de `kustomization.yaml`
#    DANS LE MÊME COMMIT.
#
#    ⚠️ Vérifier le CONTENU du `.sealed.yaml`, pas son existence : un fichier scellé vide ne fait
#    pas échouer `kustomize build`, il ne rend rien.
#    ⚠️ Chiffré pour le couple (`repo-homelab-gitops-github`, `argocd`) : le renommer ou le changer
#    de namespace le rend indéchiffrable.
#    ⚠️ Supprimer le `.pem` : il est dans le `SealedSecret`, et GitHub en régénère un à la demande.
#
# BOOTSTRAP À FROID : le clair de l'étape 4 s'applique à la main AVANT `k8s/root.yaml`, la
# CRD `SealedSecret` n'existant pas encore — même geste et mêmes raisons que dans le README
# §Accès au dépôt privé :
#
#      kubectl apply -f "$SEC" --server-side --force-conflicts
#
#    ⚠️ `--server-side` obligatoire : en client-side la clé privée finit en clair dans
#    l'annotation `last-applied-configuration`, que le scellement ne nettoie jamais.
#
# ROTATION : générer une NOUVELLE clé privée (étape 2), refaire 4 → 5, committer, attendre que le
# Secret soit à jour dans le cluster, PUIS supprimer l'ancienne clé côté GitHub — dans l'autre
# ordre, fenêtre pendant laquelle plus rien ne synchronise.
apiVersion: v1
kind: Secret
metadata:
  name: repo-homelab-gitops-github
  namespace: argocd
  labels:
    # Ce label est ce qui fait qu'ArgoCD regarde ce Secret. Sans lui l'objet est inerte.
    argocd.argoproj.io/secret-type: repository
  annotations:
    # Autorise le contrôleur sealed-secrets à reprendre un Secret qu'il n'a pas créé (celui posé
    # à la main au bootstrap à froid).
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  type: git
  # ⚠️ Doit être STRICTEMENT la chaîne des `repoURL` de `k8s/`, suffixe `.git` compris :
  # ArgoCD apparie credential et source par égalité d'URL normalisée. Un décalage ne produit
  # aucune erreur, juste un clone anonyme qui échoue en 404.
  # ⚠️ HTTPS obligatoire : une GitHub App ne s'authentifie pas en SSH.
  url: https://github.com/jbwittner/homelab_gitops.git
  githubAppID: "REMPLACER"
  githubAppInstallationID: "REMPLACER"
  githubAppPrivateKey: |
    REMPLACER
