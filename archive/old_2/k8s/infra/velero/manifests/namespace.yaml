apiVersion: v1
kind: Namespace
metadata:
  name: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-1"       # avant les objets du chart, qui atterrissent tous ici
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: homelab-gitops
    # ⚠️ LOAD-BEARING. Le DaemonSet node-agent monte /var/lib/kubelet/pods en hostPath pour lire le
    # contenu des volumes montés par les pods : hostPath est INTERDIT par le PodSecurity `baseline`
    # appliqué par défaut sur Talos, donc sans ce label les pods node-agent sont refusés à
    # l'admission et seuls les objets Kubernetes seraient sauvegardés — jamais les données.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
