apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-barman-plugin
  namespace: argocd
  annotations:
    # Wave -1 : ce composant apporte la CRD `objectstores.barmancloud.cnpg.io`, consommée par le
    # `manifests/` de l'application qui possède une base sauvegardée (wave 0 par défaut) — aucune
    # aujourd'hui. Sans cet ordre, une sync à
    # froid ferait échouer cette application sur `no matches for kind "ObjectStore"` avant de se
    # réparer au retry. Ce symptôme-là se règle par une wave puisque les deux composants vivent
    # dans le MÊME app-of-apps
    # (`k8s/app/app.bootstrap.yaml`). Les waves ne jouent qu'à l'intérieur d'un app-of-apps.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: cnpg-barman-plugin
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: database
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Plugin CNPG-I `barman-cloud` : la sauvegarde native de PostgreSQL vers un stockage objet
  # (archétype (a) : Helm + `$values`).
  #
  # POURQUOI UN COMPOSANT SÉPARÉ DE [cnpg](../cnpg/README.md). Depuis CloudNativePG 1.26, le
  # support barman-cloud a été SORTI de l'opérateur (`spec.backup.barmanObjectStore` est déprécié
  # et disparaît en 1.28+) au profit de ce plugin, distribué comme un chart et une image à part.
  # Ce sont deux charts, deux cadences de release, deux `targetRevision` que Renovate suit
  # séparément — donc deux Applications, comme partout ailleurs dans ce repo.
  #
  # ⚠️ Le plugin DOIT tourner dans le namespace de l'opérateur (`cnpg-system`) : c'est là que
  # l'opérateur va chercher le Service `barman-cloud:9090` de CNPG-I. Le déplacer ailleurs ne
  # produit aucune erreur au déploiement — seulement des Clusters dont le plugin reste
  # `Unavailable`.
  #
  # ⚠️ DEUX PRÉ-REQUIS, dont un cross-tier :
  #   - CloudNativePG >= 1.26 — ici 1.30.0 (chart `cloudnative-pg` 0.29.0), OK.
  #   - cert-manager — le chart rend un `Issuer` auto-signé et DEUX `Certificate` (client et
  #     serveur) pour le mTLS opérateur ↔ plugin. cert-manager vit dans `k8s/infra/`, donc
  #     dans un AUTRE app-of-apps : aucune wave ne les ordonne. Au bootstrap à froid cette
  #     Application reste en erreur jusqu'à son arrivée, puis se répare seule (`selfHeal`).
  #     Même raisonnement que [velero-monitoring](../../infra/velero-monitoring/README.md).
  #
  # Ce composant n'active RIEN par lui-même : installer le plugin ne sauvegarde aucune base. Un
  # `Cluster` n'est pris en charge que s'il porte explicitement `spec.plugins` et pointe un
  # `ObjectStore` — même logique de liste blanche que la schedule velero. Voir le README.
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: plugin-barman-cloud
      # Chart 0.8.0 → appVersion v0.15.0. ⚠️ Le chart tire DEUX images qui doivent rester
      # solidaires : `plugin-barman-cloud` (le Deployment) et `plugin-barman-cloud-sidecar`
      # (injecté dans chaque pod d'instance PostgreSQL). Les deux prennent l'appVersion du chart
      # par défaut — ne PAS épingler `image.tag` / `sidecarImage.tag` séparément.
      targetRevision: 0.8.0
      helm:
        releaseName: plugin-barman-cloud
        valueFiles:
          - $values/k8s/app/cnpg-barman-plugin/helm-values.yaml
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
  destination:
    name: bleu-kalecgos
    # ns `cnpg-system` — créé par le composant [cnpg](../cnpg/README.md)
    # (`CreateNamespace=true`). Pas de `CreateNamespace` ici : ce composant ne le possède pas,
    # et deux Applications qui se disputent la création d'un namespace produisent une dérive.
    namespace: cnpg-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
