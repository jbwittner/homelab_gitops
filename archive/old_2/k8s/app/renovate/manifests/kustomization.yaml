apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renovate
resources:
  - namespace.yaml
  #
  # ⚠️ Un fichier scellé VIDE (0 octet) ne fait PAS échouer le build : kustomize l'accepte et ne
  # rend rien. C'est précisément le piège dans lequel ce dépôt est déjà tombé une fois — le Job
  # tournait sur un Secret orphelin que plus personne ne gérait, et rien ne le signalait.
  #
  # ⚠️ Les `*.secret.example.yaml` ne vont JAMAIS ici : ils ne contiennent que des `REMPLACER`.
  #
  - renovate-github.sealed.yaml     # GitHub App → Secret `renovate-github`
  - cron-job-github.yaml
configMapGenerator:
  # Suffixe de hash : toute modification de config.mjs change le nom du ConfigMap, donc le
  # CronJob, et le run suivant prend la nouvelle version — pas de ConfigMap modifié en place.
  - name: renovate-github-config
    files:
      - config.mjs
