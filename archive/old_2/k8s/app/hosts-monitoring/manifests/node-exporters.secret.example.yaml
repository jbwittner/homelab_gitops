# EXEMPLE — versionné, sans aucune valeur réelle. Copie de référence du template de scellement
# `node-exporters.secret.yaml`, qui est gitignoré (`*.secret.yaml`) et supprimé après `kubeseal`.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient que
# des `REMPLACER`. Il se recopie, il ne s'applique pas.
#
# --------------------------------------------------------------------------------------------
#
# À quoi il sert : présenter `Authorization: Basic ...` aux `node-exporter` des machines HORS
# CLUSTER de ce composant. Une seule aujourd'hui, `vert-emeriss` : pile `docker/node-exporter/` de
# ce dépôt, fichier d'hôte `/etc/node-exporter/web-config.yml`. Sans en-tête, l'exportateur
# répond 401 et la cible reste muette.
#
# ⚠️ NOMMÉ AU PLURIEL À DESSEIN. Il porte le credential de TOUTES les machines de ce composant.
# Ajouter une machine = un fichier de ScrapeConfig de plus et le MÊME hachage posé sur son hôte ;
# pas un Secret de plus. C'est un choix d'exploitation, pas de sécurité : une machine compromise
# donne déjà bien plus que le mot de passe de lecture des métriques de ses voisines.
#
# ⚠️ IL N'EST PAS À PARTAGER avec un exportateur APPLICATIF ajouté plus tard sur la même machine
# (un `postgres-exporter`, par exemple), même s'il pourrait utiliser la même paire. Ce ne serait
# pas une isolation cryptographique — illusoire, même hôte, même `docker inspect` — c'est une
# INDÉPENDANCE DE CYCLE DE VIE : retirer le service doit pouvoir supprimer son Secret sans toucher
# à la supervision de la machine, qui lui survit. Un secret partagé réintroduirait exactement le
# couplage que la séparation des composants sert à défaire.
#
# ⚠️ CÔTÉ HÔTE, C'EST UN HACHAGE BCRYPT QUI EST STOCKÉ, pas le mot de passe. Ici c'est le mot de
# passe EN CLAIR (scellé) : c'est Prometheus qui l'émet. On ne peut donc PAS récupérer la valeur
# depuis la machine si elle est perdue — il faut en tirer une neuve et refaire les deux copies.
#
# Scellement (depuis la racine du repo) :
#   cp k8s/app/hosts-monitoring/manifests/node-exporters.secret.example.yaml \
#      k8s/app/hosts-monitoring/manifests/node-exporters.secret.yaml
#   # tirer le mot de passe, puis le renseigner ci-dessous :
#   openssl rand -base64 24
#   kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#     < k8s/app/hosts-monitoring/manifests/node-exporters.secret.yaml \
#     > k8s/app/hosts-monitoring/manifests/node-exporters.sealed.yaml
#   rm k8s/app/hosts-monitoring/manifests/node-exporters.secret.yaml
#   # puis DÉCOMMENTER la ligne `node-exporters.sealed.yaml` de kustomization.yaml
#
# Puis, sur chaque machine du composant, produire le hachage du MÊME mot de passe et le poser dans
# `/etc/node-exporter/web-config.yml` (paquet `apache2-utils`, cf. docker/node-exporter/README.md
# §« Mise en service » — et `/etc/cadvisor/htpasswd`, cf. docker/cadvisor/README.md) :
#   htpasswd -nBC 12 "" | tr -d ':\n' ; echo
#
# ⚠️ ORDRE DE ROTATION : le CLUSTER D'ABORD, les hôtes ensuite. `exporter-toolkit` relit son
# fichier à chaque requête (aucun redémarrage), alors que ce Secret demande un commit puis une
# synchro ArgoCD. Dans l'autre sens, la fenêtre de 401 dure le temps du commit — et au-delà de
# 10 min elle allume `ExternalNodeDown`.
#
# ⚠️ Entre Traefik et les machines, ce mot de passe passe EN CLAIR sur le LAN : le TLS s'arrête au
# proxy (pas de `tls_server_config` côté exportateurs, qui imposerait un certificat auto-signé
# donc un `insecureSkipVerify` — que ce dépôt refuse).
apiVersion: v1
kind: Secret
metadata:
  name: node-exporters
  namespace: monitoring
  labels:
    # Exclut le Secret des sauvegardes velero : il est reproductible depuis Git, et le RESTAURER
    # nuit — un Secret restauré arrive sans ownerReference, le contrôleur sealed-secrets refuse
    # alors de s'approprier l'objet préexistant et le Secret devient orphelin, en silence.
    velero.io/exclude-from-backup: "true"
type: Opaque
stringData:
  # ⚠️ `prometheus` est le nom attendu par les `web-config.yml` des hôtes (clé de
  # `basic_auth_users`). Le changer ici sans le changer là-bas donne un 401, donc `up == 0`, donc
  # une alerte de disponibilité de la machine — pas un message d'authentification.
  username: "prometheus"
  # `openssl rand -base64 24`. En clair ici, scellé ensuite ; les hôtes n'en gardent que le bcrypt.
  password: "REMPLACER"
