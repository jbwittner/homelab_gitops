# `secret_key` d'authentik (AUTHENTIK_SECRET_KEY), servi par openbao.
#
# ⚠️ Cette valeur ne doit JAMAIS changer après la première installation : elle chiffre les
# tokens et sessions en base. Le stocker en KV v2 (versionné) est un gain net sur le
# scellement — un écrasement accidentel côté coffre se rattrape par `bao kv rollback`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secret-key
      remoteRef:
        key: homelab/authentik/secrets
        property: secret-key
