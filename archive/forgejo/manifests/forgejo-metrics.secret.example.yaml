# EXEMPLE — versionné, sans aucune valeur réelle. Copie de référence du template de scellement
# `forgejo-metrics.secret.yaml`, qui est gitignoré (`*.secret.yaml`) et supprimé après `kubeseal`.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être : il ne contient
# qu'un `REMPLACER`. Il se recopie, il ne s'applique pas.
#
# --------------------------------------------------------------------------------------------
#
# ⚠️ POURQUOI CE SECRET EST SEUL DANS SON FICHIER, et non un quatrième document de
# `forgejo-admin.secret.example.yaml` comme les trois autres : un `SealedSecret` ne se relit pas.
# Re-sceller le fichier groupé pour y ajouter un document oblige à re-fournir AUSSI les valeurs
# des trois autres — dont les quatre secrets cryptographiques du document 2, que des valeurs
# neuves invalideraient d'un coup (sessions, jetons d'API, LFS, OAuth2). Un token de métriques ne
# vaut pas ce risque : il vit dans son propre fichier, se scelle seul et se change seul.
#
# À quoi il sert, des DEUX côtés à la fois :
#   - Forgejo l'écrit dans `[metrics] TOKEN` de l'`app.ini` (`FORGEJO__METRICS__TOKEN`,
#     helm-values.yaml) et répond 401 à toute requête `/metrics` sans
#     `Authorization: Bearer <token>` ;
#   - le ServiceMonitor `forgejo-metrics` le présente à chaque scrape.
# C'est la même clé du même Secret pour les deux : ils ne peuvent pas diverger.
#
# Valeur (aucune contrainte de format côté Forgejo, la comparaison est octet à octet) :
#   openssl rand -hex 32
#
# Scellement (cf. README §Métriques) :
#   cp cluster/app/forgejo/manifests/forgejo-metrics.secret.example.yaml \
#      cluster/app/forgejo/manifests/forgejo-metrics.secret.yaml
#   # renseigner `token`, puis :
#   kubeseal --controller-name sealed-secrets --controller-namespace sealed-secrets --format yaml \
#     < cluster/app/forgejo/manifests/forgejo-metrics.secret.yaml \
#     > cluster/app/forgejo/manifests/forgejo-metrics.sealed.yaml
#   rm cluster/app/forgejo/manifests/forgejo-metrics.secret.yaml
#   # puis DÉCOMMENTER la ligne `forgejo-metrics.sealed.yaml` de kustomization.yaml
#
# ⚠️ Rotation : rescellé, le Secret change pour les deux consommateurs, mais PAS au même moment —
# Prometheus recharge sa configuration en quelques dizaines de secondes, Forgejo ne relit son
# `app.ini` qu'au DÉMARRAGE. Entre les deux, la cible est en 401. Un
# `kubectl -n forgejo rollout restart deploy/forgejo` referme la fenêtre.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-metrics
  namespace: forgejo
  labels:
    # ⚠️ Le label est PORTÉ PAR LE TEMPLATE EN CLAIR, et pas ajouté après coup dans le fichier
    # scellé comme il l'a été pour `forgejo-admin.sealed.yaml` : `kubeseal` recopie les métadonnées
    # de l'entrée dans `spec.template.metadata`, un re-scellement le reproduit donc tout seul.
    # Ce qu'il fait : exclut le Secret des sauvegardes velero. Il est reproductible depuis Git, et
    # le RESTAURER nuit — un Secret restauré arrive sans ownerReference, le contrôleur
    # sealed-secrets refuse alors de s'approprier l'objet préexistant et le Secret devient
    # orphelin, en silence. Cf. en-tête de forgejo-admin.sealed.yaml.
    velero.io/exclude-from-backup: "true"
type: Opaque
stringData:
  # [metrics] TOKEN -> FORGEJO__METRICS__TOKEN
  token: "REMPLACER"
