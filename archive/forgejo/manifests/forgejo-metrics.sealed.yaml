# Token du `/metrics` de Forgejo, scellé. Consommé DEUX FOIS depuis la même clé `token` :
# `FORGEJO__METRICS__TOKEN` côté pod (helm-values.yaml) et `authorization.credentials` côté
# ServiceMonitor (forgejo-metrics-servicemonitor.yaml) — c'est ce partage qui les empêche de
# diverger. Cf. README §Métriques pour la rotation (⚠️ Forgejo ne relit son `app.ini` qu'au
# démarrage : rescellé sans `rollout restart`, la cible reste en 401).
#
# Scellé À PART du fichier groupé `forgejo-admin.sealed.yaml`, à dessein : un `SealedSecret` ne se
# relit pas, et re-sceller le groupé pour y ajouter un document obligerait à re-fournir les quatre
# secrets cryptographiques du document 2 — que des valeurs neuves invalideraient. Un token de
# métriques ne vaut pas ce risque.
#
# Le label `velero.io/exclude-from-backup` a la même justification qu'à côté (cf. en-tête de
# forgejo-admin.sealed.yaml) : reproductible depuis Git, et une restauration l'ORPHELINE.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-metrics
  namespace: forgejo
spec:
  encryptedData:
    token: 
  template:
    metadata:
      labels:
        # Même raison que pour les trois Secrets de forgejo-admin.sealed.yaml : un Secret restauré
        # par velero arrive sans ownerReference, le contrôleur refuse de s'approprier un objet
        # préexistant, et le Secret devient ORPHELIN — une rotation faite dans Git ne se propage
        # plus, en silence.
        velero.io/exclude-from-backup: "true"
      name: forgejo-metrics
      namespace: forgejo
    type: Opaque
