# EXEMPLE — versionné, sans aucune valeur réelle. Copie de référence du template de scellement
# `forgejo-db-gcs.secret.yaml`, qui est gitignoré (`*.secret.yaml`) et que la procédure demande de
# SUPPRIMER une fois `kubeseal` passé. Sans ce fichier-ci, la raison de chaque valeur
# disparaîtrait avec lui : un `SealedSecret` ne porte que du chiffré.
#
# ⚠️ Ce fichier n'est PAS dans `kustomization.yaml` et ne doit jamais y être. Il se recopie, il ne
# s'applique pas :
#
#   cp manifests/forgejo-db-gcs.secret.example.yaml manifests/forgejo-db-gcs.secret.yaml
#
# ⚠️ Le nom de la copie compte : `*.secret.yaml` est le motif du `.gitignore`. Un fichier nommé
# autrement serait suivi par Git avec la clé privée du compte de service en clair.
#
# --------------------------------------------------------------------------------------------
#
# POURQUOI CE SECRET EST SCELLÉ À PART, et non ajouté comme quatrième document au template
# multi-documents `forgejo-admin.secret.example.yaml`. Un `SealedSecret` ne se relit pas : ajouter
# un document oblige à re-fournir AUSSI les valeurs des documents déjà scellés. Or ces deux
# secrets n'ont ni le même cycle de vie ni le même détenteur — la clé du compte de service GCP se
# tourne côté GCP (`gcloud iam service-accounts keys create`), quand le mot de passe admin et les
# quatre secrets cryptographiques de Forgejo ne bougent quasiment jamais et sont, eux, IRRÉCUPÉRABLES
# si on les perd. Les mélanger ferait dépendre chaque rotation de clé GCS d'une reprise du mot de
# passe admin et des quatre secrets — c'est-à-dire du risque décrit en capitales dans
# `forgejo-admin.secret.example.yaml`. D'où deux fichiers scellés, et deux lignes dans
# `kustomization.yaml`.
#
# CE QUE CONTIENT LA CLÉ. C'est le fichier JSON ENTIER téléchargé depuis GCP, tel quel, sans
# ré-indentation ni retrait des sauts de ligne. Le plugin barman-cloud le passe à la bibliothèque
# Google, qui attend un document JSON valide — un fichier tronqué produit un échec d'archivage WAL,
# donc `cnpg_pg_stat_archiver_failed_count` qui monte, et non une erreur au démarrage du pod.
#
# ⚠️ Le nom de la clé DOIT être `cloud` : il est référencé par
# `forgejo-db-objectstore.yaml` (`googleCredentials.applicationCredentials.key`). Le nom du Secret
# (`forgejo-db-gcs`) et son namespace (`forgejo`) sont figés par le scellement — sealed-secrets
# chiffre pour le couple (nom, namespace), les changer exige de resceller.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-db-gcs
  namespace: forgejo
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Contenu intégral de la clé JSON du compte de service, collé ici. Le bloc littéral `|` conserve
  # les sauts de ligne — indispensable, la valeur `private_key` en contient.
  cloud: |
    REMPLACER
