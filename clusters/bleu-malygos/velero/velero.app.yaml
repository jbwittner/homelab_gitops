apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-malygos
  namespace: argocd
  labels:
    layer: infra
spec:
  project: default
  destination:
    name: bleu-malygos
    namespace: velero
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.2.1
      helm:
        releaseName: velero
        valueFiles:
          - $values/components/velero/values.yaml
          - $values/clusters/bleu-malygos/velero/values.yaml
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: clusters/bleu-malygos/velero/manifests
  syncPolicy:
    # pas de prune : supprimer une CRD supprime les Backups et Schedules
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    # sans fin : une dépendance (CRD, secret) d'une autre Application peut arriver tard (boot à blanc)
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
