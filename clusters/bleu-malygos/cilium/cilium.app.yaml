apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-malygos
  namespace: argocd
  labels:
    layer: boot
spec:
  project: default
  destination:
    name: bleu-malygos
    namespace: kube-system
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: 1.20.3
      helm:
        releaseName: cilium
        valueFiles:
          - $values/components/cilium/values.yaml
          - $values/clusters/bleu-malygos/cilium/values.yaml
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: clusters/bleu-malygos/cilium/manifests
  syncPolicy:
    # pas de prune : une suppression dans le CNI couperait le cluster
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    # sans fin : une dépendance (CRD, secret) d'une autre Application peut arriver tard (boot à blanc)
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
