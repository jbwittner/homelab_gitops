apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-malygos
  namespace: argocd
spec:
  project: default
  destination:
    name: bleu-malygos
    namespace: kube-system
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.20.0
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/clusters/bleu-malygos/sealed-secrets/values.yaml
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
  syncPolicy:
    # pas de prune : supprimer la CRD supprime tous les SealedSecrets et leurs Secrets
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
