          "type": "timeseries",
          "description": "Source: kube-state-metrics. `kube_pod_container_status_restarts_total` only counts restarts INSIDE a pod that keeps existing: a recreated pod (rollout, eviction) is a new object whose counter starts back at zero, so the restart series stays flat during exactly the event it is meant to catch. The second series counts the argocd pods started less than an hour ago."
