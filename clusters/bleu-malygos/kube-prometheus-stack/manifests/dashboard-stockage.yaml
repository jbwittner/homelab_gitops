# Dashboard « Storage — cluster » : état des nœuds et VG LVM (OpenEBS) des deux clusters, variable cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-stockage
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  stockage.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": false,
            "iconColor": "purple",
            "name": "ArgoCD deployments",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [
                "argocd",
                "deployed"
              ],
              "type": "tags"
            }
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "id": 100,
          "panels": [],
          "title": "Node state",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "One row per node: stays readable whether the cluster has 2, 3 or more. \"Load / core\" is the 1 min load average divided by the core count — 1.00 = exactly saturated. A dash means the node does not expose that sensor (no coretemp, no NVMe) or, for \"NVMe (% threshold)\", that no disk reports a valid threshold — not that it is broken.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "mode": "gradient",
                  "type": "gauge",
                  "valueDisplayMode": "text"
                },
                "inspect": false
              },
              "decimals": 0,
              "mappings": [],
              "max": 100,
              "min": 0,
              "noValue": "—",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "orange",
                    "value": 85
                  },
                  {
                    "color": "red",
                    "value": 95
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Node"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "auto"
                    }
                  },
                  {
                    "id": "unit",
                    "value": "string"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Load / core"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "max",
                    "value": 2
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 0.8
                        },
                        {
                          "color": "orange",
                          "value": 1
                        },
                        {
                          "color": "red",
                          "value": 1.5
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU temp."
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  },
                  {
                    "id": "max",
                    "value": 100
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "blue",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 40
                        },
                        {
                          "color": "yellow",
                          "value": 70
                        },
                        {
                          "color": "orange",
                          "value": 80
                        },
                        {
                          "color": "red",
                          "value": 90
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Pods"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 24,
            "h": 8
          },
          "id": 2,
          "options": {
            "cellHeight": "lg",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Node"
              }
            ]
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{cluster=~\"$cluster\",instance=~\"$instance\",mode=\"idle\"}[$__rate_interval])) * 100)",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance) ((1 - node_memory_MemAvailable_bytes{cluster=~\"$cluster\",instance=~\"$instance\"} / node_memory_MemTotal_bytes{cluster=~\"$cluster\",instance=~\"$instance\"}) * 100)",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance) ((1 - node_filesystem_avail_bytes{cluster=~\"$cluster\",instance=~\"$instance\",mountpoint=\"/var\"} / node_filesystem_size_bytes{cluster=~\"$cluster\",instance=~\"$instance\",mountpoint=\"/var\"}) * 100)",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance) (node_load1{cluster=~\"$cluster\",instance=~\"$instance\"}) / count by (instance) (node_cpu_seconds_total{cluster=~\"$cluster\",instance=~\"$instance\",mode=\"idle\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance) (node_hwmon_temp_celsius{cluster=~\"$cluster\",instance=~\"$instance\",chip=~\"platform_coretemp.*\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "E"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance) (node_hwmon_temp_celsius{cluster=~\"$cluster\",instance=~\"$instance\",chip=~\"nvme.*\",sensor=\"temp1\"} / on (instance, chip) (node_hwmon_temp_max_celsius{cluster=~\"$cluster\",instance=~\"$instance\",chip=~\"nvme.*\",sensor=\"temp1\"} > 0 < 200)) * 100",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "F"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "count by (instance) (label_replace(kube_pod_info{cluster=~\"$cluster\",node=~\"$node\"}, \"instance\", \"\", \"\", \"\") * on (node) group_left (instance) label_replace(max by (instance, nodename) (node_uname_info{cluster=~\"$cluster\",instance=~\"$instance\"}), \"node\", \"$1\", \"nodename\", \"(.*)\"))",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "G"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance, nodename) (node_uname_info{cluster=~\"$cluster\",instance=~\"$instance\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "H"
            }
          ],
          "title": "Node state",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "instance",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "Time 5": true,
                  "Time 6": true,
                  "Time 7": true,
                  "Time 8": true,
                  "Value #H": true,
                  "instance": true
                },
                "indexByName": {
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4,
                  "Value #E": 5,
                  "Value #F": 6,
                  "Value #G": 7,
                  "nodename": 0
                },
                "renameByName": {
                  "Value #A": "CPU",
                  "Value #B": "Memory",
                  "Value #C": "/var",
                  "Value #D": "Load / core",
                  "Value #E": "CPU temp.",
                  "Value #F": "NVMe (% threshold)",
                  "Value #G": "Pods",
                  "nodename": "Node"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 24,
            "h": 1
          },
          "id": 101,
          "panels": [],
          "title": "LVM VolumeGroups — OpenEBS",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "LVM layer (OpenEBS exporter). LVM PVs have no filesystem: they are invisible to node-exporter, hence absent from the neighbouring panel.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "orange",
                    "value": 85
                  },
                  {
                    "color": "red",
                    "value": 95
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 24,
            "h": 8
          },
          "id": 26,
          "options": {
            "displayMode": "gradient",
            "maxVizHeight": 300,
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance, name) ((1 - lvm_vg_free_size_bytes{cluster=~\"$cluster\",instance=~\"$instance\"} / lvm_vg_total_size_bytes{cluster=~\"$cluster\",instance=~\"$instance\"}) * 100)",
              "legendFormat": "{{instance}} · {{name}}",
              "range": true,
              "refId": "A",
              "instant": false
            }
          ],
          "title": "LVM VolumeGroups (OpenEBS)",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "LVM layer (OpenEBS exporter). LVM PVs have no filesystem: invisible to node-exporter, whatever disk carries them. The slope shows the pace at which PVCs are provisioned.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 8,
                "gradientMode": "opacity",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "bytes",
              "min": 0
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 8
          },
          "id": 29,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance, name) (lvm_vg_free_size_bytes{cluster=~\"$cluster\",instance=~\"$instance\"})",
              "legendFormat": "{{instance}} · {{name}} — free",
              "range": true,
              "refId": "A",
              "instant": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance, name) (lvm_vg_total_size_bytes{cluster=~\"$cluster\",instance=~\"$instance\"})",
              "legendFormat": "{{instance}} · {{name}} — capacity",
              "range": true,
              "refId": "B",
              "instant": false
            }
          ],
          "title": "LVM VolumeGroup — free space",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 24,
            "h": 1
          },
          "id": 102,
          "panels": [],
          "title": "Capacity and metadata",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 6,
            "h": 4
          },
          "id": 21,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(lvm_vg_total_size_bytes{cluster=~\"$cluster\",instance=~\"$instance\"})",
              "legendFormat": "",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "VG — capacity (total)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 6,
            "y": 27,
            "w": 6,
            "h": 4
          },
          "id": 20,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(lvm_vg_free_size_bytes{cluster=~\"$cluster\",instance=~\"$instance\"})",
              "legendFormat": "",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "VG — free (total)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Total number of provisioned logical volumes / physical volumes, across all VolumeGroups.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 12,
            "y": 27,
            "w": 6,
            "h": 4
          },
          "id": 22,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(lvm_vg_lv_count{cluster=~\"$cluster\",instance=~\"$instance\"})",
              "legendFormat": "LV",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum(lvm_vg_pv_count{cluster=~\"$cluster\",instance=~\"$instance\"})",
              "legendFormat": "PV",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "LVM volumes",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Fill level of the LVM metadata. It saturates well before the data space only when there are very many LVs/snapshots.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "orange",
                    "value": 85
                  },
                  {
                    "color": "red",
                    "value": 95
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 18,
            "y": 27,
            "w": 6,
            "h": 4
          },
          "id": 23,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "(1 - sum(lvm_vg_mda_free_size_bytes{cluster=~\"$cluster\",instance=~\"$instance\"}) / sum(lvm_vg_mda_total_size_bytes{cluster=~\"$cluster\",instance=~\"$instance\"})) * 100",
              "legendFormat": "",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "VG metadata",
          "type": "stat"
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": [
        "wittnerlab",
        "cluster",
        "storage",
