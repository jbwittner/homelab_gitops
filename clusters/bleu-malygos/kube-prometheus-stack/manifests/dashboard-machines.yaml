# Dashboard « Machines » : tous les nœuds (node-exporter) des deux clusters, variable cluster.
# Chargé par le sidecar Grafana (label grafana_dashboard), rangé dans le dossier grafana_folder.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-machines
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  machines.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": false,
            "iconColor": "purple",
            "name": "ArgoCD deployments",
            "target": {
              "limit": 100,
              "matchAny": false,
              "tags": [
                "argocd",
                "deployed"
              ],
              "type": "tags"
            }
          }
        ]
      },
      "description": "System view of every node running node-exporter, on both clusters (bleu-malygos, bleu-kalecgos). Essentials first; fine-grained analysis in the collapsed \"Diagnostic\" rows. Nodes, disks and sensors are discovered dynamically.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "id": 1,
          "panels": [],
          "title": "Overview",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Share of CPU time spent ANYWHERE but `idle`, averaged over all cores. `1 - avg(rate(idle))` rather than the sum of the other modes: same value, but it stays correct if a mode appears or disappears from one kernel version to the next.\n\n⚠️ THIS FIGURE ALONE MISLEADS: storage-bound workloads (databases, Git, image pulls) can be sluggish with a low CPU, a high `iowait` and a saturated disk. Read it next to \"Load (1 min)\" and \"Disk saturation\" further down — if the load goes above 1 while this square is green, the bottleneck is the disk, not the compute.\n\nNo alert is built on it, deliberately: a CPU spike is usually a build, a compaction or a reindexing, not an incident.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "percentunit",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 6
          },
          "id": 80,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{cluster=~\"$cluster\",instance=~\"$instance\",mode=\"idle\"}[$__rate_interval]))",
              "legendFormat": "{{instance}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "title": "CPU used",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`1 - MemAvailable/MemTotal`. ⚠️ `MemAvailable` AND NOT `MemFree`: the latter ignores the reclaimable cache and would show 90% on a perfectly healthy machine — the classic misreading on Linux.\n\nThe red of this square is aligned on the threshold of the `ExternalNodeMemoryPressure` alert (less than 10% available for 20 min).\n\n⚠️ A brief trip to red when an application starts or reindexes is EXPECTED. Lasting, on the other hand, it ends in an OOM-kill — which will show as the service's own alert, without naming the cause.\n\nThe host carries 15 GiB for a handful of stacks: this square must stay very low. The detail — total, used, available, cache — is in the \"Memory\" panel.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "percentunit",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 6
          },
          "id": 81,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "1 - (node_memory_MemAvailable_bytes{cluster=~\"$cluster\",instance=~\"$instance\"} / node_memory_MemTotal_bytes{cluster=~\"$cluster\",instance=~\"$instance\"})",
              "legendFormat": "{{instance}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "title": "RAM used",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "A DELIBERATELY SILENT tile: it shows a mount point only when one goes above 80% full. Otherwise it says \"all < 80%\" in green.\n\n⚠️ UNDERSTAND THE MECHANICS BEFORE CHANGING IT: the `> 0.80` is not formatting, it is a vector FILTER. Below the threshold the series does not exist — the tile is in the \"no data\" state, and what shows is the `noValue`. That is also why the first colour step is GREEN: it never colours a value (they are at least 0.80 by construction), it colours the absence.\n\n`topk(1, ...)` rather than `max(...)`: `max` would return a scalar with NO label, hence a percentage one could not attribute to anything. `topk` keeps the mount point, which the tile displays.\n\n⚠️ IT SHOWS ONLY ONE MOUNT AT A TIME. If two disks cross 80% together, the second is hidden. The \"Mounted filesystems\" panel further down shows them all — this one is a warning light, not an inventory.\n\nOrange at 80% is a HEADS-UP with no alert attached; red at 90% is the exact threshold of `ExternalNodeDiskAlmostFull` (severity critical). So a red square announces an alert that will fire within 30 min.\n\n`tmpfs` are dropped at scrape time: `/run/lock` is 5 MiB and would permanently top this ranking.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "percentunit",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              },
              "noValue": "all < 80%"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 5,
            "h": 4
          },
          "id": 82,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "topk(1, (1 - (node_filesystem_avail_bytes{cluster=~\"$cluster\",instance=~\"$instance\"} / node_filesystem_size_bytes{cluster=~\"$cluster\",instance=~\"$instance\"})) > 0.80)",
              "legendFormat": "{{instance}} · {{mountpoint}}",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "title": "Disk in alert",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Hottest hwmon sensor of each machine (max across its sensors, not over time).\n· `{{instance}}`: last scraped value.\n· `{{instance}} · 5 min`: mean over a fixed 5-minute window, so a one-second spike does not read as a state.\nThe 70 °C / 85 °C colours are cosmetic: no alert rule behind them.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "celsius",
              "decimals": 1,
              "noValue": "no sensor",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 6
          },
          "id": 83,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance) ((node_hwmon_temp_celsius{cluster=~\"$cluster\",instance=~\"$instance\"} * on(instance,chip,sensor) group_left(label) node_hwmon_sensor_label{cluster=~\"$cluster\",instance=~\"$instance\"}) or on(instance,chip,sensor) node_hwmon_temp_celsius{cluster=~\"$cluster\",instance=~\"$instance\"})",
              "legendFormat": "{{instance}}",
              "range": true,
              "instant": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (instance) (avg_over_time(node_hwmon_temp_celsius{cluster=~\"$cluster\",instance=~\"$instance\"}[5m]))",
              "legendFormat": "{{instance}} · 5 min",
              "range": false,
              "instant": true,
              "refId": "B"
            }
          ],
          "title": "Hottest sensor",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`up` of the machine's node-exporter. At 0, every panel freezes on its last value without a visible gap.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds",
                "fixedColor": "text"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "KO",
                      "color": "red",
                      "index": 1
                    },
                    "1": {
                      "text": "OK",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "x": 5,
            "y": 7,
            "w": 5,
            "h": 4
          },
          "id": 84,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "up{job=\"node-exporter\",cluster=~\"$cluster\",instance=~\"$instance\"}",
              "legendFormat": "{{instance}}",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Scrape",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`node_uname_info`: kernel nodename and release.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "x": 10,
            "y": 7,
            "w": 5,
            "h": 4
          },
          "id": 85,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "name",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "node_uname_info{cluster=~\"$cluster\",instance=~\"$instance\"}",
              "legendFormat": "{{nodename}} · {{release}}",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Machine",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "`node_time_seconds - node_boot_time_seconds`. An uptime falling back to zero with no intervention is an unplanned reboot: cross-read with the memory panel (OOM) and the host's journal.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 15,
            "y": 7,
            "w": 9,
            "h": 4
          },
          "id": 86,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "node_time_seconds{cluster=~\"$cluster\",instance=~\"$instance\"} - node_boot_time_seconds{cluster=~\"$cluster\",instance=~\"$instance\"}",
              "legendFormat": "uptime",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Uptime",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 24,
            "h": 1
          },
          "id": 10,
          "panels": [],
          "title": "Load",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "One curve per node. For the per-mode breakdown (iowait, steal, system…), expand \"Diagnostic — CPU & memory\".",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percent",
              "decimals": 1
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 24,
            "h": 8
          },
          "id": 50,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{cluster=~\"$cluster\",instance=~\"$instance\",mode=\"idle\"}[$__rate_interval])) * 100)",
              "legendFormat": "{{instance}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "CPU per node",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Based on MemAvailable: reclaimable cache is not counted as used. For the cache / buffers / free breakdown, expand \"Diagnostic — CPU & memory\".",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percent",
              "decimals": 1
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 8
          },
          "id": 51,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "(1 - node_memory_MemAvailable_bytes{cluster=~\"$cluster\",instance=~\"$instance\"} / node_memory_MemTotal_bytes{cluster=~\"$cluster\",instance=~\"$instance\"}) * 100",
              "legendFormat": "{{instance}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Memory per node",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "% of time tasks spend waiting for a resource. A more reliable contention signal than the usage ratio: this is the first panel to look at when things feel slow while neither CPU nor memory saturates.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "opacity",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percent",
              "min": 0,
              "decimals": 2
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 24,
