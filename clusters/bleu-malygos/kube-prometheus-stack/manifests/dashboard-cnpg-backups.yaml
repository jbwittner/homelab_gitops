# Dashboard « Backups — cnpg » : sauvegardes barman-cloud des bases CloudNativePG (kalecgos).
# Métriques du plugin (barman_cloud_*) et de l'archiveur WAL (cnpg_pg_stat_archiver_*), exposées par
# chaque instance ; tableau : objets Backup via kube-state-metrics (customResourceState).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cnpg-backups
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  cnpg-backups.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "id": 100,
          "panels": [],
          "title": "State",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Per database: \"Failed\" when the last failed backup is more recent than the last successful one (barman-cloud plugin metrics, read from the ObjectStore). Back to \"OK\" at the next successful backup. Only databases with a barman-cloud ObjectStore appear here.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "green",
                      "index": 0,
                      "text": "OK"
                    },
                    "1": {
                      "color": "red",
                      "index": 1,
                      "text": "Failed"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster, namespace, job) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{cluster=~\"$cluster\",namespace=~\"$namespace\"}) > bool max by (cluster, namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster=~\"$cluster\",namespace=~\"$namespace\"})",
              "refId": "A",
              "instant": false,
              "legendFormat": "{{job}}",
              "range": true
            }
          ],
          "title": "Backup status",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Time elapsed since the most recent full backup still in the bucket — scheduled or manual, barman does not tell them apart (see the Backup objects table for that). Red beyond 36 h, the ScheduledBackup being daily (02:00 UTC).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 93600
                  },
                  {
                    "color": "red",
                    "value": 129600
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "time() - max by (cluster, namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster=~\"$cluster\",namespace=~\"$namespace\"} > 0)",
              "refId": "A",
              "instant": false,
              "legendFormat": "{{job}}",
              "range": true
            }
          ],
          "title": "Last successful backup",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "How far back a point-in-time restore can go: age of the first recoverability point (oldest base backup kept). Expected around the ObjectStore retentionPolicy (7d) plus up to one day; much less means backups are being purged or failing.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 8,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "time() - max by (cluster, namespace, job) (barman_cloud_cloudnative_pg_io_first_recoverability_point{cluster=~\"$cluster\",namespace=~\"$namespace\"} > 0)",
              "refId": "A",
              "instant": false,
              "legendFormat": "{{job}}",
              "range": true
            }
          ],
          "title": "Recovery window",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "WAL segments written but not yet archived (pg_wal/archive_status/*.ready). Should stay at 0 or 1; a number that keeps growing means archiving is stuck — the WAL pile up on the volume and no point-in-time restore is possible past the last archived one.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 2
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster, namespace, job) (cnpg_collector_pg_wal_archive_status{cluster=~\"$cluster\",namespace=~\"$namespace\",value=\"ready\"})",
              "refId": "A",
              "instant": false,
              "legendFormat": "{{job}}",
              "range": true
            }
          ],
          "title": "WAL waiting for archive",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Time since the last successfully archived WAL segment (pg_stat_archiver). Not an alarm on its own: an idle database switches no WAL and the value grows harmlessly (archive_timeout only forces a switch after some activity). Read it together with \"WAL waiting for archive\".",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "min by (cluster, namespace, job) (cnpg_pg_stat_archiver_seconds_since_last_archival{cluster=~\"$cluster\",namespace=~\"$namespace\"})",
              "refId": "A",
              "instant": false,
              "legendFormat": "{{job}}",
              "range": true
            }
          ],
          "title": "Last WAL archived",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Failed archive_command attempts over the last 24 h (pg_stat_archiver.failed_count; PostgreSQL retries, a failure is not a lost WAL). Persistent failures with WAL waiting = credentials or bucket issue: read the plugin-barman-cloud sidecar logs.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 5
          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (cluster, namespace, job) (increase(cnpg_pg_stat_archiver_failed_count{cluster=~\"$cluster\",namespace=~\"$namespace\"}[24h])) or on() vector(0)",
              "refId": "A",
              "instant": false,
              "legendFormat": "{{job}}",
              "range": true
            }
          ],
          "title": "WAL archive failures (24 h)",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 1
          },
          "id": 101,
          "panels": [],
          "title": "Backups",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "One row per CNPG Backup object (scheduled and manual), with its error message if any. Source: kube-state-metrics customResourceState (components/kube-prometheus-stack/values.yaml). Backup objects are not purged by the retention policy: a row can point to a backup already removed from the bucket. No duration for a failed backup.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "noValue": "—"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Phase"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "completed": {
                            "color": "green",
                            "index": 0
                          },
                          "failed": {
                            "color": "red",
                            "index": 1
                          },
                          "running": {
                            "color": "blue",
                            "index": 2
                          },
                          "started": {
                            "color": "blue",
                            "index": 3
                          },
                          "pending": {
                            "color": "text",
                            "index": 4
                          }
                        },
                        "type": "value"
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Start"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "time:YYYY-MM-DD HH:mm"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Duration"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Error"
                },
                "properties": [
                  {
                    "id": "custom.inspect",
                    "value": true
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 24,
            "h": 8
          },
          "id": 7,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Start"
              }
            ]
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster, namespace, backup, cluster_name, scheduled_backup, phase, error) (cnpg_backup_object_info{cluster=~\"$cluster\",namespace=~\"$namespace\"})",
              "refId": "A",
              "format": "table",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster, namespace, backup) (cnpg_backup_object_reconciliation_start_time{cluster=~\"$cluster\",namespace=~\"$namespace\"}) * 1000",
              "refId": "B",
              "format": "table",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster, namespace, backup) (cnpg_backup_object_stop_time{cluster=~\"$cluster\",namespace=~\"$namespace\"} - cnpg_backup_object_start_time{cluster=~\"$cluster\",namespace=~\"$namespace\"})",
              "refId": "C",
              "format": "table",
              "instant": true,
              "range": false
            }
          ],
          "title": "All backups (Backup objects)",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {},
                "renameByName": {}
              }
            },
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Value #A": true
                },
                "indexByName": {
                  "cluster": 0,
                  "namespace": 1,
                  "cluster_name": 2,
                  "backup": 3,
                  "scheduled_backup": 4,
                  "phase": 5,
                  "Value #B": 6,
                  "Value #C": 7,
                  "error": 8
                },
                "renameByName": {
                  "cluster": "Cluster",
                  "namespace": "Namespace",
                  "cluster_name": "Database",
                  "backup": "Backup",
                  "scheduled_backup": "Schedule",
                  "phase": "Phase",
                  "Value #B": "Start",
                  "Value #C": "Duration",
                  "error": "Error"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Sawtooth expected: grows for a day, drops back after the nightly backup. A tooth that keeps climbing past 24 h is a missed schedule.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 24,
            "h": 8
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "list",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "time() - max by (cluster, namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cluster=~\"$cluster\",namespace=~\"$namespace\"} > 0)",
              "refId": "A",
              "instant": false,
              "legendFormat": "{{job}}",
              "range": true
            }
          ],
          "title": "Age of the last successful backup",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Age of the first recoverability point. Climbs until the retention policy purges the oldest base backup, then steps down.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 24,
            "h": 8
          },
          "id": 9,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "min"
              ],
              "displayMode": "list",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "time() - max by (cluster, namespace, job) (barman_cloud_cloudnative_pg_io_first_recoverability_point{cluster=~\"$cluster\",namespace=~\"$namespace\"} > 0)",
              "refId": "A",
              "instant": false,
              "legendFormat": "{{job}}",
              "range": true
            }
          ],
          "title": "Recovery window",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 31,
            "w": 24,
            "h": 1
          },
          "id": 102,
          "panels": [],
          "title": "WAL archiving",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Segments archived and failed archive attempts per interval (pg_stat_archiver counters).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "bars",
