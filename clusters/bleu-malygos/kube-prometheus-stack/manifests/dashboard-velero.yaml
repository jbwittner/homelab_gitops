# Dashboard « Backups — velero » : sauvegardes des deux clusters, variable cluster.
# Tableaux : objets Backup/PodVolumeBackup via kube-state-metrics (customResourceState).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-velero
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
data:
  velero.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "id": 100,
          "panels": [],
          "title": "State",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Time elapsed since the last successful SCHEDULED backup — manual backups are excluded on purpose (neighbouring tile): a hand-launched backup does not prove the schedule runs, and counting it here would hide a dead schedule. Red beyond 36 h, the schedule being daily. \"No data\" is not reassuring — the metric disappears when the velero server restarts and until a scheduled backup has succeeded.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 93600
                  },
                  {
                    "color": "red",
                    "value": 129600
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "time() - max by (cluster) (velero_backup_last_successful_timestamp{cluster=~\"$cluster\",schedule=~\"$schedule\", schedule!=\"manuel\"})",
              "instant": false,
              "legendFormat": "{{cluster}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Last scheduled backup",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Time elapsed since the last backup launched BY HAND (`schedule=\"manuel\"`: velero emits an empty schedule, rewritten by the metricRelabelings of the velero ServiceMonitor, components/velero/values.yaml). No threshold: nothing requires taking manual backups.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "id": 14,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "time() - max by (cluster) (velero_backup_last_successful_timestamp{cluster=~\"$cluster\",schedule=\"manuel\"})",
              "instant": false,
              "legendFormat": "{{cluster}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Last manual backup",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Periodic validation of the BackupStorageLocation by velero. Unavailable = unreachable GCS bucket or broken Workload Identity Federation (pool, provider, IAM binding): no backup will succeed.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 1,
                      "text": "Unavailable"
                    },
                    "1": {
                      "color": "green",
                      "index": 0,
                      "text": "Available"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster, backup_location_name) (velero_backup_location_status_gauge{cluster=~\"$cluster\"})",
              "instant": false,
              "legendFormat": "{{cluster}} · {{backup_location_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Bucket (BackupStorageLocation)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Number of existing Backups, across all schedules. It goes down when the TTL (30 d) expires and velero's GC runs.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (cluster) (velero_backup_total{cluster=~\"$cluster\"})",
              "instant": false,
              "legendFormat": "{{cluster}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Backups retained",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Outright failures over 24 h. PARTIAL failures are not counted here: see the \"Backup outcomes\" graph.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (cluster) (increase(velero_backup_failure_total{cluster=~\"$cluster\",schedule=~\"$schedule\"}[24h])) or vector(0)",
              "instant": false,
              "legendFormat": "{{cluster}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Failures (24 h)",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "id": 101,
          "panels": [],
          "title": "Backups",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "One row per schedule (\"manuel\" groups the hand-launched backups). Counts and ages cover the backups STILL PRESENT: they drop when the TTL expires. \"Data copied\" is the sum of the PodVolumeBackups before kopia deduplication — it is not the bucket usage.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "noValue": "—"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last status"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "0": {
                            "color": "red",
                            "index": 1,
                            "text": "Failed"
                          },
                          "1": {
                            "color": "green",
                            "index": 0,
                            "text": "Succeeded"
                          }
                        },
                        "type": "value"
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last backup"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Oldest backup"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Data copied"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 7
          },
          "id": 5,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Schedule"
              }
            ]
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "label_replace(count by (cluster, schedule) (velero_backup_object_info{cluster=~\"$cluster\"}), \"schedule\", \"manuel\", \"schedule\", \"^$\")",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster, schedule) (velero_backup_last_status{cluster=~\"$cluster\",schedule=~\"$schedule\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "label_replace(max by (cluster, schedule) (velero_backup_object_completion_time{cluster=~\"$cluster\"} * on(cluster, backup) group_left(schedule) velero_backup_object_info{cluster=~\"$cluster\"}), \"schedule\", \"manuel\", \"schedule\", \"^$\") * 1000",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "label_replace(min by (cluster, schedule) (velero_backup_object_start_time{cluster=~\"$cluster\"} * on(cluster, backup) group_left(schedule) velero_backup_object_info{cluster=~\"$cluster\"}), \"schedule\", \"manuel\", \"schedule\", \"^$\") * 1000",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "label_replace(sum by (cluster, schedule) (sum by (cluster, backup) (velero_pvb_object_bytes{cluster=~\"$cluster\"}) * on(cluster, backup) group_left(schedule) velero_backup_object_info{cluster=~\"$cluster\"}), \"schedule\", \"manuel\", \"schedule\", \"^$\")",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "E"
            }
          ],
          "title": "Per schedule (aggregated)",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {},
                "renameByName": {}
              }
            },
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "indexByName": {
                  "cluster": 0,
                  "schedule": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4,
                  "Value #A": 5,
                  "Value #E": 6
                },
                "renameByName": {
                  "cluster": "Cluster",
                  "schedule": "Schedule",
                  "Value #A": "Retained",
                  "Value #B": "Last status",
                  "Value #C": "Last backup",
                  "Value #D": "Oldest backup",
                  "Value #E": "Data copied"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "The real inventory of the Backup objects, one row per backup — impossible to get from velero's native metrics, which are aggregated per schedule and overwritten on every run. Source: kube-state-metrics customResourceState (components/kube-prometheus-stack/values.yaml). No duration while the backup is in progress. \"Data copied\" is the sum of the PodVolumeBackups before kopia deduplication — it is not the bucket usage.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "noValue": "—"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Phase"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "Completed": {
                            "color": "green",
                            "index": 0
                          },
                          "PartiallyFailed": {
                            "color": "orange",
                            "index": 1
                          },
                          "Failed": {
                            "color": "red",
                            "index": 2
                          },
                          "FailedValidation": {
                            "color": "red",
                            "index": 3
                          },
                          "InProgress": {
                            "color": "blue",
                            "index": 4
                          },
                          "Deleting": {
                            "color": "text",
                            "index": 5
                          }
                        },
                        "type": "value"
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Start"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "time:YYYY-MM-DD HH:mm"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Duration"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Data copied"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Expires"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 8
          },
          "id": 15,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Start"
              }
            ]
          },
          "pluginVersion": "10.4.0",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster, backup, phase) (velero_backup_object_info{cluster=~\"$cluster\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster, backup) (velero_backup_object_start_time{cluster=~\"$cluster\"}) * 1000",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster, backup) (velero_backup_object_completion_time{cluster=~\"$cluster\"} - velero_backup_object_start_time{cluster=~\"$cluster\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster, backup) (velero_backup_object_items_backed_up{cluster=~\"$cluster\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "sum by (cluster, backup) (velero_pvb_object_bytes{cluster=~\"$cluster\"})",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "E"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "editorMode": "code",
              "expr": "max by (cluster, backup) (velero_backup_object_expiration{cluster=~\"$cluster\"}) * 1000",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "F"
            }
          ],
          "title": "All backups (Backup objects)",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {},
                "renameByName": {}
              }
            },
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Value #A": true
                },
                "indexByName": {
                  "cluster": 0,
                  "backup": 1,
                  "phase": 2,
                  "Value #B": 3,
                  "Value #C": 4,
                  "Value #D": 5,
                  "Value #E": 6,
                  "Value #F": 7
                },
                "renameByName": {
                  "cluster": "Cluster",
                  "backup": "Backup",
                  "phase": "Phase",
                  "Value #B": "Start",
                  "Value #C": "Duration",
                  "Value #D": "Items",
                  "Value #E": "Data copied",
                  "Value #F": "Expires"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "description": "Counters accumulated over the refresh window. A PARTIAL failure is a backup that exists and restores, but is missing items — most often a volume node-agent could not read.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "bars",
                "fillOpacity": 60,
                "gradientMode": "none",
