# Modèle : rempli en cluster-bleu-kalecgos.secret.yaml (ignoré par Git), scellé en cluster-bleu-kalecgos.sealed.yaml (doc/bootstrap/05-kalecgos.md)
apiVersion: v1
kind: Secret
metadata:
  name: cluster-bleu-kalecgos
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    role: worker
stringData:
  name: bleu-kalecgos
  server: https://192.168.1.14:6443
  # jeton et CA du compte argocd-manager de kalecgos (secret kube-system/argocd-manager-token)
  config: '{"bearerToken":"<TOKEN>","tlsClientConfig":{"caData":"<CA_BASE64>"}}'
