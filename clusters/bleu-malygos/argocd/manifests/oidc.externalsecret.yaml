# Secret du client OIDC argocd (Authelia), lu dans OpenBao (secret/argocd, champ oidc_client_secret).
# Référencé dans argocd-cm par $argocd-oidc:clientSecret : ArgoCD ne lit que les Secrets portant ce label.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-oidc
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef:
        key: argocd
        property: oidc_client_secret
