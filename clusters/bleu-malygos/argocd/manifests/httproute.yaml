# TLS terminé au Gateway : argocd-server en HTTP (server.insecure, kustomization.yaml)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
spec:
  parentRefs:
    - name: lan
      namespace: gateway
  hostnames:
    - argocd.lan.wittner.tech
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
