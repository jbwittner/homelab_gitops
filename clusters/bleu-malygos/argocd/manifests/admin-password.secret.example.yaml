# Modèle : rempli en admin-password.secret.yaml (ignoré par Git), scellé en admin-password.sealed.yaml (doc/bootstrap/04-argocd.md)
# patch : ajoute ces clés à argocd-secret sans écraser celles écrites par ArgoCD (server.secretkey…)
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  annotations:
    sealedsecrets.bitnami.com/patch: "true"
stringData:
  # hash bcrypt (argocd account bcrypt)
  admin.password: "<HASH_BCRYPT>"
  # date du changement : invalide les sessions ouvertes avant
  admin.passwordMtime: "<AAAA-MM-JJT00:00:00Z>"
