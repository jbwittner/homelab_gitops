apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: malygos-argocd
  namespace: argocd
spec:
  project: default
  destination:
    name: bleu-malygos
    namespace: argocd
  source:
    repoURL: https://github.com/jbwittner/homelab_gitops.git
    targetRevision: main
    path: clusters/bleu-malygos/argocd/manifests
  syncPolicy:
    # pas de prune : ArgoCD se gère lui-même, une suppression par erreur le couperait
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
