apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-malygos
  namespace: argocd
  labels:
    layer: boot
spec:
  project: default
  destination:
    name: bleu-malygos
    namespace: argocd
  source:
    repoURL: https://github.com/jbwittner/homelab_gitops.git
    targetRevision: main
    path: clusters/bleu-malygos/argocd/manifests
  syncPolicy:
    # pas de prune : ArgoCD se gère lui-même, une suppression par erreur le couperait
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    # sans fin : une dépendance (CRD, secret) d'une autre Application peut arriver tard (boot à blanc)
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
