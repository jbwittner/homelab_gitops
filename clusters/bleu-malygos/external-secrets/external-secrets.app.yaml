apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-malygos
  namespace: argocd
  labels:
    layer: infra
spec:
  project: default
  destination:
    name: bleu-malygos
    namespace: external-secrets
  sources:
    # releaseName → compte external-secrets/external-secrets, attendu par le rôle eso
    # d'OpenBao (homelab_terraform, openbao/bleu-malygos/auth_kubernetes.tf)
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.13.0
      helm:
        releaseName: external-secrets
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: clusters/bleu-malygos/external-secrets/manifests
  syncPolicy:
    # pas de prune : supprimer une CRD supprime tous les ExternalSecrets (et leurs Secrets)
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    # sans fin : une dépendance (CRD, secret) d'une autre Application peut arriver tard (boot à blanc)
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
