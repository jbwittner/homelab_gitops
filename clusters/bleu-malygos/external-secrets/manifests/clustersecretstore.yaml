# OpenBao par le service interne ; auth avec le jeton du compte d'ESO
# (auth/k8s-bleu-malygos, rôle eso : lecture seule sur secret/).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    # après les Deployments du chart : le webhook valide ce store
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: k8s-bleu-malygos
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
