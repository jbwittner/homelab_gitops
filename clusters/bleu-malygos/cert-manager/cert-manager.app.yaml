apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-malygos
  namespace: argocd
  labels:
    layer: infra
spec:
  project: default
  destination:
    name: bleu-malygos
    namespace: cert-manager
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.3
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/components/cert-manager/values.yaml
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: components/cert-manager/manifests
  syncPolicy:
    # pas de prune : supprimer une CRD supprime tous les Certificates (et leurs Secrets)
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    # sans fin : une dépendance (CRD, secret) d'une autre Application peut arriver tard (boot à blanc)
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
