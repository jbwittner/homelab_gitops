apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia-malygos
  namespace: argocd
  labels:
    layer: infra
spec:
  project: default
  destination:
    name: bleu-malygos
  # manifestes simples sur l'image officielle (exception à « Helm en priorité », doc/decisions.md)
  source:
    repoURL: https://github.com/jbwittner/homelab_gitops.git
    targetRevision: main
    path: clusters/bleu-malygos/authelia/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # sans fin : une dépendance (CRD, secret) d'une autre Application peut arriver tard (boot à blanc)
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
