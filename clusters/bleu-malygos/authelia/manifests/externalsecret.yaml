# Secrets d'Authelia et fichier des utilisateurs, lus dans OpenBao (secret/authelia) ; voir doc/authelia.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authelia
    template:
      data:
        session_secret: "{{ .session_secret }}"
        storage_encryption_key: "{{ .storage_encryption_key }}"
        oidc_hmac_secret: "{{ .oidc_hmac_secret }}"
        oidc_jwks_key: "{{ .oidc_jwks_key }}"
        # lu au démarrage seulement : redémarrer le pod après un changement
        users_database.yml: |
          users:
            jbwittner:
              displayname: Jean-Baptiste WITTNER
              password: "{{ .user_password_hash }}"
              email: "{{ .user_email }}"
              groups:
                - admins
  dataFrom:
    - extract:
        key: authelia
