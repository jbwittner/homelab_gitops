# Clients OIDC (https://www.authelia.com/integration/openid-connect/clients/) : tous ici, jamais dans un autre fichier
# client_secret : hash pbkdf2 seul ; le secret en clair est dans OpenBao, côté application (doc/authelia.md)
# consent_mode pre-configured : consentement demandé une fois, retenu un an (case « se souvenir » ; base SQLite)
identity_providers:
  oidc:
    # Grafana, OpenBao : claims lus dans l'ID token, pas via userinfo
    claims_policies:
      grafana:
        id_token: [email, name, groups, preferred_username]
      openbao:
        id_token: [email, groups, preferred_username]
    clients:
      - client_id: argocd
        client_name: Argo CD
        client_secret: '$pbkdf2-sha512$310000$hgFxqX2lrdQ20x498P3RVA$X02slCmPnbAXk.4Y4aedLwiYWCgMHX4VA.pIebGlfsUyhu4FR7hN9ti94NBaja3YZoREkzQZXogdvROTale4WA'
        public: false
        authorization_policy: two_factor
        consent_mode: pre-configured
        pre_configured_consent_duration: 1 year
        redirect_uris:
          - https://argocd.lan.wittner.tech/auth/callback
        scopes: [openid, groups, email]
        response_types: [code]
        grant_types: [authorization_code]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
      # argocd login --sso
      - client_id: argocd-cli
        client_name: Argo CD (CLI)
        public: true
        authorization_policy: two_factor
        consent_mode: pre-configured
        pre_configured_consent_duration: 1 year
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - http://localhost:8085/auth/callback
        scopes: [openid, offline_access, groups, email]
        response_types: [code]
        grant_types: [authorization_code, refresh_token]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: none
      - client_id: grafana
        client_name: Grafana
        client_secret: '$pbkdf2-sha512$310000$SM2y938BHhIpzJ8tUJBILA$VBYkzu3bVX385TgkKCXmzNS7gOfHRtrFa4KVjcW/sP3gXB.3m6fFS2sCS92TBWqA4IfY2UG2WMa0IJyOPXvCng'
        public: false
        authorization_policy: two_factor
        consent_mode: pre-configured
        pre_configured_consent_duration: 1 year
        claims_policy: grafana
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://grafana.lan.wittner.tech/login/generic_oauth
        scopes: [openid, profile, groups, email]
        response_types: [code]
        grant_types: [authorization_code]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
      # auth oidc et rôle authelia : homelab_terraform (openbao/bleu-malygos/auth_oidc.tf)
      - client_id: openbao
        client_name: OpenBao
        client_secret: '$pbkdf2-sha512$310000$ILdA2PWIw3.48T3W4DBylg$W4x7oZ8qKGd7MtTqwrA9AVTAi2Ta.jNkB5NHnkd6wUpjjHX2QVbQawsUWhm1S4VEIgolE3iXg9bB2IXXh.o39w'
        public: false
        authorization_policy: two_factor
        consent_mode: pre-configured
        pre_configured_consent_duration: 1 year
        claims_policy: openbao
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://openbao.lan.wittner.tech/ui/vault/auth/oidc/oidc/callback
          # bao login -method=oidc
          - http://localhost:8250/oidc/callback
        scopes: [openid, profile, groups, email]
        response_types: [code]
        grant_types: [authorization_code]
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
