apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../components/gateway/manifests
patches:
  # IP fixe dans le pool LB-IPAM (cilium/manifests/lb.yaml)
  - target:
      kind: Gateway
      name: lan
    patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: lan
        namespace: gateway
      spec:
        addresses:
          - type: IPAddress
            value: 192.168.1.80
