# Homepage (gethomepage) : home.lan.wittner.tech dans HOMEPAGE_ALLOWED_HOSTS
apiVersion: v1
kind: Service
metadata:
  name: homepage
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: homepage
  labels:
    kubernetes.io/service-name: homepage
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: http
    port: 3000
endpoints:
  - addresses:
      - 192.168.1.54
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
spec:
  parentRefs:
    - name: lan
      namespace: gateway
  hostnames:
    - home.lan.wittner.tech
  rules:
    - backendRefs:
        - name: homepage
          port: 80
