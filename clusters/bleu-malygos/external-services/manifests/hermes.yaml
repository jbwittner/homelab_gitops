# Hermes tourne sur kalecgos : relais vers la Gateway de kalecgos (192.168.1.85, HTTPS), le
# wildcard DNS *.lan envoyant tout sur malygos. Un Service par hostname : la BackendTLSPolicy
# fixe le SNI, qui doit suivre le Host. Certificat vérifié avec ISRG Root X1.
apiVersion: v1
kind: Service
metadata:
  name: hermes
spec:
  ports:
    - name: https
      port: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: hermes
  labels:
    kubernetes.io/service-name: hermes
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: https
    port: 443
endpoints:
  - addresses:
      - 192.168.1.85
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: hermes
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: hermes
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: isrg-root-x1
    hostname: hermes.lan.wittner.tech
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
spec:
  parentRefs:
    - name: lan
      namespace: gateway
  hostnames:
    - hermes.lan.wittner.tech
  rules:
    - backendRefs:
        - name: hermes
          port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-api
spec:
  ports:
    - name: https
      port: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: hermes-api
  labels:
    kubernetes.io/service-name: hermes-api
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: https
    port: 443
endpoints:
  - addresses:
      - 192.168.1.85
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: hermes-api
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: hermes-api
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: isrg-root-x1
    hostname: hermes-api.lan.wittner.tech
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-api
spec:
  parentRefs:
    - name: lan
      namespace: gateway
  hostnames:
    - hermes-api.lan.wittner.tech
  rules:
    - backendRefs:
        - name: hermes-api
          port: 443
