# Zigbee2MQTT
apiVersion: v1
kind: Service
metadata:
  name: zigbee2mqtt
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: zigbee2mqtt
  labels:
    kubernetes.io/service-name: zigbee2mqtt
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: http
    port: 8080
endpoints:
  - addresses:
      - 192.168.1.52
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt
spec:
  parentRefs:
    - name: lan
      namespace: gateway
  hostnames:
    - z2m.lan.wittner.tech
  rules:
    - backendRefs:
        - name: zigbee2mqtt
          port: 80
