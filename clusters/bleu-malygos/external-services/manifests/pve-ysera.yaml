# Proxmox : HTTPS seulement (8006). Envoy vérifie le certificat du nœud avec la CA
# de cluster PVE (pve-root-ca.crt = /etc/pve/pve-root-ca.pem, ConfigMap via kustomization.yaml)
apiVersion: v1
kind: Service
metadata:
  name: pve-ysera
spec:
  ports:
    - name: https
      port: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pve-ysera
  labels:
    kubernetes.io/service-name: pve-ysera
    endpointslice.kubernetes.io/managed-by: argocd
addressType: IPv4
ports:
  - name: https
    port: 8006
endpoints:
  - addresses:
      - 192.168.1.10
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: pve-ysera
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: pve-ysera
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: pve-root-ca
    # nom présent dans le certificat du nœud (pas pve-ysera.lan)
    hostname: vert-ysera.lan.wittner.tech
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pve-ysera
spec:
  parentRefs:
    - name: lan
      namespace: gateway
  hostnames:
    - pve-ysera.lan.wittner.tech
  rules:
    - backendRefs:
        - name: pve-ysera
          port: 443
