apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-services-malygos
  namespace: argocd
  labels:
    layer: infra
spec:
  project: default
  destination:
    name: bleu-malygos
  source:
    repoURL: https://github.com/jbwittner/homelab_gitops.git
    targetRevision: main
    path: clusters/bleu-malygos/external-services/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
