apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smtp-relay-kalecgos
  namespace: argocd
  labels:
    layer: infra
spec:
  project: default
  destination:
    name: bleu-kalecgos
    namespace: smtp-relay
  sources:
    - repoURL: https://bokysan.github.io/docker-postfix
      chart: mail
      targetRevision: 5.1.0
      helm:
        releaseName: smtp-relay
        valueFiles:
          - $values/components/smtp-relay/values.yaml
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: components/smtp-relay/manifests
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
