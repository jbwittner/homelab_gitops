# Secret attendu par le chart (secretRefs.existingSecret) : clé de chiffrement des identifiants
# et jeton des task runners, lus dans OpenBao (secret/n8n, champs encryption_key et
# runners_auth_token) ; N8N_HOST, N8N_PORT, N8N_PROTOCOL en dur. N8N_PROTOCOL reste http :
# en https, n8n servirait lui-même le TLS (N8N_SSL_KEY/CERT) ; TLS terminé au Gateway.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: n8n-secrets
    template:
      data:
        N8N_ENCRYPTION_KEY: "{{ .encryptionKey }}"
        N8N_RUNNERS_AUTH_TOKEN: "{{ .runnersAuthToken }}"
        N8N_HOST: n8n.lan.wittner.tech
        N8N_PORT: "5678"
        N8N_PROTOCOL: http
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: n8n
        property: encryption_key
    - secretKey: runnersAuthToken
      remoteRef:
        key: n8n
        property: runners_auth_token
---
# Mot de passe du rôle n8n_data (database.yaml), lu dans OpenBao (secret/n8n, champ
# data_db_password). Format basic-auth exigé par CNPG ; label : CNPG suit les changements.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-db-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: n8n-db-data
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: n8n_data
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: n8n
        property: data_db_password
