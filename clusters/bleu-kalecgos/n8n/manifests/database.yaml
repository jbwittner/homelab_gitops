# PostgreSQL de n8n (opérateur CloudNativePG) ; CNPG crée le Secret n8n-db-app
# (username, password…) et le Service n8n-db-rw. WAL et sauvegardes : plugin barman-cloud
# vers GCS, ObjectStore n8n-db (objectstore.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  # une seule instance : le PDB bloquerait le drain du nœud
  enablePDB: false
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
  # rôle des données des workflows (base n8n_data, plus bas), à part du rôle interne de n8n
  managed:
    roles:
      - name: n8n_data
        ensure: present
        login: true
        passwordSecret:
          name: n8n-db-data
  storage:
    size: 5Gi
    storageClass: openebs-lvm
  # Workload Identity Federation (homelab_terraform, gcp/homelab/cnpg.tf) : jeton du compte
  # n8n-db (audience gcp-wif) + fichier d'identifiants, sous /projected/gcp ; le sidecar
  # barman-cloud hérite des montages du conteneur postgres
  projectedVolumeTemplate:
    sources:
      - serviceAccountToken:
          audience: gcp-wif
          expirationSeconds: 3600
          path: gcp/token
      - configMap:
          name: n8n-db-gcp
          items:
            - key: credentials.json
              path: gcp/credentials.json
  # hérité par le sidecar barman-cloud : le client GCS ne déduit pas le projet d'identifiants
  # external_account (seulement sur GKE)
  env:
    - name: GOOGLE_CLOUD_PROJECT
      value: homelab-499008
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: n8n-db
---
# Base des données des workflows (identifiant Postgres dans n8n, hôte n8n-db-rw) : jamais la
# base interne n8n. Même Cluster, donc mêmes sauvegardes ; restauration commune avec n8n.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: n8n-data
spec:
  name: n8n_data
  owner: n8n_data
  cluster:
    name: n8n-db
---
# sauvegarde complète chaque nuit (02:30 UTC, après filon, avant OpenBao à 03:00) ; WAL archivés en continu
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: n8n-db
spec:
  # format cron à secondes
  schedule: "0 30 2 * * *"
  # une première sauvegarde dès la création : base restaurable tout de suite
  immediate: true
  backupOwnerReference: self
  cluster:
    name: n8n-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
# enablePodMonitor du Cluster déprécié : PodMonitor déclaré ici (doc/supervision.md)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: n8n-db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: n8n-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
