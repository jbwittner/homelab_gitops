# n8n : à côté du chart, base CNPG sauvegardée sur GCS, secrets OpenBao, route, supervision
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n
resources:
  - database.yaml
  - objectstore.yaml
  - gcp-credentials.yaml
  - externalsecret.yaml
  - httproute.yaml
  - servicemonitor.yaml
