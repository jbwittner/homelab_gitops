apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-manager-kalecgos
  namespace: argocd
  labels:
    layer: boot
spec:
  project: default
  destination:
    name: bleu-kalecgos
    namespace: kube-system
  source:
    repoURL: https://github.com/jbwittner/homelab_gitops.git
    targetRevision: main
    path: clusters/bleu-kalecgos/argocd-manager/manifests
  syncPolicy:
    # pas de prune : supprimer le compte couperait ArgoCD de kalecgos
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    # sans fin : une dépendance (CRD, secret) d'une autre Application peut arriver tard (boot à blanc)
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
