# OpenBao tourne sur malygos : passage par le Gateway (proxy LAN 192.168.1.50).
# OpenBao valide le jeton d'ESO auprès de l'API de kalecgos (auth-delegator.yaml).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      server: https://openbao.lan.wittner.tech
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: k8s-bleu-kalecgos
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
