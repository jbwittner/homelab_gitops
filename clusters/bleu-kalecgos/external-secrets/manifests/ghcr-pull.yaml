# Pull des images privées ghcr.io/jbwittner/* : Secret ghcr-pull créé dans chaque namespace portant
# le label ghcr-pull: enabled (pod : imagePullSecrets ghcr-pull). PAT GitHub classic read:packages
# (tous les packages du compte) lu dans OpenBao (secret/ghcr, champ token), mis en forme par ESO.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: ghcr-pull
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  namespaceSelectors:
    - matchLabels:
        ghcr-pull: enabled
  externalSecretName: ghcr-pull
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: openbao
    target:
      name: ghcr-pull
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "jbwittner:%s" .token | b64enc }}"}}}'
    data:
      - secretKey: token
        remoteRef:
          key: ghcr
          property: token
