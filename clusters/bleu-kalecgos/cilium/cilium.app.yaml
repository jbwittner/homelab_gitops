apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-kalecgos
  namespace: argocd
  labels:
    layer: boot
spec:
  project: default
  destination:
    name: bleu-kalecgos
    namespace: kube-system
  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: 1.20.3
      helm:
        releaseName: cilium
        valueFiles:
          - $values/components/cilium/values.yaml
          - $values/clusters/bleu-kalecgos/cilium/values.yaml
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: clusters/bleu-kalecgos/cilium/manifests
  syncPolicy:
    # pas de prune : une suppression dans le CNI couperait le cluster
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
