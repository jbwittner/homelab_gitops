# Ligne image réécrite par la CI de bankwiz (develop.yml) à chaque push sur develop :
# tag fixe develop-sha-<sha> épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankwiz
spec:
  template:
    spec:
      containers:
        - name: bankwiz
          image: ghcr.io/jbwittner/bankwiz:develop-sha-b68b4c9@sha256:137b7ac823cf81669d5f0c1d7e1ed148dd6cc0771678c07ca2b5827af7781c28
