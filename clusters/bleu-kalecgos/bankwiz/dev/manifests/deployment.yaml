# Ligne image réécrite par la CI de bankwiz (develop.yml) à chaque push sur develop :
# tag fixe develop-sha-<sha> épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankwiz
spec:
  template:
    spec:
      containers:
        - name: bankwiz
          image: ghcr.io/jbwittner/bankwiz:develop-sha-0dfee54@sha256:6553be545813d981da389e324c27c0eafa4bad264012dfec759c18b573d5944b
