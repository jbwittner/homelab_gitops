# Ligne image réécrite par la CI de bankwiz (develop.yml) à chaque push sur develop :
# tag fixe develop-sha-<sha> épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankwiz
spec:
  template:
    spec:
      containers:
        - name: bankwiz
          image: ghcr.io/jbwittner/bankwiz:develop-sha-b8e057e@sha256:2d125f99881d5fac35d882e72e84f62e1a31d45b6519a09a0cf81ddf895652fc
