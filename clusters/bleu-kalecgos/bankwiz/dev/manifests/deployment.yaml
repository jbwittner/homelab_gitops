# Ligne image réécrite par la CI de bankwiz (develop.yml) à chaque push sur develop :
# tag fixe develop-sha-<sha> épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankwiz
spec:
  template:
    spec:
      containers:
        - name: bankwiz
          # fusionnée par nom avec l'env du commun (identifiants de la base)
          env:
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHELIA_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: bankwiz-oidc
                  key: clientSecret
          image: ghcr.io/jbwittner/bankwiz:develop-sha-2ba1c59@sha256:196a6b8869d0a92213056fddfa721808e6ef3c757096f5fcdcd2e1b1298b9314
