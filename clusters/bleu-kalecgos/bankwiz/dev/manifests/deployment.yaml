# Ligne image réécrite par la CI de bankwiz (develop.yml) à chaque push sur develop :
# tag fixe develop-sha-<sha> épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankwiz
spec:
  template:
    spec:
      containers:
        - name: bankwiz
          # fusionnée par nom avec l'env du commun (identifiants de la base)
          env:
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHELIA_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: bankwiz-oidc
                  key: clientSecret
          image: ghcr.io/jbwittner/bankwiz:develop-sha-3205c48@sha256:95665979eb42efe1fd29fe3dd7832137c8545bd9973bfe65fa22c974c7d41b53
