# Ligne image réécrite par la CI de bankwiz (develop.yml) à chaque push sur develop :
# tag fixe develop-sha-<sha> épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankwiz
spec:
  template:
    spec:
      containers:
        - name: bankwiz
          # fusionnée par nom avec l'env du commun (identifiants de la base)
          env:
            - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_AUTHELIA_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: bankwiz-oidc
                  key: clientSecret
          image: ghcr.io/jbwittner/bankwiz:develop-sha-f5784e8@sha256:a1fcdd923ed0209a66f4519214e6bddae16c90df29129505a6a8468643077a92
