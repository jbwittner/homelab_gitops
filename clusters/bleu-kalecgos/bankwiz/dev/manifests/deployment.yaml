# Ligne image réécrite par la CI de bankwiz (develop.yml) à chaque push sur develop :
# tag fixe develop-sha-<sha> épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankwiz
spec:
  template:
    spec:
      containers:
        - name: bankwiz
          image: ghcr.io/jbwittner/bankwiz:develop-sha-421cec8@sha256:fa6210dee5812ce5e0bc333657d12077476bc36132636b307db01efa3a1b96f7
