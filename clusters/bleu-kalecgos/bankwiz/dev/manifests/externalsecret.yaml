# Secret du client OIDC bankwiz-dev (Authelia), lu dans OpenBao (secret/bankwiz/dev, champ oidc_client_secret)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bankwiz-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: bankwiz-oidc
  data:
    - secretKey: clientSecret
      remoteRef:
        key: bankwiz/dev
        property: oidc_client_secret
