# PostgreSQL de bankwiz (opérateur CloudNativePG) ; CNPG crée le Secret bankwiz-db-app
# (username, password…) et le Service bankwiz-db-rw
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bankwiz-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  # une seule instance : le PDB bloquerait le drain du nœud
  enablePDB: false
  bootstrap:
    initdb:
      database: bankwiz
      owner: bankwiz
  storage:
    size: 5Gi
    storageClass: openebs-lvm
---
# enablePodMonitor du Cluster déprécié : PodMonitor déclaré ici (doc/supervision.md)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: bankwiz-db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: bankwiz-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
