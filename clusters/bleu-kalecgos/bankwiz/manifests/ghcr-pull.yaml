# Pull de l'image privée ghcr.io/jbwittner/bankwiz : PAT GitHub (read:packages) lu dans OpenBao
# (secret/bankwiz, champ ghcr_token), mis en forme dockerconfigjson par ESO
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "jbwittner:%s" .token | b64enc }}"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: bankwiz
        property: ghcr_token
