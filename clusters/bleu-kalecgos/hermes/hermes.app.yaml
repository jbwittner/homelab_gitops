apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-kalecgos
  namespace: argocd
  labels:
    layer: apps
spec:
  project: default
  destination:
    name: bleu-kalecgos
  # manifestes simples sur l'image officielle : pas de chart amont (doc/decisions.md)
  source:
    repoURL: https://github.com/jbwittner/homelab_gitops.git
    targetRevision: main
    path: clusters/bleu-kalecgos/hermes/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # sans fin : une dépendance (CRD, secret) d'une autre Application peut arriver tard (boot à blanc)
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
