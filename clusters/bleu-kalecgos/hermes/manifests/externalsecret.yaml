# Secret runtime d'Hermes, lu dans OpenBao (secret/hermes), injecté par envFrom.
# Tout ce qu'il porte est lisible par l'agent (code décidé par un LLM) : n'y mettre que des
# jetons aux droits restreints. Un changement n'atteint le pod qu'à son redémarrage (doc/hermes.md).
# Discord plus tard : DISCORD_BOT_TOKEN, DISCORD_HOME_CHANNEL, DISCORD_ALLOWED_USERS ; jamais de
# valeur factice (un token invalide fait sortir toute la gateway).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: hermes-env
    template:
      data:
        API_SERVER_KEY: "{{ .apiServerKey }}"
  data:
    - secretKey: apiServerKey
      remoteRef:
        key: hermes
        property: api_server_key
