# Deux hostnames, deux ports : un HTTPRoute par nom. LAN seulement (Gateway lan), jamais public :
# dashboards et API exposés ont servi de point d'entrée à des compromissions (doc amont, juin 2026).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
spec:
  parentRefs:
    - name: lan
      namespace: gateway
  hostnames:
    - hermes.lan.wittner.tech
  rules:
    - backendRefs:
        - name: hermes
          port: 9119
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-api
spec:
  parentRefs:
    - name: lan
      namespace: gateway
  hostnames:
    - hermes-api.lan.wittner.tech
  rules:
    - backendRefs:
        - name: hermes
          port: 8642
