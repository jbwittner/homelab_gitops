cronjob:
  # une fois par jour, à 5 h
  schedule: "0 5 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: "1"
  failedJobsHistoryLimit: "3"
  # pas de nouvel essai : un passage raté (dépôt inaccessible…) attend le lendemain
  jobBackoffLimit: "0"
  # GitHub App : Renovate n'accepte qu'un jeton d'installation (1 h), généré avant chaque passage
  # depuis l'App ID, l'Installation ID et la clé privée (OpenBao, secret/renovate)
  # affectation puis export : avec « export X=$(…) », un échec serait masqué (set -e)
  preCommand: |
    RENOVATE_TOKEN="$(node /github-app/token.js)"
    export RENOVATE_TOKEN

renovate:
  # dépôts traités : ceux accordés à l'installation de la GitHub App (réglages de l'App sur GitHub),
  # parmi eux seuls ceux qui ont un renovate.json (requireConfig)
  config: |
    {
      "platform": "github",
      "autodiscover": true,
      "autodiscoverFilter": ["jbwittner/*"],
      "onboarding": false,
      "requireConfig": "required"
    }

env:
  GITHUB_APP_ID: "5417686"
  GITHUB_APP_INSTALLATION_ID: "175555325"
  GITHUB_APP_KEY_FILE: /github-app/key/private_key

extraVolumes:
  - name: github-app-script
    configMap:
      name: renovate-github-app-token
  - name: github-app-key
    secret:
      secretName: renovate-github-app

extraVolumeMounts:
  - name: github-app-script
    mountPath: /github-app/token.js
    subPath: token.js
  - name: github-app-key
    mountPath: /github-app/key
    readOnly: true

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    memory: 2Gi
