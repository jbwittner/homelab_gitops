apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-kalecgos
  namespace: argocd
  labels:
    layer: infra
spec:
  project: default
  destination:
    name: bleu-kalecgos
    namespace: cert-manager
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.2
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/components/cert-manager/values.yaml
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: components/cert-manager/manifests
  syncPolicy:
    # pas de prune : supprimer une CRD supprime tous les Certificates (et leurs Secrets)
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
