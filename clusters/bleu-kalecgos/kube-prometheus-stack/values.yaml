# Agent : collecte et envoie tout à malygos, ne stocke rien (WAL seul)
prometheus:
  agentMode: true
  prometheusSpec:
    scrapeClasses:
      - name: cluster
        default: true
        relabelings:
          - targetLabel: cluster
            replacement: bleu-kalecgos
    # sans authentification (LAN), comme la réception sur malygos
    remoteWrite:
      - url: https://prometheus.lan.wittner.tech/api/v1/write
  # pas d'Alertmanager : sans ces séries, PrometheusNotConnectedToAlertmanagers ne sonne pas sur malygos
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels:
          - __name__
        regex: prometheus_notifications_.*

# agent : horodatages de cadvisor + marqueurs de péremption rejetés comme hors d'ordre
# (PrometheusOutOfOrderTimestamps) ; horodatage du scrape à la place (le chart impose
# honorTimestamps tant que trackTimestampsStaleness est actif)
kubelet:
  serviceMonitor:
    trackTimestampsStaleness: false
    honorTimestamps: false

# règles, alertes et tableaux de bord : sur malygos, qui reçoit les séries
alertmanager:
  enabled: false
grafana:
  enabled: false
defaultRules:
  create: false
