# Ligne image réécrite par la CI de filon à chaque push sur main (main.yml) : tag fixe main-sha-<sha>, épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: filon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filon
    spec:
      # image privée : Secret ghcr-pull posé par ESO dans les namespaces ghcr-pull: enabled
      # (clusters/bleu-kalecgos/external-secrets/manifests/ghcr-pull.yaml)
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: filon
          image: ghcr.io/jbwittner/filon:main-sha-5577251@sha256:e6fcdb4cf698c608d4019718d5a7217552cde9460fbc1eeb33ae1291be7100fe
          env:
            # identifiants de la base : Secret de CNPG
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: filon-db-app
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filon-db-app
                  key: password
            # utilisateur du login : OpenBao secret/filon (externalsecret.yaml)
            - name: FILON_USERNAME
              valueFrom:
                secretKeyRef:
                  name: filon-login
                  key: username
            - name: FILON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filon-login
                  key: password
            # clé Unipile : OpenBao secret/filon (externalsecret.yaml)
            - name: UNIPILE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: filon-unipile
                  key: apiKey
            # compte LinkedIn connecté dans Unipile : OpenBao secret/filon (externalsecret.yaml)
            - name: UNIPILE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: filon-unipile
                  key: accountId
            # jeton bearer du serveur MCP (/mcp) : OpenBao secret/filon (externalsecret.yaml)
            - name: FILON_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: filon-mcp
                  key: token
          ports:
            - name: http
              containerPort: 8080
          # démarrage JVM (+ migrations Flyway à venir) : jusqu'à 150 s avant la liveness
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 768Mi
          # ./config/ du WORKDIR /app, lu par Spring Boot : application.yaml
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: filon-config
