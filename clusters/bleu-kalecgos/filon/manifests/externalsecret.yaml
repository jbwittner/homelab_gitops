# Clé API et compte LinkedIn connecté d'Unipile, lus dans OpenBao (secret/filon, champs unipile_api_key et unipile_account_id)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filon-unipile
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: filon-unipile
  data:
    - secretKey: apiKey
      remoteRef:
        key: filon
        property: unipile_api_key
    - secretKey: accountId
      remoteRef:
        key: filon
        property: unipile_account_id
---
# Utilisateur unique du login de filon, lu dans OpenBao (secret/filon, champs login_username et login_password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filon-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: filon-login
  data:
    - secretKey: username
      remoteRef:
        key: filon
        property: login_username
    - secretKey: password
      remoteRef:
        key: filon
        property: login_password
---
# Jeton bearer du serveur MCP de filon (/mcp), lu dans OpenBao (secret/filon, champ mcp_token)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filon-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: filon-mcp
  data:
    - secretKey: token
      remoteRef:
        key: filon
        property: mcp_token
