# Config Spring, montée sur /app/config/application.yaml (prioritaire sur l'application.yaml du
# jar). Pas de secret ici : identifiants de la base en env, depuis le Secret CNPG filon-db-app ;
# clé Unipile en env, depuis le Secret filon-unipile (ESO).
spring:
  datasource:
    url: jdbc:postgresql://filon-db-rw:5432/filon

application:
  unipile:
    since: "2026-09-01T00:00:00Z"
  scheduler:
    enabled: true
    conversations:
      cron: "0 0 13 * * MON-FRI"