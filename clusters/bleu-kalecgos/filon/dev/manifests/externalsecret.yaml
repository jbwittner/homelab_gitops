# Clé API Unipile de l'env, lue dans OpenBao (secret/filon/dev, champ unipile_api_key)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filon-unipile
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: filon-unipile
  data:
    - secretKey: apiKey
      remoteRef:
        key: filon/dev
        property: unipile_api_key
