# Ligne image réécrite par la CI de filon à chaque push sur main (main.yml) : tag fixe main-sha-<sha>, épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filon
spec:
  template:
    spec:
      containers:
        - name: filon
          image: ghcr.io/jbwittner/filon:main-sha-d371475@sha256:59af39f975f81ab4786b9454b9206e508d7198ee900d6e9ee732e5f70c56414d
