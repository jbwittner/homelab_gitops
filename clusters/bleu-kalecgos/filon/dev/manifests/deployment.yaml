# Ligne image réécrite par la CI de filon à chaque push sur main (main.yml) : tag fixe main-sha-<sha>, épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filon
spec:
  template:
    spec:
      containers:
        - name: filon
          image: ghcr.io/jbwittner/filon:main-sha-341f5d7@sha256:9cc48b76ff56a08074f7a98b6de088f2fdedc615115e3d4eff12c08ad42eb770
