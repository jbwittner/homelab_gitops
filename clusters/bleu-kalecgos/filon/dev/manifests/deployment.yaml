# Ligne image réécrite par la CI de filon à chaque push sur main (main.yml) : tag fixe main-sha-<sha>, épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filon
spec:
  template:
    spec:
      containers:
        - name: filon
          image: ghcr.io/jbwittner/filon:main-sha-d68c438@sha256:eb7be6cf2746ac0b0a6ea20bc8305f35a19185edb80bb6de3ca532316c29f43c
