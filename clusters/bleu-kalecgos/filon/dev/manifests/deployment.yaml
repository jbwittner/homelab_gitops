# Ligne image réécrite par la CI de filon à chaque push sur main (main.yml) : tag fixe main-sha-<sha>, épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filon
spec:
  template:
    spec:
      containers:
        - name: filon
          image: ghcr.io/jbwittner/filon:main-sha-f0c0121@sha256:4ee1e5175e41186626aa7da38a3b38ba7c373256719716eeaf77b22f60c2c953
