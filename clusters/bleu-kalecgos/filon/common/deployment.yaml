apiVersion: apps/v1
kind: Deployment
metadata:
  name: filon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: filon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filon
    spec:
      # image privée : Secret ghcr-pull posé par ESO dans les namespaces ghcr-pull: enabled
      # (clusters/bleu-kalecgos/external-secrets/manifests/ghcr-pull.yaml)
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: filon
          # tag et digest posés par chaque env (<env>/manifests/deployment.yaml)
          image: ghcr.io/jbwittner/filon
          env:
            # identifiants de la base : Secret de CNPG
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: filon-db-app
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filon-db-app
                  key: password
            # utilisateur du login : OpenBao secret/filon/<env> (<env>/manifests/externalsecret.yaml)
            - name: FILON_USERNAME
              valueFrom:
                secretKeyRef:
                  name: filon-login
                  key: username
            - name: FILON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filon-login
                  key: password
            # clé Unipile : OpenBao secret/filon/<env> (<env>/manifests/externalsecret.yaml)
            - name: UNIPILE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: filon-unipile
                  key: apiKey
          ports:
            - name: http
              containerPort: 8080
          # démarrage JVM (+ migrations Flyway à venir) : jusqu'à 150 s avant la liveness
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 768Mi
          # ./config/ du WORKDIR /app, lu par Spring Boot : application.yaml commun
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: filon-config
