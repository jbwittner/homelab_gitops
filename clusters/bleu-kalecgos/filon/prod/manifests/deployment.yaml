# Ligne image réécrite par la CI de filon à chaque tag v* (release.yml) : tag v<version>, même image que dev, épinglé à son digest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filon
spec:
  template:
    spec:
      containers:
        - name: filon
          image: ghcr.io/jbwittner/filon:v0.1.0@sha256:f05c42e64a2a5732c21fbcddf3add6404f820d68720c332cccf27f05d2dab01b
