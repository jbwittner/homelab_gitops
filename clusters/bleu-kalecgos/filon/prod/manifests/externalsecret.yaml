# Clé API Unipile de l'env, lue dans OpenBao (secret/filon/prod, champ unipile_api_key)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filon-unipile
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: filon-unipile
  data:
    - secretKey: apiKey
      remoteRef:
        key: filon/prod
        property: unipile_api_key
---
# Utilisateur unique du login de filon, lu dans OpenBao (secret/filon/prod, champs login_username et login_password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filon-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: filon-login
  data:
    - secretKey: username
      remoteRef:
        key: filon/prod
        property: login_username
    - secretKey: password
      remoteRef:
        key: filon/prod
        property: login_password
---
# Jeton bearer du serveur MCP de filon (/mcp), lu dans OpenBao (secret/filon/prod, champ mcp_token)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filon-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: filon-mcp
  data:
    - secretKey: token
      remoteRef:
        key: filon/prod
        property: mcp_token
