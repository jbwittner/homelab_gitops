# filon, env prod : commun + namespace, image (CI), secret Unipile, ObjectStore et route
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: filon-prod
resources:
  - ../../common
  - namespace.yaml
  - externalsecret.yaml
  - objectstore.yaml
  - httproute.yaml
labels:
  - pairs:
      environment: prod
    includeTemplates: true
patches:
  - target:
      kind: Deployment
      name: filon
    path: deployment.yaml
