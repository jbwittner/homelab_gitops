apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: filon-prod-kalecgos
  namespace: argocd
  # retrait de l'env : supprimer l'Application supprime aussi ses ressources (namespace, base)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    layer: apps
spec:
  project: default
  destination:
    name: bleu-kalecgos
  # appli maison : commun dans ../common, overlay de l'env ici (doc/filon.md)
  source:
    repoURL: https://github.com/jbwittner/homelab_gitops.git
    targetRevision: main
    path: clusters/bleu-kalecgos/filon/prod/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # sans fin : une dépendance (CRD, secret) d'une autre Application peut arriver tard (boot à blanc)
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
