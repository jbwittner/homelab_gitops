# Métriques LVM (lvm_vg_*, lvm_lv_*) du service créé par le chart. Pas lvmNode.serviceMonitor
# du chart : les métriques ne portent que le nom du VG, il faut instance = nom du nœud.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openebs-lvm-node
  namespace: openebs
spec:
  selector:
    matchLabels:
      name: openebs-lvm-node
  endpoints:
    - port: metrics
      interval: 30s
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: instance
