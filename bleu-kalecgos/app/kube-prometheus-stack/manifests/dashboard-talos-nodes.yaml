# bleu-kalecgos/app/kube-prometheus-stack/manifests/dashboard-talos-nodes.yaml
# Dashboard Grafana « Système — nœuds Talos »
# Chargé automatiquement par le sidecar de kube-prometheus-stack
# via le label grafana_dashboard: "1".
#
# Sources de métriques :
#   - node-exporter        : CPU, mémoire, filesystems, réseau, hwmon
#   - openebs-lvm exporter : VolumeGroups LVM (ServiceMonitor openebs)
#
# Les requêtes hwmon ne présument aucune topologie matérielle : nombre de NVMe/SSD
# variable selon le nœud, chips coretemp multiples, capteurs multiples par disque
# (composite + capteurs internes). Tout est agrégé/étiqueté par chip et par capteur.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-talos-nodes
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  talos-nodes.json: |
