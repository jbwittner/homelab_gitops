# bleu-kalecgos/app/kube-prometheus-stack/manifests/servicemonitors-argocd.yaml
# Scrape des composants ArgoCD (ns argocd) — prérequis du dashboard « GitOps — ArgoCD ».
#
# L'install upstream d'ArgoCD livre les Services `metrics` mais AUCUN ServiceMonitor.
# Ces objets vivent ici, dans le ns `monitoring`, et pas dans infra/argocd/manifests :
# ce dossier-là sert aussi à l'apply manuel du bootstrap (`kubectl apply -k`), qui tourne
# AVANT l'installation du prometheus-operator — la CRD ServiceMonitor n'existe pas encore
# et l'apply échouerait. Ici, ServiceMonitors et CRD arrivent dans la même Application.
# Le scrape cross-namespace se fait via `namespaceSelector` (le ClusterRole du Prometheus
# du chart autorise déjà services/endpoints à l'échelle du cluster).
#
# `release: kube-prometheus-stack` est OBLIGATOIRE : le prometheus-operator du chart ne
# sélectionne que les ServiceMonitors portant ce label (serviceMonitorSelectorNilUsesHelmValues).
# Le label `job` des séries = nom du Service (défaut de l'opérateur) — c'est sur ces valeurs
# que filtrent les panneaux du dashboard (`job="argocd-metrics"`, `job=~"argocd-.*"`).
#
# Le dex-server expose aussi un port `metrics` mais n'est pas scrapé : le SSO passe par
# authentik en OIDC direct, dex n'est pas utilisé.

# Contrôleur d'applications — le gros des métriques GitOps : argocd_app_info,
# argocd_app_sync_total, argocd_app_reconcile, argocd_cluster_*, workqueue_*.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-application-controller
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# Serveur API/UI : argocd_info (version), argocd_login_request_total, argocd_redis_request_total.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-server
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# Repo-server : argocd_git_* (ls-remote/fetch, durées, échecs), file d'attente des locks dépôt.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-repo-server
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# Notifications-controller : argocd_notifications_* (annotations Grafana posées à chaque
# déploiement / dégradation / échec de sync, cf. infra/argocd/README.md).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-notifications-controller
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-notifications-controller-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# ApplicationSet-controller : aucun ApplicationSet dans ce repo (app-of-apps par glob),
# scrapé uniquement pour la supervision de liveness du composant (`up`).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-applicationset-controller
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-applicationset-controller
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
