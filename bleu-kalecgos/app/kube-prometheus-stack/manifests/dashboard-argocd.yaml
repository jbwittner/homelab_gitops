# bleu-kalecgos/app/kube-prometheus-stack/manifests/dashboard-argocd.yaml
# Dashboard Grafana « GitOps — ArgoCD »
# Chargé automatiquement par le sidecar de kube-prometheus-stack
# via le label grafana_dashboard: "1".
#
# Sources de métriques (ServiceMonitors : servicemonitors-argocd.yaml) :
#   - argocd-metrics                            : contrôleur d'applications
#     (argocd_app_info / _sync_total / _reconcile, argocd_cluster_*, workqueue_*)
#   - argocd-repo-server                        : argocd_git_*, argocd_repo_pending_request_total
#   - argocd-server-metrics                     : argocd_info, argocd_login_request_total
#   - argocd-notifications-controller-metrics   : argocd_notifications_*
#   - kube-state-metrics / cAdvisor             : redémarrages, CPU des pods du ns argocd
#
# Les 3 couches d'annotations reprennent les tags posés par le notifications-controller
# (`argocd` + `deployed` | `degraded` | `sync-failed`, cf. infra/argocd/README.md).
#
# Portée des filtres : les variables Projet/Application ne s'appliquent qu'aux métriques
# portant les labels `project`/`name` (argocd_app_info, argocd_app_sync_total,
# argocd_app_k8s_request_total). Les histogrammes de réconciliation, le repo-server et
# les métriques Git sont agrégés à l'échelle du contrôleur — ils ignorent ces variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-argocd
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
