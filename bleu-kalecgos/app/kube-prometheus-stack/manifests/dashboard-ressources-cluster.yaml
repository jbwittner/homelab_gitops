# bleu-kalecgos/app/kube-prometheus-stack/manifests/dashboard-ressources-cluster.yaml
# Dashboard Grafana « Ressources — cluster »
# Chargé automatiquement par le sidecar de kube-prometheus-stack (label grafana_dashboard: "1").
#
# Niveau 1 de la chaîne : totaux du cluster (utilisation / requests / limits / allocatable)
# pour le CPU et la mémoire, plus la ventilation par namespace.
#
# Sources : cAdvisor (kubelet) + kube-state-metrics, via les **recording rules du chart**
# (`defaultRules`, activées par défaut — ne pas les désactiver dans helm-values.yaml sans
# réécrire ces requêtes) :
#   - node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate  (usage CPU)
#   - node_namespace_pod_container:container_memory_working_set_bytes           (usage mémoire)
#   - cluster:namespace:pod_{cpu,memory}:active:kube_pod_container_resource_{requests,limits}
#     (requests/limits des pods Pending|Running uniquement — les pods terminés sont exclus)
#
# Requests, limits et ratios : un conteneur peut déclarer des requests SANS limite. Les totaux
# de requests et de limits portent donc sur des ensembles de conteneurs différents, et
# « requests > limits » est un état normal, pas un bug. Les ratios utilisation/requests et
# utilisation/limits restreignent donc le numérateur aux conteneurs qui déclarent la ressource
# (`and on (namespace, pod, container)`), sans quoi ils dépasseraient 100 % sans rien signifier.
# Une tuile « Conteneurs sans limite » chiffre l'écart dans chaque rangée.
#
# Les 5 dashboards « Ressources » partagent le tag `ressources` : le menu déroulant en haut
# à droite navigue de l'un à l'autre en conservant période et variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ressources-cluster
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Wittnerlab
