apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: monitoring
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Grafana Alloy en DaemonSet : lit les fichiers de logs des conteneurs sur le nœud
  # (/var/log/pods) et les pousse vers [loki](../loki/README.md). Successeur de Promtail (EOL).
  # Pattern multi-source (archétype b) : chart + `$values` + `manifests/` (namespace privileged).
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.11.1
      helm:
        releaseName: alloy
        valueFiles:
          - $values/bleu-kalecgos/app/alloy/helm-values.yaml
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
    # Ressource annexe : namespace labellisé `privileged` (hostPath /var/log).
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: bleu-kalecgos/app/alloy/manifests
  destination:
    name: bleu-kalecgos
    namespace: alloy
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
