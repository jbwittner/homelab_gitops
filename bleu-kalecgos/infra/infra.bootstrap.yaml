apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bleu-kalecgos-infra
  namespace: argocd
  labels:
    app.kubernetes.io/name: bleu-kalecgos-infra
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: app-of-apps
  # ⚠️ MIGRATION EN COURS vers l'arbre unique `cluster/` : finalizer retiré temporairement pour
  # que la suppression de cette Application ne détruise pas en cascade ses composants.
spec:
  # App-of-apps de la partie INFRA de bleu-kalecgos : découvre tous les composants infra
  # (recurse + include '*.app.yaml' → matche infra/<name>/<name>.app.yaml, PAS ce fichier
  # *.bootstrap.yaml qui a un suffixe différent).
  project: default
  source:
    repoURL: https://github.com/jbwittner/homelab_gitops.git
    targetRevision: main
    path: bleu-kalecgos/infra
    directory:
      recurse: true
      include: '*.app.yaml'
  destination:
    name: bleu-kalecgos
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
