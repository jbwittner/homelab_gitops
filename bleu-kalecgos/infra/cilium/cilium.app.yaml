apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  labels:
    app.kubernetes.io/name: cilium
    app.kubernetes.io/part-of: homelab-gitops
    app.kubernetes.io/component: cni
  # ⚠️ MIGRATION EN COURS : cette Application est la seule feuille qui change de nom
  # (`cilium` → `bleu-kalecgos-cilium`, généré par l'ApplicationSet `cluster/infra/cilium`).
  # Le finalizer est retiré pour que sa suppression n'emporte PAS le CNI en cascade ; la
  # nouvelle Application adoptera les ressources Cilium vivantes.
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.20.0
      helm:
        # ⚠️ releaseName DOIT rester `cilium` : la release a été adoptée depuis le
        # `helm install cilium` du bootstrap (Phase 3 du runbook). Le changer renommerait
        # toutes les ressources Cilium et détruirait le CNI.
        releaseName: cilium
        valueFiles:
          - $values/bleu-kalecgos/infra/cilium/helm-values.yaml
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/jbwittner/homelab_gitops.git
      targetRevision: main
      path: bleu-kalecgos/infra/cilium/manifests
  destination:
    name: bleu-kalecgos
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: cilium-config
      namespace: kube-system
      jsonPointers:
        - /data